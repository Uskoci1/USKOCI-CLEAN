name: TEMP P2 successor-aware proof patch
on:
  push:
    branches: [feat/p2-data-export-20260908]
permissions:
  contents: write
concurrency:
  group: p2-successor-patch
  cancel-in-progress: false
jobs:
  patch:
    if: github.repository == 'Uskoci1/USKOCI-CLEAN' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Patch only P2 proof admission for later pending successors
        shell: bash
        env:
          BRANCH: feat/p2-data-export-20260908
          EXPECTED_PARENT: 0ac7dffb0e241d005765908c1a9b4849e7c9d623
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path

          p=Path('supabase/proofs/legal/p2_data_export_predecessor.mjs')
          s=p.read_text()
          old="""  const unitPendingIndex = pendingEntries.findIndex(entry => entry.file === unit.forward_file);\n  assert.ok(unitPendingIndex >= 0, 'P2_PENDING_PROVENANCE_MISSING');\n  assert.equal(unitPendingIndex, pendingEntries.length - 1, 'P2_PENDING_NOT_LAST_IN_CURRENT_FORWARD_STACK');\n  const pendingPredecessors = pendingEntries.slice(0, unitPendingIndex).map(entry => {\n"""
          new="""  const unitPendingIndex = pendingEntries.findIndex(entry => entry.file === unit.forward_file);\n  assert.ok(unitPendingIndex >= 0, 'P2_PENDING_PROVENANCE_MISSING');\n  const pendingPredecessors = pendingEntries.slice(0, unitPendingIndex).map(entry => {\n"""
          assert old in s
          s=s.replace(old,new,1)
          old="""  assert.equal(source.length, historical.length + pendingEntries.length);\n\n  for (const dep of [admitted.d03, admitted.ai_draft]) {\n"""
          new="""  // Later admitted forwards remain a separate ordered suffix. P2 is proved\n  // at its own position first, then each successor is replayed and checked\n  // not to mutate export rows, projection, grants or original history.\n  const pendingSuccessors = pendingEntries.slice(unitPendingIndex + 1).map(entry => {\n    assert.equal(entry.live_applied, false, `PENDING_SUCCESSOR_MARKED_LIVE:${entry.file}`);\n    assert.ok(String(entry.version) > String(unit.forward_version), `PENDING_SUCCESSOR_ORDER_INVALID:${entry.file}`);\n    const current = source.find(candidate => candidate.file === entry.file);\n    assert.ok(current, `PENDING_SUCCESSOR_FILE_MISSING:${entry.file}`);\n    assert.equal(current.md5, entry.raw_md5, `PENDING_SUCCESSOR_MD5_CHANGED:${entry.file}`);\n    return { file: entry.file, version: String(entry.version), name: entry.name, md5: entry.raw_md5 };\n  });\n\n  assert.equal(source.length, historical.length + pendingEntries.length);\n\n  for (const dep of [admitted.d03, admitted.ai_draft]) {\n"""
          assert old in s
          s=s.replace(old,new,1)
          old="""    pending_predecessors: pendingPredecessors,\n    d03: admitted.d03,\n"""
          new="""    pending_predecessors: pendingPredecessors,\n    pending_successors: pendingSuccessors,\n    pending_successor_count: pendingSuccessors.length,\n    d03: admitted.d03,\n"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('supabase/proofs/legal/p2_data_export_predecessor.test.mjs')
          s=p.read_text()
          s=s.replace("import { readFileSync } from 'node:fs';", "import { cpSync, mkdtempSync, readFileSync, rmSync, writeFileSync } from 'node:fs';\nimport { tmpdir } from 'node:os';\nimport { join } from 'node:path';",1)
          old="""  assert.deepEqual(plan.pending_predecessors.map(entry => entry.file), before);\n  assert.equal(pending.at(-1), unit.forward_file, 'unit must be last in the current forward stack');\n});\n"""
          new="""  assert.deepEqual(plan.pending_predecessors.map(entry => entry.file), before);\n  const after = pending.slice(pending.indexOf(unit.forward_file) + 1);\n  assert.deepEqual(plan.pending_successors.map(entry => entry.file), after);\n  assert.equal(plan.pending_successor_count, after.length);\n  assert.equal(plan.source_migration_count, plan.expected_predecessor_count + 1 + after.length);\n});\n"""
          assert old in s
          s=s.replace(old,new,1)
          s += """\nfor (const mutation of ['changed-source','wrong-checksum','marked-live','wrong-order']) {\n  test(`refuses a declared successor with ${mutation} before any database operation`, () => {\n    const root = mkdtempSync(join(tmpdir(), 'p2-admission-'));\n    try {\n      cpSync('supabase',join(root,'supabase'),{recursive:true});\n      const file=join(root,'supabase/migrations/MIGRATION_PROVENANCE.json');\n      const provenance=JSON.parse(readFileSync(file,'utf8'));\n      const suffix=provenance.pending_forward_migrations.filter(entry => entry.version>unit.forward_version);\n      assert.ok(suffix.length, 'this integration test requires its admitted later unit');\n      const next=suffix[0];\n      if(mutation==='changed-source') writeFileSync(join(root,'supabase/migrations',next.file),'-- altered SQL');\n      if(mutation==='wrong-checksum') next.raw_md5='0'.repeat(32);\n      if(mutation==='marked-live') next.live_applied=true;\n      if(mutation==='wrong-order') next.version=unit.forward_version;\n      writeFileSync(file,JSON.stringify(provenance));\n      assert.throws(() => readP2ExportPredecessorPlan(root), /PENDING_SUCCESSOR_/);\n    } finally { rmSync(root,{recursive:true,force:true}); }\n  });\n}\n"""
          p.write_text(s)

          p=Path('supabase/proofs/legal/p2_data_export_proof.mjs')
          s=p.read_text()
          old="""  {\n  check('FINAL_FINGERPRINTS_HISTORY_AND_NO_ARTIFACT');\n  assert.equal(tableHash('supabase_migrations.schema_migrations',`version<>${q(manifest.forward_version)}`),history);\n  report.migration_history_count=Number(sql('select count(*) from supabase_migrations.schema_migrations'));\n  assert.equal(report.migration_history_count,predecessorCount+1);\n  assert.equal(report.migration_history_count,plan.source_migration_count);\n  assert.equal(sql(\"select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname in ('public','private') and p.proname ~* 'export_(generate|build|deliver|artifact)'\"),'0','no artifact generator may be admitted');\n  report.request_rows={requester:requestsOf(rid).length,worker:requestsOf(wid).length};\n  pass();\n  }\n"""
          new="""  {\n  check('FINAL_FINGERPRINTS_HISTORY_AND_NO_ARTIFACT');\n  // Prove P2 completely at its own position, then replay every later pending\n  // source and prove that the export boundary remains byte/behavior stable.\n  const requesterStatusBefore=await ok(status(requester));\n  const workerStatusBefore=await ok(status(worker));\n  const exportRowsBefore=tableHash('public.data_export_requests');\n  const functions=()=>rows(`select p.proname,p.prosecdef,p.proacl,p.proconfig,md5(p.prosrc) body\n    from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'\n    and p.proname in ('rpc_get_data_export_status','rpc_request_data_export','rpc_cancel_data_export') order by 1`);\n  const functionsBefore=functions();assert.equal(functionsBefore.length,3);\n  const tableSecurity=()=>rows(`select c.relname,c.relrowsecurity,c.relforcerowsecurity,c.relacl\n    from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='data_export_requests'`);\n  const securityBefore=tableSecurity();assert.equal(securityBefore.length,1);\n  const appliedSuccessors=[];\n  for(const successor of plan.pending_successors){\n    assert.equal(sql(`select count(*) from supabase_migrations.schema_migrations where version=${q(successor.version)}`),'0');\n    const file=`supabase/migrations/${successor.file}`,suffixBytes=readFileSync(file);\n    assert.equal(createHash('md5').update(suffixBytes).digest('hex'),successor.md5);\n    execFileSync('psql',[db,'-X','-v','ON_ERROR_STOP=1','-f',file],{stdio:'pipe'});\n    sql(`insert into supabase_migrations.schema_migrations(version,name,statements)\n      values(${q(successor.version)},${q(successor.name)},array[${q(suffixBytes.toString('utf8'))}])`);\n    assert.equal(sql(`select md5(statements[1]) from supabase_migrations.schema_migrations where version=${q(successor.version)}`),successor.md5);\n    appliedSuccessors.push(successor);\n  }\n  sql(\"notify pgrst,'reload schema'\");\n  assert.deepEqual(await ok(status(requester)),requesterStatusBefore,'EXPORT_REQUESTER_STATUS_CHANGED_BY_SUCCESSOR');\n  assert.deepEqual(await ok(status(worker)),workerStatusBefore,'EXPORT_WORKER_STATUS_CHANGED_BY_SUCCESSOR');\n  assert.equal(tableHash('public.data_export_requests'),exportRowsBefore,'EXPORT_ROWS_CHANGED_BY_SUCCESSOR');\n  assert.deepEqual(functions(),functionsBefore,'EXPORT_FUNCTIONS_OR_GRANTS_CHANGED_BY_SUCCESSOR');\n  assert.deepEqual(tableSecurity(),securityBefore,'EXPORT_TABLE_SECURITY_CHANGED_BY_SUCCESSOR');\n  report.successor_replay={applied:appliedSuccessors,count:appliedSuccessors.length,\n    export_projection_unchanged:true,export_rows_unchanged:true,export_functions_and_grants_unchanged:true,export_security_unchanged:true};\n  const newlyApplied=[manifest.forward_version,...appliedSuccessors.map(item=>item.version)];\n  assert.equal(tableHash('supabase_migrations.schema_migrations',`version not in (${newlyApplied.map(q).join(',')})`),history);\n  report.successor_replay.original_history_unchanged=true;\n  report.migration_history_count=Number(sql('select count(*) from supabase_migrations.schema_migrations'));\n  assert.equal(report.migration_history_count,predecessorCount+1+appliedSuccessors.length);\n  assert.equal(report.migration_history_count,plan.source_migration_count);\n  assert.equal(sql(\"select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname in ('public','private') and p.proname ~* 'export_(generate|build|deliver|artifact)'\"),'0','no artifact generator may be admitted');\n  report.request_rows={requester:requestsOf(rid).length,worker:requestsOf(wid).length};\n  pass();\n  }\n"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('.github/workflows/p2-data-export-proof.yml')
          s=p.read_text()
          old="""r.export_artifact_generated || r.migration_history_count!==r.predecessor_history_count+1 || r.migration_history_count!==r.predecessor_plan.source_migration_count || r.predecessor_history_count!==r.predecessor_plan.expected_predecessor_count"""
          new="""r.export_artifact_generated || !r.successor_replay || r.successor_replay.count!==r.predecessor_plan.pending_successor_count || !r.successor_replay.original_history_unchanged || !r.successor_replay.export_projection_unchanged || !r.successor_replay.export_rows_unchanged || !r.successor_replay.export_functions_and_grants_unchanged || !r.successor_replay.export_security_unchanged || r.migration_history_count!==r.predecessor_history_count+1+r.successor_replay.count || r.migration_history_count!==r.predecessor_plan.source_migration_count || r.predecessor_history_count!==r.predecessor_plan.expected_predecessor_count"""
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/_tmp_p2_successor_patch.yml
          git add -A
          git diff --cached --check
          node --check supabase/proofs/legal/p2_data_export_predecessor.mjs
          node --check supabase/proofs/legal/p2_data_export_proof.mjs
          node --test supabase/proofs/legal/p2_data_export_predecessor.test.mjs
          python3 supabase/migrations/check_migration_integrity.py
          git commit -m 'test(w11): make P2 export proof successor-aware after D0140'
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
