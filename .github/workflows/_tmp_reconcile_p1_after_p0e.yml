name: TEMP reconcile P1 registries after P0E

on:
  push:
    branches:
      - feat/p1-legal-consent-20260908

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/p1-legal-consent-20260908

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile canonical registries semantically
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin clean-alpha-backend
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          provenance_path = Path('supabase/migrations/MIGRATION_PROVENANCE.json')
          manifest_path = Path('supabase/migrations/MD5_MANIFEST.txt')

          def git_show(path: str) -> str:
              return subprocess.check_output(
                  ['git', 'show', f'origin/clean-alpha-backend:{path}'],
                  text=True,
              )

          base = json.loads(git_show(str(provenance_path)))
          feature = json.loads(provenance_path.read_text(encoding='utf-8'))

          merged = dict(base)
          merged.update(feature)

          pending_by_version = {}
          for source_name, items in (
              ('base', base.get('pending_forward_migrations', [])),
              ('feature', feature.get('pending_forward_migrations', [])),
          ):
              for item in items:
                  version = item['version']
                  prior = pending_by_version.get(version)
                  if prior is not None and prior != item:
                      raise SystemExit(
                          f'conflicting pending provenance for {version}: {source_name}'
                      )
                  pending_by_version[version] = item

          merged['pending_forward_migrations'] = [
              pending_by_version[v] for v in sorted(pending_by_version)
          ]
          provenance_path.write_text(
              json.dumps(merged, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )

          def parse_manifest(text: str):
              out = {}
              for raw in text.splitlines():
                  checksum, filename = raw.split('  ', 1)
                  prior = out.get(filename)
                  if prior is not None and prior != checksum:
                      raise SystemExit(f'conflicting checksum for {filename}')
                  out[filename] = checksum
              return out

          manifest = parse_manifest(git_show(str(manifest_path)))
          for filename, checksum in parse_manifest(
              manifest_path.read_text(encoding='utf-8')
          ).items():
              prior = manifest.get(filename)
              if prior is not None and prior != checksum:
                  raise SystemExit(f'conflicting checksum for {filename}')
              manifest[filename] = checksum

          manifest_path.write_text(
              ''.join(f'{manifest[name]}  {name}\n' for name in sorted(manifest)),
              encoding='utf-8',
              newline='\n',
          )
          PY

          python3 supabase/migrations/check_migration_integrity.py
          git diff --check

      - name: Commit registry-only reconciliation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/migrations/MD5_MANIFEST.txt supabase/migrations/MIGRATION_PROVENANCE.json; then
            echo 'Registry reconciliation already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/MD5_MANIFEST.txt supabase/migrations/MIGRATION_PROVENANCE.json
          git commit -m 'chore: reconcile P1 provenance after P0E merge'
          git push origin "HEAD:${TARGET_BRANCH}"
