name: TEMP reconcile P2 after D0140
on:
  push:
    branches: [feat/p2-data-export-20260908]
permissions:
  contents: write
concurrency:
  group: p2-reconcile-after-d0140
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'Uskoci1/USKOCI-CLEAN' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Merge verified canonical and union only migration registries
        shell: bash
        env:
          BRANCH: feat/p2-data-export-20260908
          EXPECTED_PARENT: d7a3ffd7f41cc5cbc9f0efdacda809ef5c4d113f
          CANONICAL: 9614f5503340bcee3639e7cb8d13555fe58a6ed9
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp supabase/migrations/MIGRATION_PROVENANCE.json /tmp/p2-provenance.json
          cp supabase/migrations/MD5_MANIFEST.txt /tmp/p2-manifest.txt
          git fetch origin clean-alpha-backend
          test "$(git rev-parse origin/clean-alpha-backend)" = "$CANONICAL"
          set +e
          git merge --no-commit --no-ff "$CANONICAL"
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            allowed=$'supabase/migrations/MD5_MANIFEST.txt\nsupabase/migrations/MIGRATION_PROVENANCE.json'
            test "$conflicts" = "$allowed"
            git checkout --theirs supabase/migrations/MD5_MANIFEST.txt supabase/migrations/MIGRATION_PROVENANCE.json
          fi
          python3 - <<'PY'
          import hashlib,json,pathlib
          prov_path=pathlib.Path('supabase/migrations/MIGRATION_PROVENANCE.json')
          canonical=json.loads(prov_path.read_text())
          branch=json.loads(pathlib.Path('/tmp/p2-provenance.json').read_text())
          p2_file='20260908160000_clean_p2_data_export_requests.sql'
          p2=[x for x in branch['pending_forward_migrations'] if x['file']==p2_file]
          assert len(p2)==1
          assert not any(x['file']==p2_file for x in canonical['pending_forward_migrations'])
          canonical['pending_forward_migrations'].append(p2[0])
          canonical['pending_forward_migrations'].sort(key=lambda x:str(x['version']))
          assert [x['file'] for x in canonical['pending_forward_migrations']].count(p2_file)==1
          assert 'p2_data_export_requests' in branch and 'p2_data_export_requests' not in canonical
          canonical['p2_data_export_requests']=branch['p2_data_export_requests']
          prov_path.write_text(json.dumps(canonical,ensure_ascii=False,indent=2)+'\n')

          manifest=pathlib.Path('supabase/migrations/MD5_MANIFEST.txt')
          lines=[x for x in manifest.read_text().splitlines() if x.strip()]
          branch_lines=[x for x in pathlib.Path('/tmp/p2-manifest.txt').read_text().splitlines() if p2_file in x]
          assert len(branch_lines)==1 and not any(p2_file in x for x in lines)
          lines.append(branch_lines[0])
          lines.sort(key=lambda x:x.split('  ',1)[1])
          manifest.write_text('\n'.join(lines)+'\n')

          sql=pathlib.Path('supabase/migrations')/p2_file
          candidate=pathlib.Path('supabase/proofs/legal/p2_data_export_candidate.sql')
          assert sql.read_bytes()==candidate.read_bytes()
          assert hashlib.md5(sql.read_bytes()).hexdigest()=='51b1cb1aea386a5bd2a596c89b58dd97'
          assert hashlib.sha256(sql.read_bytes()).hexdigest()=='f5e25e2e6dde212103d9c81a4b34ea75ee772c80123d85d513af169fb80099b5'
          PY
          rm .github/workflows/_tmp_reconcile_p2_after_d0140.yml
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          python3 supabase/migrations/check_migration_integrity.py
          git diff --cached --check
          git commit -m 'Merge canonical through D0140 into P2 export source'
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
