name: TEMP merge canonical into P4 and reconcile registries

on:
  push:
    branches:
      - feat/p4-processor-map-20260908

permissions:
  contents: write

env:
  TARGET_BRANCH: feat/p4-processor-map-20260908

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout feature branch with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge canonical and resolve only migration registry conflicts
        shell: bash
        run: |
          set -euo pipefail
          provenance='supabase/migrations/MIGRATION_PROVENANCE.json'
          manifest='supabase/migrations/MD5_MANIFEST.txt'

          git fetch origin clean-alpha-backend
          git show "HEAD:${provenance}" > /tmp/feature_provenance.json
          git show "HEAD:${manifest}" > /tmp/feature_manifest.txt
          git show "origin/clean-alpha-backend:${provenance}" > /tmp/base_provenance.json
          git show "origin/clean-alpha-backend:${manifest}" > /tmp/base_manifest.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          set +e
          git merge --no-ff --no-commit origin/clean-alpha-backend
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ] && [ ! -f .git/MERGE_HEAD ]; then
            echo 'Merge failed before creating MERGE_HEAD.'
            exit "$merge_rc"
          fi

          unresolved="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$unresolved" ]; then
            bad="$(printf '%s\n' "$unresolved" | grep -vxF "$manifest" | grep -vxF "$provenance" || true)"
            if [ -n "$bad" ]; then
              echo 'Unexpected merge conflicts:'
              printf '%s\n' "$bad"
              exit 1
            fi
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          provenance_path = Path('supabase/migrations/MIGRATION_PROVENANCE.json')
          manifest_path = Path('supabase/migrations/MD5_MANIFEST.txt')
          base = json.loads(Path('/tmp/base_provenance.json').read_text(encoding='utf-8'))
          feature = json.loads(Path('/tmp/feature_provenance.json').read_text(encoding='utf-8'))

          merged = dict(base)
          merged.update(feature)
          pending_by_version = {}
          for source_name, items in (
              ('base', base.get('pending_forward_migrations', [])),
              ('feature', feature.get('pending_forward_migrations', [])),
          ):
              for item in items:
                  version = item['version']
                  prior = pending_by_version.get(version)
                  if prior is not None and prior != item:
                      raise SystemExit(f'conflicting pending provenance for {version}: {source_name}')
                  pending_by_version[version] = item
          merged['pending_forward_migrations'] = [pending_by_version[v] for v in sorted(pending_by_version)]
          provenance_path.write_text(json.dumps(merged, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')

          def parse_manifest(text: str):
              out = {}
              for raw in text.splitlines():
                  checksum, filename = raw.split('  ', 1)
                  prior = out.get(filename)
                  if prior is not None and prior != checksum:
                      raise SystemExit(f'conflicting checksum for {filename}')
                  out[filename] = checksum
              return out

          manifest = parse_manifest(Path('/tmp/base_manifest.txt').read_text(encoding='utf-8'))
          for filename, checksum in parse_manifest(Path('/tmp/feature_manifest.txt').read_text(encoding='utf-8')).items():
              prior = manifest.get(filename)
              if prior is not None and prior != checksum:
                  raise SystemExit(f'conflicting checksum for {filename}')
              manifest[filename] = checksum
          manifest_path.write_text(''.join(f'{manifest[name]}  {name}\n' for name in sorted(manifest)), encoding='utf-8', newline='\n')
          PY

          git add "$manifest" "$provenance"
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo 'Unresolved conflicts remain:'
            git diff --name-only --diff-filter=U
            exit 1
          fi
          python3 supabase/migrations/check_migration_integrity.py
          git diff --cached --check
          git diff --check
          git status --short
          git commit -m 'Merge clean-alpha-backend into P4; reconcile migration registries'
          git push origin "HEAD:${TARGET_BRANCH}"
