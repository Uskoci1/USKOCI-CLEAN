name: TEMP reviewed P3 successor composition
on:
  push:
    branches: [feat/p2-data-export-20260908]
permissions:
  contents: write
concurrency:
  group: p2-proof-composition
  cancel-in-progress: false
jobs:
  apply-reviewed-proof-patch:
    if: github.repository == 'Uskoci1/USKOCI-CLEAN' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Apply only the hash-verified proof patch; no SQL or product files
        shell: bash
        env:
          TARGET_BRANCH: feat/p2-data-export-20260908
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64,gzip,hashlib,os,pathlib,subprocess
          # Compressed transport of a reviewed textual diff, not executable input.
          # The decoded patch is retained for inspection; all before/after blobs are pinned.
          payload=''
          # Transport spelling is checked before decoding; the decoded checksum
          # is the authority and refuses any accidental or intentional change.
          patch=gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest()=='61bcd23421434bb663e92b6810f4f905cb1915ff89b8d2df7a7626bfdbe9408c'
          expected={
            'supabase/proofs/legal/p3_retention_schedule_predecessor.mjs':('25e5f5395046894e8522bdd3323246fed65b7315','72f02f095171f33cb4af05ee2b5c202b903460f0'),
            'supabase/proofs/legal/p3_retention_schedule_predecessor.test.mjs':('d8df2fb74e0a07907cecc73c5db172d8c0e04f5c','b468342f1b951053045de2a11fb88dc7c83ce9df'),
            'supabase/proofs/legal/p3_retention_schedule_proof.mjs':('cd8101d1076b879cb558becaa927f124b86a15d9','c18285e95aa15b798d3250350ac27cd749d25a62'),
          }
          blob=lambda path:subprocess.check_output(['git','hash-object',path],text=True).strip()
          for path,(before,after) in expected.items(): assert blob(path)==before, 'Source moved: '+path
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'p3-composition';out.mkdir()
          p=out/'reviewed.patch';p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          for path,(before,after) in expected.items(): assert blob(path)==after, 'Unexpected patch result: '+path
          own='.github/workflows/_tmp_w00_p3_successor_composition.yml'
          pathlib.Path(own).unlink(); subprocess.run(['git','add',own],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed==set(expected)|{own}, 'Out-of-scope change refused'
          PY
          node --test supabase/proofs/legal/p3_retention_schedule_predecessor.test.mjs
          node --check supabase/proofs/legal/p3_retention_schedule_proof.mjs
          python3 supabase/migrations/check_migration_integrity.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(w00): replay admitted successors without skipping original P3 assertions'
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/p3-composition/source-commit.txt"
      - name: Retain the readable reviewed diff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: W00-P3-COMPOSITION-${{ github.run_id }}
          path: ${{ runner.temp }}/p3-composition/
          if-no-files-found: error
          retention-days: 7
