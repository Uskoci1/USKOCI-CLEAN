name: TEMP W00 W01 continuation checkpoint
on:
  push:
    branches: [feat/w00-w01-account-recovery-20260908]
permissions:
  contents: write
concurrency:
  group: w00-w01-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'Uskoci1/USKOCI-CLEAN' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Preserve history and update only the four existing control records
        shell: bash
        env:
          BRANCH: feat/w00-w01-account-recovery-20260908
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          test "$(git rev-parse HEAD^)" = 22ba47adad13d6a55f7462514aa83bb20efc6ac0
          python3 - <<'PY'
          import csv,datetime,hashlib,io,json,os,pathlib,subprocess
          root=pathlib.Path('docs/implementation')
          expected={
            'CURRENT_IMPLEMENTATION_HANDOFF.md':'37f6afacd8eacf814e6ae7eab161b068ff5f2706d4fc3acfc0540b1cd456a76c',
            'LIVE_IMPLEMENTATION_NETWORK.md':'dddf960b2798678043a2f53d3376c6a9bf9bebaa57c2b01adc118c274e73ccf7',
            'LIVE_MIGRATION_STATE.json':'1358f232ac170d7e8bf094a450f5002d77993df8114b2e8e70c0882620e490c9',
            'IMPLEMENTATION_STATUS_LEDGER.csv':'92946533022f1bdf1861fe499c79b000f74d98b648af09eb4ff7b754ee3a9cd3',
          }
          for name,digest in expected.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest, 'Control record changed concurrently: '+name
          stamp=datetime.datetime.now(datetime.timezone.utc).isoformat()
          section='''## W00/W01 functional continuation checkpoint

          This is a dated checkpoint in the existing continuation records, not a new MASTER.
          The owner froze new visual design/composition while Claude performs read-only synthesis.
          Do not modify .claude/, PRODUCT.md, design-reference materials, styling or composition.

          Source of scope: USKOCI_KOMPLETAN_PLAN_2026-09-08.zip, SHA256
          b3ea1efe19dac4d30287fb7d569e7d58b469c2d4b555a7561bad7f84ca1d2ff7;
          all six SHA256.json entries were verified. Original dependencies/canon remain authoritative.

          Last observed canonical: b0f6851c1957cf27da8e135fdf05c0b55321f754 (PR78 merged).
          Always read actual refs before continuing; do not restore this historical SHA.

          W01 recovery application source: aee6d56f81b69a5474f7076640d0cd13bcf3e66b, PR80.
          Exact tested merge: e069d0899b354124a8458b131076c50a58030e4d.
          Run 34288483397 passed both actual Expo web and installed Android API34 emulator
          recovery using real disposable GoTrue and SMTP mailbox; no mocked Auth responses.
          Old password rejected, new password opens the same user, second account unchanged,
          cold/warm native links, reused/expired links, explicit login return and nonpersisted
          web credentials verified. All fifteen screenshots were visually reviewed.
          Artifacts: native 10081018711, web 10080530999. Native ZIP SHA256
          7c4c600ca369c0b62ec7c7bdf5310744ae7d2b20070207aae3eb8014bf7a4836;
          web ZIP SHA256 98c1a18889c645c73ff823f7fd05485aa50b273d0c078ab917768ee1b56e1a92.
          Local complete source regression: 77 suites / 816 tests; TypeScript passed.
          PRE-P4 run34288483394 and P3 run34288483403 passed for the same PR head.

          Since that proof, 22ba47adad13d6a55f7462514aa83bb20efc6ac0 changes only the
          loopback browser proof server: static /auth and /oporavak mapping replaces
          request-controlled filesystem probes reported by CodeQL. Application bytes
          are unchanged; verify the current CI/security result before root integration.

          Written: recovery + exact build identity. UI-connected: recovery/identity.
          Proven: web and Android emulator recovery. Not claimed: physical handset,
          external production SMTP, production recovery configuration/activation,
          complete W00/W01 closure or full marketplace lifecycle. No live mutation.
          The last live read-only observation remains 87 migrations through 20260907135905;
          no source migration has been newly declared applied by this checkpoint.

          Independent W11 continuation is the existing PR77 branch feat/p2-data-export-20260908.
          Source 3cd547c8c1bf90fc107367186dde4255532a65ce hardens export-request receipts,
          account revision guards and timeouts; 88 unit tests passed. db4e6d02c7e9d67ff6073bf98df6a413160e49bb
          adds actual-client/PostgREST proof and exact P3-successor replay; inspect current CI.
          It is intake/status/cancellation, NOT a generated export, UI delivery or live activation.

          Exact next action: verify current PR80 refs, CI and review threads; root merge only
          if all applicable gates pass. Then reconcile PR77 against the new canonical,
          prove its actual client and complete source migration stack, update these same
          records and integrate. Do not overwrite completed work or run blind db push.
          Missing production approvals, positive charging, HITNO, verification and ALLOW
          stay closed. Do not stop independent nonvisual implementation for design approval.

          Older sections below remain historical evidence; they are not a rollback cursor.

          '''
          import textwrap
          section=textwrap.dedent(section)+'Checkpoint recorded: '+stamp+'\n\n'
          for name in ['CURRENT_IMPLEMENTATION_HANDOFF.md','LIVE_IMPLEMENTATION_NETWORK.md']:
              p=root/name;p.write_text(section+p.read_text())
          p=root/'LIVE_MIGRATION_STATE.json';state=json.loads(p.read_text())
          state['whole_product_continuation_checkpoint']={
              'recorded_at':stamp,'scope':'W00_W01_W11_NONVISUAL_CONTINUATION',
              'observed_canonical_sha':'b0f6851c1957cf27da8e135fdf05c0b55321f754',
              'recovery_application_sha':'aee6d56f81b69a5474f7076640d0cd13bcf3e66b',
              'recovery_tested_merge_sha':'e069d0899b354124a8458b131076c50a58030e4d',
              'recovery_proof_run':34288483397,'web_proof':'PASS','android_emulator_proof':'PASS',
              'integration':'VERIFY_CURRENT_PR80_GATES_BEFORE_ROOT_MERGE',
              'source_security_amendment':'22ba47adad13d6a55f7462514aa83bb20efc6ac0',
              'physical_handset_verified':False,'external_smtp_verified':False,
              'live_mutation':False,'recovery_production_activation':False,
              'live_history_observation':{'count':87,'latest_version':'20260907135905'},
              'source_migration_inventory_changed':False,'design_frozen':True,
              'independent_continuation':{'pr':77,'unit':'W11_EXPORT_REQUEST_INTAKE_ONLY','source':'db4e6d02c7e9d67ff6073bf98df6a413160e49bb'},
          }
          p.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n')
          p=root/'IMPLEMENTATION_STATUS_LEDGER.csv'; original=p.read_text();rows=list(csv.reader(io.StringIO(original)))
          assert len(rows[0])==11
          additions=[
              ['W00_BUILD_IDENTITY_20260909','IMPLEMENTED_UI_CONNECTED_SOURCE_PROVEN_PR80','aee6d56f81b69a5474f7076640d0cd13bcf3e66b','NONE','UNCHANGED','BuildIdentity;app.config.js','run34288483397;run34288483394','EXACT_SOURCE_RECEIPT_AND_ACTUAL_WEB','NO_MUTATION','FULL_W00_CONSOLIDATION_NOT_CLAIMED','VERIFY_CURRENT_GATES_ROOT_INTEGRATE_PR80_THEN_PR77'],
              ['W01_RECOVERY_20260909','WEB_AND_ANDROID_EMULATOR_PROVEN_PR80','aee6d56f81b69a5474f7076640d0cd13bcf3e66b','NONE','EXISTING_SUPABASE_AUTH','auth;oporavak;native-intent;session-runtime','run34288483397;artifact10081018711;artifact10080530999','REAL_AUTH_SMTP_WEB_ANDROID_TWO_ACCOUNTS_77S816','NO_MUTATION','PHYSICAL_HANDSET_EXTERNAL_SMTP_PRODUCTION_ACTIVATION_NOT_PROVEN','VERIFY_CURRENT_SECURITY_GATES_ROOT_INTEGRATE_PR80'],
              ['W11_EXPORT_INTAKE_REVIEW_20260909','HARDENED_CLIENT_PROOF_PENDING_PR77','db4e6d02c7e9d67ff6073bf98df6a413160e49bb','20260908160000_PENDING_NOT_LIVE','EXISTING_P2_PRIVATE_REGISTRY','dataExportClientService_NO_UI_DELIVERY','88_CLIENT_TESTS;ACTUAL_RPC_CI_PENDING','UNIT_AND_SOURCE_ONLY_UNTIL_CI_CONFIRMED','NO_MUTATION','GENERATED_EXPORT_DELIVERY_AND_ACTIVATION_NOT_IMPLEMENTED','VERIFY_ACTUAL_CLIENT_AND_FULL_STACK_THEN_INTEGRATE_PR77'],
          ]
          assert not any(row[0]==additions[0][0] for row in rows)
          out=io.StringIO();writer=csv.writer(out,lineterminator='\n');writer.writerows(additions)
          p.write_text(original.rstrip('\n')+'\n'+out.getvalue())
          own='.github/workflows/_tmp_w00_w01_checkpoint.yml';pathlib.Path(own).unlink()
          subprocess.run(['git','add',*(str(root/name) for name in expected),own],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed=={str(root/name) for name in expected}|{own}
          assert all(len(row)==11 for row in csv.reader(io.StringIO(p.read_text())))
          json.loads((root/'LIVE_MIGRATION_STATE.json').read_text())
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(w00-w01): record actual recovery proof and preserve exact nonvisual continuation'
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
