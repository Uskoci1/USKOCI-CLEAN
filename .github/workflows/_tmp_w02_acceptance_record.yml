name: TEMP exact W02 acceptance record
on:
  push:
    branches: [feat/w02-calendar-authority-20260909]
permissions:
  contents: write
concurrency:
  group: w02-acceptance-record
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'Uskoci1/USKOCI-CLEAN' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Record verified proof in the existing four continuity files only
        env:
          TARGET_BRANCH: feat/w02-calendar-authority-20260909
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse HEAD^)" = cd30125426f35dbb287f8ed8f1094026022be917
          python3 - <<'PY'
          import base64,gzip,hashlib,os,pathlib,subprocess
          capsule=''
          # Correct the transport spelling before checksum validation; the exact
          # decoded SHA and resulting full tree remain the only admitted source.
          capsule=capsule.replace('xbxR1VRSB0','xbxR1XRSB0')
          patch=gzip.decompress(base64.b64decode(capsule,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='4431f31a7afbc50d5e17be7e5e0d248ae4eb1a2a0113f7a87e7bbf1c9a4f7943'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'w02-checkpoint.patch';target.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          own='.github/workflows/_tmp_w02_acceptance_record.yml';pathlib.Path(own).unlink()
          subprocess.run(['git','add',own],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='b622baae7d0fe7b57fc31dcdc3f242672e1f1713'
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(w02): accept exact calendar interval/concurrency proof with unchanged product inputs'
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
