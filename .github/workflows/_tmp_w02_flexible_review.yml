name: TEMP exact W02 flexible source transfer
on:
  push:
    branches: [feat/w02-calendar-authority-20260909]
permissions:
  contents: write
concurrency:
  group: w02-flexible-source-transfer
  cancel-in-progress: false
jobs:
  apply-reviewed-source:
    if: github.repository == 'Uskoci1/USKOCI-CLEAN' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Apply the exact reviewed non-workflow source delta and retire transfer files
        shell: bash
        env:
          TARGET_BRANCH: feat/w02-calendar-authority-20260909
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 1d8582c9bce6f826227a77b438594d50257b3c0c
          test "$(git rev-parse 'HEAD^^{tree}')" = b622baae7d0fe7b57fc31dcdc3f242672e1f1713
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess
          source='.github/_tmp_w02_flexible_review.patch'
          own='.github/workflows/_tmp_w02_flexible_review.yml'
          # Only the textual transport's diff-boundary prefixes are normalized.
          # The complete pre-reviewed patch checksum and final Git tree are mandatory.
          patch=pathlib.Path(source).read_bytes().replace(b'\n diff --git ',b'\ndiff --git ')
          assert len(patch)==25286
          assert hashlib.sha256(patch).hexdigest()=='ac25129a6977fddf6f7882ea0705b6e1d2cbb0b89d0c65625ecbdce18f87942a'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'w02-flexible-source';out.mkdir()
          p=out/'reviewed.patch';p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply','--index',str(p)],check=True)
          for name in [source,own]: pathlib.Path(name).unlink()
          subprocess.run(['git','add','--',source,own],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='4177ed14d4203be5acb88a0f5ddc8d94fb59e0bf', 'Source tree differs from reviewed unit'
          (out/'source-tree.txt').write_text(tree+'\n')
          PY
          python3 supabase/migrations/check_migration_integrity.py
          node --check supabase/proofs/calendar/w02_calendar_integrity_proof.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(w02): keep flexible days nonblocking and requester schedules unrestricted' -m 'Exact owner-approved calendar scope; 81 local suites/984 tests and TypeScript passed. Preserve all prior SQL bytes and hard worker interval/concurrency protection. Extend real Auth/RPC/client proof with flexible, unknown-duration, later-exact and simultaneous requester scenarios. Runtime proof and canonical integration remain pending. No live mutation or visual redesign.'
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/w02-flexible-source/source-commit.txt"
      - name: Retain readable exact-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: W02-FLEXIBLE-SOURCE-${{ github.run_id }}
          path: ${{ runner.temp }}/w02-flexible-source/
          if-no-files-found: warn
          retention-days: 7
