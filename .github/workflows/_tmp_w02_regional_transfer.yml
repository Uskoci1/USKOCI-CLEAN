name: TEMP bounded W02 regional source transfer
on:
  push:
    branches: [feat/w02-regional-country-authority-20260910]
permissions:
  contents: write
concurrency:
  group: w02-regional-transfer
  cancel-in-progress: false
jobs:
  apply-reviewed-source:
    if: github.repository == 'Uskoci1/USKOCI-CLEAN' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Apply only SHA-bound reviewed W02 regional source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/w02-regional-country-authority-20260910"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 4bcc5dbf1128a4d081824797350b83a00127c21f
          python3 - <<'PY'
          from pathlib import Path
          import gzip,hashlib
          capsule=Path('_tmp/w02-regional-source.patch.gz').read_bytes()
          assert hashlib.sha256(capsule).hexdigest()=='c8281db5d68f1718417807594c957fa56894c656db699957b9f2c09fb04dac00'
          patch=gzip.decompress(capsule)
          assert hashlib.sha256(patch).hexdigest()=='dbb71037bdce9395ee98350355667ac560f93f6f439ee035f55e46fd6dc35642'
          assert len(patch)==103988
          Path('/tmp/w02-regional.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/w02-regional.patch
          git apply --index /tmp/w02-regional.patch
          python3 - <<'PY'
          import subprocess
          expected=set('''src/contracts/location.ts
          src/contracts/market.ts
          src/contracts/needFactsV2.ts
          src/contracts/projections.ts
          src/data/__tests__/ru2-ai-v2-ui.test.ts
          src/data/__tests__/task-detail-read.test.ts
          src/data/__tests__/w02-location-client.test.ts
          src/data/__tests__/w02-regional-market-client.test.ts
          src/data/aiNeedV2Ui.ts
          src/data/locationClientService.ts
          src/data/locationResolver.ts
          src/data/marketClientService.ts
          src/data/needClientService.ts
          src/data/supabaseIzvor.ts
          src/lib/location.ts
          src/lib/market.ts
          supabase/functions/uskoci-ai-interview/index.ts
          supabase/migrations/20260910060000_clean_w02_regional_country_authority.sql
          supabase/migrations/MD5_MANIFEST.txt
          supabase/migrations/MIGRATION_PROVENANCE.json
          supabase/proofs/calendar/w02_location_proof.mjs'''.split())
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).split())
          assert actual==expected,(sorted(actual-expected),sorted(expected-actual))
          PY
          python3 supabase/migrations/check_migration_integrity.py
          node --check supabase/proofs/calendar/w02_location_proof.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(w02): adapt verified R47 country boundaries into current CLEAN owners' -m 'REUSE-first: current location, profile, availability and matching owners are extended; no parallel geography or regional engine. Local86 suites/1207 tests and migration integrity101=87+14 passed. Runtime proof and canonical integration remain pending. No live mutation or design change.'
          test "$(git ls-remote origin refs/heads/feat/w02-regional-country-authority-20260910 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/feat/w02-regional-country-authority-20260910
