name: TEMP exact W02 reviewed source transfer
on:
  push:
    branches: [feat/w02-calendar-authority-20260909]
permissions:
  contents: write
concurrency:
  group: w02-reviewed-source-transfer
  cancel-in-progress: false
jobs:
  apply-reviewed-source:
    if: github.repository == 'Uskoci1/USKOCI-CLEAN' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Apply only the reviewed exact-tree delta and retire this writer
        shell: bash
        env:
          TARGET_BRANCH: feat/w02-calendar-authority-20260909
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse HEAD^)" = b3445e1f9d7863f5c1fce301e637108643f1e56e
          test "$(git rev-parse 'HEAD^^{tree}')" = 41164cb14a4dbf7ff065d0ef82475a0131cfa38e
          python3 - <<'PY'
          import base64,gzip,hashlib,os,pathlib,subprocess
          parts=['.github/_tmp_w02_delta_1.txt','.github/_tmp_w02_delta_2.txt']
          own='.github/workflows/_tmp_w02_review_apply.yml'
          archive=base64.b64decode(''.join(pathlib.Path(p).read_text() for p in parts),validate=True)
          assert hashlib.sha256(archive).hexdigest()=='bc28775e6b1919095e040bd4ab47391203426b270019f2cf1792fe83ac91d7d4'
          patch=gzip.decompress(archive)
          assert hashlib.sha256(patch).hexdigest()=='bd36ab4fe8e839d2b927e3aaefb9fb4d65be89a02d0dfbfe6eed745f2e371179'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'w02-reviewed-source';out.mkdir()
          target=out/'reviewed.patch';target.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          for name in parts+[own]:
              pathlib.Path(name).unlink()
          subprocess.run(['git','add','--',*parts,own],check=True)
          # This pins every byte/mode/path, including all untouched historical,
          # design, SQL and application files. No approximate patch is admitted.
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='804ea25df7db047bac67fae509eb39c0bd901af4', 'Unexpected source tree; refusing push'
          (out/'source-tree.txt').write_text(tree+'\n')
          PY
          python3 supabase/migrations/check_migration_integrity.py
          node --check supabase/proofs/calendar/w02_calendar_integrity_proof.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(w02): freeze agreed intervals and serialize calendar changes across snapshots' -m 'Exact reviewed source: 81 local suites / 982 tests and TypeScript passed. Add forward-only interval integrity, finite microsecond client validation, static conflict errors and completion/observed-concurrency proofs. Preserve all existing SQL and frozen visual material. New runtime proof and canonical integration remain pending; no live mutation.'
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/w02-reviewed-source/source-commit.txt"
      - name: Retain the readable exact source delta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: W02-REVIEWED-SOURCE-${{ github.run_id }}
          path: ${{ runner.temp }}/w02-reviewed-source/
          if-no-files-found: error
          retention-days: 7
