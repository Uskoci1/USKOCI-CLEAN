name: AI Edge server context source proof

on:
  push:
    branches:
      - fix/ai-server-context-20260907
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-edge-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Install exact dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Deno Edge module check
        run: deno check supabase/functions/uskoci-ai-interview/index.ts
      - name: Actual Edge handler with mocked transport
        run: node supabase/proofs/ai/ai_edge_context_proof.mjs
      - name: Regression tests
        run: npm test -- --runInBand
      - name: Archive source proof only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-edge-context-source-proof
          path: proof-out/ai-edge-context/
          if-no-files-found: error
          retention-days: 14
