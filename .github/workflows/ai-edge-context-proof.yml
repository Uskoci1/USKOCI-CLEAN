name: W03 owned AI intake and privacy proof
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Targeted source checks or actual owned intake on disposable SQL106
        type: choice
        options: [source, intake]
        default: intake
  workflow_call:
    inputs:
      scope:
        type: string
        default: intake
permissions:
  contents: read
concurrency:
  group: ai-edge-context-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  CI: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  W03_INTAKE_ARTIFACT_DIR: artifacts/w03-owned-intake
jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate requested boundary
        env:
          W03_SCOPE: ${{ inputs.scope || 'intake' }}
        run: node -e 'if(!["source","intake"].includes(process.env.W03_SCOPE)) process.exit(1)'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.5.6
      - name: Install exact dependencies
        run: npm ci
      - name: Source admission and TypeScript
        run: |
          python3 supabase/migrations/check_migration_integrity.py
          node --test scripts/ci/owned-intake-source.test.mjs
          node --test supabase/proofs/ru5_device_ui_local_guard.test.mjs
          npx tsc --noEmit
          deno check supabase/functions/uskoci-ai-interview/index.ts
      - name: Actual Edge handler and private-location negatives with synthetic transports
        run: |
          node supabase/proofs/ai/ai_edge_context_proof.mjs
          node -e 'const r=JSON.parse(require("fs").readFileSync("proof-out/ai-edge-context/proof-report.json")); if(r.status!=="PASS" || r.sourceCommit!==process.env.GITHUB_SHA || r.actualProviderCalled || r.databaseConnected || r.testsPassed!==98 || r.testsFailed!==0) process.exit(1);'
      - name: Affected intake, account, draft-save and location regressions
        run: node scripts/ci/scope.cjs test w03
      - name: Set up existing disposable Supabase runtime
        if: inputs.scope != 'source'
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Existing disposable historical79 environment
        if: inputs.scope != 'source'
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh
      - name: Existing real local Auth fixture
        if: inputs.scope != 'source'
        run: node supabase/proofs/ru5_device_ui_fixture.mjs
      - name: Prepare exact canonical105 prefix without replaying old behavior suites
        if: inputs.scope != 'source'
        run: node scripts/ci/owned-intake-proof.mjs prepare105
      - name: Apply106 and prove owned requests, human authority and observed locks
        if: inputs.scope != 'source'
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/ai/owned_intake_proof.mjs 2>&1 | tee "$W03_INTAKE_ARTIFACT_DIR/proof.log"
          node scripts/ci/owned-intake-proof.mjs admit
      - name: Retain original source-bound intake evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: W03-OWNED-INTAKE-EVIDENCE
          path: |
            artifacts/w03-owned-intake/
            proof-out/ai-edge-context/
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown only this disposable instance
        if: always() && inputs.scope != 'source'
        shell: bash
        run: |
          if [[ -n "${RU5_DEVICE_PROOF_DIR:-}" && -d "$RU5_DEVICE_PROOF_DIR" ]]; then
            cd "$RU5_DEVICE_PROOF_DIR"
            supabase stop --no-backup
          fi
