name: W03 native owned AI and human review
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: w03-native-review-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  CI: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  RU5_DEVICE_PACKAGE: rs.uskoci.n04proof
  RU5_DEVICE_ARTIFACT_DIR: artifacts/ai-review-device
  W03_INTAKE_ARTIFACT_DIR: artifacts/ai-review-device/source105
jobs:
  native-owned-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Locked dependencies and targeted harness integrity
        run: |
          npm ci
          python3 supabase/migrations/check_migration_integrity.py
          node --test scripts/ai_review_fixture_guard.test.mjs
          python3 -B -m unittest scripts/ai_review_harness_test.py -v
          node --check scripts/ai_review_edge_server.mjs
          npx tsc --noEmit
      - name: Existing local environment and real Auth fixture
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh
      - run: node supabase/proofs/ru5_device_ui_fixture.mjs
      - name: Exact source105 with existing reconstruction helpers
        run: node scripts/ci/owned-intake-proof.mjs prepare105
      - name: Exact106 native admission and isolated fresh Auth accounts
        run: |
          node scripts/ai_review_fixture.mjs admit
          node scripts/ai_review_fixture.mjs create-account
      - name: Bind disposable native endpoint to actual-handler loopback adapter
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=http://10.0.2.2:54329" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$RU5_DEVICE_ANON_KEY" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_USE_FAKE_SOURCE=0" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs=require('fs'),p='app.json',app=JSON.parse(fs.readFileSync(p));
          app.expo.android={...app.expo.android,package:'rs.uskoci.n04proof'};
          app.expo.name='USKOČI W03 NATIVE PROOF';fs.writeFileSync(p,JSON.stringify(app,null,2)+'\n');
          NODE
      - name: Generate exact current native application
        run: npx expo prebuild --platform android --clean
      - name: Proof-only HTTP and x86_64 build settings
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml');s=p.read_text()
          if 'android:usesCleartextTraffic=' not in s:s=s.replace('<application ','<application android:usesCleartextTraffic="true" ',1)
          p.write_text(s)
          assert 'android:usesCleartextTraffic="true"' in s
          p=Path('android/gradle.properties');s=p.read_text()
          for key,value in [('org.gradle.jvmargs','-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8'),('reactNativeArchitectures','x86_64')]:
              expr=r'^'+re.escape(key)+r'=.*$';line=key+'='+value
              s=re.sub(expr,line,s,flags=re.M) if re.search(expr,s,re.M) else s.rstrip()+'\n'+line+'\n'
          p.write_text(s)
          PY
      - name: Build standalone current native proof APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -x lintVitalAnalyzeRelease
      - name: Verify compiled local endpoint
        run: |
          bundle="$(find android/app/build/generated/assets -type f -name 'index.android.bundle' | head -n 1)"
          test -n "$bundle"
          grep -aF 'http://10.0.2.2:54329' "$bundle" >/dev/null
          if grep -aF 'leqcwgzvjsxugfgzdmth.supabase.co' "$bundle" >/dev/null; then exit 1; fi
      - name: Enable emulator KVM when available
        run: if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
      - name: Physical current native composer and review roundtrip
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            bash scripts/ai_review_run_journey.sh
      - name: Admit exact physical and business evidence
        run: |
          grep -F 'PASS AI_REVIEW_PHYSICAL' artifacts/ai-review-device/ai-proof.log
          grep -F 'PASS AI_REVIEW_ARTIFACT_CHAIN' artifacts/ai-review-device/ai-proof.log
          grep -F 'CHECKPOINT AI_REVIEW_LOCAL_REST_STOPPED' artifacts/ai-review-device/ai-proof.log
          grep -F 'CHECKPOINT AI_REVIEW_LOCAL_REST_RESTORED' artifacts/ai-review-device/ai-proof.log
          for checkpoint in AI_entry_real_native AI_owner_empty AI_owned_conversation_open AI_composer_keyboard AI_send_unknown_after_commit AI_pending_proposals AI_review_pending_top AI_review_back_same_conversation AI_people_correction_input AI_people_corrected AI_optional_vehicle_blocks_save AI_offline_confirmation_readback AI_restored_explicit_confirmation AI_ready_human_confirmed AI_saved_draft_detail AI_saved_conversation_readonly AI_saved_in_tasks AI_other_account_empty AI_other_account_new_conversation; do
            test -s "artifacts/ai-review-device/${checkpoint}.png"
            test -s "artifacts/ai-review-device/${checkpoint}.xml"
          done
          node <<'NODE'
          const assert=require('assert/strict'),fs=require('fs'),dir='artifacts/ai-review-device/';
          const r=JSON.parse(fs.readFileSync(dir+'proof-report.json'));
          assert.equal(r.result,'PASS');assert.equal(r.sourceSha,process.env.GITHUB_SHA);assert.equal(r.historyCount,106);
          for(const key of ['localOnly','actualAuth','actualNativeClient','actualHandler','actualSql','oneTurn','oneDraft','oneSaveReceipt','gatesUnchanged'])assert.equal(r[key],true);
          for(const key of ['providerProof','gatewayProof','publicationProof'])assert.equal(r[key],false);
          assert.equal(r.adapter.providerCalls,1);assert.equal(r.adapter.handlerCalls,1);assert.equal(r.adapter.committedResponseDropped,true);
          NODE
      - name: Retain original screenshots, hierarchy and source-bound evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: W03-NATIVE-AI-REVIEW-EVIDENCE
          path: artifacts/ai-review-device/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop this disposable Supabase instance
        if: always()
        run: |
          if [[ -n "${RU5_DEVICE_PROOF_DIR:-}" && -d "$RU5_DEVICE_PROOF_DIR" ]]; then
            cd "$RU5_DEVICE_PROOF_DIR"
            supabase stop --no-backup
          fi
