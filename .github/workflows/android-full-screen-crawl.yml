name: Android full screen crawl

on:
  push:
    branches:
      - proof/android-visual-proof-20260905
    paths:
      - '.github/workflows/android-full-screen-crawl.yml'
      - '.github/visual-proof/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: '1'
  NODE_ENV: production
  EXPO_PUBLIC_USE_FAKE_SOURCE: '1'
  EXPO_PUBLIC_VISUAL_PROOF: '1'

jobs:
  android-full-screen-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout isolated proof branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare proof-only authenticated fixtures
        run: python3 .github/visual-proof/prepare-all-screens.py

      - name: TypeScript proof preflight
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Tune Gradle for x86_64 proof
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/gradle.properties')
          lines = path.read_text().splitlines()
          values = {
              'org.gradle.jvmargs': '-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8',
              'reactNativeArchitectures': 'x86_64',
          }
          seen = set()
          out = []
          for line in lines:
              key = line.split('=', 1)[0] if '=' in line else None
              if key in values:
                  out.append(f'{key}={values[key]}')
                  seen.add(key)
              else:
                  out.append(line)
          for key, value in values.items():
              if key not in seen:
                  out.append(f'{key}={value}')
          path.write_text('\n'.join(out) + '\n')
          PY

      - name: Build standalone proof APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -x lintVitalAnalyzeRelease

      - name: Prepare crawl bundle
        run: |
          mkdir -p visual-all
          cp android/app/build/outputs/apk/release/app-release.apk visual-all/USKOCI-ALL-SCREENS.apk
          sha256sum visual-all/USKOCI-ALL-SCREENS.apk > visual-all/USKOCI-ALL-SCREENS.apk.sha256
          printf '%s\n' \
            '01 requester Početna' \
            '02 requester Potrebe' \
            '03 requester Novi-Zadatak-AI' \
            '04 requester Pregled-nacrta' \
            '05 requester Prijave-kandidata' \
            '06 requester Zadatak-pregled' \
            '07 requester Kandidati' \
            '08 requester Dogovori' \
            '09 requester Dogovor-detalj' \
            '10 requester Profil' \
            '11 worker Početna' \
            '12 worker Moje-prijave' \
            '13 worker Prilike' \
            '14 worker Prilika-detalj' \
            '15 worker Prijava-na-priliku' \
            '16 worker Profil-radnika' \
            '17 worker Dogovori' \
            '18 worker Dogovor-detalj' \
            '19 worker Profil' > visual-all/routes.txt

      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Boot emulator and crawl real RN routes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash .github/visual-proof/crawl-all-screens.sh

      - name: Verify crawl outputs
        if: always()
        run: |
          set -eu
          ls -lah visual-all || true
          printf 'file\tbytes\tsha256\n' > visual-all/screenshots-manifest.tsv
          count=0
          for f in visual-all/[0-9][0-9]-*.png; do
            test -s "$f"
            bytes=$(wc -c < "$f")
            sha=$(sha256sum "$f" | awk '{print $1}')
            printf '%s\t%s\t%s\n' "$(basename "$f")" "$bytes" "$sha" >> visual-all/screenshots-manifest.tsv
            count=$((count+1))
          done
          echo "SCREENSHOT_COUNT=$count"
          test "$count" -eq 19

      - name: Upload all-screen visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: USKOCI-ANDROID-ALL-SCREENS
          path: visual-all/
          if-no-files-found: warn
          retention-days: 14
