name: Android visual proof

on:
  push:
    branches:
      - proof/android-visual-proof-20260905
    paths:
      - '.github/workflows/android-visual-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_PUBLIC_SUPABASE_URL: https://leqcwgzvjsxugfgzdmth.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_o_I-YOn57oPCrIboF0OjPQ_c3DHmOZW
  EXPO_PUBLIC_USE_FAKE_SOURCE: '0'
  CI: '1'
  NODE_ENV: production

jobs:
  android-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout isolated proof branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked dependencies
        run: npm ci

      - name: Inject proof-only Android package id
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          app.expo.android = app.expo.android || {};
          app.expo.android.package = 'rs.uskoci.visualproof';
          app.expo.name = 'USKOČI VISUAL PROOF';
          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Tune Gradle for x86_64 emulator proof
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'android/gradle.properties';
          let text = fs.readFileSync(path, 'utf8');
          const setProp = (key, value) => {
            const re = new RegExp(`^${key.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&')}=.*$`, 'm');
            const line = `${key}=${value}`;
            text = re.test(text) ? text.replace(re, line) : `${text.trimEnd()}\n${line}\n`;
          };
          setProp('org.gradle.jvmargs', '-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8');
          setProp('reactNativeArchitectures', 'x86_64');
          fs.writeFileSync(path, text);
          NODE

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -x lintVitalAnalyzeRelease

      - name: Boot Android emulator and capture real app screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euxo pipefail
            mkdir -p visual-proof
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb shell monkey -p rs.uskoci.visualproof -c android.intent.category.LAUNCHER 1
            sleep 12
            adb exec-out screencap -p > visual-proof/01-launch.png
            adb shell uiautomator dump /sdcard/window-launch.xml || true
            adb pull /sdcard/window-launch.xml visual-proof/window-launch.xml || true
            adb shell am start -W -a android.intent.action.VIEW -d 'uskociapp://auth' rs.uskoci.visualproof || true
            sleep 6
            adb exec-out screencap -p > visual-proof/02-auth.png
            adb shell uiautomator dump /sdcard/window-auth.xml || true
            adb pull /sdcard/window-auth.xml visual-proof/window-auth.xml || true
            adb shell dumpsys window > visual-proof/window-dumpsys.txt || true
            adb logcat -d > visual-proof/logcat.txt || true

      - name: Prepare proof bundle
        if: always()
        run: |
          mkdir -p visual-proof
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk visual-proof/USKOCI-VISUAL-PROOF.apk
            sha256sum visual-proof/USKOCI-VISUAL-PROOF.apk > visual-proof/USKOCI-VISUAL-PROOF.apk.sha256
          fi

      - name: Upload visual proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: USKOCI-ANDROID-VISUAL-PROOF
          path: visual-proof/
          if-no-files-found: warn
          retention-days: 14
