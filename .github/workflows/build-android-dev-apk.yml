name: Build Android development APK

on:
  workflow_dispatch:
  push:
    branches:
      - clean-alpha-backend
    paths:
      - '.github/workflows/build-android-dev-apk.yml'

permissions:
  contents: write

env:
  # Public client configuration by design. No service-role/provider secret is stored here.
  EXPO_PUBLIC_SUPABASE_URL: https://leqcwgzvjsxugfgzdmth.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_o_I-YOn57oPCrIboF0OjPQ_c3DHmOZW
  EXPO_PUBLIC_USE_FAKE_SOURCE: '0'

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked dependencies
        run: npm ci

      - name: Inject development-only Android package id
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          app.expo.android = app.expo.android || {};
          app.expo.android.package = 'rs.uskoci.dev';
          app.expo.name = 'USKOČI DEV';
          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk USKOCI-DEV.apk
          sha256sum USKOCI-DEV.apk > USKOCI-DEV.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: USKOCI-DEV-APK
          path: |
            USKOCI-DEV.apk
            USKOCI-DEV.apk.sha256
          retention-days: 14

      - name: Refresh dev-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest \
            USKOCI-DEV.apk \
            USKOCI-DEV.apk.sha256 \
            --target "${GITHUB_SHA}" \
            --title 'USKOČI DEV — Android APK' \
            --notes 'Development APK connected to the live USKOČI Supabase backend. This is not a Play Store release.' \
            --prerelease
