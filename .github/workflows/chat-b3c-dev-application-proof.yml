name: Chat B3c exact application candidate and certified erasure proof
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths: ['.github/workflows/chat-b3c-dev-application-proof.yml', 'supabase/candidates/chat_b3c_private_invalidation_dev_application.sql', 'supabase/proofs/chat/private_invalidation_dev_application_proof.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chat-b3c-dev-application-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/chat-b3c-private
      B3C_ARTIFACT_DIR: /tmp/chat-b3c-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Bind exact source and install locked existing dependencies
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$B3C_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$B3C_ARTIFACT_DIR/source-binding.txt"
          git ls-files -z supabase/migrations supabase/operations/dev-alpha/ledger supabase/candidates supabase/proofs supabase/functions/uskoci-account-closure-worker supabase/functions/_shared/data-export.ts docs/implementation/v5-ai-first .github/workflows/chat-b3-history-proof.yml .github/workflows/chat-b3c-invalidation-proof.yml .github/workflows/chat-b3c-dev-application-proof.yml package.json package-lock.json | xargs -0 sha256sum | sha256sum > "$B3C_ARTIFACT_DIR/source-manifest-sha256.txt"
          dependency_exit=0
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/01-dependencies.log" 2>&1 || dependency_exit=$?
          printf '01-dependencies exit=%s\n' "$dependency_exit" | tee "$B3C_ARTIFACT_DIR/stages.txt"
          test "$dependency_exit" -eq 0
          git diff --exit-code
      - name: Reconstruct the existing disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          # Setup can print local keys. Raw output and predecessor reports stay
          # outside the uploaded directory; only fixed stage summaries are public.
          setup_exit=0
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/02-live79.log" 2>&1 || setup_exit=$?
          printf '02-live79 exit=%s\n' "$setup_exit" | tee -a "$B3C_ARTIFACT_DIR/stages.txt"
          exit "$setup_exit"
      - name: Guard loopback targets and replay unchanged B3 predecessor stages
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          try {
            assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
            if (process.env.DB_URL !== process.env.RU5_DEVICE_DB_URL) throw new Error();
          } catch { console.error('FAIL CHAT_B3C_LOCAL_TARGET_ADMISSION'); process.exit(1); }
          NODE
          run_stage() {
            local stage="$1" status=0
            shift
            printf '%s START\n' "$stage" | tee -a "$B3C_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$B3C_ARTIFACT_DIR/stages.txt"
            return "$status"
          }
          # Exact proven historical stages. Current P0/P4/P5 readers follow below; PKG-051 remains excluded.
          run_stage 03-source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage 04-dev-alpha-to-pkg026 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage 05-pkg027 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage 06-pkg028 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage 07-pkg029 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage 08-pkg030 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage 09-pkg031 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage 10-pkg032 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage 11-pkg033 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage 12-pkg034 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage 13-pkg035 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage 14-pkg037 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage 15-pkg038 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage 16-pkg039 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage 17-pkg040 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage 18-pkg042-to-pkg050 node supabase/proofs/pkg050/pkg050_proof.mjs
          run_stage 19-a1-preparation node supabase/proofs/chat/prepare_notification_a1.mjs
          run_stage 20-b3a node supabase/proofs/chat/private_history_read_proof.mjs
          run_stage 21-b3b node supabase/proofs/chat/message_window_proof.mjs
          run_stage 22-p0 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/discovery_p0_exact_public_landing.sql
          run_stage 23-p4 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/chat_p4_exact_message_event_resolver.sql
          run_stage 24-p5 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/worker_profile_licenses_owned_projection.sql
      - name: Run B3c SQL with real local sessions and independent rollback checks
        run: |
          set -euo pipefail
          umask 077
          proof_exit=0
          node supabase/proofs/chat/private_invalidation_proof.mjs > "$PRE_V3_ARTIFACT_DIR/25-b3c.log" 2>&1 || proof_exit=$?
          printf '25-b3c exit=%s\n' "$proof_exit" | tee -a "$B3C_ARTIFACT_DIR/stages.txt"
          exit "$proof_exit"
      - name: Admit only the bounded SQL-only result
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          try {
            const report=JSON.parse(readFileSync(process.env.B3C_ARTIFACT_DIR+'/chat-b3c-report.json','utf8'));
            assert.equal(report.result,'PASS'); assert.equal(report.sourceSha,process.env.GITHUB_SHA);
            for (const key of ['actualAuth','actualDatabase','sqlAuthenticatedRoles','disposableOnly','sqlRollbackMarker']) assert.equal(report[key],true);
            for (const key of ['liveAccess','providerCalled','deviceProven','incomingStreamProven','certificateMoved','deploymentReady']) assert.equal(report[key],false);
            assert.equal(report.providerCalls,0); assert.equal(report.storageCalls,0); assert.equal(report.sqlExit,0);
            assert.deepEqual(report.fixtureCounts,{actors:4,agreements:2,admittedSessions:3});
            assert.deepEqual(report.rollback,{checked:true,catalogUnchanged:true,fixtureStateUnchanged:true});
            assert.equal(report.catalogBeforeSha256,report.catalogAfterSha256);
            assert.equal(report.checks.length,5); assert.ok(report.checks.every(check=>check.result==='PASS'));
            assert.equal(Object.keys(report.sourceArtifactHashes).length,8);
            assert.ok(Object.values(report.sourceArtifactHashes).every(hash=>/^[a-f0-9]{64}$/.test(hash)));
            console.log('PASS CHAT_B3C_SQL_AUTHORIZATION_AND_ROLLBACK_ONLY');
          } catch { console.error('FAIL CHAT_B3C_RESULT_ADMISSION'); process.exit(1); }
          NODE
      - name: Prove the exact atomic application candidate and both canonical closures
        run: |
          set -euo pipefail
          umask 077
          application_exit=0
          timeout --signal=TERM --kill-after=10s 600s node supabase/proofs/chat/private_invalidation_dev_application_proof.mjs > "$PRE_V3_ARTIFACT_DIR/26-b3c-application.log" 2>&1 || application_exit=$?
          printf '26-b3c-application exit=%s\n' "$application_exit" | tee -a "$B3C_ARTIFACT_DIR/stages.txt"
          exit "$application_exit"
      - name: Admit only the bounded exact application proof
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          try {
            const r=JSON.parse(readFileSync(process.env.B3C_ARTIFACT_DIR+'/chat-b3c-application-report.json','utf8'));
            assert.equal(r.result,'PASS');assert.equal(r.sourceSha,process.env.GITHUB_SHA);
            for(const key of ['actualAuth','actualDatabase','disposableOnly','teardownRequired',
              'disposableCertificateMoved','certifiedErasureProven','provedInstallFragmentIdentical',
              'atomicRollbackPreservesCatalog','actualAuthenticatedRowVisibility',
              'finalCatalogUnchangedSinceApplication','finalReadiness'])assert.equal(r[key],true);
            for(const key of ['liveAccess','providerCalled','deviceProven','incomingStreamProven',
              'devCertificateMoved','deploymentReady'])assert.equal(r[key],false);
            assert.equal(r.providerCalls,0);assert.equal(r.storageCalls,0);
            assert.equal(r.application.certificatePlacesChanged,3);
            assert.equal(r.application.exactDeltaGuardPassedAtomically,true);
            assert.equal(r.application.readinessConstantOnly,true);
            assert.equal(r.application.readinessMetadataOtherwiseUnchanged,true);
            assert.equal(r.application.migrationHistoryUnchanged,true);
            assert.equal(r.application.ready,true);assert.equal(r.application.bindingMatches,true);
            assert.equal(r.catalogFinalSha256,r.catalogCertifiedSha256);
            assert.deepEqual(r.fixtureCounts,{actors:7,agreements:3,closingAccounts:2,syntheticResidualCacheRows:2});
            assert.equal(r.fixtureContract,'CANONICAL_MESSAGES_AND_CANCEL_THEN_EXPLICIT_SYNTHETIC_RESIDUAL_CACHE');
            assert.deepEqual(r.refusals.map(x=>x.name),['CERTIFICATES_DISAGREE','UNREVIEWED_TABLE',
              'READINESS_METADATA_CHANGED','AUTH_PREDECESSOR_METADATA_CHANGED','PUBLICATION_FLAGS_CHANGED',
              'CANONICAL_EXECUTING_CLOSURE','ALREADY_INSTALLED']);
            assert.ok(r.refusals.every(x=>x.refused&&x.completeCatalogUnchanged));
            assert.deepEqual(r.laterDriftChecks.map(x=>x.name),['UNREVIEWED_TABLE','POLICY_CHANGED',
              'PUBLICATION_DELETE_ENABLED','FUNCTION_METADATA_CHANGED']);
            assert.ok(r.laterDriftChecks.every(x=>x.readinessFalse&&x.bindingNull&&x.rollbackUnchanged));
            assert.deepEqual(r.closures.map(x=>x.role),['REQUESTER','WORKER']);
            for(const c of r.closures) {
              assert.equal(c.result,'CLOSED');assert.equal(c.sessionsRemaining,0);assert.equal(c.syntheticResidualCacheRowsErased,1);
              assert.ok(c.calls>0&&c.calls<200);assert.ok(c.redactionSteps>0&&c.redactionSteps<200);
              for(const key of ['canonicalStartReplayedWithoutNewGeneration','erasureStepVerified',
                'ownMessageAndCancelReasonErased','peerMessagePreserved','authIdentitySoftErased',
                'oldSessionCannotRead','unrelatedAgreementUnchanged'])assert.equal(c[key],true);
            }
            assert.deepEqual(r.checks.map(x=>x.name),[
              'EXACT_SOURCE_AND_IDENTICAL_PROVED_INSTALL_FRAGMENT',
              'PREDECESSOR_REFUSALS_PRESERVE_COMPLETE_CATALOG',
              'EXECUTING_CLOSURE_REFUSAL_ROLLS_BACK_CANONICAL_START',
              'EXACT_APPLICATION_ROLLBACK_PRESERVES_COMPLETE_CATALOG',
              'ATOMIC_INSTALL_AND_EXACT_THREE_CERTIFICATE_BINDINGS',
              'REPEATED_APPLICATION_REFUSED_WITHOUT_CATALOG_CHANGE',
              'CANONICAL_CLEANUP_AUTHENTICATED_VISIBILITY_AND_RESIDUAL_ERASURE_FIXTURES',
              'LATER_SOURCE_DRIFT_INVALIDATES_READINESS_AND_BINDING',
              'REQUESTER_FULL_CANONICAL_CLOSURE_ERASES_OWNED_CONTENT_AND_CACHE',
              'WORKER_FULL_CANONICAL_CLOSURE_ERASES_OWNED_CONTENT_AND_CACHE',
              'CLOSED_SESSION_REFUSAL_AND_UNRELATED_AGREEMENT_UNCHANGED',
              'FINAL_CERTIFIED_CATALOG_PUBLICATION_AND_HISTORY_UNCHANGED']);
            assert.ok(r.checks.every(x=>x.result==='PASS'));
            assert.equal(Object.keys(r.sourceArtifactHashes).length,20);
            assert.ok(Object.values(r.sourceArtifactHashes).every(h=>/^[a-f0-9]{64}$/.test(h)));
            console.log('PASS CHAT_B3C_EXACT_APPLICATION_DISPOSABLE_ONLY');
          } catch {console.error('FAIL CHAT_B3C_APPLICATION_RESULT_ADMISSION');process.exit(1);}
          NODE
      - name: Always discard the disposable database
        if: always()
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$B3C_ARTIFACT_DIR"
          teardown_exit=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || teardown_exit=$?
          fi
          printf 'teardown exit=%s\n' "$teardown_exit" | tee -a "$B3C_ARTIFACT_DIR/stages.txt"
          exit "$teardown_exit"
      - name: Upload only bounded source and result summaries including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-b3c-application-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/chat-b3c-artifacts/source-binding.txt
            /tmp/chat-b3c-artifacts/source-manifest-sha256.txt
            /tmp/chat-b3c-artifacts/stages.txt
            /tmp/chat-b3c-artifacts/chat-b3c-report.json
            /tmp/chat-b3c-artifacts/chat-b3c-application-report.json
          if-no-files-found: error
          retention-days: 30
