name: Chat Voice B0 contract proof
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - 'docs/implementation/product-v1-closure-20260926/CHAT_VOICE_CONTRACT.md'
      - 'supabase/functions/_shared/voiceM4a.mjs'
      - 'supabase/proofs/chat/voice_m4a.test.mjs'
      - '.github/workflows/chat-voice-b0-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Voice container admission contract
        run: |
          node --check supabase/functions/_shared/voiceM4a.mjs
          node --test supabase/proofs/chat/voice_m4a.test.mjs
