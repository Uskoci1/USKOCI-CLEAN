name: Chat voice B1 DEV application file proof
# Voice messages B1-d: the ONE-statement DEV application file (exact DEV pins, the proved B1-a and B1-b fragments embedded, the three-place re-bind computed inside, exact delta accounting)
# is applied to a disposable chain that has the DEV closure surface (the exact B3c application file, then B24 part 2 whose 14 bodies must equal the DEV receipt), and the export, support, blocker,
# real-Edge and two full closure proofs run on the result. No DEV, provider or device access. Every outcome destroys the disposable stack.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/chat-voice-b1-dev-application-proof.yml'
      - 'supabase/candidates/chat_voice_b1_dev_application.sql'
      - 'supabase/proofs/chat/voice_b1_dev_application.head.sql'
      - 'supabase/proofs/chat/voice_b1_dev_application.tail.sql'
      - 'supabase/proofs/chat/build_voice_b1_dev_application.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chat-voice-b1-dev-application-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/chat-voice-dev-private
      VOICE_ARTIFACT_DIR: /tmp/chat-voice-dev-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Bind exact source and install locked existing dependencies
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$VOICE_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$VOICE_ARTIFACT_DIR/source-binding.txt"
          git ls-files -z supabase/migrations supabase/operations/dev-alpha/ledger supabase/candidates supabase/proofs supabase/functions/uskoci-account-closure-worker supabase/functions/_shared/data-export.ts docs/implementation/v5-ai-first supabase/functions/_shared/voiceM4a.mjs .github/workflows/chat-b3-history-proof.yml .github/workflows/chat-voice-b1-dev-application-proof.yml package.json package-lock.json | xargs -0 sha256sum | sha256sum > "$VOICE_ARTIFACT_DIR/source-manifest-sha256.txt"
          dependency_exit=0
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/01-dependencies.log" 2>&1 || dependency_exit=$?
          printf '01-dependencies exit=%s\n' "$dependency_exit" | tee "$VOICE_ARTIFACT_DIR/stages.txt"
          test "$dependency_exit" -eq 0
          git diff --exit-code
      - name: Reconstruct the existing disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          # Setup can print local keys. Raw output and predecessor reports stay
          # outside the uploaded directory; only fixed stage summaries are public.
          setup_exit=0
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/02-live79.log" 2>&1 || setup_exit=$?
          printf '02-live79 exit=%s\n' "$setup_exit" | tee -a "$VOICE_ARTIFACT_DIR/stages.txt"
          exit "$setup_exit"
      - name: Guard loopback targets and replay unchanged B3 predecessor stages
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          try {
            assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
            if (process.env.DB_URL !== process.env.RU5_DEVICE_DB_URL) throw new Error();
          } catch { console.error('FAIL CHAT_VOICE_LOCAL_TARGET_ADMISSION'); process.exit(1); }
          NODE
          run_stage() {
            local stage="$1" status=0
            shift
            printf '%s START\n' "$stage" | tee -a "$VOICE_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$VOICE_ARTIFACT_DIR/stages.txt"
            return "$status"
          }
          # Exact stage order from chat-b3-history-proof.yml. PKG-051/P0 excluded.
          run_stage 03-source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage 04-dev-alpha-to-pkg026 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage 05-pkg027 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage 06-pkg028 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage 07-pkg029 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage 08-pkg030 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage 09-pkg031 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage 10-pkg032 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage 11-pkg033 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage 12-pkg034 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage 13-pkg035 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage 14-pkg037 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage 15-pkg038 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage 16-pkg039 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage 17-pkg040 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage 18-pkg042-to-pkg050 node supabase/proofs/pkg050/pkg050_proof.mjs
          run_stage 19-a1-preparation node supabase/proofs/chat/prepare_notification_a1.mjs
          run_stage 20-b3a node supabase/proofs/chat/private_history_read_proof.mjs
          run_stage 21-b3b node supabase/proofs/chat/message_window_proof.mjs
          # The packages applied to DEV before B3c, then the exact B3c application file: the closure surface is then the one DEV has.
          run_stage 22-p0 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/discovery_p0_exact_public_landing.sql
          run_stage 23-p4 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/chat_p4_exact_message_event_resolver.sql
          run_stage 24-p5 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/worker_profile_licenses_owned_projection.sql
          run_stage 25-b3c-application psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/chat_b3c_private_invalidation_dev_application.sql
      - name: B24 part 2 in relaxed pre-image mode, then the chain fidelity check against the DEV receipt
        run: |
          set -euo pipefail
          umask 077
          b24_exit=0
          PGOPTIONS='-c b24.preimage=relaxed' psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/candidates/b24_nonretried_conflicts_part2_certified.sql > "$PRE_V3_ARTIFACT_DIR/26-b24-part2.log" 2>&1 || b24_exit=$?
          printf '26-b24-part2 exit=%s\n' "$b24_exit" | tee -a "$VOICE_ARTIFACT_DIR/stages.txt"
          if [ "$b24_exit" -ne 0 ]; then tail -20 "$PRE_V3_ARTIFACT_DIR/26-b24-part2.log"; fi
          fidelity_exit=0
          node supabase/proofs/chat/voice_b1_b24_fidelity.mjs || fidelity_exit=$?
          printf '26-b24-fidelity exit=%s\n' "$fidelity_exit" | tee -a "$VOICE_ARTIFACT_DIR/stages.txt"
          test "$b24_exit" -eq 0
          exit "$fidelity_exit"
      - name: Apply the ONE-statement DEV application file and prove it (export, support, blockers, real Edge, two full closures)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          umask 077
          proof_exit=0
          python3 supabase/proofs/chat/build_voice_b1_dev_application.py --check
          VOICE_PROOF_MODE=dev-form timeout --signal=TERM --kill-after=10s 1500s node supabase/proofs/chat/voice_b1b_closure_proof.mjs > "$PRE_V3_ARTIFACT_DIR/27-voice-b1-dev.log" 2>&1 || proof_exit=$?
          printf '27-voice-b1-dev exit=%s\n' "$proof_exit" | tee -a "$VOICE_ARTIFACT_DIR/stages.txt"
          cat "$PRE_V3_ARTIFACT_DIR/27-voice-b1-dev.log"
          cp "$PRE_V3_ARTIFACT_DIR/chat-voice-b1-dev-report.json" "$VOICE_ARTIFACT_DIR/chat-voice-b1-dev-report.json" || true
          exit "$proof_exit"
      - name: Admit only the bounded DEV application result
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          try {
            const report=JSON.parse(readFileSync(process.env.VOICE_ARTIFACT_DIR+'/chat-voice-b1-dev-report.json','utf8'));
            assert.equal(report.result,'PASS'); assert.equal(report.sourceSha,process.env.GITHUB_SHA);
            for (const key of ['actualAuth','actualDatabase','disposableCertificateMoved','certifiedErasureProven','finalReadiness','finalCatalogUnchangedSinceRecertification']) assert.equal(report[key],true);
            for (const key of ['liveAccess','providerCalled','deviceProven','devAccess','devCertificateMoved']) assert.equal(report[key],false);
            assert.equal(report.providerCalls,0); assert.ok(report.storageCalls>10); assert.deepEqual(report.failures,[]);
            assert.equal(report.checks.length,17); assert.ok(report.checks.every(check=>check.result==='PASS')); assert.equal(report.edgeEndToEnd.realSqlAndStorage,true);
            assert.equal(report.refusals.length,7); assert.ok(report.refusals.every(item=>item.refused&&item.completeCatalogUnchanged));
            assert.equal(report.laterDriftChecks.length,9); assert.ok(report.laterDriftChecks.every(item=>item.readinessFalse&&item.bindingNull&&item.rollbackUnchanged));
            assert.equal(report.recertification.placesChanged,3); assert.equal(report.recertification.ready,true);
            assert.equal(Object.keys(report.rewrittenBodyMd5).length,13); assert.ok(Object.values(report.rewrittenBodyMd5).every(value=>/^[a-f0-9]{32}$/.test(value)));
            assert.deepEqual(report.closures.map(item=>item.role),['REQUESTER','WORKER']);
            for (const item of report.closures) {
              assert.equal(item.result,'CLOSED'); assert.equal(item.voiceObjectsDeleted,3); assert.equal(item.voiceUploadRowsDeleted,4); assert.equal(item.ownVoiceMessagesErased,2);
              for (const key of ['peerVoiceObjectRowAndMessagePreserved','peerTextPreserved','authIdentitySoftErased','unrelatedAgreementUnchanged']) assert.equal(item[key],true);
              assert.equal(item.sessionsRemaining,0);
            }
            assert.equal(report.catalogRecertifiedSha256,report.catalogFinalSha256);
            console.log('PASS CHAT_VOICE_B1_DEV_APPLICATION_ONLY');
          } catch { console.error('FAIL CHAT_VOICE_B1_DEV_APPLICATION_RESULT_ADMISSION'); process.exit(1); }
          NODE
      - name: Always discard the disposable database
        if: always()
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$VOICE_ARTIFACT_DIR"
          teardown_exit=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || teardown_exit=$?
          fi
          printf 'teardown exit=%s\n' "$teardown_exit" | tee -a "$VOICE_ARTIFACT_DIR/stages.txt"
          exit "$teardown_exit"
      - name: Upload only bounded source and result summaries including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-voice-b1-dev-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/chat-voice-dev-artifacts/source-binding.txt
            /tmp/chat-voice-dev-artifacts/source-manifest-sha256.txt
            /tmp/chat-voice-dev-artifacts/stages.txt
            /tmp/chat-voice-dev-artifacts/chat-voice-b24-fidelity.json
            /tmp/chat-voice-dev-artifacts/chat-voice-b1-dev-report.json
          if-no-files-found: error
          retention-days: 30
