name: Chat voice B1-c media Edge offline proof
# Voice messages B1-c: the exact current uskoci-media source (Agreement voice operations) and the closure worker decoder run offline against a synthetic transport,
# together with the unchanged photo and avatar Edge suites (no regression), and the Edge payload inventory still resolves (exactly 11 functions, the voice
# validator reached through the existing module graph). No DEV, provider or device access. The deploy stays the owner's byte-exact CLI route.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - 'supabase/functions/uskoci-media/index.ts'
      - 'supabase/functions/uskoci-account-closure-worker/closure.ts'
      - 'supabase/functions/_shared/voiceM4a.mjs'
      - 'supabase/proofs/chat/voice_media_edge.test.mjs'
      - 'supabase/proofs/chat/voice_m4a_fixture.mjs'
      - 'supabase/proofs/ai/v5_agreement_photo_edge.test.mjs'
      - 'supabase/proofs/ai/v5_media_edge.test.mjs'
      - 'scripts/prepare-v5-edge-payloads.cjs'
      - '.github/workflows/chat-voice-b1c-edge-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Voice media Edge operations, unchanged photo and avatar suites, the B0 container contract
        run: |
          set -euo pipefail
          node --check supabase/functions/_shared/voiceM4a.mjs
          node --test supabase/proofs/chat/voice_m4a.test.mjs supabase/proofs/chat/voice_media_edge.test.mjs supabase/proofs/ai/v5_agreement_photo_edge.test.mjs supabase/proofs/ai/v5_media_edge.test.mjs
      - name: The Edge payload inventory and the module graph of uskoci-media
        run: |
          set -euo pipefail
          node scripts/prepare-v5-edge-payloads.cjs --source "$(git rev-parse HEAD)"
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync, readdirSync} from 'node:fs';
          const directory = 'artifacts/v5-edge-payloads/' + readdirSync('artifacts/v5-edge-payloads')[0];
          const manifest = JSON.parse(readFileSync(directory + '/manifest.json', 'utf8'));
          assert.equal(manifest.functions.length, 11);
          const media = manifest.functions.find(entry => entry.name === 'uskoci-media');
          assert.deepEqual(media.files.map(file => file.name).sort(), [
            'supabase/functions/_shared/mediaImageSanitizer.mjs', 'supabase/functions/_shared/voiceM4a.mjs', 'supabase/functions/uskoci-media/index.ts']);
          const closure = manifest.functions.find(entry => entry.name === 'uskoci-account-closure-worker');
          assert.ok(closure.files.some(file => file.name === 'supabase/functions/uskoci-account-closure-worker/closure.ts'));
          console.log('PASS CHAT_VOICE_B1C_EDGE_INVENTORY');
          NODE
