name: D03 stable message authenticated proof
on:
  workflow_dispatch:
  push:
    branches:
      - fix/d03-message-retry-20260907
permissions:
  contents: read
env:
  CI: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  N07_ARTIFACT_DIR: artifacts/d03-message-retry/predecessor-n07
  N08_ARTIFACT_DIR: artifacts/d03-message-retry/predecessor-n08
  D03_ARTIFACT_DIR: artifacts/d03-message-retry
jobs:
  authenticated-message-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify applied migration bytes and provenance
        run: sh supabase/migrations/check_md5.sh
      - name: Set up proven Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: TypeScript and full regression suite
        run: |
          npx tsc --noEmit
          npm test -- --runInBand
          node --check supabase/proofs/notifications/n08_preferences_proof.mjs
          node --check supabase/proofs/notifications/d03_message_retry_proof.mjs
          node --test supabase/proofs/ru5_device_ui_local_guard.test.mjs
      - name: Reconstruct disposable historical live-79 baseline
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh
      - name: Prepare real disposable accounts and seeded Need
        run: node supabase/proofs/ru5_device_ui_fixture.mjs
      - name: Reconstruct exact live84 and prove predecessor N07 behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$N07_ARTIFACT_DIR"
          node supabase/proofs/notifications/n07_forward_promotion_proof.mjs 2>&1 | tee "$N07_ARTIFACT_DIR/proof.log"
          grep -F 'PASS N07_FORWARD_NOTIFICATION_ADMISSION' "$N07_ARTIFACT_DIR/proof.log"
      - name: Reproduce failure then apply candidate and prove authenticated preferences
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$N08_ARTIFACT_DIR"
          node supabase/proofs/notifications/n08_preferences_proof.mjs 2>&1 | tee "$N08_ARTIFACT_DIR/proof.log"
          grep -F 'PASS N08_NOTIFICATION_PREFERENCES' "$N08_ARTIFACT_DIR/proof.log"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.env.N08_ARTIFACT_DIR+"/proof-report.json")); if(r.result!=="PASS" || r.source_sha!==process.env.GITHUB_SHA || r.live_access || r.live_promotion || r.push_provider_called || r.migration_history_count!==85 || !r.exact_forward_file_applied_disposable || !r.original84_history_unchanged) process.exit(1);'
      - name: Apply exact D03 source and prove stable authenticated messages
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/notifications/d03_message_retry_proof.mjs 2>&1 | tee "$D03_ARTIFACT_DIR/proof.log"
          grep -F 'PASS D03_MESSAGE_RETRY' "$D03_ARTIFACT_DIR/proof.log"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.env.D03_ARTIFACT_DIR+"/proof-report.json"));if(r.result!=="PASS"||r.source_sha!==process.env.GITHUB_SHA||r.live_access||r.live_promotion||r.provider_called||r.migration_history_count!==86||!r.exact_forward_file_applied_disposable||!r.original85_history_unchanged)process.exit(1);'
      - name: Upload exact source-bound evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: D03-MESSAGE-RETRY-AUTHENTICATED-EVIDENCE
          path: artifacts/d03-message-retry/
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown disposable Supabase
        if: always()
        shell: bash
        run: |
          if [[ -n "${RU5_DEVICE_PROOF_DIR:-}" && -d "$RU5_DEVICE_PROOF_DIR" ]]; then
            cd "$RU5_DEVICE_PROOF_DIR"
            supabase stop --no-backup
          fi
