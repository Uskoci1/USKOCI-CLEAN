name: D12 written review comment proof
# D12 (owner decision 2026-10-01: an OPTIONAL written comment with the star rating in V1; moderation = hide the comment TEXT only, service role, no automatic access, no AI, no paid service; report path = existing channels only).
# The server candidate (supabase/candidates/d12_review_comment.sql, its exact revert, the generator and the pin captures under supabase/proofs/d12/) is proved on a DISPOSABLE chain that has the DEV closure surface before D12:
# source147 -> PKG-050 (stages 03-18), A1/B3a/B3b (19-21), P0/P4/P5/B3c (22-25), B24 part 2 in relaxed pre-image mode with the chain fidelity check (26), the exact Voice B1 DEV application (27) and EX-04a-d (28-31).
# Actual Auth, actual PostgREST (real JWTs), the real shipped review client (exact git bytes) for the old-client phase, the real closure worker source for two full closures. FAIL-BEFORE / PASS-AFTER, an exact revert and a reapply.
# ROUND 1: the candidate and the revert are applied behind the apply-time integrity guard (psql -c: ONE Query message), the committed manifest holds the sha256 of every generated file, and a chain difference in any pinned function is red unless it is explained.
# CHAIN FIDELITY. The chain is NOT DEV: it lacks pkg051a, PKG-045b P0, P6 rollout v3 and B24 Part 1, its OIDs and ledger differ and its certificate is chain-internal (never equal to DEV 58447d77). The pin gate of d12_proof.mjs reads every
# pinned md5 on the chain, FAILS the run on a core difference and builds a chain variant that differs from the committed candidate only at the replaced adjacent md5 literals. Every pass line carries that label.
# No DEV, provider or device access. Every outcome destroys the disposable stack. NOT native acceptance.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/d12-review-comment-proof.yml'
      - 'supabase/proofs/d12/**'
      - 'supabase/candidates/d12_review_comment.sql'
      - 'supabase/candidates/d12_review_comment_revert.sql'
      - 'supabase/candidates/chat_voice_b1_dev_application.sql'
      - 'supabase/candidates/b24_nonretried_conflicts_part2_certified.sql'
      - 'supabase/candidates/ex04a_own_tasks_page.sql'
      - 'supabase/candidates/ex04b_own_applications_page.sql'
      - 'supabase/candidates/ex04c_rating_state.sql'
      - 'supabase/candidates/ex04d_candidates_page.sql'
      - 'supabase/proofs/ex04/**'
      - 'supabase/proofs/chat/**'
      - 'supabase/proofs/pre_v3/closure_runtime.mjs'
      - 'supabase/proofs/pre_v3/client_runtime.mjs'
      - 'supabase/proofs/pre_v3/history_snapshot.mjs'
      - 'supabase/proofs/pre_v3/v5_closure_edge_runtime.mjs'
      - 'supabase/proofs/ru5_device_ui_local_guard.mjs'
      - 'supabase/proofs/ru5_device_ui_live79_env.sh'
      - 'supabase/proofs/pkg023/pkg023_surface.sql'
      - 'supabase/functions/uskoci-account-closure-worker/**'
      - 'supabase/functions/_shared/data-export.ts'
      - 'src/data/reviewsClientService.ts'
      - 'src/data/serverReceipt.ts'
      - 'src/data/agreementRatingsRead.ts'
      - 'src/data/agreementClientService.ts'
      - 'src/data/agreementCompletion.ts'
      - 'src/data/legacyRpcFailure.ts'
      - 'src/data/calendarErrors.ts'
      - 'src/lib/**'
      - 'src/ui/system/plural.ts'
      - 'src/ui/calendar/calendarPresentation.ts'
      # the files that DEFINE the chain this evidence is about: every migration, every pkg candidate the replay stages apply, the replay and stage proof scripts and the proof directories they read, the Edge sources
      - 'supabase/migrations/**'
      - 'supabase/candidates/pkg*.sql'
      - 'supabase/functions/**'
      - 'supabase/operations/dev-alpha/ledger/**'
      - 'supabase/proofs/pkg023j/replay_source147.py'
      - 'supabase/proofs/pkg027/**'
      - 'supabase/proofs/pkg028/**'
      - 'supabase/proofs/pkg029/**'
      - 'supabase/proofs/pkg030/**'
      - 'supabase/proofs/pkg031/**'
      - 'supabase/proofs/pkg032/**'
      - 'supabase/proofs/pkg033/**'
      - 'supabase/proofs/pkg034/**'
      - 'supabase/proofs/pkg035/**'
      - 'supabase/proofs/pkg037/**'
      - 'supabase/proofs/pkg038/**'
      - 'supabase/proofs/pkg039/**'
      - 'supabase/proofs/pkg040/**'
      - 'supabase/proofs/pkg042/**'
      - 'supabase/proofs/pkg050/**'
      - 'supabase/proofs/ai/**'
      - 'supabase/proofs/completion/**'
      - 'supabase/proofs/legal/**'
      - 'supabase/proofs/policy/**'
      - 'supabase/proofs/notifications/**'
      - 'docs/implementation/v5-ai-first/PRESELECTION_QA_EXECUTABLE_POLICY.json'
      - 'docs/implementation/v5-ai-first/pkg042/FUNCTION_PINS_20260922.json'
      - 'scripts/render-qa-policy-bundle.mjs'
      - 'src/contracts/qaSubmission.ts'
      - 'src/lib/qaTextHash.ts'
  workflow_dispatch:
    inputs:
      pin_gate_only:
        description: 'Stop after the pin gate and print EVERY pin difference of the chain (a cheap first cycle)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: d12-review-comment-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/d12-private
      D12_ARTIFACT_DIR: /tmp/d12-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Bind exact source, check the generated files, install locked existing dependencies and run the pure unit tests (validators, pin gate, labels, source ties)
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$D12_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$D12_ARTIFACT_DIR/source-binding.txt"
          # Round-1 findings: the PostgreSQL grammar (pglast) parses every generated statement, function body, DO body and guard in CI (it needs no database); --check compares the BYTES (a CR is a difference) and the committed manifest.
          python3 -m pip install --quiet pglast==8.4
          python3 supabase/proofs/d12/build_d12.py --check --syntax | tee "$D12_ARTIFACT_DIR/generated-files.txt"
          # Transport safety: no carriage return, no non-ASCII byte and no unicode escape text (a connector resolves it) in any generated file, whatever the checkout's line-ending settings are.
          for file in supabase/candidates/d12_review_comment.sql supabase/candidates/d12_review_comment_revert.sql supabase/proofs/d12/d12_preflight.readonly.sql supabase/proofs/d12/d12_postflight.readonly.sql supabase/proofs/d12/d12_manifest.json; do
            if [ "$(tr -cd '\r' < "$file" | wc -c)" -ne 0 ]; then echo "FAIL D12_CRLF_IN $file"; exit 1; fi
            if LC_ALL=C grep -q -P '[^\x00-\x7F]' "$file"; then echo "FAIL D12_NON_ASCII_IN $file"; exit 1; fi
            if LC_ALL=C grep -q -P '\\[uU][0-9A-Fa-f]{4}' "$file"; then echo "FAIL D12_UNICODE_ESCAPE_TEXT_IN $file"; exit 1; fi
          done
          sha256sum supabase/candidates/d12_review_comment.sql supabase/candidates/d12_review_comment_revert.sql supabase/proofs/d12/d12_preflight.readonly.sql supabase/proofs/d12/d12_postflight.readonly.sql supabase/proofs/d12/d12_manifest.json supabase/proofs/d12/d12_pins.json supabase/proofs/d12/d12_preimage.json > "$D12_ARTIFACT_DIR/source-manifest-sha256.txt"
          for file in d12_lib.mjs d12_pins.mjs d12_proof.mjs d12_lib.test.mjs d12_pins.test.mjs; do node --check "supabase/proofs/d12/$file"; done
          dependency_exit=0
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/01-dependencies.log" 2>&1 || dependency_exit=$?
          printf '01-dependencies exit=%s\n' "$dependency_exit" | tee "$D12_ARTIFACT_DIR/stages.txt"
          test "$dependency_exit" -eq 0
          git diff --exit-code
          node --test supabase/proofs/d12/*.test.mjs | tee "$D12_ARTIFACT_DIR/unit-tests.txt"
      - name: Reconstruct the existing disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          # Setup can print local keys. Raw output and predecessor reports stay outside the uploaded directory; only fixed stage summaries are public.
          setup_exit=0
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/02-live79.log" 2>&1 || setup_exit=$?
          printf '02-live79 exit=%s\n' "$setup_exit" | tee -a "$D12_ARTIFACT_DIR/stages.txt"
          exit "$setup_exit"
      - name: Guard loopback targets and replay the unchanged predecessor stages (source147 to the B3c application)
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          try {
            assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
            if (process.env.DB_URL !== process.env.RU5_DEVICE_DB_URL) throw new Error();
          } catch { console.error('FAIL D12_LOCAL_TARGET_ADMISSION'); process.exit(1); }
          NODE
          run_stage() {
            local stage="$1" status=0
            shift
            printf '%s START\n' "$stage" | tee -a "$D12_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$D12_ARTIFACT_DIR/stages.txt"
            return "$status"
          }
          # Exact stage order of chat-voice-b1-dev-application-proof.yml (PKG-051/P0 excluded there too).
          run_stage 03-source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage 04-dev-alpha-to-pkg026 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage 05-pkg027 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage 06-pkg028 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage 07-pkg029 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage 08-pkg030 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage 09-pkg031 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage 10-pkg032 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage 11-pkg033 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage 12-pkg034 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage 13-pkg035 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage 14-pkg037 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage 15-pkg038 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage 16-pkg039 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage 17-pkg040 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage 18-pkg042-to-pkg050 node supabase/proofs/pkg050/pkg050_proof.mjs
          run_stage 19-a1-preparation node supabase/proofs/chat/prepare_notification_a1.mjs
          run_stage 20-b3a node supabase/proofs/chat/private_history_read_proof.mjs
          run_stage 21-b3b node supabase/proofs/chat/message_window_proof.mjs
          # The packages applied to DEV before B3c, then the exact B3c application file.
          run_stage 22-p0 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/discovery_p0_exact_public_landing.sql
          run_stage 23-p4 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/chat_p4_exact_message_event_resolver.sql
          run_stage 24-p5 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/worker_profile_licenses_owned_projection.sql
          run_stage 25-b3c-application psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/chat_b3c_private_invalidation_dev_application.sql
      - name: B24 part 2 in relaxed pre-image mode, then the chain fidelity check against the DEV receipt
        run: |
          set -euo pipefail
          umask 077
          b24_exit=0
          PGOPTIONS='-c b24.preimage=relaxed' psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/candidates/b24_nonretried_conflicts_part2_certified.sql > "$PRE_V3_ARTIFACT_DIR/26-b24-part2.log" 2>&1 || b24_exit=$?
          printf '26-b24-part2 exit=%s\n' "$b24_exit" | tee -a "$D12_ARTIFACT_DIR/stages.txt"
          if [ "$b24_exit" -ne 0 ]; then tail -20 "$PRE_V3_ARTIFACT_DIR/26-b24-part2.log"; fi
          fidelity_exit=0
          node supabase/proofs/chat/voice_b1_b24_fidelity.mjs || fidelity_exit=$?
          printf '26-b24-fidelity exit=%s\n' "$fidelity_exit" | tee -a "$D12_ARTIFACT_DIR/stages.txt"
          test "$b24_exit" -eq 0
          exit "$fidelity_exit"
      - name: The exact Voice B1 DEV application (ledger 215), then EX-04a-d (ledger 216-219), the DEV closure surface before D12
        run: |
          set -euo pipefail
          umask 077
          stage() {
            local name="$1" file="$2" strict="$3" status=0
            printf '%s START\n' "$name" | tee -a "$D12_ARTIFACT_DIR/stages.txt"
            psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f "$file" > "$PRE_V3_ARTIFACT_DIR/$name.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$name" "$status" | tee -a "$D12_ARTIFACT_DIR/stages.txt"
            if [ "$status" -ne 0 ]; then tail -12 "$PRE_V3_ARTIFACT_DIR/$name.log"; fi
            # Voice B1 and EX-04c are REQUIRED (D12 pins the closure surface and the ratingDue readers); EX-04a/b/d are tolerated and reported by the proof (its P0 reads their DEV postflights on the chain).
            if [ "$strict" = "required" ] && [ "$status" -ne 0 ]; then return "$status"; fi
            return 0
          }
          stage 27-voice-b1-application supabase/candidates/chat_voice_b1_dev_application.sql required
          stage 28-ex04a supabase/candidates/ex04a_own_tasks_page.sql tolerated
          stage 29-ex04b supabase/candidates/ex04b_own_applications_page.sql tolerated
          stage 30-ex04c supabase/candidates/ex04c_rating_state.sql required
          stage 31-ex04d supabase/candidates/ex04d_candidates_page.sql tolerated
      - name: The D12 proof (pin gate, before, atomic application, old-client parity, validation, gates, visibility, RLS, moderation, two real closures, export, certificate, revert, reapply, weakening probes)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          umask 077
          proof_exit=0
          if [ "${{ inputs.pin_gate_only }}" = "true" ]; then export D12_PIN_GATE_ONLY=1; fi
          timeout --signal=TERM --kill-after=10s 6000s node supabase/proofs/d12/d12_proof.mjs 2>&1 | tee "$PRE_V3_ARTIFACT_DIR/32-d12-proof.log" || proof_exit=${PIPESTATUS[0]}
          printf '32-d12-proof exit=%s\n' "$proof_exit" | tee -a "$D12_ARTIFACT_DIR/stages.txt"
          { echo '## D12 written review comment: disposable-chain proof (the label comes first: this is evidence about the CHAIN, never about DEV; "D12 PINS == DEV" means ONLY that the pinned function bodies and metadata equal the 2026-10-01 DEV readback; not native acceptance; the known residuals are pinned, not blessed)'; echo; head -c 60000 "$D12_ARTIFACT_DIR/d12-report.md" 2>/dev/null || echo "(no markdown report: proof exit $proof_exit)"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$proof_exit"
      - name: Always discard the disposable database
        if: always()
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$D12_ARTIFACT_DIR"
          teardown_exit=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || teardown_exit=$?
          fi
          printf 'teardown exit=%s\n' "$teardown_exit" | tee -a "$D12_ARTIFACT_DIR/stages.txt"
          exit "$teardown_exit"
      - name: Upload only bounded source and result summaries including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d12-review-comment-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/d12-artifacts/source-binding.txt
            /tmp/d12-artifacts/source-manifest-sha256.txt
            /tmp/d12-artifacts/generated-files.txt
            /tmp/d12-artifacts/unit-tests.txt
            /tmp/d12-artifacts/stages.txt
            /tmp/d12-artifacts/d12-report.json
            /tmp/d12-artifacts/d12-report.md
            /tmp/d12-artifacts/d12_application.chain.sql
            /tmp/d12-artifacts/d12_application.chain.guarded.sql
            /tmp/d12-artifacts/d12_revert.chain.sql
            /tmp/d12-artifacts/d12_revert.chain.guarded.sql
          if-no-files-found: error
          retention-days: 30
