name: Discovery P0 exact public landing disposable proof
# Disposable proof only; no DEV apply or provider calls. The narrowly scoped push
# trigger registers this branch-only workflow before later manual dispatches.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths: ['.github/workflows/discovery-p0-exact-public-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discovery-p0-exact-public-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/discovery-p0-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Bind exact source and install locked existing dependencies
        run: |
          set -euo pipefail
          mkdir -p "$PRE_V3_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$PRE_V3_ARTIFACT_DIR/source-binding.txt"
          git ls-files -z supabase/migrations supabase/operations/dev-alpha/ledger supabase/candidates supabase/proofs docs/implementation/v5-ai-first .github/workflows/discovery-p0-exact-public-proof.yml package.json package-lock.json | xargs -0 sha256sum > "$PRE_V3_ARTIFACT_DIR/source-sha256.txt"
          npm ci --include=dev 2>&1 | tee "$PRE_V3_ARTIFACT_DIR/01-dependencies.log"
          git diff --exit-code
      - name: Reconstruct disposable historical live79
        run: |
          set -euo pipefail
          # The existing CLI setup can print local keys. Keep its raw output
          # outside the artifact tree and emit only allowlisted stage markers.
          setup_exit=0
          bash supabase/proofs/ru5_device_ui_live79_env.sh > /tmp/discovery-p0-live79-private.log 2>&1 || setup_exit=$?
          printf 'live79_exit=%s\n' "$setup_exit" > "$PRE_V3_ARTIFACT_DIR/02-live79.log"
          node --input-type=module - <<'NODE' | tee -a "$PRE_V3_ARTIFACT_DIR/02-live79.log"
          import {readFileSync} from 'node:fs';
          const text = readFileSync('/tmp/discovery-p0-live79-private.log', 'utf8');
          for (const line of text.split('\n')) {
            if (/^apply_source=[a-z0-9_]+\.sql live_alias=[a-z0-9_]+$/.test(line)
                || /^disposable_live_equivalent=[0-9]+\/[a-z0-9_]+$/.test(line)
                || /^PASS [A-Z0-9_ ]+/.test(line)) console.log(line.split(' local_full_stack')[0]);
          }
          for (const marker of ['toomanyrequests', 'connection refused', 'ERROR:', 'FATAL:']) {
            if (text.toLowerCase().includes(marker.toLowerCase())) console.log('SETUP_DIAGNOSTIC ' + marker);
          }
          NODE
          exit "$setup_exit"
      - name: Guard local targets and replay through the proven historical B3 predecessor
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          import assert from 'node:assert/strict';
          assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
          assert.equal(process.env.DB_URL, process.env.RU5_DEVICE_DB_URL);
          NODE
          run_stage() {
            local stage="$1"
            shift
            printf '%s START\n' "$stage" >> "$PRE_V3_ARTIFACT_DIR/stages.txt"
            if "$@" 2>&1 | tee "$PRE_V3_ARTIFACT_DIR/$stage.log"; then
              printf '%s PASS\n' "$stage" >> "$PRE_V3_ARTIFACT_DIR/stages.txt"
            else
              printf '%s FAIL\n' "$stage" >> "$PRE_V3_ARTIFACT_DIR/stages.txt"
              return 1
            fi
          }
          # Same dependency order as pkg050-agreement-messages-read-proof.yml.
          # Replay modes only prepare predecessors; PKG-051 is deliberately absent.
          run_stage 03-source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage 04-dev-alpha-to-pkg026 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage 05-pkg027 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage 06-pkg028 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage 07-pkg029 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage 08-pkg030 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage 09-pkg031 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage 10-pkg032 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage 11-pkg033 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage 12-pkg034 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage 13-pkg035 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage 14-pkg037 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage 15-pkg038 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage 16-pkg039 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage 17-pkg040 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage 18-pkg042-to-pkg050 node supabase/proofs/pkg050/pkg050_proof.mjs
          run_stage 19-a1-preparation node supabase/proofs/chat/prepare_notification_a1.mjs
          run_stage 20-b3a node supabase/proofs/chat/private_history_read_proof.mjs
          run_stage 21-b3b node supabase/proofs/chat/message_window_proof.mjs
      - name: Prove the exact P0 candidate under SQL authenticated and anon roles
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          import assert from 'node:assert/strict';
          assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
          assert.equal(process.env.DB_URL, process.env.RU5_DEVICE_DB_URL);
          NODE
          # psql independently guards HOST/PORT/DBNAME/current_user before any mutation.
          # The successful proof restores the predecessor and rolls back every fixture.
          proof_exit=0
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -v discovery_disposable=true \
            -f supabase/proofs/discovery/discovery_p0_exact_public_landing_proof.sql \
            2>&1 | tee "$PRE_V3_ARTIFACT_DIR/22-discovery-p0.log" || proof_exit=$?
          P0_PROOF_EXIT="$proof_exit" node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const out=process.env.PRE_V3_ARTIFACT_DIR;
          const log=readFileSync(out+'/22-discovery-p0.log','utf8');
          const expected=['EXACT_CANDIDATE_AND_AUTHORITY','ORDINARY_PARITY_AND_CURSOR',
            'EXACT_BEYOND_FIRST_200_AND_REVISION','PUBLIC_FIELDS_AND_POINTLESS_TASKS',
            'NONPUBLIC_AND_MISSING_TASKS','STRICT_INPUT_AND_BOUNDS','OWNER_AND_WORLD_ISOLATION',
            'AUTH_AND_ANON_DENIALS','RESTORE_AND_CERTIFICATES'];
          const report={unit:'DISCOVERY_P0_EXACT_PUBLIC_LANDING',sourceSha:process.env.GITHUB_SHA,
            sourceTree:execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),
            result:'FAIL',actualDatabase:true,sqlAuthenticatedRoles:true,actualAuth:false,postgrestProven:false,
            liveAccess:false,providerCalled:false,providerCalls:0,storageCalls:0,deviceProven:false,queryCostProven:false,
            predecessor:'historical source147 + recorded dev_alpha through PKG050 + A1 + B3a/B3b; PKG051 excluded',
            sourceArtifactHashes:{},checks:expected.map(name=>({name,result:log.split(/\r?\n/).includes('PASS DISCOVERY_P0_'+name)?'PASS':'NOT_PASSED'}))};
          try {
            for(const path of ['supabase/candidates/discovery_p0_exact_public_landing.sql',
              'supabase/proofs/discovery/discovery_p0_exact_public_landing_proof.sql',
              '.github/workflows/discovery-p0-exact-public-proof.yml']) {
              const bytes=readFileSync(path);
              assert.deepEqual(bytes,execFileSync('git',['show',process.env.GITHUB_SHA+':'+path]));
              report.sourceArtifactHashes[path]=createHash('sha256').update(bytes).digest('hex');
            }
            for(const name of ['chat-b3-a1-preparation.json','chat-b3a-report.json','chat-b3b-report.json']) {
              const prepared=JSON.parse(readFileSync(out+'/'+name,'utf8'));
              assert.equal(prepared.result,'PASS'); assert.equal(prepared.sourceSha,process.env.GITHUB_SHA);
              assert.equal(prepared.liveAccess,false); assert.equal(prepared.providerCalled,false);
            }
            assert.equal(process.env.P0_PROOF_EXIT,'0');
            assert.ok(log.split(/\r?\n/).includes('DISCOVERY_P0_EXACT_PUBLIC_LANDING_PROOF_PASS'));
            assert.ok(report.checks.every(check=>check.result==='PASS'));
            report.result='PASS';
          } catch(error) { report.failure=String(error.message).slice(0,1000); process.exitCode=1; }
          finally {
            writeFileSync(out+'/discovery-p0-report.json',JSON.stringify(report,null,2)+'\n');
            console.log(report.result+' DISCOVERY_P0_EXACT_PUBLIC_LANDING');
          }
          NODE
          exit "$proof_exit"
      - name: Stop disposable database
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$PRE_V3_ARTIFACT_DIR"
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup 2>&1 | tee "$PRE_V3_ARTIFACT_DIR/teardown.log"
          fi
      - name: Upload source binding, stage logs and proof evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: discovery-p0-exact-public-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/discovery-p0-artifacts
          if-no-files-found: error
          retention-days: 30
