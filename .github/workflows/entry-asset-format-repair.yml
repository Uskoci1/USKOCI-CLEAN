name: Entry asset format repair

on:
  push:
    branches:
      - clean-alpha-backend
    paths:
      - '.github/workflows/entry-asset-format-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: clean-alpha-backend

      - name: Patch canonical WebP asset contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          generator = Path('scripts/sync-entry-reference-assets.cjs')
          text = generator.read_text()
          old = "const cityPath = path.join(outDir, 'uskoci-entry-city.png');\n"
          new = "const cityPath = path.join(outDir, 'uskoci-entry-city.webp');\n"
          assert text.count(old) == 1, f'generator city path target count={text.count(old)}'
          text = text.replace(old, new)

          marker = "const cityMime = cityMatch[1].toLowerCase();\n"
          guard = "const cityMime = cityMatch[1].toLowerCase();\nif (cityMime !== 'webp') {\n  throw new Error(`[entry-reference] canonical city image must be WebP for native binding, got image/${cityMime}`);\n}\n"
          assert text.count(marker) == 1, 'generator MIME marker missing'
          text = text.replace(marker, guard)
          generator.write_text(text)

          hero = Path('src/ui/referenceEntry/ReferenceEntryHero.tsx')
          text = hero.read_text()
          old = "const CITY_IMAGE = require('../../../assets/generated/uskoci-entry-city.png');"
          new = "const CITY_IMAGE = require('../../../assets/generated/uskoci-entry-city.webp');"
          assert text.count(old) == 1, f'hero city require target count={text.count(old)}'
          hero.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- scripts/sync-entry-reference-assets.cjs src/ui/referenceEntry/ReferenceEntryHero.tsx

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install and generate canonical artifacts
        run: npm ci

      - name: Verify generated WebP bytes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'assets/generated/uskoci-entry-city.webp';
          if (!fs.existsSync(p)) throw new Error(`missing ${p}`);
          const b = fs.readFileSync(p);
          const isWebp = b.subarray(0, 4).toString('ascii') === 'RIFF' && b.subarray(8, 12).toString('ascii') === 'WEBP';
          if (!isWebp) throw new Error('generated city asset is not WebP bytes');
          console.log(`[entry-reference] verified WebP ${b.length} bytes`);
          NODE

      - name: TypeScript contract check
        run: npx tsc --noEmit --pretty false

      - name: Regression tests
        run: npm test -- --runInBand

      - name: Commit persistent source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'USKOCI CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/sync-entry-reference-assets.cjs src/ui/referenceEntry/ReferenceEntryHero.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: align canonical city asset WebP extension'
          git push origin HEAD:clean-alpha-backend
