name: Entry typecheck diagnostic

on:
  push:
    branches:
      - clean-alpha-backend

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > tsc-errors.txt 2>&1
          echo "TSC_EXIT=$?" >> "$GITHUB_ENV"
          set -e

      - name: Auth file clean
        if: always()
        shell: bash
        run: '! grep -q "src/app/auth.tsx" tsc-errors.txt'

      - name: Entry hero clean
        if: always()
        shell: bash
        run: '! grep -q "src/ui/referenceEntry/ReferenceEntryHero.tsx" tsc-errors.txt'

      - name: Generated entry data clean
        if: always()
        shell: bash
        run: '! grep -q "src/ui/referenceEntry/entryReferenceData.ts" tsc-errors.txt'

      - name: Auth lines 1-260 clean
        if: always()
        shell: bash
        run: '! grep -E -q "src/app/auth.tsx\\(([1-9]|[1-9][0-9]|1[0-9][0-9]|2[0-5][0-9]|260)," tsc-errors.txt'

      - name: Auth lines 261-600 clean
        if: always()
        shell: bash
        run: '! grep -E -q "src/app/auth.tsx\\((26[1-9]|2[7-9][0-9]|[3-5][0-9][0-9]|600)," tsc-errors.txt'

      - name: Auth lines 601-plus clean
        if: always()
        shell: bash
        run: '! grep -E -q "src/app/auth.tsx\\(([6-9][0-9][0-9]|[1-9][0-9]{3,})," tsc-errors.txt'

      - name: Entry lines 1-220 clean
        if: always()
        shell: bash
        run: '! grep -E -q "ReferenceEntryHero.tsx\\(([1-9]|[1-9][0-9]|1[0-9][0-9]|20[0-9]|21[0-9]|220)," tsc-errors.txt'

      - name: Entry lines 221-440 clean
        if: always()
        shell: bash
        run: '! grep -E -q "ReferenceEntryHero.tsx\\((22[1-9]|2[3-9][0-9]|3[0-9][0-9]|4[0-3][0-9]|440)," tsc-errors.txt'

      - name: Entry lines 441-plus clean
        if: always()
        shell: bash
        run: '! grep -E -q "ReferenceEntryHero.tsx\\(([4][4-9][1-9]|[5-9][0-9][0-9]|[1-9][0-9]{3,})," tsc-errors.txt'

      - name: TS2304 clean
        if: always()
        run: '! grep -q "TS2304" tsc-errors.txt'

      - name: TS2322 clean
        if: always()
        run: '! grep -q "TS2322" tsc-errors.txt'

      - name: TS2339 clean
        if: always()
        run: '! grep -q "TS2339" tsc-errors.txt'

      - name: TS2345 clean
        if: always()
        run: '! grep -q "TS2345" tsc-errors.txt'

      - name: TS2352 clean
        if: always()
        run: '! grep -q "TS2352" tsc-errors.txt'

      - name: TS2769 clean
        if: always()
        run: '! grep -q "TS2769" tsc-errors.txt'

      - name: TypeScript overall
        if: always()
        shell: bash
        run: test "$TSC_EXIT" = "0"
