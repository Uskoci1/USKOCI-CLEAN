name: Entry typecheck diagnostic

on:
  push:
    branches:
      - clean-alpha-backend

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > tsc-errors.txt 2>&1
          echo "TSC_EXIT=$?" >> "$GITHUB_ENV"
          set -e

      - name: Auth 381-385 clean
        if: always()
        run: '! grep -E -q "auth.tsx\\((381|382|383|384|385)," tsc-errors.txt'
      - name: Auth 386-390 clean
        if: always()
        run: '! grep -E -q "auth.tsx\\((386|387|388|389|390)," tsc-errors.txt'
      - name: Auth 391-395 clean
        if: always()
        run: '! grep -E -q "auth.tsx\\((391|392|393|394|395)," tsc-errors.txt'
      - name: Auth 396-400 clean
        if: always()
        run: '! grep -E -q "auth.tsx\\((396|397|398|399|400)," tsc-errors.txt'

      - name: Auth 681-685 clean
        if: always()
        run: '! grep -E -q "auth.tsx\\((681|682|683|684|685)," tsc-errors.txt'
      - name: Auth 686-690 clean
        if: always()
        run: '! grep -E -q "auth.tsx\\((686|687|688|689|690)," tsc-errors.txt'
      - name: Auth 691-695 clean
        if: always()
        run: '! grep -E -q "auth.tsx\\((691|692|693|694|695)," tsc-errors.txt'
      - name: Auth 696-700 clean
        if: always()
        run: '! grep -E -q "auth.tsx\\((696|697|698|699|700)," tsc-errors.txt'

      - name: Entry 301-305 clean
        if: always()
        run: '! grep -E -q "ReferenceEntryHero.tsx\\((301|302|303|304|305)," tsc-errors.txt'
      - name: Entry 306-310 clean
        if: always()
        run: '! grep -E -q "ReferenceEntryHero.tsx\\((306|307|308|309|310)," tsc-errors.txt'
      - name: Entry 311-315 clean
        if: always()
        run: '! grep -E -q "ReferenceEntryHero.tsx\\((311|312|313|314|315)," tsc-errors.txt'
      - name: Entry 316-320 clean
        if: always()
        run: '! grep -E -q "ReferenceEntryHero.tsx\\((316|317|318|319|320)," tsc-errors.txt'

      - name: Entry 421-425 clean
        if: always()
        run: '! grep -E -q "ReferenceEntryHero.tsx\\((421|422|423|424|425)," tsc-errors.txt'
      - name: Entry 426-430 clean
        if: always()
        run: '! grep -E -q "ReferenceEntryHero.tsx\\((426|427|428|429|430)," tsc-errors.txt'
      - name: Entry 431-435 clean
        if: always()
        run: '! grep -E -q "ReferenceEntryHero.tsx\\((431|432|433|434|435)," tsc-errors.txt'
      - name: Entry 436-440 clean
        if: always()
        run: '! grep -E -q "ReferenceEntryHero.tsx\\((436|437|438|439|440)," tsc-errors.txt'

      - name: No TS2503
        if: always()
        run: '! grep -q "TS2503" tsc-errors.txt'
      - name: No TS2551
        if: always()
        run: '! grep -q "TS2551" tsc-errors.txt'
      - name: No TS2554
        if: always()
        run: '! grep -q "TS2554" tsc-errors.txt'
      - name: No TS2589
        if: always()
        run: '! grep -q "TS2589" tsc-errors.txt'
      - name: No TS2590
        if: always()
        run: '! grep -q "TS2590" tsc-errors.txt'
      - name: No other TS25xx
        if: always()
        shell: bash
        run: test -z "$(grep -o 'TS25[0-9][0-9]' tsc-errors.txt | sort -u | grep -Ev '^(TS2503|TS2551|TS2554|TS2589|TS2590)$')"
      - name: TypeScript overall
        if: always()
        run: test "$TSC_EXIT" = "0"
