name: Entry typecheck diagnostic

on:
  push:
    branches:
      - clean-alpha-backend

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript diagnostics
        run: npx tsc --noEmit --pretty false
