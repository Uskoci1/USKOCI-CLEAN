name: Entry typecheck diagnostic

on:
  push:
    branches:
      - clean-alpha-backend

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > tsc-errors.txt 2>&1
          echo "TSC_EXIT=$?" >> "$GITHUB_ENV"
          set -e

      - name: Auth 261-360 clean
        if: always()
        run: '! grep -E -q "src/app/auth.tsx\\((26[1-9]|2[7-9][0-9]|3[0-5][0-9]|360)," tsc-errors.txt'

      - name: Auth 361-460 clean
        if: always()
        run: '! grep -E -q "src/app/auth.tsx\\((36[1-9]|3[7-9][0-9]|4[0-5][0-9]|460)," tsc-errors.txt'

      - name: Auth 461-560 clean
        if: always()
        run: '! grep -E -q "src/app/auth.tsx\\((46[1-9]|4[7-9][0-9]|5[0-5][0-9]|560)," tsc-errors.txt'

      - name: Auth 561-660 clean
        if: always()
        run: '! grep -E -q "src/app/auth.tsx\\((56[1-9]|5[7-9][0-9]|6[0-5][0-9]|660)," tsc-errors.txt'

      - name: Auth 661-760 clean
        if: always()
        run: '! grep -E -q "src/app/auth.tsx\\((66[1-9]|6[7-9][0-9]|7[0-5][0-9]|760)," tsc-errors.txt'

      - name: Auth 761-plus clean
        if: always()
        run: '! grep -E -q "src/app/auth.tsx\\((76[1-9]|7[7-9][0-9]|[89][0-9][0-9]|[1-9][0-9]{3,})," tsc-errors.txt'

      - name: Entry 221-300 clean
        if: always()
        run: '! grep -E -q "ReferenceEntryHero.tsx\\((22[1-9]|2[3-9][0-9]|300)," tsc-errors.txt'

      - name: Entry 301-360 clean
        if: always()
        run: '! grep -E -q "ReferenceEntryHero.tsx\\((30[1-9]|3[1-5][0-9]|360)," tsc-errors.txt'

      - name: Entry 361-440 clean
        if: always()
        run: '! grep -E -q "ReferenceEntryHero.tsx\\((36[1-9]|3[7-9][0-9]|4[0-3][0-9]|440)," tsc-errors.txt'

      - name: TS2322 only expected
        if: always()
        shell: bash
        run: |
          test -z "$(grep -o 'TS[0-9][0-9]*' tsc-errors.txt | sort -u | grep -v '^TS2322$')"

      - name: TypeScript overall
        if: always()
        run: test "$TSC_EXIT" = "0"
