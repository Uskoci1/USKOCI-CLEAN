name: EX-04 S3 rating state proof
# EX-04 S3 (RC-03: the rating state of a finished Dogovor): rpc_list_my_agreements_page items gain `ratingDue` and rpc_home_attention gains `ratings` {due, dueAgreementId}, both the answer of
# rpc_get_my_agreement_review(...).eligible computed in one pass, so the client stops asking once per finished Dogovor. The ONE-statement candidate (two readers replaced in place), its exact revert
# and the read-only postflight are proved on a disposable DEV-equivalent chain (the unchanged source147 -> PKG-050 stages) with actual Auth and PostgREST and the real client TypeScript: the fact equals
# the authority for every party and every awkward state, every other key is unchanged, the requests are the pages for none, one and a long history, a stalled review read withholds nothing, the exact
# catalog delta, and the revert. No DEV, provider or device access. Every outcome destroys the disposable stack.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/ex04c-rating-state-proof.yml'
      - 'supabase/candidates/ex04c_rating_state.sql'
      - 'supabase/candidates/ex04c_rating_state_revert.sql'
      - 'supabase/proofs/ex04/**'
      - 'src/data/agreementClientService.ts'
      - 'src/data/agreementRatingsRead.ts'
      - 'src/data/homeSnapshot.ts'
      - 'src/data/homeAttentionClientService.ts'
      - 'src/data/serverReceipt.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ex04c-rating-state-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/ex04c-private
      EX04_ARTIFACT_DIR: /tmp/ex04c-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Bind exact source, check the generated files and install locked existing dependencies
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX04_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$EX04_ARTIFACT_DIR/source-binding.txt"
          python3 supabase/proofs/ex04/build_ex04c.py --check | tee "$EX04_ARTIFACT_DIR/generated-files.txt"
          sha256sum supabase/candidates/ex04c_rating_state.sql supabase/candidates/ex04c_rating_state_revert.sql supabase/proofs/ex04/ex04c_postflight.readonly.sql | tee "$EX04_ARTIFACT_DIR/source-manifest-sha256.txt"
          dependency_exit=0
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/01-dependencies.log" 2>&1 || dependency_exit=$?
          printf '01-dependencies exit=%s\n' "$dependency_exit" | tee "$EX04_ARTIFACT_DIR/stages.txt"
          test "$dependency_exit" -eq 0
          git diff --exit-code
      - name: Reconstruct the existing disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          setup_exit=0
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/02-live79.log" 2>&1 || setup_exit=$?
          printf '02-live79 exit=%s\n' "$setup_exit" | tee -a "$EX04_ARTIFACT_DIR/stages.txt"
          exit "$setup_exit"
      - name: Guard loopback targets and replay the unchanged predecessor stages (source147 to PKG-050)
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          try {
            assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
            if (process.env.DB_URL !== process.env.RU5_DEVICE_DB_URL) throw new Error();
          } catch { console.error('FAIL EX04C_LOCAL_TARGET_ADMISSION'); process.exit(1); }
          NODE
          run_stage() {
            local stage="$1" status=0
            shift
            printf '%s START\n' "$stage" | tee -a "$EX04_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$EX04_ARTIFACT_DIR/stages.txt"
            return "$status"
          }
          # Exact stage order of chat-voice-b1-dev-application-proof.yml up to PKG-050 (PKG-045a, which created rpc_read_task and rpc_list_my_tasks, is replayed inside stage 18).
          run_stage 03-source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage 04-dev-alpha-to-pkg026 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage 05-pkg027 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage 06-pkg028 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage 07-pkg029 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage 08-pkg030 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage 09-pkg031 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage 10-pkg032 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage 11-pkg033 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage 12-pkg034 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage 13-pkg035 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage 14-pkg037 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage 15-pkg038 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage 16-pkg039 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage 17-pkg040 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage 18-pkg042-to-pkg050 node supabase/proofs/pkg050/pkg050_proof.mjs
      - name: Before, atomic application, after, exact revert, reapply (one fixture, actual Auth and PostgREST, the real client TypeScript)
        run: |
          set -euo pipefail
          umask 077
          proof_exit=0
          node supabase/proofs/ex04/ex04c_proof.mjs 2>&1 | tee "$PRE_V3_ARTIFACT_DIR/19-ex04c-proof.log" || proof_exit=${PIPESTATUS[0]}
          printf '19-ex04c-proof exit=%s\n' "$proof_exit" | tee -a "$EX04_ARTIFACT_DIR/stages.txt"
          cp "$PRE_V3_ARTIFACT_DIR/ex04c-report.json" "$EX04_ARTIFACT_DIR/ex04c-report.json" || true
          exit "$proof_exit"
      - name: Always discard the disposable database
        if: always()
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX04_ARTIFACT_DIR"
          teardown_exit=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || teardown_exit=$?
          fi
          printf 'teardown exit=%s\n' "$teardown_exit" | tee -a "$EX04_ARTIFACT_DIR/stages.txt"
          exit "$teardown_exit"
      - name: Upload only bounded source and result summaries including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ex04c-rating-state-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/ex04c-artifacts/source-binding.txt
            /tmp/ex04c-artifacts/source-manifest-sha256.txt
            /tmp/ex04c-artifacts/generated-files.txt
            /tmp/ex04c-artifacts/stages.txt
            /tmp/ex04c-artifacts/ex04c-report.json
          if-no-files-found: error
          retention-days: 30
