name: EX05-S01 chat server proofs re-proof
# EX-05 slice S01 (docs/implementation/product-v1-closure-20260926/finalization-20260927/EX05_CANONICAL_SCOPE_20261001.md, gap G10): do the SQL proofs of text, photo, group and voice chat still hold on a disposable chain that already
# contains B24 (PT409 instead of SQLSTATE 40001) and Voice B1? The frozen originals cannot run on such a chain (each applies its own candidate at a recorded predecessor position), so this workflow
#   - offline: runs the unit tests of every tool of this slice and the five existing offline suites (the OFFLINE_RERUN row of the evidence table);
#   - chain: builds the DEV-like chain (stages 02-31 as the D12 workflow records them, plus the P4 push transport candidate and B24 Part 1 as a CHAIN VARIANT), runs the existing P4 resolver and transport proofs at their
#     own position (stages 21b/21c), the pin gate (60 chat-surface functions against the 2026-10-02 DEV capture) and the six UPDATED COPIES (supabase/proofs/ex05_s01/ex05_s01_*_proof.mjs) on the final chain;
#   - d03-position: the frozen n07, n08 and d03 proofs at their own position (live79 to history 86), unchanged, to keep their pre-B24 evidence honest;
#   - evidence: renders the table "proof -> predecessor state it assumes -> result on the current chain" (supabase/proofs/ex05_s01/proof_matrix.json) with the results and the run id of THIS run.
# NOT in this workflow (stated, not hidden): the pkg010 positions of the photo and group proofs (the existing PKG-010 driver cannot plan on the head: python3 supabase/proofs/pkg010/chain.py --plan stops with PKG010_UNKNOWN_MIGRATION
# push_readiness_proof.mjs 20260926175504_clean_notification_push_event_type.sql), Realtime WebSockets, real closures after the Voice B1 and D12 re-binds, the hosted Deno runtime, a real recorder file, devices, iOS, providers.
# The chain is NOT DEV: it lacks pkg051a, PKG-045b P0, P6 rollout v3, EX-06a, D12 and B24 Part 1 for every target it does not carry; its OIDs, ledger and certificate differ (the certificate is chain-internal).
# Nothing here touches DEV, PROD, a provider or a device. Every outcome destroys the disposable stack. NOT native acceptance. FIRST CYCLE: pin_gate_mode defaults to `report` (prints every pin difference, never stops); dispatch with `enforce` to make a core pin difference red.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/ex05-s01-chat-reproof.yml'
      - 'supabase/proofs/ex05_s01/**'
  workflow_dispatch:
    inputs:
      pin_gate_mode:
        description: 'report (print every pin difference, never stop; the cheap first cycle) or enforce (a core pin difference or any B24 conversion difference fails the run)'
        type: choice
        options: [report, enforce]
        default: report
      run_chain:
        description: 'Run the chain job (the post-state proofs)'
        type: boolean
        default: true
      run_d03_position:
        description: 'Run the frozen n07/n08/d03 proofs at their own position'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ex05-s01-chat-reproof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      EX05_S01_ARTIFACT_DIR: /tmp/ex05-s01-offline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Bind exact source, install locked dependencies and the SQL grammar checker
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$EX05_S01_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$EX05_S01_ARTIFACT_DIR/source-binding.txt"
          npm ci --include=dev > "$EX05_S01_ARTIFACT_DIR/dependencies.log" 2>&1
          git diff --exit-code
          python3 -m pip install --quiet pglast==8.4
      - name: Syntax of every tool and proof of this slice, then their unit tests (pure logic, SQL grammar, static source checks, the evidence table is current)
        run: |
          set -euo pipefail
          umask 077
          for file in supabase/proofs/ex05_s01/*.mjs supabase/proofs/ex05_s01/lib/*.mjs; do node --check "$file"; done
          node supabase/proofs/ex05_s01/render_evidence.mjs --check
          node --test supabase/proofs/ex05_s01/lib/*.test.mjs 2>&1 | tee "$EX05_S01_ARTIFACT_DIR/own-unit-tests.txt"
      - name: The five existing offline suites on the exact head (voice M4A, voice media Edge, push transport Edge, push copy, photo migration text)
        run: |
          set -euo pipefail
          umask 077
          exit_code=0
          node --test --test-reporter=tap supabase/proofs/chat/voice_m4a.test.mjs supabase/proofs/chat/voice_media_edge.test.mjs supabase/proofs/notifications/n09_push_transport_edge.test.mjs supabase/proofs/notifications/n10_push_copy.test.mjs supabase/proofs/pre_v3/v5_agreement_photos.test.mjs > "$EX05_S01_ARTIFACT_DIR/offline-existing.tap" 2>&1 || exit_code=$?
          tail -12 "$EX05_S01_ARTIFACT_DIR/offline-existing.tap"
          node supabase/proofs/ex05_s01/offline_report.mjs --tap "$EX05_S01_ARTIFACT_DIR/offline-existing.tap" --exit "$exit_code" --out "$EX05_S01_ARTIFACT_DIR/ex05-s01-offline-existing-report.json"
      - name: Upload bounded source and result summaries including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ex05-s01-offline-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/ex05-s01-offline/source-binding.txt
            /tmp/ex05-s01-offline/own-unit-tests.txt
            /tmp/ex05-s01-offline/offline-existing.tap
            /tmp/ex05-s01-offline/ex05-s01-offline-existing-report.json
          if-no-files-found: error
          retention-days: 30

  chain:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_chain }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # The existing P4 proofs assert these three exact paths; the whole chain uses them so the predecessor reports (chat-b3a, chat-b3b, A1 preparation) are where those proofs read them.
      PRE_V3_ARTIFACT_DIR: /tmp/chat-p4-private
      P4_ARTIFACT_DIR: /tmp/chat-p4-artifacts
      P4_PUSH_ARTIFACT_DIR: /tmp/chat-p4-push-artifacts
      EX05_S01_ARTIFACT_DIR: /tmp/ex05-s01-artifacts
      EX05_S01_PIN_GATE: ${{ inputs.pin_gate_mode || 'report' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Bind exact source and install locked existing dependencies
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$P4_ARTIFACT_DIR" "$P4_PUSH_ARTIFACT_DIR" "$EX05_S01_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$EX05_S01_ARTIFACT_DIR/source-binding.txt"
          : > "$EX05_S01_ARTIFACT_DIR/failed-stages.txt"
          dependency_exit=0
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/01-dependencies.log" 2>&1 || dependency_exit=$?
          printf '01-dependencies exit=%s\n' "$dependency_exit" | tee "$EX05_S01_ARTIFACT_DIR/stages.txt"
          test "$dependency_exit" -eq 0
          git diff --exit-code
      - name: Reconstruct the existing disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          # Setup can print local keys. Raw output and predecessor reports stay outside the uploaded directory; only fixed stage summaries are public.
          setup_exit=0
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/02-live79.log" 2>&1 || setup_exit=$?
          printf '02-live79 exit=%s\n' "$setup_exit" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
          exit "$setup_exit"
      - name: Guard loopback targets and replay the unchanged predecessor stages (source147 to B3b, the stage order of the D12 workflow)
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          try {
            assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
            if (process.env.DB_URL !== process.env.RU5_DEVICE_DB_URL) throw new Error();
          } catch { console.error('FAIL EX05_S01_LOCAL_TARGET_ADMISSION'); process.exit(1); }
          NODE
          run_stage() {
            local stage="$1" status=0
            shift
            printf '%s START\n' "$stage" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
            if [ "$status" -ne 0 ]; then tail -15 "$PRE_V3_ARTIFACT_DIR/$stage.log"; fi
            return "$status"
          }
          run_stage 03-source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage 04-dev-alpha-to-pkg026 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage 05-pkg027 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage 06-pkg028 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage 07-pkg029 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage 08-pkg030 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage 09-pkg031 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage 10-pkg032 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage 11-pkg033 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage 12-pkg034 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage 13-pkg035 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage 14-pkg037 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage 15-pkg038 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage 16-pkg039 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage 17-pkg040 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          # The existing proofs that ARE chain stages: PKG-050 (18), then the A1 preparation (19), B3a (20) and B3b (21) at their own positions.
          run_stage 18-pkg042-to-pkg050 node supabase/proofs/pkg050/pkg050_proof.mjs
          run_stage 19-a1-preparation node supabase/proofs/chat/prepare_notification_a1.mjs
          run_stage 20-b3a node supabase/proofs/chat/private_history_read_proof.mjs
          run_stage 21-b3b node supabase/proofs/chat/message_window_proof.mjs
          for report in pkg050-report.json chat-b3-a1-preparation.json chat-b3a-report.json chat-b3b-report.json; do cp "$PRE_V3_ARTIFACT_DIR/$report" "$EX05_S01_ARTIFACT_DIR/$report" || echo "no $report"; done
      - name: The existing P4 resolver and transport proofs at their own position (each self-restoring; a failure is recorded and does not stop the chain)
        run: |
          set -euo pipefail
          umask 077
          position_stage() {
            local stage="$1" script="$2" status=0
            printf '%s START\n' "$stage" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
            timeout --signal=TERM --kill-after=10s 600s node "$script" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
            if [ "$status" -ne 0 ]; then echo "$stage exit=$status" >> "$EX05_S01_ARTIFACT_DIR/failed-stages.txt"; tail -25 "$PRE_V3_ARTIFACT_DIR/$stage.log"; fi
          }
          position_stage 21b-p4-resolver-at-position supabase/proofs/chat/exact_message_event_resolver_proof.mjs
          position_stage 21c-p4-transport-at-position supabase/proofs/chat/push_event_transport_proof.mjs
          cp "$P4_ARTIFACT_DIR/chat-p4-exact-message-report.json" "$EX05_S01_ARTIFACT_DIR/" || echo 'no resolver report'
          cp "$P4_PUSH_ARTIFACT_DIR/chat-p4-push-transport-report.json" "$EX05_S01_ARTIFACT_DIR/" || echo 'no transport report'
      - name: The packages applied to DEV before B3c, the exact B3c application file, then the P4 push transport candidate (ledger 210)
        run: |
          set -euo pipefail
          umask 077
          run_stage() {
            local stage="$1" status=0
            shift
            printf '%s START\n' "$stage" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
            if [ "$status" -ne 0 ]; then tail -15 "$PRE_V3_ARTIFACT_DIR/$stage.log"; fi
            return "$status"
          }
          run_stage 22-p0 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/discovery_p0_exact_public_landing.sql
          run_stage 23-p4 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/chat_p4_exact_message_event_resolver.sql
          run_stage 24-p5 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/worker_profile_licenses_owned_projection.sql
          run_stage 25-b3c-application psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/chat_b3c_private_invalidation_dev_application.sql
          run_stage 25b-p4-push-transport psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/chat_p4_push_event_transport.sql
      - name: B24 part 1 as a chain variant (the targets that exist, relaxed pre-image mode), then B24 part 2 in relaxed mode and the chain fidelity check against the DEV receipt
        run: |
          set -euo pipefail
          umask 077
          derive_exit=0
          node supabase/proofs/ex05_s01/derive_b24_part1_chain.mjs --db "$DB_URL" --out "$EX05_S01_ARTIFACT_DIR/b24_part1.chain.sql" --report "$EX05_S01_ARTIFACT_DIR/b24-part1-chain-variant-report.json" || derive_exit=$?
          printf '26a-b24-part1-derive exit=%s\n' "$derive_exit" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
          test "$derive_exit" -eq 0
          part1_exit=0
          PGOPTIONS='-c b24.preimage=relaxed' psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f "$EX05_S01_ARTIFACT_DIR/b24_part1.chain.sql" > "$PRE_V3_ARTIFACT_DIR/26a-b24-part1.log" 2>&1 || part1_exit=$?
          printf '26a-b24-part1 exit=%s\n' "$part1_exit" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
          if [ "$part1_exit" -ne 0 ]; then tail -20 "$PRE_V3_ARTIFACT_DIR/26a-b24-part1.log"; fi
          test "$part1_exit" -eq 0
          b24_exit=0
          PGOPTIONS='-c b24.preimage=relaxed' psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/candidates/b24_nonretried_conflicts_part2_certified.sql > "$PRE_V3_ARTIFACT_DIR/26b-b24-part2.log" 2>&1 || b24_exit=$?
          printf '26b-b24-part2 exit=%s\n' "$b24_exit" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
          if [ "$b24_exit" -ne 0 ]; then tail -20 "$PRE_V3_ARTIFACT_DIR/26b-b24-part2.log"; fi
          fidelity_exit=0
          node supabase/proofs/chat/voice_b1_b24_fidelity.mjs || fidelity_exit=$?
          printf '26b-b24-fidelity exit=%s\n' "$fidelity_exit" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
          test "$b24_exit" -eq 0
          exit "$fidelity_exit"
      - name: The exact Voice B1 DEV application (ledger 215, REQUIRED), then EX-04a-d (ledger 216-219, tolerated as in the D12 workflow)
        run: |
          set -euo pipefail
          umask 077
          stage() {
            local name="$1" file="$2" strict="$3" status=0
            printf '%s START\n' "$name" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
            psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f "$file" > "$PRE_V3_ARTIFACT_DIR/$name.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$name" "$status" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
            if [ "$status" -ne 0 ]; then tail -12 "$PRE_V3_ARTIFACT_DIR/$name.log"; fi
            if [ "$strict" = "required" ] && [ "$status" -ne 0 ]; then return "$status"; fi
            return 0
          }
          stage 27-voice-b1-application supabase/candidates/chat_voice_b1_dev_application.sql required
          stage 28-ex04a supabase/candidates/ex04a_own_tasks_page.sql tolerated
          stage 29-ex04b supabase/candidates/ex04b_own_applications_page.sql tolerated
          stage 30-ex04c supabase/candidates/ex04c_rating_state.sql tolerated
          stage 31-ex04d supabase/candidates/ex04d_candidates_page.sql tolerated
      - name: The pin gate (60 chat-surface functions of this chain against the 2026-10-02 DEV capture; every difference is printed before the verdict)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          umask 077
          gate_exit=0
          node supabase/proofs/ex05_s01/pin_gate.mjs --out-dir "$EX05_S01_ARTIFACT_DIR" --db "$DB_URL" 2>&1 | tee "$PRE_V3_ARTIFACT_DIR/32-pin-gate.log" || gate_exit=${PIPESTATUS[0]}
          printf '32-pin-gate mode=%s exit=%s\n' "$EX05_S01_PIN_GATE" "$gate_exit" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
          { echo '## EX05-S01 pin gate (evidence about the CHAIN, never about DEV)'; echo; head -c 60000 "$EX05_S01_ARTIFACT_DIR/ex05-s01-pin-gate.md" 2>/dev/null || echo '(no pin gate markdown)'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$gate_exit" -ne 0 ]; then echo "32-pin-gate exit=$gate_exit" >> "$EX05_S01_ARTIFACT_DIR/failed-stages.txt"; fi
      - name: Pause the disposable minute schedulers, then the six updated post-state proofs (every proof runs even after an earlier one failed)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "begin;set local lock_timeout='5s';select cron.alter_job(job_id:=j.jobid::bigint,active:=false) from cron.job j where j.active;commit;" | psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 || echo 'scheduler pause failed (recorded, the proofs still run)'
          run_proof() {
            local stage="$1" script="$2" status=0
            printf '%s START\n' "$stage" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
            timeout --signal=TERM --kill-after=10s 2400s node "supabase/proofs/ex05_s01/$script" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
            if [ "$status" -ne 0 ]; then echo "$stage exit=$status" >> "$EX05_S01_ARTIFACT_DIR/failed-stages.txt"; fi
            tail -60 "$PRE_V3_ARTIFACT_DIR/$stage.log"
          }
          run_proof 40-text ex05_s01_text_proof.mjs
          run_proof 41-readers ex05_s01_readers_proof.mjs
          run_proof 42-photo ex05_s01_photo_proof.mjs
          run_proof 43-group ex05_s01_group_proof.mjs
          run_proof 44-voice ex05_s01_voice_proof.mjs
          run_proof 45-push ex05_s01_push_proof.mjs
          ls -1 "$EX05_S01_ARTIFACT_DIR"
      - name: Verdict (a recorded stage failure, a missing proof report or a FAIL report makes the job red)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          verdict=0
          if [ -s "$EX05_S01_ARTIFACT_DIR/failed-stages.txt" ]; then echo 'FAILED STAGES:'; cat "$EX05_S01_ARTIFACT_DIR/failed-stages.txt"; verdict=1; fi
          for report in text readers photo group voice push; do
            file="$EX05_S01_ARTIFACT_DIR/ex05-s01-$report-report.json"
            if [ ! -f "$file" ]; then echo "MISSING $file"; verdict=1; continue; fi
            result=$(node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));console.log(r.result+' passed='+r.passed+' recorded='+r.recorded+' failed='+r.failed+' skipped='+r.skipped)" "$file")
            echo "$report: $result"
            case "$result" in PASS*) ;; *) verdict=1 ;; esac
          done
          exit "$verdict"
      - name: Always discard the disposable database
        if: always()
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX05_S01_ARTIFACT_DIR"
          teardown_exit=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || teardown_exit=$?
          fi
          printf 'teardown exit=%s\n' "$teardown_exit" | tee -a "$EX05_S01_ARTIFACT_DIR/stages.txt"
          exit "$teardown_exit"
      - name: Upload bounded source and result summaries including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ex05-s01-chain-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/ex05-s01-artifacts/source-binding.txt
            /tmp/ex05-s01-artifacts/stages.txt
            /tmp/ex05-s01-artifacts/failed-stages.txt
            /tmp/ex05-s01-artifacts/pkg050-report.json
            /tmp/ex05-s01-artifacts/chat-b3-a1-preparation.json
            /tmp/ex05-s01-artifacts/chat-b3a-report.json
            /tmp/ex05-s01-artifacts/chat-b3b-report.json
            /tmp/ex05-s01-artifacts/chat-p4-exact-message-report.json
            /tmp/ex05-s01-artifacts/chat-p4-push-transport-report.json
            /tmp/ex05-s01-artifacts/b24_part1.chain.sql
            /tmp/ex05-s01-artifacts/b24-part1-chain-variant-report.json
            /tmp/ex05-s01-artifacts/ex05-s01-pin-gate-report.json
            /tmp/ex05-s01-artifacts/ex05-s01-pin-gate.md
            /tmp/ex05-s01-artifacts/ex05-s01-text-report.json
            /tmp/ex05-s01-artifacts/ex05-s01-readers-report.json
            /tmp/ex05-s01-artifacts/ex05-s01-photo-report.json
            /tmp/ex05-s01-artifacts/ex05-s01-group-report.json
            /tmp/ex05-s01-artifacts/ex05-s01-voice-report.json
            /tmp/ex05-s01-artifacts/ex05-s01-push-report.json
          if-no-files-found: error
          retention-days: 30

  d03-position:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_d03_position }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      N07_ARTIFACT_DIR: artifacts/d03-message-retry/predecessor-n07
      N08_ARTIFACT_DIR: artifacts/d03-message-retry/predecessor-n08
      D03_ARTIFACT_DIR: artifacts/d03-message-retry
      EX05_S01_ARTIFACT_DIR: /tmp/ex05-s01-d03
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Locked dependencies
        run: |
          set -euo pipefail
          mkdir -p "$EX05_S01_ARTIFACT_DIR" "$N07_ARTIFACT_DIR" "$N08_ARTIFACT_DIR" "$D03_ARTIFACT_DIR"
          git rev-parse HEAD > "$EX05_S01_ARTIFACT_DIR/source-binding.txt"
          npm ci
      - name: Reconstruct the disposable historical live-79 baseline and prepare the real disposable accounts
        run: |
          set -euo pipefail
          bash supabase/proofs/ru5_device_ui_live79_env.sh
          node supabase/proofs/ru5_device_ui_fixture.mjs
      - name: The frozen N07, N08 and D03 proofs at their own position (live79 to history 84, 85, 86), unchanged; each report is kept even when a proof fails
        run: |
          set -euo pipefail
          exit_code=0
          node supabase/proofs/notifications/n07_forward_promotion_proof.mjs 2>&1 | tee "$EX05_S01_ARTIFACT_DIR/n07.log" || exit_code=${PIPESTATUS[0]}
          cp "$N07_ARTIFACT_DIR/proof-report.json" "$EX05_S01_ARTIFACT_DIR/d03-n07-proof-report.json" || true
          if [ "$exit_code" -eq 0 ]; then
            node supabase/proofs/notifications/n08_preferences_proof.mjs 2>&1 | tee "$EX05_S01_ARTIFACT_DIR/n08.log" || exit_code=${PIPESTATUS[0]}
            cp "$N08_ARTIFACT_DIR/proof-report.json" "$EX05_S01_ARTIFACT_DIR/d03-n08-proof-report.json" || true
          fi
          if [ "$exit_code" -eq 0 ]; then
            node supabase/proofs/notifications/d03_message_retry_proof.mjs 2>&1 | tee "$EX05_S01_ARTIFACT_DIR/d03.log" || exit_code=${PIPESTATUS[0]}
            cp "$D03_ARTIFACT_DIR/proof-report.json" "$EX05_S01_ARTIFACT_DIR/d03-proof-report.json" || true
          fi
          exit "$exit_code"
      - name: Teardown disposable Supabase
        if: always()
        run: |
          if [[ -n "${RU5_DEVICE_PROOF_DIR:-}" && -d "$RU5_DEVICE_PROOF_DIR" ]]; then
            cd "$RU5_DEVICE_PROOF_DIR"
            supabase stop --no-backup
          fi
      - name: Upload bounded result summaries including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ex05-s01-d03-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/ex05-s01-d03/source-binding.txt
            /tmp/ex05-s01-d03/d03-n07-proof-report.json
            /tmp/ex05-s01-d03/d03-n08-proof-report.json
            /tmp/ex05-s01-d03/d03-proof-report.json
          if-no-files-found: error
          retention-days: 30

  evidence:
    if: ${{ always() }}
    needs: [offline, chain, d03-position]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Download the reports of this run
        uses: actions/download-artifact@v4
        with:
          pattern: ex05-s01-*
          path: evidence-input
          merge-multiple: true
      - name: Render the evidence table with the results and the run id (the exit code is the verdict; a FAIL or a missing report is red)
        run: |
          set -euo pipefail
          mkdir -p evidence-out
          render_exit=0
          node supabase/proofs/ex05_s01/render_evidence.mjs --reports-dir evidence-input --run-id "$GITHUB_RUN_ID" --out evidence-out/EX05_S01_EVIDENCE_TABLE_RUN.md --summary-out evidence-out/evidence-summary.json || render_exit=$?
          { echo "## EX05-S01 evidence table, run $GITHUB_RUN_ID (a disposable chain is NOT DEV; a source or CI result is NOT device proof)"; echo; cat evidence-out/EX05_S01_EVIDENCE_TABLE_RUN.md; } >> "$GITHUB_STEP_SUMMARY"
          echo "render_exit=$render_exit"
          echo "$render_exit" > evidence-out/render-exit.txt
      - name: Upload the rendered table
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ex05-s01-evidence-table-${{ github.sha }}-${{ github.run_id }}
          path: |
            evidence-out/EX05_S01_EVIDENCE_TABLE_RUN.md
            evidence-out/evidence-summary.json
            evidence-out/render-exit.txt
          if-no-files-found: error
          retention-days: 90
      - name: Verdict
        run: |
          set -euo pipefail
          test "$(cat evidence-out/render-exit.txt)" = "0"
