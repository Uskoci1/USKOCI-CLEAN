name: EX-05 S02 RC-02 media cancel lock order proof
# EX-05 slice S02 (gap G11, audit RC-02): does the cancellation of an upload lock in an order that can deadlock against the other media writers? The proof drives REAL, genuinely concurrent database
# sessions on a DISPOSABLE chain: a gate session holds one lock, two callers are parked behind it in a chosen queue order (each wait is OBSERVED in pg_stat_activity / pg_blocking_pids before the next
# step), the gate is released, and every session's outcome is classified (single documented final state, 40P01 deadlock with its exact statements, 40001, PT409). Task path: rpc_cancel_media_upload against
# rpc_remove_task_photo and rpc_complete_media_upload_service. Agreement photo and voice: the upload service CANCEL / SETTLE / CLAIM against the message send, plus the closure key. Named controls: a scratch copy
# with the wrong lock order MUST deadlock (negative control, so the proof can fail), a scratch copy with the conversation row first MUST NOT (positive control). PT409 is asserted over real PostgREST.
# LABEL: the chain is NOT DEV. It carries the unchanged stages source147 -> PKG-050, A1/B3a/B3b, P0/P4/P5/B3c, B24 part 2 (relaxed pre-image mode) and the exact Voice B1 DEV application (ledger 215); it lacks pkg051a,
# PKG-045b P0, P6 rollout v3, EX-04, D12 and B24 part 1 (the proof converts the seven task media functions the way B24 part 1 does and requires the converted md5 to equal the DEV md5). The pin gate compares 42 function
# bodies and 11 trigger definitions with the DEV md5 read read-only on 2026-10-02. NOTHING is applied to DEV or a provider, no device is involved, no function body is changed (scratch copies live in a schema the proof drops).
# A green run means every outcome equals the pre-registered one INCLUDING the pre-registered RC-02 deadlock of the task path (a finding, not a fix); the summary names the findings first. NOT native acceptance.
# TRIGGERS: only this file and supabase/proofs/ex05/**. A change in a chain-defining file (migrations, candidates, other proofs) does NOT start it: dispatch it by hand. The chain takes about 90 minutes.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/ex05-s02-rc02-proof.yml'
      - 'supabase/proofs/ex05/**'
  workflow_dispatch:
    inputs:
      pin_gate_only:
        description: 'Stop after the pin gate (chain fidelity, B24 conversion, writer census) and print every difference: a cheap first cycle'
        type: boolean
        default: false
      only:
        description: 'Comma list of interleaving ids to run (empty = all); unknown ids fail the run'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ex05-s02-rc02-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/ex05-s02-private
      EX05_ARTIFACT_DIR: /tmp/ex05-s02-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Bind exact source, check the own files (ASCII, LF, pglast syntax of every statement and rewritten definition), run the offline tests and install locked existing dependencies
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX05_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$EX05_ARTIFACT_DIR/source-binding.txt"
          python3 -m pip install --quiet pglast==8.4
          python3 supabase/proofs/ex05/check_ex05_s02.py --check --syntax | tee "$EX05_ARTIFACT_DIR/checker.txt"
          sha256sum supabase/proofs/ex05/*.mjs supabase/proofs/ex05/*.py supabase/proofs/ex05/*.json > "$EX05_ARTIFACT_DIR/source-manifest-sha256.txt"
          for file in supabase/proofs/ex05/*.mjs; do node --check "$file"; done
          node --test supabase/proofs/ex05/*.test.mjs | tee "$EX05_ARTIFACT_DIR/unit-tests.txt"
          dependency_exit=0
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/01-dependencies.log" 2>&1 || dependency_exit=$?
          printf '01-dependencies exit=%s\n' "$dependency_exit" | tee "$EX05_ARTIFACT_DIR/stages.txt"
          test "$dependency_exit" -eq 0
          git diff --exit-code
      - name: Reconstruct the existing disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          # Setup can print local keys. Raw output and predecessor reports stay outside the uploaded directory; only fixed stage summaries are public.
          setup_exit=0
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/02-live79.log" 2>&1 || setup_exit=$?
          printf '02-live79 exit=%s\n' "$setup_exit" | tee -a "$EX05_ARTIFACT_DIR/stages.txt"
          exit "$setup_exit"
      - name: Guard loopback targets and replay the unchanged predecessor stages (source147 to the B3c application)
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          try {
            assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
            if (process.env.DB_URL !== process.env.RU5_DEVICE_DB_URL) throw new Error();
          } catch { console.error('FAIL EX05_S02_LOCAL_TARGET_ADMISSION'); process.exit(1); }
          NODE
          run_stage() {
            local stage="$1" status=0
            shift
            printf '%s START\n' "$stage" | tee -a "$EX05_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$EX05_ARTIFACT_DIR/stages.txt"
            if [ "$status" -ne 0 ]; then { printf '== %s\n' "$stage"; tail -n 15 "$PRE_V3_ARTIFACT_DIR/$stage.log"; } >> "$EX05_ARTIFACT_DIR/stage-failures.txt"; fi
            return "$status"
          }
          # Exact stage order of d12-review-comment-proof.yml and chat-voice-b1-dev-application-proof.yml (PKG-051/P0 excluded there too).
          run_stage 03-source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage 04-dev-alpha-to-pkg026 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage 05-pkg027 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage 06-pkg028 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage 07-pkg029 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage 08-pkg030 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage 09-pkg031 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage 10-pkg032 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage 11-pkg033 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage 12-pkg034 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage 13-pkg035 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage 14-pkg037 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage 15-pkg038 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage 16-pkg039 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage 17-pkg040 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage 18-pkg042-to-pkg050 node supabase/proofs/pkg050/pkg050_proof.mjs
          run_stage 19-a1-preparation node supabase/proofs/chat/prepare_notification_a1.mjs
          run_stage 20-b3a node supabase/proofs/chat/private_history_read_proof.mjs
          run_stage 21-b3b node supabase/proofs/chat/message_window_proof.mjs
          # The packages applied to DEV before B3c, then the exact B3c application file.
          run_stage 22-p0 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/discovery_p0_exact_public_landing.sql
          run_stage 23-p4 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/chat_p4_exact_message_event_resolver.sql
          run_stage 24-p5 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/worker_profile_licenses_owned_projection.sql
          run_stage 25-b3c-application psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/chat_b3c_private_invalidation_dev_application.sql
      - name: B24 part 2 in relaxed pre-image mode, then the chain fidelity check against the DEV receipt
        run: |
          set -euo pipefail
          umask 077
          b24_exit=0
          PGOPTIONS='-c b24.preimage=relaxed' psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/candidates/b24_nonretried_conflicts_part2_certified.sql > "$PRE_V3_ARTIFACT_DIR/26-b24-part2.log" 2>&1 || b24_exit=$?
          printf '26-b24-part2 exit=%s\n' "$b24_exit" | tee -a "$EX05_ARTIFACT_DIR/stages.txt"
          if [ "$b24_exit" -ne 0 ]; then tail -20 "$PRE_V3_ARTIFACT_DIR/26-b24-part2.log"; fi
          fidelity_exit=0
          VOICE_ARTIFACT_DIR="$EX05_ARTIFACT_DIR" node supabase/proofs/chat/voice_b1_b24_fidelity.mjs || fidelity_exit=$?
          printf '26-b24-fidelity exit=%s\n' "$fidelity_exit" | tee -a "$EX05_ARTIFACT_DIR/stages.txt"
          test "$b24_exit" -eq 0
          exit "$fidelity_exit"
      - name: The exact Voice B1 DEV application (ledger 215), the DEV closure surface before D12 without EX-04
        run: |
          set -euo pipefail
          umask 077
          status=0
          printf '27-voice-b1-application START\n' | tee -a "$EX05_ARTIFACT_DIR/stages.txt"
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/candidates/chat_voice_b1_dev_application.sql > "$PRE_V3_ARTIFACT_DIR/27-voice-b1-application.log" 2>&1 || status=$?
          printf '27-voice-b1-application exit=%s\n' "$status" | tee -a "$EX05_ARTIFACT_DIR/stages.txt"
          if [ "$status" -ne 0 ]; then tail -12 "$PRE_V3_ARTIFACT_DIR/27-voice-b1-application.log"; fi
          exit "$status"
      - name: The EX-05 S02 proof (pin gate, B24 conversion, scratch controls, PT409 contract, the interleavings with genuinely concurrent sessions)
        if: ${{ !cancelled() }}
        env:
          EX05_PIN_GATE_ONLY_INPUT: ${{ inputs.pin_gate_only }}
          EX05_ONLY_INPUT: ${{ inputs.only }}
        run: |
          set -euo pipefail
          umask 077
          proof_exit=0
          if [ "$EX05_PIN_GATE_ONLY_INPUT" = "true" ]; then export EX05_PIN_GATE_ONLY=1; fi
          if [ -n "$EX05_ONLY_INPUT" ]; then export EX05_ONLY="$EX05_ONLY_INPUT"; fi
          timeout --signal=TERM --kill-after=10s 3600s node supabase/proofs/ex05/ex05_s02_proof.mjs 2>&1 | tee "$PRE_V3_ARTIFACT_DIR/28-ex05-s02-proof.log" || proof_exit=${PIPESTATUS[0]}
          printf '28-ex05-s02-proof exit=%s\n' "$proof_exit" | tee -a "$EX05_ARTIFACT_DIR/stages.txt"
          tail -n 160 "$PRE_V3_ARTIFACT_DIR/28-ex05-s02-proof.log" > "$EX05_ARTIFACT_DIR/proof-tail.txt" || true
          { echo '## EX-05 S02 / RC-02 lock-order proof: evidence about a DISPOSABLE CHAIN, never about DEV (the label comes first; a green run means every outcome equals the pre-registered one, INCLUDING the pre-registered task-path deadlock, which is a finding and not a fix; not native acceptance)'; echo; head -c 60000 "$EX05_ARTIFACT_DIR/ex05-s02-report.md" 2>/dev/null || echo "(no markdown report: proof exit $proof_exit)"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$proof_exit"
      - name: Always discard the disposable database
        if: always()
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX05_ARTIFACT_DIR"
          teardown_exit=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || teardown_exit=$?
          fi
          printf 'teardown exit=%s\n' "$teardown_exit" | tee -a "$EX05_ARTIFACT_DIR/stages.txt"
          exit "$teardown_exit"
      - name: Upload only bounded source and result summaries including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ex05-s02-rc02-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/ex05-s02-artifacts/source-binding.txt
            /tmp/ex05-s02-artifacts/source-manifest-sha256.txt
            /tmp/ex05-s02-artifacts/checker.txt
            /tmp/ex05-s02-artifacts/unit-tests.txt
            /tmp/ex05-s02-artifacts/stages.txt
            /tmp/ex05-s02-artifacts/stage-failures.txt
            /tmp/ex05-s02-artifacts/chat-voice-b24-fidelity.json
            /tmp/ex05-s02-artifacts/proof-tail.txt
            /tmp/ex05-s02-artifacts/ex05-s02-report.json
            /tmp/ex05-s02-artifacts/ex05-s02-report.md
          if-no-files-found: error
          retention-days: 30
