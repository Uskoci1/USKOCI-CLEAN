name: EX-06 S03 matching contract proof
# EX-06 S03: a corpus-driven proof of the matcher and one dispatch wave on a disposable DEV-equivalent chain, with actual Auth and PostgREST.
#
# ORDER. The corpus proof runs IMMEDIATELY after stage 18 on exactly the ex04d-proven chain (stages 03-18: source147 -> PKG-027 .. PKG-042 -> PKG-050; the unchanged stage list of
# ex04d-candidates-page-proof.yml). The extension stages (A1, B3a, B3b, P0, the P4 resolver, P5, B3c, the P4 push transport, pkg051a, B24 part 1 relaxed) run AFTER it, non-blocking and
# recorded, only to reach the post-B24 body of public.rpc_begin_push_send (the 12th S01 pin) and to report which objects the extension changed (a second, small report section).
# No matching assertion is made on the extended chain.
#
# THE PROOF (stage 19, supabase/proofs/ex06/ex06_s03_proof.mjs). A canary (seven product-path cases: stationary, scheduled, radius, REMOTE, POINT_TO_POINT, MULTI_STOP, the world gate) first: any disagreement is a harness error, never a finding. Then for each task case of the
# S02 contract corpus (supabase/proofs/ai/corpus/ex06_contract_corpus_v1.json, through the total adapter lib/s02_adapter.mjs): the task is published through the product path (never a silent
# direct insert), the reference workers are built through the product's own writers, every fixture is read back, private.match_detail is read, private.dispatch_next_wave runs once, the
# deliveries and OPPORTUNITY_AVAILABLE events are read and compared with the corpus. A disagreement is a FINDING, never adjusted and never fixed here. EX06_REQUIRE_CORPUS=1: a missing
# corpus file is an error, not a fall back to the SMOKE corpus. The result is PASS | FINDINGS | SMOKE_ONLY | PARTIAL | HARNESS_BROKEN and is printed on the RESULT line; a green job is
# not evidence by itself (the proof prints ::warning / ::error annotations for findings, SMOKE_ONLY, PARTIAL and a broken harness).
#
# CHAIN FIDELITY. Eleven of the twelve S01 function-body pins are read at the proof point (stage 18 ends on the DEV body of match_detail, match_detail_for_calendar_interval,
# match_detail_without_calendar, dispatch_next_wave, dispatch_tick, dispatch_cheap_candidate_admitted, candidate_profile_ids, emit_event, push_suppression, work_kinds_v5 and
# requeue_open_needs_for_worker_v5; nothing after PKG-050 redefines them). The 12th, public.rpc_begin_push_send, reaches fc76b344 only after A1, the P4 push transport and B24 part 1; B24 part 1
# needs private.platform_price_add_version, one of its 54 targets, which only pkg051a creates (the target check has no relaxed mode), so pkg051a runs right before it. The pins cover function
# bodies only: helper functions, marketplace_config rows and triggers are recorded for information and not pinned (see the label). A differing pin only downgrades the label.
# No DEV, provider or device access. Every outcome destroys the disposable stack.
#
# TRIGGERS. Every file the proof reads or imports re-runs it: the harness, the S02 corpus, the need-fact registry (src/contracts/needFactsV2.ts: loaded by ts_loader and parsed by the offline
# tests), the proof adapter (closure_runtime.mjs and what it imports: ru5_device_ui_local_guard.mjs, history_snapshot.mjs), the TypeScript loader, the product-path helpers
# (pkg023_flow.mjs and publication_fixtures.mjs), the S01 baseline document the offline tests read, the stack script, and every candidate and proof script the extension stages apply.
# Documentation under supabase/proofs/ex06 (README, review dispositions) does NOT start the job: it is a chain of about 90 minutes.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/ex06-s03-matching-proof.yml'
      - 'supabase/proofs/ex06/**'
      - '!supabase/proofs/ex06/*.md'
      - '!supabase/proofs/ex06/**/*.md'
      - '!supabase/proofs/ex06/ex06a_*'
      - '!supabase/proofs/ex06/build_ex06a.py'
      - 'supabase/proofs/ai/corpus/**'
      - 'src/contracts/needFactsV2.ts'
      - 'supabase/proofs/pre_v3/closure_runtime.mjs'
      - 'supabase/proofs/pre_v3/history_snapshot.mjs'
      - 'supabase/proofs/ru5_device_ui_local_guard.mjs'
      - 'supabase/proofs/ru5_device_ui_live79_env.sh'
      - 'supabase/proofs/ex04/ts_loader.mjs'
      - 'supabase/proofs/pkg023/pkg023_flow.mjs'
      - 'supabase/proofs/policy/publication_fixtures.mjs'
      - 'docs/implementation/product-v1-closure-20260926/finalization-20260927/ex06/EX06_S01_DEV_BEFORE_BASELINE_20261001.md'
      - 'supabase/candidates/pkg051a_platform_price_list.sql'
      - 'supabase/candidates/b24_nonretried_conflicts_part1.sql'
      - 'supabase/candidates/chat_p4_push_event_transport.sql'
      - 'supabase/candidates/chat_p4_exact_message_event_resolver.sql'
      - 'supabase/candidates/chat_b3c_private_invalidation_dev_application.sql'
      - 'supabase/candidates/discovery_p0_exact_public_landing.sql'
      - 'supabase/candidates/worker_profile_licenses_owned_projection.sql'
      - 'supabase/proofs/chat/prepare_notification_a1.mjs'
      - 'supabase/proofs/chat/private_history_read_proof.mjs'
      - 'supabase/proofs/chat/message_window_proof.mjs'
  workflow_dispatch:
    inputs:
      max_cases:
        description: 'EX06_MAX_CASES: cap the corpus cases for a cheap first run (a positive integer; empty = all; a capped run is PARTIAL)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ex06-s03-matching-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/ex06-s03-private
      EX06_ARTIFACT_DIR: /tmp/ex06-s03-artifacts
      EX06_STAGES_FILE: /tmp/ex06-s03-artifacts/stages.txt
      EX06_NEED_PATH: product
      EX06_REQUIRE_CORPUS: '1'
      EX06_MAX_CASES: ${{ github.event.inputs.max_cases }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Bind exact source, run the offline harness tests and install locked existing dependencies
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX06_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$EX06_ARTIFACT_DIR/source-binding.txt"
          git ls-files -z -- .github/workflows/ex06-s03-matching-proof.yml supabase/proofs/ex06 supabase/proofs/ai/corpus | xargs -0 -r sha256sum | tee "$EX06_ARTIFACT_DIR/source-manifest-sha256.txt"
          # The harness itself, before the long chain: syntax, then the offline tests (no database, no dependency): the S02 adapter against the real corpus, the runner against a scripted fake.
          for file in supabase/proofs/ex06/ex06_s03_proof.mjs supabase/proofs/ex06/ex06_s03_extension_report.mjs supabase/proofs/ex06/lib/*.mjs; do node --check "$file"; done
          node --test supabase/proofs/ex06/lib/*.test.mjs | tee "$EX06_ARTIFACT_DIR/offline-tests.txt"
          dependency_exit=0
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/01-dependencies.log" 2>&1 || dependency_exit=$?
          printf '01-dependencies exit=%s\n' "$dependency_exit" | tee "$EX06_ARTIFACT_DIR/stages.txt"
          test "$dependency_exit" -eq 0
          git diff --exit-code
      - name: Reconstruct the existing disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          setup_exit=0
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/02-live79.log" 2>&1 || setup_exit=$?
          printf '02-live79 exit=%s\n' "$setup_exit" | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
          exit "$setup_exit"
      - name: Guard loopback targets and replay the unchanged predecessor stages (source147 to PKG-050)
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          try {
            assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
            if (process.env.DB_URL !== process.env.RU5_DEVICE_DB_URL) throw new Error();
          } catch { console.error('FAIL EX06_LOCAL_TARGET_ADMISSION'); process.exit(1); }
          NODE
          run_stage() {
            local stage="$1" status=0
            shift
            printf '%s START\n' "$stage" | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
            if [ "$status" -ne 0 ]; then { printf '== %s\n' "$stage"; tail -n 15 "$PRE_V3_ARTIFACT_DIR/$stage.log"; } >> "$EX06_ARTIFACT_DIR/stage-failures.txt"; fi
            return "$status"
          }
          # Exact stage order of chat-voice-b1-dev-application-proof.yml and ex04d-candidates-page-proof.yml up to PKG-050 (PKG-045a is replayed inside stage 18).
          run_stage 03-source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage 04-dev-alpha-to-pkg026 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage 05-pkg027 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage 06-pkg028 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage 07-pkg029 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage 08-pkg030 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage 09-pkg031 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage 10-pkg032 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage 11-pkg033 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage 12-pkg034 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage 13-pkg035 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage 14-pkg037 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage 15-pkg038 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage 16-pkg039 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage 17-pkg040 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage 18-pkg042-to-pkg050 node supabase/proofs/pkg050/pkg050_proof.mjs
      - name: Corpus-driven matching proof on exactly the ex04d-proven chain (actual Auth and PostgREST; canary, pin gate, certificate, expected versus actual)
        timeout-minutes: 45
        run: |
          set -euo pipefail
          umask 077
          proof_exit=0
          # The run signs in about 200 Auth accounts (every other proof makes ten or fewer). The disposable stack was created by `supabase init` with the CLI's default [auth.rate_limit]; print
          # the limits into the job summary BEFORE the proof, so the first run records what GoTrue enforces (the harness retries a 429 with a bounded back-off and reports the retries).
          config=/tmp/uskoci-ru5-device-ui/supabase/config.toml
          { printf '### Auth rate limits of the disposable stack (%s)\n\n```\n' "$config"; if [ -f "$config" ]; then grep -A12 '^\[auth.rate_limit\]' "$config" || printf 'no [auth.rate_limit] section in the config (GoTrue defaults apply)\n'; else printf 'config.toml not found\n'; fi; printf '```\n\n'; } | tee -a "$EX06_ARTIFACT_DIR/auth-rate-limits.txt" >> "$GITHUB_STEP_SUMMARY"
          printf '19-ex06-s03-proof START\n' | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
          node supabase/proofs/ex06/ex06_s03_proof.mjs 2>&1 | tee "$PRE_V3_ARTIFACT_DIR/19-ex06-s03-proof.log" || proof_exit=${PIPESTATUS[0]}
          printf '19-ex06-s03-proof exit=%s\n' "$proof_exit" | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
          tail -n 60 "$PRE_V3_ARTIFACT_DIR/19-ex06-s03-proof.log" > "$EX06_ARTIFACT_DIR/proof-tail.txt" || true
          # A green step is not evidence: the RESULT line (result, corpus, cases ran/total, asserted, product/direct, findings) heads the summary.
          { printf '### EX-06 S03 result\n\n```\n'; grep -h '^RESULT ' "$PRE_V3_ARTIFACT_DIR/19-ex06-s03-proof.log" || printf 'no RESULT line: the proof did not finish\n'; printf '```\n\n'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$EX06_ARTIFACT_DIR/ex06-s03-report.md" ]; then head -c 900000 "$EX06_ARTIFACT_DIR/ex06-s03-report.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$proof_exit"
      - name: Fidelity extension for public.rpc_begin_push_send (A1, B3a, B3b, P0, P4 resolver, P5, B3c, P4 push transport, pkg051a, B24 part 1 relaxed). Non-blocking, unproven, recorded; then the second report section
        if: always()
        timeout-minutes: 40
        run: |
          set -uo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX06_ARTIFACT_DIR"
          if ! grep -q '^18-pkg042-to-pkg050 exit=0$' "$EX06_ARTIFACT_DIR/stages.txt" 2>/dev/null; then
            printf '20-extension SKIPPED (stage 18 did not succeed: there is no chain to extend)\n' | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
            exit 0
          fi
          ext_failed=0
          ext_stage() {
            local stage="$1" status=0
            shift
            if [ "$ext_failed" -ne 0 ]; then
              printf '%s SKIPPED (an earlier extension stage failed)\n' "$stage" | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
              return 0
            fi
            printf '%s START\n' "$stage" | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
            if [ "$status" -ne 0 ]; then
              ext_failed=1
              case "$stage" in
                2[0-9]-*) { printf '== %s\n' "$stage"; tail -n 15 "$PRE_V3_ARTIFACT_DIR/$stage.log"; } >> "$EX06_ARTIFACT_DIR/extension-failures.txt" ;;
              esac
            fi
            return 0
          }
          # Stages 20-26: the exact order of chat-voice-b1-dev-application-proof.yml (the packages applied to DEV before B3c, then the B3c application file; its stages 19-25).
          ext_stage 20-a1-preparation node supabase/proofs/chat/prepare_notification_a1.mjs
          ext_stage 21-b3a node supabase/proofs/chat/private_history_read_proof.mjs
          ext_stage 22-b3b node supabase/proofs/chat/message_window_proof.mjs
          ext_stage 23-p0 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/discovery_p0_exact_public_landing.sql
          ext_stage 24-p4-resolver psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/chat_p4_exact_message_event_resolver.sql
          ext_stage 25-p5 psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/worker_profile_licenses_owned_projection.sql
          ext_stage 26-b3c-application psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/chat_b3c_private_invalidation_dev_application.sql
          # DEV order after B3c: the P4 push transport (ledger 210; pins the A1 body f946246b and leaves ea801be7).
          ext_stage 27-p4-push-transport psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/candidates/chat_p4_push_event_transport.sql
          # pkg051a creates private.platform_price_add_version, a target of B24 part 1 (the candidate refuses a missing target even in relaxed mode). It adds only private functions and config
          # rows, changes no pinned function and leaves the certificate unmoved, so it runs last (not at its DEV position, ledger 202) and the proofs above keep the predecessor state they expect.
          # It is a single begin ... commit file: no -1.
          ext_stage 28-pkg051a-price-list psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/candidates/pkg051a_platform_price_list.sql
          # B24 part 1 (DEV ledger 213), relaxed pre-image mode, as B24 part 2 runs in the voice chain.
          ext_stage 29-b24-part1-relaxed env PGOPTIONS='-c b24.preimage=relaxed' psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/candidates/b24_nonretried_conflicts_part1.sql
          report_exit=0
          printf '30-ex06-s03-extension-report START\n' | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
          node supabase/proofs/ex06/ex06_s03_extension_report.mjs 2>&1 | tee "$PRE_V3_ARTIFACT_DIR/30-ex06-s03-extension-report.log" || report_exit=${PIPESTATUS[0]}
          printf '30-ex06-s03-extension-report exit=%s\n' "$report_exit" | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
          { printf '### EX-06 S03 second section: the extension for rpc_begin_push_send\n\n```\n'; grep -h '^EXTENSION_RESULT ' "$PRE_V3_ARTIFACT_DIR/30-ex06-s03-extension-report.log" || printf 'no EXTENSION_RESULT line\n'; printf '```\n\n'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$EX06_ARTIFACT_DIR/ex06-s03-extension-report.md" ]; then head -c 200000 "$EX06_ARTIFACT_DIR/ex06-s03-extension-report.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$ext_failed" -ne 0 ]; then echo '::warning::EX-06 S03: an extension stage failed; the 12th pin (rpc_begin_push_send) was not brought to its post-B24 body (the corpus result is unaffected: it was produced before the extension)'; fi
          if [ "$report_exit" -ne 0 ]; then echo '::warning::EX-06 S03: the extension report could not be read'; fi
          exit 0
      - name: Always discard the disposable database
        if: always()
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX06_ARTIFACT_DIR"
          teardown_exit=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || teardown_exit=$?
          fi
          printf 'teardown exit=%s\n' "$teardown_exit" | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
          exit "$teardown_exit"
      - name: Upload only bounded source and result summaries including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ex06-s03-matching-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/ex06-s03-artifacts/source-binding.txt
            /tmp/ex06-s03-artifacts/source-manifest-sha256.txt
            /tmp/ex06-s03-artifacts/offline-tests.txt
            /tmp/ex06-s03-artifacts/stages.txt
            /tmp/ex06-s03-artifacts/stage-failures.txt
            /tmp/ex06-s03-artifacts/extension-failures.txt
            /tmp/ex06-s03-artifacts/proof-tail.txt
            /tmp/ex06-s03-artifacts/auth-rate-limits.txt
            /tmp/ex06-s03-artifacts/ex06-s03-report.json
            /tmp/ex06-s03-artifacts/ex06-s03-report.md
            /tmp/ex06-s03-artifacts/ex06-s03-extension-report.json
            /tmp/ex06-s03-artifacts/ex06-s03-extension-report.md
          if-no-files-found: warn
          retention-days: 30
