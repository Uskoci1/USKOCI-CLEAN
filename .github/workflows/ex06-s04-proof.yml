name: EX-06 S04 dispatch lifecycle proof
# EX-06 S04: the NEGATIVE cases of the dispatch lifecycle and five probes of inferences nobody had tested, proved on a disposable DEV-equivalent chain (the unchanged source147 -> PKG-050 stages 03-18,
# then the ex06a candidate, exactly as DEV applied it) with actual Auth and PostgREST. 17 scenarios build people and tasks through the PRODUCT path (the S03 fixtures) and drive the dispatch (a wave, a
# tick, an expiry sweep, a cancellation, a selection, a push claim): paused, blocked (both directions), outside the world (both directions), closed profile, closure-restricted, already applied, over
# capacity, past expiry, no availability for the window (including the ex06a derived TOMORROW / WEEK window), a profile that is not ACTIVE, an unlicensed work kind or tool, the requester themself, a
# task that is not OPEN; wave order and size, idempotent re-dispatch, expiry and cancellation closing the dispatch, the notification events once. Each case says what the canonical requirement is and
# what the product did; a disagreement is a FINDING (F5 ... F12) with failing rows and a proposed fix as TEXT. NOTHING in S04 changes a function body; nothing is sent (the chain has no push sender and
# no device: the claim RPC only suppresses or queues rows in the database); no DEV, provider or device access; every outcome destroys the disposable stack.
#
# WHAT A GREEN JOB IS NOT. A disposable chain is NOT DEV. The proof pins 60 function bodies of the dispatch lifecycle to the md5 values read READ-ONLY on canonical DEV on 2026-10-02 (ledger 221) and the
# report label says whether the chain's bodies equal them (FUNCTION BODIES == DEV or !=); RLS policies, config rows other than dispatch_normal, triggers and grants are not pinned. A green job is not
# evidence by itself: read the RESULT line (PASS | FINDINGS | PARTIAL | CHAIN_DIFFERS | HARNESS_BROKEN) and the report. NOTHING in this workflow has run yet: the first run is the first evidence.
# What only a run can show: that the labelled fixtures (closure request, stored response deadline, re-publication after a confirmed edit, the Agreement booked for the calendar case) work on the chain,
# that the SUPPORTING pins really equal DEV on it, and that the predicted findings are real (see README_S04.md, section "How to continue").
#
# TRIGGERS. Every file the proof reads or imports re-runs it. Documentation (README_S04.md) does NOT start the job: it is a chain of about 90 minutes.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/ex06-s04-proof.yml'
      - 'supabase/proofs/ex06/ex06_s04_*'
      - 'supabase/proofs/ex06/s04/**'
      - '!supabase/proofs/ex06/s04/**/*.md'
      - 'supabase/proofs/ex06/lib/**'
      - '!supabase/proofs/ex06/lib/**/*.md'
      - 'supabase/candidates/ex06a_flexible_window.sql'
      - 'supabase/proofs/pre_v3/closure_runtime.mjs'
      - 'supabase/proofs/pre_v3/history_snapshot.mjs'
      - 'supabase/proofs/ru5_device_ui_local_guard.mjs'
      - 'supabase/proofs/ru5_device_ui_live79_env.sh'
      - 'supabase/proofs/pkg023/pkg023_flow.mjs'
      - 'supabase/proofs/pkg023/pkg023_surface.sql'
      - 'supabase/proofs/policy/publication_fixtures.mjs'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      only:
        description: 'EX06_S04_ONLY: comma separated scenarios for a focused re-run (reach, licence, worldReverse, capacity, target, calendar, window, waves, ticks, expiry, cancel, fill, search, revision, requeue, resolver, push); empty = all; a focused run is PARTIAL'
        required: false
        default: ''
      pins:
        description: 'EX06_S04_PINS: strict (default, empty) or report (a SUPPORTING pin difference is a loud warning instead of a failure; a CORE pin difference is always fatal)'
        required: false
        default: ''
      strict_findings:
        description: 'EX06_S04_STRICT_FINDINGS: 1 = a run with findings exits 2 (default empty: findings exit 0, the result line says FINDINGS)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ex06-s04-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/ex06-s04-private
      EX06_ARTIFACT_DIR: /tmp/ex06-s04-artifacts
      EX06_STAGES_FILE: /tmp/ex06-s04-artifacts/stages.txt
      EX06_S04_ONLY: ${{ github.event.inputs.only }}
      EX06_S04_PINS: ${{ github.event.inputs.pins }}
      EX06_S04_STRICT_FINDINGS: ${{ github.event.inputs.strict_findings }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Bind exact source, run the offline tests and install locked existing dependencies
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX06_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$EX06_ARTIFACT_DIR/source-binding.txt"
          git ls-files -z -- .github/workflows/ex06-s04-proof.yml supabase/proofs/ex06/ex06_s04_proof.mjs supabase/proofs/ex06/s04 supabase/proofs/ex06/lib supabase/candidates/ex06a_flexible_window.sql | xargs -0 -r sha256sum | tee "$EX06_ARTIFACT_DIR/source-manifest-sha256.txt"
          # The proof itself, before the long chain: syntax, then the offline tests (no database, no dependency): the SQL builders, the DEV pins, the verdict mechanics, the case catalogue, the 17 scenario
          # drivers against a simulated world in two variants (the product as built and with every proposed fix), the report and the orchestration.
          node --check supabase/proofs/ex06/ex06_s04_proof.mjs
          for file in supabase/proofs/ex06/s04/lib/*.mjs; do node --check "$file"; done
          node --test supabase/proofs/ex06/s04/lib/*.test.mjs | tee "$EX06_ARTIFACT_DIR/offline-tests.txt"
          dependency_exit=0
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/01-dependencies.log" 2>&1 || dependency_exit=$?
          printf '01-dependencies exit=%s\n' "$dependency_exit" | tee "$EX06_ARTIFACT_DIR/stages.txt"
          test "$dependency_exit" -eq 0
          git diff --exit-code
      - name: Reconstruct the existing disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          setup_exit=0
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/02-live79.log" 2>&1 || setup_exit=$?
          printf '02-live79 exit=%s\n' "$setup_exit" | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
          exit "$setup_exit"
      - name: Guard loopback targets, replay the unchanged predecessor stages (source147 to PKG-050) and apply the ex06a candidate
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          try {
            assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
            if (process.env.DB_URL !== process.env.RU5_DEVICE_DB_URL) throw new Error();
          } catch { console.error('FAIL EX06_S04_LOCAL_TARGET_ADMISSION'); process.exit(1); }
          NODE
          run_stage() {
            local stage="$1" status=0
            shift
            printf '%s START\n' "$stage" | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
            if [ "$status" -ne 0 ]; then { printf '== %s\n' "$stage"; tail -n 15 "$PRE_V3_ARTIFACT_DIR/$stage.log"; } >> "$EX06_ARTIFACT_DIR/stage-failures.txt"; fi
            return "$status"
          }
          # Exact stage order of chat-voice-b1-dev-application-proof.yml up to PKG-050 (PKG-045a, which created rpc_read_task and rpc_list_my_tasks, is replayed inside stage 18).
          run_stage 03-source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage 04-dev-alpha-to-pkg026 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage 05-pkg027 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage 06-pkg028 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage 07-pkg029 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage 08-pkg030 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage 09-pkg031 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage 10-pkg032 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage 11-pkg033 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage 12-pkg034 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage 13-pkg035 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage 14-pkg037 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage 15-pkg038 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage 16-pkg039 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage 17-pkg040 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage 18-pkg042-to-pkg050 node supabase/proofs/pkg050/pkg050_proof.mjs
          # DEV carries the two ex06a bodies (ledger 220), the pinned CORE bodies private.match_detail_without_calendar and private.worker_dispatch_time_admitted are the ex06a ones: the chain gets the
          # candidate exactly as the DEV application did (one atomic DO that refuses on drift, a CRLF text, an uncertified closure and a second application). Disposable database only.
          run_stage 19-ex06a-candidate psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/candidates/ex06a_flexible_window.sql
      - name: Dispatch lifecycle proof (negative cases and probes; actual Auth and PostgREST; nothing is sent)
        timeout-minutes: 90
        run: |
          set -euo pipefail
          umask 077
          proof_exit=0
          # The proof signs in about 110 Auth accounts (one per person of each scenario; the S03 run needed 219 with no 429). The disposable stack was created by `supabase init` with the CLI's default
          # [auth.rate_limit]: print the limits into the job summary BEFORE the proof (the harness retries a 429 with a bounded back-off and reports the retries).
          config=/tmp/uskoci-ru5-device-ui/supabase/config.toml
          { printf '### Auth rate limits of the disposable stack (%s)\n\n```\n' "$config"; if [ -f "$config" ]; then grep -A12 '^\[auth.rate_limit\]' "$config" || printf 'no [auth.rate_limit] section in the config (GoTrue defaults apply)\n'; else printf 'config.toml not found\n'; fi; printf '```\n\n'; } | tee -a "$EX06_ARTIFACT_DIR/auth-rate-limits.txt" >> "$GITHUB_STEP_SUMMARY"
          printf '20-ex06-s04-proof START\n' | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
          node supabase/proofs/ex06/ex06_s04_proof.mjs 2>&1 | tee "$PRE_V3_ARTIFACT_DIR/20-ex06-s04-proof.log" || proof_exit=${PIPESTATUS[0]}
          printf '20-ex06-s04-proof exit=%s\n' "$proof_exit" | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
          tail -n 120 "$PRE_V3_ARTIFACT_DIR/20-ex06-s04-proof.log" > "$EX06_ARTIFACT_DIR/proof-tail.txt" || true
          # A green step is not evidence by itself: the RESULT line (result, chain, cases, probes, scenarios, findings) heads the summary, then the report: expected versus actual per case.
          {
            echo '### EX-06 S04 result (a disposable chain, NOT DEV; nothing was sent)'
            echo
            echo '```'
            grep -h '^RESULT ' "$PRE_V3_ARTIFACT_DIR/20-ex06-s04-proof.log" || echo 'no RESULT line: the proof did not finish'
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$EX06_ARTIFACT_DIR/ex06-s04-report.md" ]; then head -c 900000 "$EX06_ARTIFACT_DIR/ex06-s04-report.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$proof_exit"
      - name: Always discard the disposable database
        if: always()
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX06_ARTIFACT_DIR"
          teardown_exit=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || teardown_exit=$?
          fi
          printf 'teardown exit=%s\n' "$teardown_exit" | tee -a "$EX06_ARTIFACT_DIR/stages.txt"
          exit "$teardown_exit"
      - name: Upload only bounded source and result summaries including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ex06-s04-dispatch-lifecycle-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/ex06-s04-artifacts/source-binding.txt
            /tmp/ex06-s04-artifacts/source-manifest-sha256.txt
            /tmp/ex06-s04-artifacts/offline-tests.txt
            /tmp/ex06-s04-artifacts/proof-tail.txt
            /tmp/ex06-s04-artifacts/stages.txt
            /tmp/ex06-s04-artifacts/stage-failures.txt
            /tmp/ex06-s04-artifacts/auth-rate-limits.txt
            /tmp/ex06-s04-artifacts/ex06-s04-report.json
            /tmp/ex06-s04-artifacts/ex06-s04-report.md
          if-no-files-found: error
          retention-days: 30
