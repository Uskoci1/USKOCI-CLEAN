name: EX-06 ex06b alias registry proof
# EX-06 ex06b (S06: canonical groups step 1): private.work_kinds_v5 reads its word stems from twelve DATA rows of private.marketplace_config (a classification version, the eleven owner-approved kinds, aliases for the
# synonym cases of the S02 corpus, Cyrillic folded to Latin, the S03 finding F2 stem removed) instead of hard-coded regular expressions. The ONE-statement candidate (one function body completed in place + twelve
# rows, certificate-neutral), its exact revert, the read-only DEV preflight and postflight and the integrity-guarded forms for both connector transports are proved on a disposable DEV-equivalent chain (the unchanged
# source147 -> PKG-050 stages, then the ex06a candidate exactly as DEV has it) with actual Auth and PostgREST: fail-before / pass-after on ~670 deterministic probes against an independent model, on the written intent
# of the additive corpus v1.1 and, through the product path, on the real S02 corpus v1 (the only difference is the written intended flips of T-031 = finding F2 closed) and the eight v1.1 cases; refusals first, each
# atomic; the exact catalog and data delta (one function, twelve rows), the certificate unchanged, the data edits (an alias is a row edit, an invalid registry is refused loudly, a twelfth kind row is ignored),
# the revert and the reapply. A disposable chain is NOT canonical DEV. No DEV, provider or device access. Every outcome destroys the disposable stack. NOTHING in this workflow has run yet: the first run is the first evidence.
#
# TRIGGERS. Every file the proof reads or imports re-runs it: the generated candidate, revert and read-only files, the generator, the byte-exact DEV body it replaces, the PKG-031b candidate it is checked against, the
# ex06a candidate the proof applies first, the proof and its libraries, the S03 harness (lib/), both corpora, the need-fact registry (loaded by ts_loader), the proof adapter (closure_runtime.mjs and what it imports),
# the TypeScript loader, the product-path helpers, the surface script and .gitattributes (the bytes are LF text). Documentation (README_EX06B.md) does NOT start the job: it is a chain of about 90 minutes.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/ex06b-alias-proof.yml'
      - 'supabase/candidates/ex06b_alias_registry.sql'
      - 'supabase/candidates/ex06b_alias_registry_revert.sql'
      - 'supabase/candidates/pkg031b_work_kinds_for_matching.sql'
      - 'supabase/candidates/ex06a_flexible_window.sql'
      - 'supabase/proofs/ex06/ex06a_postflight.readonly.sql'
      - 'supabase/proofs/ex06/build_ex06b.py'
      - 'supabase/proofs/ex06/ex06b_*'
      - 'supabase/proofs/ex06/s06/**'
      - 'supabase/proofs/ex06/lib/**'
      - '!supabase/proofs/ex06/lib/**/*.md'
      - 'supabase/proofs/ai/corpus/**'
      - 'src/contracts/needFactsV2.ts'
      - 'supabase/proofs/pre_v3/closure_runtime.mjs'
      - 'supabase/proofs/pre_v3/history_snapshot.mjs'
      - 'supabase/proofs/ru5_device_ui_local_guard.mjs'
      - 'supabase/proofs/ru5_device_ui_live79_env.sh'
      - 'supabase/proofs/ex04/ts_loader.mjs'
      - 'supabase/proofs/pkg023/pkg023_flow.mjs'
      - 'supabase/proofs/pkg023/pkg023_surface.sql'
      - 'supabase/proofs/policy/publication_fixtures.mjs'
      - '.gitattributes'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ex06b-alias-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/ex06b-private
      EX06B_ARTIFACT_DIR: /tmp/ex06b-artifacts
      EX06_NEED_PATH: product
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Bind exact source, check the generated files, run the offline tests and install locked existing dependencies
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX06B_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$EX06B_ARTIFACT_DIR/source-binding.txt"
          # The PostgreSQL grammar (pglast) parses every generated statement, every function body, both DO bodies and the four guards in CI (it needs no database); --check compares the BYTES (a carriage return is a
          # difference) of the eleven generated files and the manifest; --selftest runs both integrity guards against a model of what each connector sends.
          python3 -m pip install --quiet pglast==8.4
          python3 supabase/proofs/ex06/build_ex06b.py --check --syntax | tee "$EX06B_ARTIFACT_DIR/generated-files.txt"
          python3 supabase/proofs/ex06/build_ex06b.py --selftest | tee "$EX06B_ARTIFACT_DIR/guards-selftest.txt"
          sha256sum supabase/candidates/ex06b_alias_registry.sql supabase/candidates/ex06b_alias_registry_revert.sql supabase/proofs/ex06/ex06b_preflight.readonly.sql supabase/proofs/ex06/ex06b_postflight.readonly.sql supabase/proofs/ex06/s06/ex06b_manifest.json supabase/proofs/ex06/s06/ex06b_work_kinds_v5_dev_body.txt supabase/proofs/ex06/s06/ex06_contract_corpus_v1_1.json supabase/proofs/ex06/ex06b_proof.mjs supabase/proofs/ex06/ex06b_lib.mjs supabase/proofs/ex06/ex06b_passes.mjs supabase/proofs/ai/corpus/ex06_contract_corpus_v1.json | tee "$EX06B_ARTIFACT_DIR/source-manifest-sha256.txt"
          # The proof itself, before the long chain: syntax, then the offline tests (no database, no dependency): the generated files against their rules and each other, the independent model against the
          # SQL, the corpus v1.1 against both classifications and the real S03 loader, the mutation tests, and the pass runner against the simulated backend of the S03 harness.
          for file in supabase/proofs/ex06/ex06b_proof.mjs supabase/proofs/ex06/ex06b_lib.mjs supabase/proofs/ex06/ex06b_passes.mjs; do node --check "$file"; done
          node --test supabase/proofs/ex06/ex06b_lib.test.mjs supabase/proofs/ex06/ex06b_passes.test.mjs | tee "$EX06B_ARTIFACT_DIR/offline-tests.txt"
          dependency_exit=0
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/01-dependencies.log" 2>&1 || dependency_exit=$?
          printf '01-dependencies exit=%s\n' "$dependency_exit" | tee "$EX06B_ARTIFACT_DIR/stages.txt"
          test "$dependency_exit" -eq 0
          git diff --exit-code
      - name: Reconstruct the existing disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          setup_exit=0
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/02-live79.log" 2>&1 || setup_exit=$?
          printf '02-live79 exit=%s\n' "$setup_exit" | tee -a "$EX06B_ARTIFACT_DIR/stages.txt"
          exit "$setup_exit"
      - name: Guard loopback targets and replay the unchanged predecessor stages (source147 to PKG-050)
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          try {
            assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
            if (process.env.DB_URL !== process.env.RU5_DEVICE_DB_URL) throw new Error();
          } catch { console.error('FAIL EX06B_LOCAL_TARGET_ADMISSION'); process.exit(1); }
          NODE
          run_stage() {
            local stage="$1" status=0
            shift
            printf '%s START\n' "$stage" | tee -a "$EX06B_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$EX06B_ARTIFACT_DIR/stages.txt"
            if [ "$status" -ne 0 ]; then { printf '== %s\n' "$stage"; tail -n 15 "$PRE_V3_ARTIFACT_DIR/$stage.log"; } >> "$EX06B_ARTIFACT_DIR/stage-failures.txt"; fi
            return "$status"
          }
          # Exact stage order of chat-voice-b1-dev-application-proof.yml up to PKG-050 (PKG-045a, which created rpc_read_task and rpc_list_my_tasks, is replayed inside stage 18).
          run_stage 03-source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage 04-dev-alpha-to-pkg026 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage 05-pkg027 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage 06-pkg028 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage 07-pkg029 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage 08-pkg030 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage 09-pkg031 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage 10-pkg032 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage 11-pkg033 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage 12-pkg034 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage 13-pkg035 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage 14-pkg037 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage 15-pkg038 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage 16-pkg039 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage 17-pkg040 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage 18-pkg042-to-pkg050 node supabase/proofs/pkg050/pkg050_proof.mjs
      - name: Before, refusals, atomic application, after, data edits, exact revert, reapply (probes, the real S02 corpus v1 and the additive v1.1; actual Auth and PostgREST)
        timeout-minutes: 90
        run: |
          set -euo pipefail
          umask 077
          proof_exit=0
          # The proof signs in about 1,000 Auth accounts (three full v1 passes with their canaries, four small v1.1 passes and the T-031 pass; the S03 run needed 219 per full pass with no 429, the ex06a run about 650).
          # The disposable stack was created by `supabase init` with the CLI's default [auth.rate_limit]: print the limits into the job summary BEFORE the proof, so this run records what GoTrue enforces (the harness
          # retries a 429 with a bounded back-off and reports the retries). The S03 fixtures create a fresh account per requester/worker and retire the workers at the end of a pass, so accounts are not reused.
          config=/tmp/uskoci-ru5-device-ui/supabase/config.toml
          { printf '### Auth rate limits of the disposable stack (%s)\n\n```\n' "$config"; if [ -f "$config" ]; then grep -A12 '^\[auth.rate_limit\]' "$config" || printf 'no [auth.rate_limit] section in the config (GoTrue defaults apply)\n'; else printf 'config.toml not found\n'; fi; printf '```\n\n'; } | tee -a "$EX06B_ARTIFACT_DIR/auth-rate-limits.txt" >> "$GITHUB_STEP_SUMMARY"
          printf '19-ex06b-proof START\n' | tee -a "$EX06B_ARTIFACT_DIR/stages.txt"
          node supabase/proofs/ex06/ex06b_proof.mjs 2>&1 | tee "$PRE_V3_ARTIFACT_DIR/19-ex06b-proof.log" || proof_exit=${PIPESTATUS[0]}
          printf '19-ex06b-proof exit=%s\n' "$proof_exit" | tee -a "$EX06B_ARTIFACT_DIR/stages.txt"
          cp "$PRE_V3_ARTIFACT_DIR/ex06b-report.json" "$EX06B_ARTIFACT_DIR/ex06b-report.json" || true
          tail -n 80 "$PRE_V3_ARTIFACT_DIR/19-ex06b-proof.log" > "$EX06B_ARTIFACT_DIR/proof-tail.txt" || true
          # A green step is not evidence by itself: the PASS lines and the RESULT of the report head the summary. The label says what the run is: a disposable chain, NOT canonical DEV.
          {
            echo '### EX-06 ex06b result (disposable chain, NOT canonical DEV)'
            echo
            echo '```'
            grep -h '^PASS ' "$PRE_V3_ARTIFACT_DIR/19-ex06b-proof.log" || echo 'no PASS line: the proof did not get that far'
            node -e "try{const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));console.log('RESULT '+r.result+' | chain '+r.chainFidelityVerdict+' | S03 pin gate '+(r.s03PinGate?.label??'n/a')+' | probes '+(r.probes?.generated??'n/a')+'+'+(r.probes?.intent??'n/a')+' differing '+(r.probeDifferences?.total??'n/a')+' | v1 flips matched '+(r.corpusFlips?.matched??'n/a')+' unintended '+(r.corpusFlips?.unintended?.length??'n/a')+' missing '+(r.corpusFlips?.missing?.length??'n/a')+' | v1.1 fail-before findings '+(r.v11FailBefore?.length??'n/a')+' | rows added '+(r.rowsAdded?.length??'n/a')+' | detail problems '+(r.corpusDetailProblems?.length??'n/a'))}catch{console.log('RESULT no report')}" "$PRE_V3_ARTIFACT_DIR/ex06b-report.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$proof_exit"
      - name: Always discard the disposable database
        if: always()
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX06B_ARTIFACT_DIR"
          teardown_exit=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || teardown_exit=$?
          fi
          printf 'teardown exit=%s\n' "$teardown_exit" | tee -a "$EX06B_ARTIFACT_DIR/stages.txt"
          exit "$teardown_exit"
      - name: Upload only bounded source and result summaries including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ex06b-alias-registry-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/ex06b-artifacts/source-binding.txt
            /tmp/ex06b-artifacts/source-manifest-sha256.txt
            /tmp/ex06b-artifacts/generated-files.txt
            /tmp/ex06b-artifacts/guards-selftest.txt
            /tmp/ex06b-artifacts/offline-tests.txt
            /tmp/ex06b-artifacts/proof-tail.txt
            /tmp/ex06b-artifacts/stages.txt
            /tmp/ex06b-artifacts/stage-failures.txt
            /tmp/ex06b-artifacts/auth-rate-limits.txt
            /tmp/ex06b-artifacts/ex06b-report.json
          if-no-files-found: error
          retention-days: 30
