name: EX-06 ex06c F10 disposable behavioral proof
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/ex06c-f10-disposable-proof.yml'
      - 'supabase/candidates/ex06c_f10_closed_search_dispatch.sql'
      - 'supabase/candidates/ex06c_f10_closed_search_dispatch_revert.sql'
      - 'supabase/proofs/ex06/ex06c_f10_postflight.readonly.sql'
      - 'supabase/proofs/ex06/ex06c_f10_static.test.mjs'
      - 'supabase/proofs/ex06/ex06_s04_proof.mjs'
      - 'supabase/proofs/ex06/s04/**'
      - 'supabase/proofs/ex06/lib/**'
      - 'supabase/candidates/ex06a_flexible_window.sql'
      - 'supabase/proofs/pre_v3/closure_runtime.mjs'
      - 'supabase/proofs/ru5_device_ui_local_guard.mjs'
      - 'supabase/proofs/ru5_device_ui_live79_env.sh'
      - '.gitattributes'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ex06c-f10-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/ex06c-f10-private
      F10_ARTIFACT_DIR: /tmp/ex06c-f10-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}

      - name: Bind exact source and run static package gate
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$F10_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$F10_ARTIFACT_DIR/source-binding.txt"
          sha256sum \
            supabase/candidates/ex06c_f10_closed_search_dispatch.sql \
            supabase/candidates/ex06c_f10_closed_search_dispatch_revert.sql \
            supabase/proofs/ex06/ex06c_f10_postflight.readonly.sql \
            supabase/proofs/ex06/ex06c_f10_static.test.mjs \
            supabase/proofs/ex06/ex06_s04_proof.mjs \
            supabase/proofs/ex06/s04/lib/cases.mjs \
            supabase/proofs/ex06/s04/lib/scenarios.mjs \
            > "$F10_ARTIFACT_DIR/source-manifest-sha256.txt"
          node --check supabase/proofs/ex06/ex06c_f10_static.test.mjs
          node --test supabase/proofs/ex06/ex06c_f10_static.test.mjs | tee "$F10_ARTIFACT_DIR/static-tests.txt"
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/01-dependencies.log" 2>&1
          git diff --exit-code

      - name: Reconstruct disposable DEV-equivalent predecessor chain
        run: |
          set -euo pipefail
          umask 077
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/02-live79.log" 2>&1
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
          if (process.env.DB_URL !== process.env.RU5_DEVICE_DB_URL) throw new Error('F10_DB_URL_NOT_LOOPBACK_PROOF');
          NODE
          run_stage() {
            local stage="$1"; shift
            printf '%s START\n' "$stage" | tee -a "$F10_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1
            printf '%s exit=0\n' "$stage" | tee -a "$F10_ARTIFACT_DIR/stages.txt"
          }
          run_stage 03-source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage 04-dev-alpha-to-pkg026 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage 05-pkg027 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage 06-pkg028 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage 07-pkg029 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage 08-pkg030 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage 09-pkg031 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage 10-pkg032 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage 11-pkg033 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage 12-pkg034 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage 13-pkg035 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage 14-pkg037 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage 15-pkg038 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage 16-pkg039 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage 17-pkg040 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage 18-pkg042-to-pkg050 node supabase/proofs/pkg050/pkg050_proof.mjs
          run_stage 19-ex06a psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/candidates/ex06a_flexible_window.sql

      - name: Reproduce F10, prove candidate, exact revert and reapply
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$F10_ARTIFACT_DIR/before" "$F10_ARTIFACT_DIR/after" "$F10_ARTIFACT_DIR/revert"

          EX06_S04_ONLY=search EX06_ARTIFACT_DIR="$F10_ARTIFACT_DIR/before" \
            node supabase/proofs/ex06/ex06_s04_proof.mjs > "$F10_ARTIFACT_DIR/before.log" 2>&1
          cp "$F10_ARTIFACT_DIR/before/ex06-s04-report.json" "$F10_ARTIFACT_DIR/before-report.json"

          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 \
            -f supabase/candidates/ex06c_f10_closed_search_dispatch.sql \
            > "$F10_ARTIFACT_DIR/apply.log" 2>&1

          if psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 \
              -f supabase/candidates/ex06c_f10_closed_search_dispatch.sql \
              > "$F10_ARTIFACT_DIR/double-apply.log" 2>&1; then
            echo 'F10_DOUBLE_APPLY_WAS_NOT_REFUSED' >&2
            exit 1
          fi
          grep -q 'EX06C_F10_ALREADY_APPLIED' "$F10_ARTIFACT_DIR/double-apply.log"

          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 \
            -f supabase/proofs/ex06/ex06c_f10_postflight.readonly.sql \
            > "$F10_ARTIFACT_DIR/postflight-after.json"

          set +e
          EX06_S04_ONLY=search EX06_S04_PINS=report EX06_ARTIFACT_DIR="$F10_ARTIFACT_DIR/after" \
            node supabase/proofs/ex06/ex06_s04_proof.mjs > "$F10_ARTIFACT_DIR/after.log" 2>&1
          after_exit=$?
          set -e
          printf '%s\n' "$after_exit" > "$F10_ARTIFACT_DIR/after-exit.txt"
          cp "$F10_ARTIFACT_DIR/after/ex06-s04-report.json" "$F10_ARTIFACT_DIR/after-report.json"

          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 \
            -f supabase/candidates/ex06c_f10_closed_search_dispatch_revert.sql \
            > "$F10_ARTIFACT_DIR/revert.log" 2>&1

          EX06_S04_ONLY=search EX06_ARTIFACT_DIR="$F10_ARTIFACT_DIR/revert" \
            node supabase/proofs/ex06/ex06_s04_proof.mjs > "$F10_ARTIFACT_DIR/revert-proof.log" 2>&1
          cp "$F10_ARTIFACT_DIR/revert/ex06-s04-report.json" "$F10_ARTIFACT_DIR/revert-report.json"

          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 \
            -f supabase/candidates/ex06c_f10_closed_search_dispatch.sql \
            > "$F10_ARTIFACT_DIR/reapply.log" 2>&1
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 \
            -f supabase/proofs/ex06/ex06c_f10_postflight.readonly.sql \
            > "$F10_ARTIFACT_DIR/postflight-reapply.json"
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 \
            -f supabase/candidates/ex06c_f10_closed_search_dispatch_revert.sql \
            > "$F10_ARTIFACT_DIR/final-revert.log" 2>&1
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "
            select jsonb_build_object(
              'wave',md5(replace((select prosrc from pg_proc where oid=to_regprocedure('private.dispatch_next_wave(uuid)')),E'\\r','')),
              'tick',md5(replace((select prosrc from pg_proc where oid=to_regprocedure('private.dispatch_tick(integer,timestamptz)')),E'\\r','')),
              'digest',private.closure_source_digest_v5(),
              'certified',(select sha256 from private.closure_source_v5 where singleton),
              'ready',private.retention_ai_source_ready()
            );" > "$F10_ARTIFACT_DIR/final-state.json"

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const root=process.env.F10_ARTIFACT_DIR;
          const load=n=>JSON.parse(fs.readFileSync(root+'/'+n,'utf8'));
          const c=(report,id)=>report.cases.find(x=>x.id===id);
          const row=(item,field)=>item.rows.find(x=>x.field===field);

          const before=load('before-report.json'), after=load('after-report.json'), reverted=load('revert-report.json');
          const b=c(before,'T04b'), a=c(after,'T04b'), r=c(reverted,'T04b');

          assert.equal(before.harnessErrors.length,0);
          assert.equal(before.scenarios.find(x=>x.id==='search').status,'OK');
          assert.equal(b.verdict,'FINDING');
          assert.equal(row(b,'the tick that followed did not fail').actual,1);
          assert.equal(row(b,'the schedule row is not in ERROR').actual,false);
          assert.equal(row(b,'a later tick does not fail either').actual,1);

          assert.equal(after.harnessErrors.length,0);
          assert.equal(after.scenarios.find(x=>x.id==='search').status,'OK');
          assert.equal(a.verdict,'PASS');
          assert.ok(a.rows.every(x=>x.ok===true));
          assert.deepEqual([...after.chain.fatal].sort(),['private.dispatch_next_wave','private.dispatch_tick']);
          const wavePin=after.chain.rows.find(x=>x.name==='private.dispatch_next_wave');
          const tickPin=after.chain.rows.find(x=>x.name==='private.dispatch_tick');
          assert.equal(wavePin.actual,'3cc3af3cdbafbfbc51a491ac2ce6581d');
          assert.equal(tickPin.actual,'1600e4e3402d59c3ada13e3226a467c1');
          assert.equal(after.certificate.unchanged,true);
          assert.equal(after.catalogUnchanged,true);

          for (const n of ['postflight-after.json','postflight-reapply.json']) {
            const p=load(n);
            assert.deepEqual(p.problems,[]);
            assert.equal(p.waveMd5,'3cc3af3cdbafbfbc51a491ac2ce6581d');
            assert.equal(p.tickMd5,'1600e4e3402d59c3ada13e3226a467c1');
            assert.equal(p.closureDigest,p.certifiedDigest);
            assert.equal(p.retentionReady,true);
          }

          assert.equal(reverted.harnessErrors.length,0);
          assert.equal(reverted.scenarios.find(x=>x.id==='search').status,'OK');
          assert.equal(r.verdict,'FINDING');
          assert.equal(row(r,'the tick that followed did not fail').actual,1);
          assert.equal(row(r,'the schedule row is not in ERROR').actual,false);
          assert.equal(row(r,'a later tick does not fail either').actual,1);
          assert.equal(reverted.chain.fatal.length,0);

          const final=load('final-state.json');
          assert.equal(final.wave,'1fd8c51ef026ece24471e2f68250ecc5');
          assert.equal(final.tick,'e568b033b9457736869fc5829ffc5511');
          assert.equal(final.digest,final.certified);
          assert.equal(final.ready,true);

          fs.writeFileSync(root+'/verdict.txt',
            'PASS F10 reproduced -> candidate closes loop -> exact revert reproduces -> reapply exact -> final revert exact\n');
          console.log('PASS EX06C_F10_DISPOSABLE_BEHAVIORAL_PROOF');
          NODE

      - name: Always discard disposable database
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$F10_ARTIFACT_DIR"
          teardown_exit=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || teardown_exit=$?
          fi
          printf 'teardown exit=%s\n' "$teardown_exit" | tee "$F10_ARTIFACT_DIR/teardown.txt"
          exit "$teardown_exit"

      - name: Upload bounded proof artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ex06c-f10-proof-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/ex06c-f10-artifacts/source-binding.txt
            /tmp/ex06c-f10-artifacts/source-manifest-sha256.txt
            /tmp/ex06c-f10-artifacts/static-tests.txt
            /tmp/ex06c-f10-artifacts/stages.txt
            /tmp/ex06c-f10-artifacts/before-report.json
            /tmp/ex06c-f10-artifacts/after-report.json
            /tmp/ex06c-f10-artifacts/revert-report.json
            /tmp/ex06c-f10-artifacts/postflight-after.json
            /tmp/ex06c-f10-artifacts/postflight-reapply.json
            /tmp/ex06c-f10-artifacts/final-state.json
            /tmp/ex06c-f10-artifacts/after-exit.txt
            /tmp/ex06c-f10-artifacts/double-apply.log
            /tmp/ex06c-f10-artifacts/verdict.txt
            /tmp/ex06c-f10-artifacts/teardown.txt
          if-no-files-found: warn
          retention-days: 30
