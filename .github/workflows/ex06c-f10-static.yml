name: EX-06 ex06c F10 static package check
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/ex06c-f10-static.yml'
      - 'supabase/candidates/ex06c_f10_closed_search_dispatch.sql'
      - 'supabase/candidates/ex06c_f10_closed_search_dispatch_revert.sql'
      - 'supabase/proofs/ex06/ex06c_f10_postflight.readonly.sql'
      - 'supabase/proofs/ex06/ex06c_f10_static.test.mjs'
      - 'supabase/proofs/ex06/README_EX06C_F10.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate exact source package only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          node --check supabase/proofs/ex06/ex06c_f10_static.test.mjs
          node --test supabase/proofs/ex06/ex06c_f10_static.test.mjs
          git diff --exit-code
