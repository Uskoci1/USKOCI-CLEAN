name: EX-06 ex06d F5 static package check
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/ex06d-f5-static.yml'
      - 'supabase/candidates/ex06d_f5_already_applied_admission.sql'
      - 'supabase/candidates/ex06d_f5_already_applied_admission_revert.sql'
      - 'supabase/proofs/ex06/ex06d_f5_postflight.readonly.sql'
      - 'supabase/proofs/ex06/ex06d_f5_static.test.mjs'
      - 'supabase/proofs/ex06/README_EX06D_F5.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check supabase/proofs/ex06/ex06d_f5_static.test.mjs
          node --test supabase/proofs/ex06/ex06d_f5_static.test.mjs
          git diff --exit-code
