name: EX-06E client lifecycle integration proof
# Exact current-branch source proof; no DEV, provider or phone mutation.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/ex06e-client-integration-proof.yml'
      - 'src/contracts/needSearchRecovery.ts'
      - 'src/data/needSearchRecoveryContract.ts'
      - 'src/data/needSearchRecoveryClientService.ts'
      - 'src/ui/needs/NeedSearchRecoveryController.ts'
      - 'src/ui/needs/NeedSearchRecoverySection.tsx'
      - 'src/ui/needs/needSearchRecoveryCopy.ts'
      - 'src/ui/v2/NeedPresentation.tsx'
      - 'src/app/(app)/potrebe/[id]/pregled.tsx'
      - 'src/data/__tests__/need-search-recovery-contract.test.ts'
      - 'src/data/__tests__/need-search-recovery-controller.test.ts'
      - 'src/data/__tests__/pkg011-slice4-presentation.test.tsx'
      - 'src/data/__tests__/pkg004-lifecycle-wiring.test.ts'
      - 'src/data/__tests__/pkg004-remaining-search.test.ts'
      - 'src/data/__tests__/pkg004-close-attempt.test.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ex06e-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Bind exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD 'HEAD^{tree}' | tee /tmp/ex06e-client-source.txt
          git diff --exit-code
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Focused lifecycle client regressions
        run: >-
          npm test -- --runInBand
          src/data/__tests__/need-search-recovery-contract.test.ts
          src/data/__tests__/need-search-recovery-controller.test.ts
          src/data/__tests__/pkg004-lifecycle-wiring.test.ts
          src/data/__tests__/pkg004-remaining-search.test.ts
          src/data/__tests__/pkg004-close-attempt.test.ts
          src/data/__tests__/pkg011-slice4-presentation.test.tsx
      - name: Full regression
        run: npm test -- --runInBand
      - name: Receipt
        if: always()
        run: |
          mkdir -p /tmp/ex06e-client-proof
          cp /tmp/ex06e-client-source.txt /tmp/ex06e-client-proof/source.txt || true
          printf '{"sourceSha":"%s","treeSha":"%s","serverDevChanged":false,"phoneTouched":false,"providerCalled":false}\n'             "$GITHUB_SHA" "$(git rev-parse 'HEAD^{tree}')" > /tmp/ex06e-client-proof/receipt.json
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ex06e-client-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/ex06e-client-proof
          retention-days: 30
