name: EX-06E lifecycle recovery disposable proof
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/ex06e-lifecycle-recovery-proof.yml'
      - 'supabase/candidates/ex06e_lifecycle_recovery.sql'
      - 'supabase/candidates/ex06e_lifecycle_recovery_revert.sql'
      - 'supabase/proofs/ex06/ex06e_lifecycle_recovery_proof.mjs'
      - 'supabase/proofs/ex06/ex06e_lifecycle_recovery_static.test.mjs'
      - 'supabase/proofs/ex06/lib/**'
      - 'supabase/candidates/ex06a_flexible_window.sql'
      - 'supabase/proofs/pre_v3/closure_runtime.mjs'
      - 'supabase/proofs/ru5_device_ui_local_guard.mjs'
      - 'supabase/proofs/ru5_device_ui_live79_env.sh'
      - '.gitattributes'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ex06e-lifecycle-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/ex06e-private
      EX06E_ARTIFACT_DIR: /tmp/ex06e-artifacts
      EX06_NEED_PATH: product
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}

      - name: Bind exact source and run static gates
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX06E_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$EX06E_ARTIFACT_DIR/source-binding.txt"
          sha256sum             supabase/candidates/ex06e_lifecycle_recovery.sql             supabase/candidates/ex06e_lifecycle_recovery_revert.sql             supabase/proofs/ex06/ex06e_lifecycle_recovery_proof.mjs             supabase/proofs/ex06/ex06e_lifecycle_recovery_static.test.mjs             > "$EX06E_ARTIFACT_DIR/source-manifest-sha256.txt"
          node --check supabase/proofs/ex06/ex06e_lifecycle_recovery_proof.mjs
          node --check supabase/proofs/ex06/ex06e_lifecycle_recovery_static.test.mjs
          node --test supabase/proofs/ex06/ex06e_lifecycle_recovery_static.test.mjs | tee "$EX06E_ARTIFACT_DIR/static-tests.txt"
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/01-dependencies.log" 2>&1
          git diff --exit-code

      - name: Reconstruct disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          setup_exit=0
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/02-live79.log" 2>&1 || setup_exit=$?

          printf '02-live79 exit=%s\n' "$setup_exit" | tee -a "$EX06E_ARTIFACT_DIR/stages.txt"
          exit "$setup_exit"

      - name: Guard loopback and replay DEV-equivalent predecessor
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
          if (process.env.DB_URL !== process.env.RU5_DEVICE_DB_URL) throw new Error('EX06E_DB_URL_NOT_LOOPBACK');
          NODE
          run_stage() {
            local stage="$1"; shift
            printf '%s START\n' "$stage" | tee -a "$EX06E_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1
            printf '%s exit=0\n' "$stage" | tee -a "$EX06E_ARTIFACT_DIR/stages.txt"
          }
          run_stage 03-source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage 04-dev-alpha-to-pkg026 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage 05-pkg027 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage 06-pkg028 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage 07-pkg029 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage 08-pkg030 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage 09-pkg031 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage 10-pkg032 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage 11-pkg033 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage 12-pkg034 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage 13-pkg035 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage 14-pkg037 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage 15-pkg038 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage 16-pkg039 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage 17-pkg040 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage 18-pkg042-to-pkg050 node supabase/proofs/pkg050/pkg050_proof.mjs
          run_stage 19-ex06a psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/candidates/ex06a_flexible_window.sql

      - name: Apply candidate to disposable chain and run lifecycle proof
        run: |
          set -euo pipefail
          umask 077
          if ! psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/candidates/ex06e_lifecycle_recovery.sql > "$EX06E_ARTIFACT_DIR/apply.log" 2>&1; then
            cat "$EX06E_ARTIFACT_DIR/apply.log"
            exit 1
          fi
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "
            select jsonb_build_object(
              'wave',md5(replace((select prosrc from pg_proc where oid=to_regprocedure('private.dispatch_next_wave(uuid)')),E'\r','')),
              'tick',md5(replace((select prosrc from pg_proc where oid=to_regprocedure('private.dispatch_tick(integer,timestamptz)')),E'\r','')),
              'guard',md5(replace((select prosrc from pg_proc where oid=to_regprocedure('private.guard_remaining_search_close_fields()')),E'\r','')),
              'cancel',md5(replace((select prosrc from pg_proc where oid=to_regprocedure('public.rpc_cancel_agreement(uuid,text)')),E'\r','')),
              'timeHelper',md5(replace((select prosrc from pg_proc where oid=to_regprocedure('private.need_search_time_admitted_v1(uuid,timestamptz)')),E'\r','')),
              'reopen',md5(replace((select prosrc from pg_proc where oid=to_regprocedure('public.rpc_reopen_remaining_search(uuid,integer,text,text)')),E'\r','')),
              'digest',private.closure_source_digest_v5(),
              'certified',(select sha256 from private.closure_source_v5 where singleton),
              'ready',private.retention_ai_source_ready()
            );" > "$EX06E_ARTIFACT_DIR/applied-state.json"
          node supabase/proofs/ex06/ex06e_lifecycle_recovery_proof.mjs | tee "$EX06E_ARTIFACT_DIR/proof-console.txt"

      - name: Exact revert on disposable chain
        run: |
          set -euo pipefail
          umask 077
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/candidates/ex06e_lifecycle_recovery_revert.sql > "$EX06E_ARTIFACT_DIR/revert.log" 2>&1
          psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 -c "
            select jsonb_build_object(
              'wave',md5(replace((select prosrc from pg_proc where oid=to_regprocedure('private.dispatch_next_wave(uuid)')),E'\r','')),
              'tick',md5(replace((select prosrc from pg_proc where oid=to_regprocedure('private.dispatch_tick(integer,timestamptz)')),E'\r','')),
              'guard',md5(replace((select prosrc from pg_proc where oid=to_regprocedure('private.guard_remaining_search_close_fields()')),E'\r','')),
              'cancel',md5(replace((select prosrc from pg_proc where oid=to_regprocedure('public.rpc_cancel_agreement(uuid,text)')),E'\r','')),
              'timeHelperGone',to_regprocedure('private.need_search_time_admitted_v1(uuid,timestamptz)') is null,
              'reopenGone',to_regprocedure('public.rpc_reopen_remaining_search(uuid,integer,text,text)') is null,
              'digest',private.closure_source_digest_v5(),
              'certified',(select sha256 from private.closure_source_v5 where singleton),
              'ready',private.retention_ai_source_ready()
            );" > "$EX06E_ARTIFACT_DIR/reverted-state.json"

      - name: Judge proof and revert
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const root=process.env.EX06E_ARTIFACT_DIR;
          const load=n=>JSON.parse(fs.readFileSync(root+'/'+n,'utf8'));
          const report=load('ex06e-lifecycle-recovery-report.json');
          assert.equal(report.result,'PASS');
          assert.equal(report.scenarios.length,9);
          assert.ok(report.scenarios.every(x=>x.status==='PASS'));
          assert.equal(report.certificate.unchanged,true);
          assert.equal(report.catalog.unchanged,true);
          const applied=load('applied-state.json');
          assert.equal(applied.wave,'c37d672ccaf44e86b5e83b117156cdb8');
          assert.equal(applied.tick,'8798cb6b6f004ecd5d88dd472cd6de0b');
          assert.equal(applied.guard,'ce59ad1cdee98518950e289aa5c329a4');
          assert.equal(applied.cancel,'478ce82cafaf93f8e2b7f2d8ad0f3bbb'); assert.equal(applied.digest,applied.certified); assert.equal(applied.ready,true);
          const reverted=load('reverted-state.json');
          assert.equal(reverted.wave,'1fd8c51ef026ece24471e2f68250ecc5');
          assert.equal(reverted.tick,'e568b033b9457736869fc5829ffc5511');
          assert.equal(reverted.guard,'ce59ad1cdee98518950e289aa5c329a4');
          assert.equal(reverted.cancel,'f3ca4d5f8bdf324d5773d887d0a2d093');
          assert.equal(reverted.timeHelperGone,true);assert.equal(reverted.reopenGone,true);
          assert.equal(reverted.digest,reverted.certified);assert.equal(reverted.ready,true);
          fs.writeFileSync(root+'/verdict.txt','PASS EX06E lifecycle recovery + exact revert\n');
          console.log('PASS EX06E_LIFECYCLE_RECOVERY_AND_REVERT');
          NODE

      - name: Always discard disposable database
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX06E_ARTIFACT_DIR"
          teardown_exit=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || teardown_exit=$?
          fi
          printf 'teardown exit=%s\n' "$teardown_exit" | tee "$EX06E_ARTIFACT_DIR/teardown.txt"
          exit "$teardown_exit"

      - name: Upload bounded proof artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ex06e-lifecycle-recovery-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/ex06e-artifacts/source-binding.txt
            /tmp/ex06e-artifacts/source-manifest-sha256.txt
            /tmp/ex06e-artifacts/static-tests.txt
            /tmp/ex06e-artifacts/stages.txt
            /tmp/ex06e-artifacts/apply.log
            /tmp/ex06e-artifacts/applied-state.json
            /tmp/ex06e-artifacts/ex06e-lifecycle-recovery-report.json
            /tmp/ex06e-artifacts/proof-console.txt
            /tmp/ex06e-artifacts/reverted-state.json
            /tmp/ex06e-artifacts/verdict.txt
            /tmp/ex06e-artifacts/teardown.txt
          if-no-files-found: warn
          retention-days: 30
