name: EX-06E R2 reopen and time hardening
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/ex06e-r2-hardening-proof.yml'
      - 'supabase/proofs/ex06/r2/**'
      - '!supabase/proofs/ex06/r2/*.md'
      - 'supabase/candidates/ex06e_lifecycle_recovery*.sql'
      - 'supabase/proofs/ex06/ex06e_lifecycle_recovery_proof.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ex06e-r2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/ex06e-r2-private
      EX06E_R2_DIR: /tmp/ex06e-r2
      EX06E_ARTIFACT_DIR: /tmp/ex06e-r2/behavior
      EX06_NEED_PATH: product
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Bind source and verify deterministic generation
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX06E_R2_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$EX06E_R2_DIR/source-binding.txt"
          sha256sum supabase/proofs/ex06/r2/* .github/workflows/ex06e-r2-hardening-proof.yml > "$EX06E_R2_DIR/source-manifest.txt"
          node --check supabase/proofs/ex06/r2/run.mjs
          node --check supabase/proofs/ex06/r2/baseline.mjs
          node --test supabase/proofs/ex06/ex06e_lifecycle_recovery_static.test.mjs supabase/proofs/ex06/ex06e_mutation_verifier.test.mjs supabase/proofs/ex06/r2/build.test.mjs | tee "$EX06E_R2_DIR/offline-tests.txt"
          node supabase/proofs/ex06/r2/build.mjs
          node --check supabase/proofs/ex06/ex06e_r2_generated_proof.mjs
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/npm.log" 2>&1
          git diff --exit-code
      - name: Reconstruct disposable live79
        run: |
          set -euo pipefail
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/live79.log" 2>&1
      - name: Replay existing predecessor chain
        run: node supabase/proofs/ex06/r2/run.mjs replay
      - name: Prove before after drift refusal revert and reapply
        run: node supabase/proofs/ex06/r2/run.mjs prove
      - name: Always discard disposable database
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EX06E_R2_DIR" "$PRE_V3_ARTIFACT_DIR"
          code=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || code=$?
          fi
          printf 'teardown exit=%s\n' "$code" > "$EX06E_R2_DIR/teardown.txt"
          exit "$code"
      - name: Preserve bounded proof and generated SQL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ex06e-r2-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/ex06e-r2
          if-no-files-found: warn
          retention-days: 30
