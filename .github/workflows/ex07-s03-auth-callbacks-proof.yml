name: EX-07 S03 auth callbacks proof
# EX-07 slice S03 (gap G05 of docs/implementation/product-v1-closure-20260926/finalization-20260927/EX07_CANONICAL_SCOPE_20261001.md):
# the signup-confirmation redirect and the recovery callback, proved on a DISPOSABLE chain. Report every result as
# "DISPOSABLE EMULATOR evidence" with the exact head and run id; it is NEVER real-provider evidence (the hosted Auth dashboard, its
# allowlist, its sender, real e-mail delivery), NEVER physical-handset evidence and NEVER iOS evidence. Nothing here touches DEV or
# production; no secret and no new dependency is used (the demo key below is the Supabase CLI's public local-development constant).
#
# JOBS
#   offline-logic          the pure logic of the proof (python unittest, no network, no device) and the app-side routing/label contract
#                          (jest: the REAL Expo Router and the REAL recovery parser).
#   provider-http-proof    disposable GoTrue + Mailpit with e-mail CONFIRMATIONS ON and both redirects allowlisted: signup -> message ->
#                          link -> callback shape, used / wrong / expired link, resend limit, redirect allowlist, recovery chain,
#                          session rule. HTTP only: no app, no device.
#   native-apk             builds the x86_64 proof APK (package rs.uskoci.ex07s03proof) of this exact source, bound to 10.0.2.2:54321.
#   native-emulator-proof  the real app on a disposable Android emulator against that stack: UI sign-up and resend, the confirmation
#                          callback warm and cold, error callbacks, another account signed in, old callbacks, UI recovery; logcat and
#                          the app private storage are searched for every callback credential.
#   evidence               merges the reports into ex07-s03-evidence.json (exact head, run id, label, per-assertion table).
#
# TRIGGERS. Only this workflow and the proof folder start it (the documentation under it does not). A re-run without a code change:
# change supabase/proofs/ex07/s03/run_marker.txt, or use "Re-run failed jobs" (the APK of the same run is kept for the emulator job).
# workflow_dispatch needs this file on the default branch; on the working branch the push trigger is the way in.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/ex07-s03-auth-callbacks-proof.yml'
      - 'supabase/proofs/ex07/s03/**'
      - '!supabase/proofs/ex07/s03/*.md'
  workflow_dispatch:
    inputs:
      scope:
        description: 'which part runs (all; provider-only = no APK and no emulator; native-only = no HTTP-level job)'
        type: choice
        required: true
        default: all
        options:
          - all
          - provider-only
          - native-only
      apk_variant:
        description: 'APK recipe: release (the p6-native-apk recipe) or debug (the W01 recipe, JS bundled)'
        type: choice
        required: true
        default: release
        options:
          - release
          - debug
permissions:
  contents: read
  actions: read
concurrency:
  group: ex07-s03-auth-callbacks-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
jobs:
  offline-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Offline unit tests of the proof logic (a model of GoTrue and of the app; no network, no device)
        run: python3 -m unittest discover -s supabase/proofs/ex07/s03 -p 'test_*.py'
      - name: App-side routing and label contract (real Expo Router, real recovery parser)
        run: npx jest -w 2 --testTimeout=60000 --runTestsByPath src/data/__tests__/ex07-auth-callback-routing.test.ts
      - name: Shell scripts parse
        run: |
          set -euo pipefail
          for script in supabase/proofs/ex07/s03/*.sh; do bash -n "$script"; done

  provider-http-proof:
    if: ${{ inputs.scope != 'native-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Disposable Auth only (confirmations ON, both app redirects allowlisted), no live project, no marketplace replay
        run: bash supabase/proofs/ex07/s03/ex07_s03_env.sh artifacts/ex07-s03-provider
      - name: HTTP-level proof against the disposable GoTrue and Mailpit
        env:
          EX07_OUT: artifacts/ex07-s03-provider
        run: python3 supabase/proofs/ex07/s03/s03_provider_proof.py
      - name: Retain the sanitized report (no credential, no mailbox content)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EX07-S03-PROVIDER-${{ github.run_id }}
          path: artifacts/ex07-s03-provider/
          if-no-files-found: warn
          retention-days: 30
      - name: Teardown only this newly created disposable instance
        if: always()
        shell: bash
        run: |
          if [[ "${EX07_PROOF_DIR:-}" == /tmp/uskoci-ex07-s03-* && -d "${EX07_PROOF_DIR:-}" ]]; then
            cd "$EX07_PROOF_DIR"
            supabase stop --no-backup >/dev/null
          fi

  native-apk:
    if: ${{ inputs.scope != 'provider-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The well-known local-development demo keys of the Supabase CLI stack (public constants, not secrets).
      # The emulator job refuses to run if the live stack reports a different anon key.
      EXPO_PUBLIC_SUPABASE_URL: http://10.0.2.2:54321
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      EXPO_PUBLIC_USE_FAKE_SOURCE: '0'
      EXPO_PUBLIC_AUTH_RECOVERY_REDIRECT_URL: uskociapp://oporavak
      EX07_S03_APK_VARIANT: ${{ inputs.apk_variant || 'release' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locked dependencies (npm ci runs patch-package)
        run: npm ci
      - name: Verify the Reanimated patch before any native code is generated
        run: node scripts/verify-native-patches.cjs
      - name: Build the separately identified x86_64 proof APK of this exact source
        run: bash supabase/proofs/ex07/s03/ex07_s03_build_apk.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ex07-s03-apk
          path: |
            /tmp/ex07-s03-apk/USKOCI-EX07-S03-x86_64.apk
            /tmp/ex07-s03-apk/USKOCI-EX07-S03-x86_64.apk.sha256
            /tmp/ex07-s03-apk/apk-source.txt
            /tmp/ex07-s03-apk/badging.txt
            /tmp/ex07-s03-apk/debuggable.txt
            /tmp/ex07-s03-apk/variant.txt
            /tmp/ex07-s03-apk/abi.txt
          if-no-files-found: error
          retention-days: 7

  native-emulator-proof:
    needs: native-apk
    if: ${{ inputs.scope != 'provider-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      EX07_S03_ALLOW_CLEAR: '1'
      EX07_S03_APK: /tmp/ex07-s03-apk/USKOCI-EX07-S03-x86_64.apk
      EX07_OUT: artifacts/ex07-s03-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Download and verify the proof APK built by this run
        run: |
          set -euo pipefail
          mkdir -p /tmp/ex07-s03-apk
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n ex07-s03-apk -D /tmp/ex07-s03-apk
          (cd /tmp/ex07-s03-apk && sha256sum -c USKOCI-EX07-S03-x86_64.apk.sha256)
          grep -F "package: name='rs.uskoci.ex07s03proof'" /tmp/ex07-s03-apk/badging.txt
          apk_source="$(tr -d '[:space:]' < /tmp/ex07-s03-apk/apk-source.txt)"
          test "$apk_source" = "$(git rev-parse HEAD)"
          echo "EX07_S03_APK_SOURCE=$apk_source" >> "$GITHUB_ENV"
          echo "PASS EX07_S03_APK_BOUND source=$apk_source variant=$(cat /tmp/ex07-s03-apk/variant.txt) debuggable=$(cat /tmp/ex07-s03-apk/debuggable.txt)"
      - name: Disposable Auth only (confirmations ON, both app redirects allowlisted), no live project, no marketplace replay
        run: bash supabase/proofs/ex07/s03/ex07_s03_env.sh artifacts/ex07-s03-native
      - name: Bind the APK to this stack (the public demo key compiled into the APK must be the stack key)
        run: |
          set -euo pipefail
          expected='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0'
          if [[ "$EX07_ANON_KEY" != "$expected" ]]; then
            echo "The live stack anon key differs from the key compiled into the APK (length ${#EX07_ANON_KEY})."
            exit 1
          fi
          echo "PASS EX07_S03_KEY_BOUND stack anon key equals the APK key"
      - name: Enable KVM for the Android emulator when available
        run: |
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; echo "KVM_AVAILABLE=1"; else echo "KVM_AVAILABLE=0"; fi
      - name: Native proof on a disposable emulator (UI sign-up and recovery, callbacks warm and cold, other account, old callbacks)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash supabase/proofs/ex07/s03/ex07_s03_run_native.sh
      - name: Retain the sanitized native proof (never the logcat, never the APK, never an Auth log)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EX07-S03-NATIVE-${{ github.run_id }}
          path: |
            artifacts/ex07-s03-native/
            !artifacts/ex07-s03-native/*.private.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Teardown only this newly created disposable instance
        if: always()
        shell: bash
        run: |
          if [[ "${EX07_PROOF_DIR:-}" == /tmp/uskoci-ex07-s03-* && -d "${EX07_PROOF_DIR:-}" ]]; then
            cd "$EX07_PROOF_DIR"
            supabase stop --no-backup >/dev/null
          fi

  evidence:
    needs: [offline-logic, provider-http-proof, native-apk, native-emulator-proof]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EX07_JOB_RESULTS: '{"offline-logic":"${{ needs.offline-logic.result }}","provider-http-proof":"${{ needs.provider-http-proof.result }}","native-apk":"${{ needs.native-apk.result }}","native-emulator-proof":"${{ needs.native-emulator-proof.result }}"}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch the per-job reports of THIS run
        run: |
          mkdir -p artifacts/ex07-s03-in/provider artifacts/ex07-s03-in/native
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "EX07-S03-PROVIDER-$GITHUB_RUN_ID" -D artifacts/ex07-s03-in/provider || echo "no provider report in this run"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "EX07-S03-NATIVE-$GITHUB_RUN_ID" -D artifacts/ex07-s03-in/native || echo "no native report in this run"
      - name: One evidence document (exact head, run id, label "DISPOSABLE EMULATOR evidence")
        run: python3 supabase/proofs/ex07/s03/s03_evidence.py
      - name: Retain the evidence document
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EX07-S03-EVIDENCE-${{ github.run_id }}
          path: artifacts/ex07-s03-evidence/
          if-no-files-found: warn
          retention-days: 90
