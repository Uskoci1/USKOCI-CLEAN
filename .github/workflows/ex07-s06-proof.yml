name: EX-07 S06 safety target name proof
# EX-07 S06 (N06/N07 target identity, gap G11): public.rpc_read_safety_target (PKG-047a) is completed IN PLACE, by ONE anchored edit, so that its result also carries the displayed name of THE profile that was asked for (the
# expression rpc_get_public_profile uses for the same profile); every case that returned null still returns null. The ONE-statement candidate (exactly ONE function body and its comment), its exact revert, the read-only
# preflight and postflight and the integrity-guarded forms are proved on a disposable DEV-equivalent chain (the unchanged source147 -> PKG-050 stages) with actual Auth and PostgREST: fail-before / pass-after on real
# accounts (a person with two ACTIVE faces, a blank name, a draft face, blocks in both directions, an account of the other visibility world, a closing account, the caller's own profile), the exact catalog delta (one
# function), the certificate unchanged and ready in all three places, the revert and a reapply. The client change (the safety screen draws the name FROM THE SERVER RESULT behind a compile-time flag that is OFF by default)
# is proved by the focused Jest suites and the type check in the first job. No DEV, provider or device access. Every outcome destroys the disposable stack. NOTHING in this workflow has run yet: the first run is the first
# evidence; it is SOURCE + CI evidence only (never DEV-applied, never native).
#
# TRIGGERS. Every file the proof reads or imports re-runs it: the generated candidate, revert, flights and guarded forms, the generator, the byte-exact DEV body it edits, the proof and its library, the frozen PKG-047a
# candidate the generator cross-checks, the proof adapter (closure_runtime.mjs and what it imports), the surface script, the client files and tests of the safety screen, and .gitattributes (the bytes are LF text).
# Documentation does NOT start the job: it is a chain of about 90 minutes.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/ex07-s06-proof.yml'
      - 'supabase/candidates/ex07_safety_target_name.sql'
      - 'supabase/candidates/ex07_safety_target_name_revert.sql'
      - 'supabase/candidates/pkg047a_safety_target.sql'
      - 'supabase/proofs/ex07/build_ex07_s06.py'
      - 'supabase/proofs/ex07/s06/**'
      - '!supabase/proofs/ex07/s06/offline/**'
      - 'supabase/proofs/pre_v3/closure_runtime.mjs'
      - 'supabase/proofs/pre_v3/history_snapshot.mjs'
      - 'supabase/proofs/ru5_device_ui_local_guard.mjs'
      - 'supabase/proofs/ru5_device_ui_live79_env.sh'
      - 'supabase/proofs/pkg023/pkg023_surface.sql'
      - 'src/data/safetyClientService.ts'
      - 'src/data/safetyTargetNameGate.ts'
      - 'src/data/serverReceipt.ts'
      - 'src/ui/safety/**'
      - 'src/app/(app)/bezbednost.tsx'
      - 'src/ui/system/PublicProfileSheet.tsx'
      - 'src/data/__tests__/safety-*.test.ts*'
      - 'src/data/__tests__/v5-safety-screen.test.tsx'
      - 'src/data/__tests__/blocked-accounts-screen.test.tsx'
      - 'src/ui/__tests__/safety-target-name-entry.test.tsx'
      - 'src/ui/__tests__/public-profile-safety-entry.test.tsx'
      - '.gitattributes'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ex07-s06-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked existing dependencies
        run: npm ci --include=dev
      - name: Type check and the focused client suites (flag off byte for byte, flag on, the server result, the route, the entry)
        run: |
          set -euo pipefail
          npx tsc --noEmit -p tsconfig.json
          npx jest --runInBand --runTestsByPath \
            src/data/__tests__/safety-target-name-gate.test.ts \
            src/data/__tests__/safety-target-name-service.test.ts \
            src/data/__tests__/safety-target-name-route.test.tsx \
            src/ui/__tests__/safety-target-name-entry.test.tsx \
            src/ui/safety/__tests__/safety-screen-flag-off-baseline.test.tsx \
            src/ui/safety/__tests__/safety-screen-target-name.test.tsx \
            src/data/__tests__/safety-authority.test.ts \
            src/data/__tests__/v5-safety-screen.test.tsx \
            src/data/__tests__/safety-route-guard.test.tsx \
            src/ui/__tests__/public-profile-safety-entry.test.tsx \
            src/data/__tests__/blocked-accounts-screen.test.tsx
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/ex07s06-private
      EX07S06_ARTIFACT_DIR: /tmp/ex07s06-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Bind exact source, check the generated files, run the offline tests and install locked existing dependencies
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX07S06_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$EX07S06_ARTIFACT_DIR/source-binding.txt"
          # The PostgreSQL grammar (pglast) parses every generated statement, function body, DO body and guard (it needs no database); --check compares the BYTES (a carriage return is a difference) and the committed
          # manifest; --selftest runs the two guards against a model of what each connector sends.
          python3 -m pip install --quiet pglast==8.4
          python3 supabase/proofs/ex07/build_ex07_s06.py --check --syntax | tee "$EX07S06_ARTIFACT_DIR/generated-files.txt"
          python3 supabase/proofs/ex07/build_ex07_s06.py --selftest | tee -a "$EX07S06_ARTIFACT_DIR/generated-files.txt"
          sha256sum supabase/candidates/ex07_safety_target_name.sql supabase/candidates/ex07_safety_target_name_revert.sql supabase/proofs/ex07/s06/ex07_s06_preflight.readonly.sql supabase/proofs/ex07/s06/ex07_s06_postflight.readonly.sql supabase/proofs/ex07/s06/ex07_s06_proof.mjs supabase/proofs/ex07/s06/ex07_s06_lib.mjs supabase/proofs/ex07/s06/ex07_s06_dev_body.txt supabase/proofs/ex07/s06/ex07_s06_manifest.json | tee "$EX07S06_ARTIFACT_DIR/source-manifest-sha256.txt"
          # The proof itself, before the long chain: syntax, then the offline tests (no database, no dependency): the pure functions, the consistency of the generated files and of the manifest.
          for file in supabase/proofs/ex07/s06/ex07_s06_proof.mjs supabase/proofs/ex07/s06/ex07_s06_lib.mjs; do node --check "$file"; done
          node --test supabase/proofs/ex07/s06/ex07_s06_lib.test.mjs | tee "$EX07S06_ARTIFACT_DIR/offline-tests.txt"
          dependency_exit=0
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/01-dependencies.log" 2>&1 || dependency_exit=$?
          printf '01-dependencies exit=%s\n' "$dependency_exit" | tee "$EX07S06_ARTIFACT_DIR/stages.txt"
          test "$dependency_exit" -eq 0
          git diff --exit-code
      - name: Reconstruct the existing disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          setup_exit=0
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/02-live79.log" 2>&1 || setup_exit=$?
          printf '02-live79 exit=%s\n' "$setup_exit" | tee -a "$EX07S06_ARTIFACT_DIR/stages.txt"
          exit "$setup_exit"
      - name: Guard loopback targets and replay the unchanged predecessor stages (source147 to PKG-050)
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          try {
            assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
            if (process.env.DB_URL !== process.env.RU5_DEVICE_DB_URL) throw new Error();
          } catch { console.error('FAIL EX07S06_LOCAL_TARGET_ADMISSION'); process.exit(1); }
          NODE
          run_stage() {
            local stage="$1" status=0
            shift
            printf '%s START\n' "$stage" | tee -a "$EX07S06_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$EX07S06_ARTIFACT_DIR/stages.txt"
            if [ "$status" -ne 0 ]; then { printf '== %s\n' "$stage"; tail -n 15 "$PRE_V3_ARTIFACT_DIR/$stage.log"; } >> "$EX07S06_ARTIFACT_DIR/stage-failures.txt"; fi
            return "$status"
          }
          # Exact stage order of ex06a-flexible-window-proof.yml (which is the order of chat-voice-b1-dev-application-proof.yml up to PKG-050; PKG-045a, which created rpc_read_task and rpc_list_my_tasks, is replayed inside stage 18,
          # and so are PKG-042a, PKG-046a and PKG-047a, the stage that created the function this package completes).
          run_stage 03-source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage 04-dev-alpha-to-pkg026 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage 05-pkg027 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage 06-pkg028 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage 07-pkg029 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage 08-pkg030 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage 09-pkg031 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage 10-pkg032 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage 11-pkg033 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage 12-pkg034 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage 13-pkg035 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage 14-pkg037 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage 15-pkg038 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage 16-pkg039 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage 17-pkg040 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage 18-pkg042-to-pkg050 node supabase/proofs/pkg050/pkg050_proof.mjs
      - name: Before, refusals, atomic application, after, exact revert, guarded forms, reapply (real accounts; actual Auth and PostgREST)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          umask 077
          proof_exit=0
          printf '19-ex07-s06-proof START\n' | tee -a "$EX07S06_ARTIFACT_DIR/stages.txt"
          node supabase/proofs/ex07/s06/ex07_s06_proof.mjs 2>&1 | tee "$PRE_V3_ARTIFACT_DIR/19-ex07-s06-proof.log" || proof_exit=${PIPESTATUS[0]}
          printf '19-ex07-s06-proof exit=%s\n' "$proof_exit" | tee -a "$EX07S06_ARTIFACT_DIR/stages.txt"
          cp "$PRE_V3_ARTIFACT_DIR/ex07-s06-report.json" "$EX07S06_ARTIFACT_DIR/ex07-s06-report.json" || true
          tail -n 80 "$PRE_V3_ARTIFACT_DIR/19-ex07-s06-proof.log" > "$EX07S06_ARTIFACT_DIR/proof-tail.txt" || true
          # A green step is not evidence by itself: the PASS lines and the RESULT of the report head the summary.
          {
            echo '### EX-07 S06 result'
            echo
            echo '```'
            grep -h '^PASS ' "$PRE_V3_ARTIFACT_DIR/19-ex07-s06-proof.log" || echo 'no PASS line: the proof did not get that far'
            node -e "try{const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));console.log('RESULT '+r.result+' | chain '+(r.chainFidelityVerdict??'n/a')+' | checks '+(r.checks?.length??'n/a')+' | closing caller through PostgREST '+JSON.stringify(r.closingCallerThroughPostgrest??null)+' | limitation observed '+(r.limitation?.differsFromTheWorkerFaceThatWasSeen??'n/a'))}catch{console.log('RESULT no report')}" "$PRE_V3_ARTIFACT_DIR/ex07-s06-report.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$proof_exit"
      - name: Always discard the disposable database
        if: always()
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$EX07S06_ARTIFACT_DIR"
          teardown_exit=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || teardown_exit=$?
          fi
          printf 'teardown exit=%s\n' "$teardown_exit" | tee -a "$EX07S06_ARTIFACT_DIR/stages.txt"
          exit "$teardown_exit"
      - name: Upload only bounded source and result summaries including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ex07-s06-safety-target-name-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/ex07s06-artifacts/source-binding.txt
            /tmp/ex07s06-artifacts/source-manifest-sha256.txt
            /tmp/ex07s06-artifacts/generated-files.txt
            /tmp/ex07s06-artifacts/offline-tests.txt
            /tmp/ex07s06-artifacts/proof-tail.txt
            /tmp/ex07s06-artifacts/stages.txt
            /tmp/ex07s06-artifacts/stage-failures.txt
            /tmp/ex07s06-artifacts/ex07-s06-report.json
          if-no-files-found: error
          retention-days: 30
