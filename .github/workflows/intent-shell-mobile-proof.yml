name: Intent shell physical Android proof

on:
  workflow_dispatch:
  push:
    branches:
      - fix/intent-shell-20260907

permissions:
  contents: read

env:
  CI: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  RU5_DEVICE_PACKAGE: rs.uskoci.n04proof
  RU5_DEVICE_ARTIFACT_DIR: artifacts/intent-shell-device

jobs:
  physical-device-ui-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4

      - name: Verify migration bytes and provenance integrity
        run: sh supabase/migrations/check_md5.sh

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1; same revision as proven run 34083414939
        with:
          version: 2.116.0
          github-token: ${{ github.token }}

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript contract check
        run: npx tsc --noEmit

      - name: Regression tests
        run: npm test -- --runInBand

      - name: Physical input harness regression tests
        run: python3 -m unittest scripts/test_ru5_android_input.py scripts/test_intent_shell_android.py -v

      - name: Fixture local-target guard tests
        run: node --test supabase/proofs/ru5_device_ui_local_guard.test.mjs

      - name: Reconstruct disposable live-79 Supabase
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh

      - name: Create two real Auth accounts and one disposable Need fixture
        run: node supabase/proofs/ru5_device_ui_fixture.mjs

      - name: Apply N02 and N03 locally; real authenticated selection and Inbox fixture
        run: node supabase/proofs/notifications/n04_inbox_device_fixture.mjs

      - name: Bind proof APK to disposable emulator-host Supabase
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=http://10.0.2.2:54321" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$RU5_DEVICE_ANON_KEY" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_USE_FAKE_SOURCE=0" >> "$GITHUB_ENV"

      - name: Assert proof endpoint is local-only
        run: |
          test "$EXPO_PUBLIC_SUPABASE_URL" = "http://10.0.2.2:54321"
          if [[ "$EXPO_PUBLIC_SUPABASE_URL" == *"leqcwgzvjsxugfgzdmth.supabase.co"* ]]; then
            echo "Production Supabase URL detected in device proof environment."
            exit 1
          fi

      - name: Inject proof-only Android package id
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          app.expo.android = app.expo.android || {};
          app.expo.android.package = 'rs.uskoci.n04proof';
          app.expo.name = 'USKOČI NAV PROOF';
          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Enable local HTTP only in generated proof APK
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          if 'android:usesCleartextTraffic=' not in text:
              text = text.replace('<application ', '<application android:usesCleartextTraffic="true" ', 1)
          path.write_text(text)
          if 'android:usesCleartextTraffic="true"' not in path.read_text():
              raise SystemExit('proof-only cleartext manifest injection failed')
          PY

      - name: Tune Gradle for x86_64 emulator APK
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'android/gradle.properties';
          let text = fs.readFileSync(path, 'utf8');
          const setProp = (key, value) => {
            const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const re = new RegExp(`^${escaped}=.*$`, 'm');
            const line = `${key}=${value}`;
            text = re.test(text) ? text.replace(re, line) : `${text.trimEnd()}\n${line}\n`;
          };
          setProp('org.gradle.jvmargs', '-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8');
          setProp('reactNativeArchitectures', 'x86_64');
          fs.writeFileSync(path, text);
          NODE

      - name: Build standalone proof APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -x lintVitalAnalyzeRelease

      - name: Verify bundled Supabase endpoint is disposable local
        run: |
          bundle="$(find android/app/build/generated/assets -type f -name 'index.android.bundle' | head -n 1)"
          test -n "$bundle"
          grep -aF 'http://10.0.2.2:54321' "$bundle" >/dev/null
          if grep -aF 'leqcwgzvjsxugfgzdmth.supabase.co' "$bundle" >/dev/null; then
            echo "Production Supabase hostname found in bundled proof APK."
            exit 1
          fi
          echo "PASS RU5_DEVICE_APK_ENDPOINT disposable_local_only http://10.0.2.2:54321"

      - name: Enable KVM for Android emulator when available
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            echo "KVM_AVAILABLE=1"
            ls -l /dev/kvm
          else
            echo "KVM_AVAILABLE=0"
          fi

      - name: Run physical Android emulator journey
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            mkdir -p artifacts/intent-shell-device
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell settings put system pointer_location 0 || true
            bash scripts/intent_shell_run_journey.sh

      - name: Validate physical Inbox evidence chain
        run: |
          grep -F 'PASS N04_PHYSICAL_INBOX' artifacts/intent-shell-device/proof.log
          grep -F 'CHECKPOINT GATES_UNCHANGED' artifacts/intent-shell-device/proof.log
          for checkpoint in INBOX_requester_one_event INBOX_role_empty INBOX_requester_read_all INBOX_bell_zero INBOX_worker_selection_unread INBOX_selection_opens_real_agreement INBOX_selection_read_confirmed INBOX_next_page_available INBOX_second_page_loaded INBOX_worker_read_all; do
            test -s "artifacts/intent-shell-device/${checkpoint}.png"
            test -s "artifacts/intent-shell-device/${checkpoint}.xml"
          done

      - name: Validate physical three-zone navigation evidence
        run: |
          grep -F 'PASS PHYSICAL_INTENT_SHELL' artifacts/intent-shell-device/proof.log
          grep -F 'PASS NAV_LOCAL_FIXTURE' artifacts/intent-shell-device/proof.log
          for checkpoint in NAV_requester_tasks NAV_requester_new_task NAV_requester_agreements NAV_requester_profile NAV_profile_back NAV_inbox NAV_inbox_back NAV_same_account_worker_discovery NAV_same_account_worker_profile NAV_signed_out NAV_second_account_requester_empty NAV_second_account_profile NAV_second_account_worker_discovery NAV_task_detail NAV_task_detail_back NAV_worker_applications NAV_worker_agreements; do
            test -s "artifacts/intent-shell-device/${checkpoint}.png"
            test -s "artifacts/intent-shell-device/${checkpoint}.xml"
          done
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const fixture = JSON.parse(fs.readFileSync('artifacts/intent-shell-device/navigation-fixture.json', 'utf8'));
          assert.equal(fixture.sourceSha, process.env.GITHUB_SHA);
          assert.equal(fixture.localOnly, true);
          assert.equal(fixture.publicationProof, false);
          NODE
      - name: Validate disposable business effects
        run: |
          test "$(psql "$RU5_DEVICE_DB_URL" -Atc "
            select count(*)
            from public.marketplace_responses r
            join public.app_profiles p on p.id=r.worker_profile_id
            where r.need_id='$RU5_DEVICE_NEED_ID'::uuid
              and p.account_id='$RU5_DEVICE_WORKER_USER_ID'::uuid
              and r.price_rsd=3000
              and r.covered_slots=1;
          ")" = "1"
          test "$(psql "$RU5_DEVICE_DB_URL" -Atc "
            select count(*)
            from public.need_selections s
            join public.marketplace_responses r on r.id=s.response_id
            join public.app_profiles p on p.id=r.worker_profile_id
            where r.need_id='$RU5_DEVICE_NEED_ID'::uuid
              and p.account_id='$RU5_DEVICE_WORKER_USER_ID'::uuid
              and s.status='SELECTED';
          ")" = "1"
          test "$(psql "$RU5_DEVICE_DB_URL" -Atc "
            select count(*)
            from public.agreements a
            where a.need_id='$RU5_DEVICE_NEED_ID'::uuid
              and a.requester_account_id='$RU5_DEVICE_REQUESTER_USER_ID'::uuid
              and a.worker_account_id='$RU5_DEVICE_WORKER_USER_ID'::uuid;
          ")" = "1"
          test "$(psql "$RU5_DEVICE_DB_URL" -Atc "
            select count(*)
            from private.connection_activations a
            join public.agreements g on g.id=a.agreement_id
            where g.need_id='$RU5_DEVICE_NEED_ID'::uuid
              and a.requester_account_id='$RU5_DEVICE_REQUESTER_USER_ID'::uuid
              and a.beneficiary_account_id='$RU5_DEVICE_REQUESTER_USER_ID'::uuid
              and a.worker_account_id='$RU5_DEVICE_WORKER_USER_ID'::uuid
              and a.activation_reason='SELECTION'
              and a.units=1
              and a.platform_cost_rsd=0
              and a.state='SATISFIED'
              and a.policy_key='REQUESTER_SELECTION_V1'
              and a.policy_version=1;
          ")" = "1"
          echo "PASS RU5_DEVICE_POSTFLIGHT response selection agreement REQUESTER_SELECTION_V1 zero_rsd"

      - name: Disposable postflight invariants
        if: always()
        run: |
          if [[ -n "${RU5_DEVICE_DB_URL:-}" ]]; then
            test "$(psql "$RU5_DEVICE_DB_URL" -Atc "select count(*) from private.publication_policy_bundles;")" = "0"
            test "$(psql "$RU5_DEVICE_DB_URL" -Atc "select count(*) from private.need_publication_decisions;")" = "0"
            test "$(psql "$RU5_DEVICE_DB_URL" -Atc "select count(*) from private.preselection_qa_questions;")" = "0"
            test "$(psql "$RU5_DEVICE_DB_URL" -Atc "select count(*) from private.preselection_qa_commands;")" = "0"
            test "$(psql "$RU5_DEVICE_DB_URL" -Atc "select count(*) from public.needs where mode='FASTEST';")" = "0"
            test "$(psql "$RU5_DEVICE_DB_URL" -Atc "select count(*) from public.need_selections where selection_mode='AUTO_FILL';")" = "0"
          fi

      - name: Upload physical UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INTENT-SHELL-PHYSICAL-ANDROID-EVIDENCE
          path: artifacts/intent-shell-device/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop disposable Supabase
        if: always()
        run: |
          if [[ -n "${RU5_DEVICE_PROOF_DIR:-}" && -d "$RU5_DEVICE_PROOF_DIR" ]]; then
            cd "$RU5_DEVICE_PROOF_DIR"
            supabase stop --no-backup || true
          fi
