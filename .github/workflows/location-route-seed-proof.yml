name: Location route seed proof

on:
  workflow_dispatch:
  push:
    branches:
      - work/uskoci-ui-unification-20260924
    paths:
      - 'src/ui/location/ConversationPointAsk.tsx'
      - 'src/data/__tests__/conversation-point-ask.test.tsx'
      - 'src/ui/location/LocationPointEditor.tsx'
      - 'src/ui/location/ResolvedPinMap.tsx'
      - 'src/ui/location/ResolvedPinMap.types.ts'
      - 'src/data/__tests__/locationPointEditor.test.tsx'
      - 'supabase/functions/uskoci-ai-interview/index.ts'
      - '.github/workflows/location-route-seed-proof.yml'

permissions:
  contents: read

jobs:
  route-location:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Route location regression
        run: npx jest src/data/__tests__/conversation-point-ask.test.tsx src/data/__tests__/locationPointEditor.test.tsx --runInBand
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Full regression
        run: npm test -- --runInBand
      - name: Pin privacy-safe route instruction
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('supabase/functions/uskoci-ai-interview/index.ts', 'utf8');
          for (const phrase of [
            'privacy-safe naziv ulice/POI bez kućnog broja',
            'Jedan need.exact_address nije dozvola da se privatna adresa pripiše polazištu druge route tačke'
          ]) {
            if (!source.includes(phrase)) throw new Error('Missing route-location contract: ' + phrase);
          }
          console.log('route-location prompt contract OK');
          NODE
