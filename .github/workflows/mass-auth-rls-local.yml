name: Mass Auth RLS (disposable local)

on:
  push:
    branches:
      - 'test/mass-user-chaos-harness-*'
    paths:
      - 'scripts/load/mass_auth_rls_local.mjs'
      - '.github/workflows/mass-auth-rls-local.yml'
  workflow_dispatch:
    inputs:
      users:
        description: Real local Auth users (2..1000)
        required: true
        default: '100'
      concurrency:
        description: Concurrent user operations (1..100)
        required: true
        default: '25'
      reads_per_user:
        description: Pressure reads per user (1..50)
        required: true
        default: '5'

permissions:
  contents: read

concurrency:
  group: mass-auth-rls-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      MASS_OUT: /tmp/mass-user-chaos

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Syntax
        run: node --check scripts/load/mass_auth_rls_local.mjs
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh
      - name: Replay recorded live80-87 aliases and every pending source migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          root=os.environ['GITHUB_WORKSPACE']; db=os.environ['DB_URL']
          prov=json.load(open(f'{root}/supabase/migrations/MIGRATION_PROVENANCE.json',encoding='utf-8'))
          def scalar(s): return subprocess.run(['psql',db,'-X','-Atc',s],text=True,capture_output=True,check=True).stdout.strip()
          def run_sql(s,label):
              r=subprocess.run(['psql',db,'-X','-q','-v','ON_ERROR_STOP=1'],input=s,text=True,capture_output=True)
              if r.returncode: sys.stdout.write(r.stdout[-4000:]);sys.stderr.write(r.stderr[-4000:]);sys.exit(f'MASS_AUTH_REPLAY_FAILED {label}')
          def apply(file,version,name):
              path=f'{root}/supabase/migrations/{file}'
              r=subprocess.run(['psql',db,'-X','-q','-v','ON_ERROR_STOP=1','-f',path],text=True,capture_output=True)
              if r.returncode: sys.stdout.write(r.stdout[-4000:]);sys.stderr.write(r.stderr[-4000:]);sys.exit(f'MASS_AUTH_REPLAY_FAILED {file}')
              body=open(path,encoding='utf-8',newline='').read();tag='$massauthstmt$';assert tag not in body
              run_sql(f"insert into supabase_migrations.schema_migrations(version,name,statements) values ('{version}','{name}',array[{tag}{body}{tag}]);",file)
          assert scalar('select max(version) from supabase_migrations.schema_migrations')=='20260906141409'
          entries=[e for e in prov['live_history_snapshot']['entries'] if e['version']>'20260906141409'];assert len(entries)==8
          for e in entries: apply(e.get('file') or f"{e['version']}_{e['name']}.sql",e['version'],e['name'])
          assert scalar('select count(*) from supabase_migrations.schema_migrations')=='87'
          for p in prov['pending_forward_migrations']: apply(p['file'],p['version'],p['name'])
          run_sql("notify pgrst, 'reload schema';",'reload')
          assert scalar("select count(*)::text||'/'||max(version) from supabase_migrations.schema_migrations")=='147/20260913081242'
          PY
      - name: Run real Auth/RLS pressure
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/uskoci-ru5-device-ui
          eval "$(supabase status -o env)"
          cd "$GITHUB_WORKSPACE"
          export SUPABASE_URL="${API_URL:-${SUPABASE_URL:-}}"
          export SUPABASE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          export MASS_USERS="${{ github.event_name == 'workflow_dispatch' && inputs.users || '100' }}"
          export MASS_CONCURRENCY="${{ github.event_name == 'workflow_dispatch' && inputs.concurrency || '25' }}"
          export MASS_READS_PER_USER="${{ github.event_name == 'workflow_dispatch' && inputs.reads_per_user || '5' }}"
          export MASS_RUN_ID="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$MASS_OUT"
          node scripts/load/mass_auth_rls_local.mjs | tee /tmp/mass-auth-rls.log
          grep -F 'PASS MASS_AUTH_RLS_LOCAL' /tmp/mass-auth-rls.log
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-auth-rls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/mass-user-chaos/mass-auth-rls-report.json
            /tmp/mass-auth-rls.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop disposable database
        if: always()
        shell: bash
        run: cd /tmp/uskoci-ru5-device-ui 2>/dev/null && supabase stop --no-backup || true
