name: Mass unknown outcome (disposable local)

on:
  push:
    branches:
      - 'test/mass-user-chaos-harness-*'
    paths:
      - 'scripts/load/mass_unknown_outcome.mjs'
      - '.github/workflows/mass-unknown-outcome-local.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mass-unknown-outcome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unknown-outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/mass-fault-artifacts
      MASS_OUT: /tmp/mass-user-chaos

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Syntax
        run: node --check scripts/load/mass_unknown_outcome.mjs

      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh

      - name: Prepare proven disposable Auth fixtures
        run: node supabase/proofs/ru5_device_ui_fixture.mjs

      - name: Replay recorded live80-87 aliases and every pending source migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          root=os.environ['GITHUB_WORKSPACE']; db=os.environ['DB_URL']
          prov=json.load(open(f'{root}/supabase/migrations/MIGRATION_PROVENANCE.json',encoding='utf-8'))
          def scalar(s): return subprocess.run(['psql',db,'-X','-Atc',s],text=True,capture_output=True,check=True).stdout.strip()
          def run_sql(s,label):
              r=subprocess.run(['psql',db,'-X','-q','-v','ON_ERROR_STOP=1'],input=s,text=True,capture_output=True)
              if r.returncode: sys.stdout.write(r.stdout[-4000:]);sys.stderr.write(r.stderr[-4000:]);sys.exit(f'MASS_FAULT_REPLAY_FAILED {label}')
          def apply(file,version,name):
              path=f'{root}/supabase/migrations/{file}'
              r=subprocess.run(['psql',db,'-X','-q','-v','ON_ERROR_STOP=1','-f',path],text=True,capture_output=True)
              if r.returncode: sys.stdout.write(r.stdout[-4000:]);sys.stderr.write(r.stderr[-4000:]);sys.exit(f'MASS_FAULT_REPLAY_FAILED {file}')
              body=open(path,encoding='utf-8',newline='').read();tag='$massfaultstmt$';assert tag not in body
              run_sql(f"insert into supabase_migrations.schema_migrations(version,name,statements) values ('{version}','{name}',array[{tag}{body}{tag}]);",file)
          assert scalar('select max(version) from supabase_migrations.schema_migrations')=='20260906141409'
          entries=[e for e in prov['live_history_snapshot']['entries'] if e['version']>'20260906141409'];assert len(entries)==8
          for e in entries: apply(e.get('file') or f"{e['version']}_{e['name']}.sql",e['version'],e['name'])
          assert scalar('select count(*) from supabase_migrations.schema_migrations')=='87'
          for p in prov['pending_forward_migrations']: apply(p['file'],p['version'],p['name'])
          run_sql("notify pgrst, 'reload schema';",'reload')
          assert scalar("select count(*)::text||'/'||max(version) from supabase_migrations.schema_migrations")=='147/20260913081242'
          PY

      - name: Run lost-ACK exact-retry proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$MASS_OUT"
          node scripts/load/mass_unknown_outcome.mjs | tee /tmp/mass-unknown-outcome.log
          grep -F 'PASS MASS_UNKNOWN_OUTCOME' /tmp/mass-unknown-outcome.log

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-unknown-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/mass-user-chaos/mass-unknown-outcome-report.json
            /tmp/mass-unknown-outcome.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop disposable database
        if: always()
        shell: bash
        run: cd /tmp/uskoci-ru5-device-ui 2>/dev/null && supabase stop --no-backup || true
