name: Messages inbox focused SQL proof
on:
  workflow_dispatch:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/messages-inbox-sql-proof.yml'
      - 'supabase/candidates/messages-inbox-01-20261003/**'
      - 'supabase/proofs/messages_inbox/**'
permissions:
  contents: read
concurrency:
  group: messages-inbox-sql-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused-sql-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      INBOX_PROOF_ARTIFACT_DIR: /tmp/messages-inbox-sql-proof
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Bind exact source and execute only an isolated PostgreSQL reader proof
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          bash supabase/proofs/messages_inbox/run.sh
      - name: Upload bounded synthetic results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: messages-inbox-sql-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/messages-inbox-sql-proof/report.json
            /tmp/messages-inbox-sql-proof/source-binding.json
            /tmp/messages-inbox-sql-proof/git-source.txt
            /tmp/messages-inbox-sql-proof/status.txt
            /tmp/messages-inbox-sql-proof/image-id.txt
            /tmp/messages-inbox-sql-proof/postgres-version.txt
            /tmp/messages-inbox-sql-proof/fixture.log
            /tmp/messages-inbox-sql-proof/helpers.log
            /tmp/messages-inbox-sql-proof/install.log
            /tmp/messages-inbox-sql-proof/assertions.log
          if-no-files-found: error
          retention-days: 30
