name: Notification A1 runtime binding proof
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - 'supabase/candidates/20260926175504_clean_notification_push_event_type.sql'
      - 'supabase/functions/_shared/pushNotificationCopy.mjs'
      - 'supabase/functions/uskoci-push-transport/index.ts'
      - 'supabase/proofs/notifications/n09_push_transport_edge.test.mjs'
      - 'supabase/proofs/notifications/n09_push_transport_runtime.mjs'
      - 'supabase/proofs/notifications/n09_push_transport_proof.mjs'
      - 'supabase/proofs/pre_v3/push_readiness_proof.mjs'
      - 'supabase/proofs/pre_v3/closure_runtime.mjs'
      - '.github/workflows/notification-a1-runtime-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: '1'
  DO_NOT_TRACK: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'
  N09_ARTIFACT_DIR: artifacts/notification-a1-runtime
  W03_INTAKE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/notification-a1-runtime/source105
  RU5_DEVICE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/notification-a1-runtime/source106
  RU5_DEVICE_PACKAGE: rs.uskoci.n04proof
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Static and synthetic transport boundary
        run: |
          npm ci --include=dev
          npx tsc --noEmit
          node --test supabase/proofs/notifications/n10_push_copy.test.mjs
          node --test supabase/proofs/notifications/n09_push_transport_edge.test.mjs
          node --check supabase/proofs/notifications/n09_push_transport_proof.mjs
      - name: Historical disposable Supabase and auth fixture
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh
      - run: node supabase/proofs/ru5_device_ui_fixture.mjs
      - name: Immutable source106 setup
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9691fc6575e035b0d1bd72a7d7abf55ad1523716
          path: proof-source106
          persist-credentials: false
      - name: Admit immutable source106 predecessor
        shell: bash
        run: |
          set -euo pipefail
          baseline=9691fc6575e035b0d1bd72a7d7abf55ad1523716
          test "$(git -C proof-source106 rev-parse HEAD)" = "$baseline"
          mkdir -p "$N09_ARTIFACT_DIR"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/proof-source106/node_modules"
          cd proof-source106
          GITHUB_SHA="$baseline" node scripts/ci/owned-intake-proof.mjs prepare105
          RU5_DEVICE_ARTIFACT_DIR=artifacts/ai-review-device GITHUB_SHA="$baseline" node scripts/ai_review_fixture.mjs admit
      - name: Actual Auth/Postgres + exact Edge with synthetic Expo
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/notifications/n09_push_transport_proof.mjs 2>&1 | tee "$N09_ARTIFACT_DIR/proof.log"
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.env.N09_ARTIFACT_DIR+'/proof-report.json','utf8'));
          if(r.result!=='PASS'||r.source_sha!==process.env.GITHUB_SHA||r.live_access||r.provider_called||r.physical_push_proven||
             !r.actual_auth||!r.actual_database||!r.actual_edge_handler||r.checks.length!==11||r.checks.some(c=>c.result!=='PASS')||
             typeof r.a1_sql_sha256!=='string'||r.a1_sql_sha256.length!==64) process.exit(1);
          NODE
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NOTIFICATION-A1-RUNTIME-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: artifacts/notification-a1-runtime/
      - name: Teardown disposable Supabase
        if: always()
        shell: bash
        run: |
          if [[ -n "${RU5_DEVICE_PROOF_DIR:-}" && -d "$RU5_DEVICE_PROOF_DIR" ]]; then
            cd "$RU5_DEVICE_PROOF_DIR"
            supabase stop --no-backup
          fi
