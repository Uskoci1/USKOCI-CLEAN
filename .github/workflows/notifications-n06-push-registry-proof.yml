name: N06 Push registry authenticated proof
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Registry or current Expo transport on the proven source106 predecessor
        type: choice
        options: [registry, transport]
        default: registry
  workflow_call:
    inputs:
      scope:
        type: string
        default: transport
  push:
    branches:
      - proof/notifications-n06-push-registry-20260907
permissions:
  contents: read
env:
  CI: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  N06_ARTIFACT_DIR: artifacts/notifications-n06
jobs:
  authenticated-push-registry-proof:
    if: inputs.scope != 'transport'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify applied migration bytes and provenance
        run: sh supabase/migrations/check_md5.sh
      - name: Set up proven Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: TypeScript and full regression suite
        run: |
          npx tsc --noEmit
          npm test -- --runInBand
          node --check supabase/proofs/notifications/n06_push_registry_proof.mjs
          node --test supabase/proofs/ru5_device_ui_local_guard.test.mjs
      - name: Reconstruct disposable historical live-79 baseline
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh
      - name: Prepare real disposable accounts and seeded Need
        run: node supabase/proofs/ru5_device_ui_fixture.mjs
      - name: Apply guarded candidate locally and prove authenticated effects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$N06_ARTIFACT_DIR"
          node supabase/proofs/notifications/n06_push_registry_proof.mjs 2>&1 | tee "$N06_ARTIFACT_DIR/proof.log"
          grep -F 'PASS N06_PUSH_REGISTRY_AUTHENTICATED_PROOF' "$N06_ARTIFACT_DIR/proof.log"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.env.N06_ARTIFACT_DIR+"/proof-report.json")); if(r.result!=="PASS" || r.source_sha!==process.env.GITHUB_SHA || r.live_access || r.migration_history_count!==79) process.exit(1);'
      - name: Upload exact source-bound proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: N06-PUSH-REGISTRY-AUTHENTICATED-EVIDENCE
          path: artifacts/notifications-n06/
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown disposable Supabase
        if: always()
        shell: bash
        run: |
          if [[ -n "${RU5_DEVICE_PROOF_DIR:-}" && -d "$RU5_DEVICE_PROOF_DIR" ]]; then
            cd "$RU5_DEVICE_PROOF_DIR"
            supabase stop --no-backup
          fi

  authenticated-push-transport-proof:
    if: inputs.scope == 'transport'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      N09_ARTIFACT_DIR: artifacts/notifications-n09
      W03_INTAKE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/notifications-n09/source105
      RU5_DEVICE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/notifications-n09/source106
      RU5_DEVICE_PACKAGE: rs.uskoci.n04proof
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Current locked source and targeted push checks
        run: |
          npm ci
          python3 supabase/migrations/check_migration_integrity.py
          npx tsc --noEmit
          node --test supabase/proofs/notifications/n09_push_transport_edge.test.mjs
          node --check supabase/proofs/notifications/n09_push_transport_proof.mjs
          node scripts/ci/scope.cjs test push
      - name: Existing disposable loopback environment and actual Auth fixture
        run: |
          bash supabase/proofs/ru5_device_ui_live79_env.sh
      - run: node supabase/proofs/ru5_device_ui_fixture.mjs
      - name: Read immutable source106 setup
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9691fc6575e035b0d1bd72a7d7abf55ad1523716
          path: proof-source106
          persist-credentials: false
      - name: Reuse immutable source106 setup without replaying unrelated behavior suites
        shell: bash
        run: |
          set -euo pipefail
          baseline=9691fc6575e035b0d1bd72a7d7abf55ad1523716
          test "$(git -C proof-source106 rev-parse HEAD)" = "$baseline"
          mkdir -p "$N09_ARTIFACT_DIR"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/proof-source106/node_modules"
          printf '%s\n' "$baseline" > "$N09_ARTIFACT_DIR/predecessor-commit.txt"
          cd proof-source106
          GITHUB_SHA="$baseline" node scripts/ci/owned-intake-proof.mjs prepare105
          RU5_DEVICE_ARTIFACT_DIR=artifacts/ai-review-device GITHUB_SHA="$baseline" node scripts/ai_review_fixture.mjs admit
          cp artifacts/ai-review-device/ai-review-admission.json "$GITHUB_WORKSPACE/$N09_ARTIFACT_DIR/source106-admission.json"
      - name: Actual session registration and Expo transport SQL with synthetic provider
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/notifications/n09_push_transport_proof.mjs 2>&1 | tee "$N09_ARTIFACT_DIR/proof.log"
          node -e 'const fs=require("fs"),r=JSON.parse(fs.readFileSync(process.env.N09_ARTIFACT_DIR+"/proof-report.json"));if(r.result!=="PASS"||r.source_sha!==process.env.GITHUB_SHA||r.live_access||r.provider_called||r.physical_push_proven||!r.actual_auth||!r.actual_database||!r.actual_edge_handler||!r.history_unchanged||r.checks.length!==11||!r.concurrent_single_lease||!r.rotation_begin_suppressed_after_observed_lock||!r.postlock_session_revocation_fenced||!r.old_setter_authenticated_execute_revoked||r.observed_locks?.length!==3||r.observed_locks.some(l=>l.type!=="Lock")||JSON.stringify(r.existing_acl_delta)!==JSON.stringify(["public.rpc_set_push_device(text,text,boolean,bigint)"])||r.checks.some(c=>c.result!=="PASS"))process.exit(1);'
      - name: Retain original current-source transport evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: N09-EXPO-TRANSPORT-EVIDENCE
          path: artifacts/notifications-n09/
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown only this disposable Supabase instance
        if: always()
        shell: bash
        run: |
          if [[ -n "${RU5_DEVICE_PROOF_DIR:-}" && -d "$RU5_DEVICE_PROOF_DIR" ]]; then
            cd "$RU5_DEVICE_PROOF_DIR"
            supabase stop --no-backup
          fi
