name: N07 exact forward notification admission proof
on:
  workflow_dispatch:
  push:
    branches:
      - proof/notifications-n07-forward-promotions-20260907
permissions:
  contents: read
env:
  CI: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  N07_ARTIFACT_DIR: artifacts/notifications-n07
jobs:
  authenticated-forward-admission-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify applied migration bytes and provenance
        run: sh supabase/migrations/check_md5.sh
      - name: Set up proven Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: TypeScript and full regression suite
        run: |
          npx tsc --noEmit
          npm test -- --runInBand
          node --check supabase/proofs/notifications/n07_forward_promotion_proof.mjs
          node --test supabase/proofs/ru5_device_ui_local_guard.test.mjs
      - name: Reconstruct disposable historical live-79 baseline
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh
      - name: Prepare real disposable accounts and seeded Need
        run: node supabase/proofs/ru5_device_ui_fixture.mjs
      - name: Apply guarded candidate locally and prove authenticated effects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$N07_ARTIFACT_DIR"
          node supabase/proofs/notifications/n07_forward_promotion_proof.mjs 2>&1 | tee "$N07_ARTIFACT_DIR/proof.log"
          grep -F 'PASS N07_FORWARD_NOTIFICATION_ADMISSION' "$N07_ARTIFACT_DIR/proof.log"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.env.N07_ARTIFACT_DIR+"/proof-report.json")); if(r.result!=="PASS" || r.source_sha!==process.env.GITHUB_SHA || r.live_access || r.migration_history_count!==84) process.exit(1);'
      - name: Upload exact source-bound proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: N07-FORWARD-NOTIFICATION-ADMISSION-EVIDENCE
          path: artifacts/notifications-n07/
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown disposable Supabase
        if: always()
        shell: bash
        run: |
          if [[ -n "${RU5_DEVICE_PROOF_DIR:-}" && -d "$RU5_DEVICE_PROOF_DIR" ]]; then
            cd "$RU5_DEVICE_PROOF_DIR"
            supabase stop --no-backup
          fi
