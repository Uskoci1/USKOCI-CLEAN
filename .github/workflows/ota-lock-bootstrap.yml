name: OTA lock bootstrap

on:
  push:
    branches:
      - work/uskoci-ui-unification-20260924
    paths:
      - 'package.json'
      - '.github/workflows/ota-lock-bootstrap.yml'

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/uskoci-ui-unification-20260924
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve SDK 57 expo-updates lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci
      - name: Commit resolved lock
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json package.json; then
            echo "Lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "chore(ota): lock expo-updates dependency"
          git fetch origin work/uskoci-ui-unification-20260924
          git rebase origin/work/uskoci-ui-unification-20260924
          git push origin HEAD:work/uskoci-ui-unification-20260924
