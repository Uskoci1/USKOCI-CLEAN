name: OTA Preview source proof

on:
  workflow_dispatch:
  push:
    branches:
      - work/uskoci-ui-unification-20260924
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.js'
      - 'eas.json'
      - 'scripts/check-eas-preview.cjs'
      - 'scripts/ota-preview-guard.cjs'
      - 'scripts/__tests__/eas-preview-guard.test.ts'
      - 'scripts/__tests__/ota-preview-guard.test.ts'
      - 'src/data/buildIdentity.ts'
      - 'src/ui/BuildIdentity.tsx'
      - 'src/data/__tests__/build-identity.test.tsx'
      - '.github/workflows/ota-preview-source-proof.yml'

permissions:
  contents: read

env:
  EXPO_PUBLIC_SUPABASE_URL: https://leqcwgzvjsxugfgzdmth.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_o_I-YOn57oPCrIboF0OjPQ_c3DHmOZW
  EXPO_PUBLIC_USE_FAKE_SOURCE: '0'
  NODE_ENV: production

jobs:
  ota-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Static OTA boundary
        run: node scripts/ota-preview-guard.cjs
      - name: Focused OTA and EAS guards
        run: npx jest scripts/__tests__/eas-preview-guard.test.ts scripts/__tests__/ota-preview-guard.test.ts src/data/__tests__/build-identity.test.tsx --runInBand
      - name: Resolve preview config
        env:
          EAS_BUILD_PROFILE: preview
          USKOCI_OTA_TARGET: preview
        run: |
          node <<'NODE'
          const fs=require('fs');
          const configure=require('./app.config.js');
          const source=JSON.parse(fs.readFileSync('app.json','utf8')).expo;
          const config=configure({config:source});
          const expectedUrl='https://u.expo.dev/1e6cc490-9851-4741-9226-128612122db6';
          if(config.android.package!=='rs.uskoci.preview') throw new Error('PREVIEW_PACKAGE_DRIFT');
          if(config.runtimeVersion!=='uskoci-v1-preview-r1') throw new Error('PREVIEW_RUNTIME_DRIFT');
          if(config.updates?.url!==expectedUrl||config.updates?.requestHeaders?.['expo-channel-name']!=='preview') throw new Error('PREVIEW_CHANNEL_DRIFT');
          if(config.extra?.uskociBuild?.runtimeVersion!==config.runtimeVersion||config.extra?.uskociBuild?.updateChannel!=='preview') throw new Error('PREVIEW_BUILD_IDENTITY_DRIFT');
          console.log(JSON.stringify({package:config.android.package,runtimeVersion:config.runtimeVersion,channel:config.updates.requestHeaders['expo-channel-name'],url:config.updates.url}));
          NODE
      - name: Resolve production config separately
        env:
          EAS_BUILD_PROFILE: production
          USKOCI_OTA_TARGET: production
        run: |
          node <<'NODE'
          const fs=require('fs');
          const configure=require('./app.config.js');
          const source=JSON.parse(fs.readFileSync('app.json','utf8')).expo;
          const config=configure({config:source});
          if(config.android.package!=='rs.uskoci') throw new Error('PRODUCTION_PACKAGE_DRIFT');
          if(config.runtimeVersion!=='uskoci-v1-production-r1') throw new Error('PRODUCTION_RUNTIME_DRIFT');
          if(config.updates?.requestHeaders?.['expo-channel-name']!=='production') throw new Error('PRODUCTION_CHANNEL_DRIFT');
          if(config.runtimeVersion==='uskoci-v1-preview-r1') throw new Error('PRODUCTION_CAN_ACCEPT_PREVIEW_RUNTIME');
          console.log(JSON.stringify({package:config.android.package,runtimeVersion:config.runtimeVersion,channel:config.updates.requestHeaders['expo-channel-name']}));
          NODE
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Full regression
        run: npm test -- --runInBand
