name: P0D-02 Normalize Pending Provenance

on:
  push:
    branches:
      - proof/p0d02-selection-semantic-idempotency-20260906
    paths:
      - .github/workflows/p0d02-normalize-pending-provenance.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Restore canonical formatting and patch only pending array
        shell: bash
        run: |
          set -euo pipefail
          git show 76a649c9ec3b8e0935658734856b7ab70dd5971e:supabase/migrations/MIGRATION_PROVENANCE.json > /tmp/provenance.base.json
          python - <<'PY'
          from pathlib import Path
          import json

          base = Path('/tmp/provenance.base.json').read_text(encoding='utf-8')
          marker = '  "pending_forward_migrations": [],'
          assert base.count(marker) == 1
          entry = {
              'version': '20260906080000',
              'name': 'clean_p0d02_selection_semantic_idempotency',
              'file': '20260906080000_clean_p0d02_selection_semantic_idempotency.sql',
              'classification': 'PENDING_FORWARD_MIGRATION',
              'raw_md5': '065a6a172f1cea50b99c57f6759ef109',
              'canonical_utf8_bytes': 15516,
              'live_applied': False,
              'predecessor_live_migration_count': 76,
              'predecessor_live_head': '20260906065758',
              'proof_branch': 'proof/p0d02-selection-semantic-idempotency-20260906',
              'implementation_proof_head': '70e1ae400d011408f4e0ea84cbf66478851dec9f',
              'implementation_proof_run_id': 34020645411,
              'proof_state': 'AUTHENTICATED_RUNTIME_AND_TRUE_CONCURRENCY_PROVEN',
              'client_retry_identity': 'R05_EXACT_INTENT_REQUEST_ID_RETENTION_PROVEN',
              'scope': 'Selection semantic command receipt plus retained R05 exact-intent retry identity only',
              'nonclaims': [
                  'calendar hard-conflict authority',
                  'Povezivanje activation',
                  'Agreement/shared-Dogovor redesign',
                  'D0140 production ALLOW',
                  'RU-4B public Q&A activation',
                  'monetization',
                  'Application AI / RU-5B',
              ],
          }
          pending_json = json.dumps([entry], ensure_ascii=False, indent=2)
          pending_json = pending_json.replace('\n', '\n  ')
          replacement = '  "pending_forward_migrations": ' + pending_json + ','
          updated = base.replace(marker, replacement, 1)
          json.loads(updated)
          Path('supabase/migrations/MIGRATION_PROVENANCE.json').write_text(updated, encoding='utf-8', newline='\n')
          PY
          python supabase/migrations/check_migration_integrity.py
          git diff --check

      - name: Commit narrow provenance normalization and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'msljivic031'
          git config user.email 'msljivic031@gmail.com'
          git rm .github/workflows/p0d02-normalize-pending-provenance.yml
          git add supabase/migrations/MIGRATION_PROVENANCE.json
          git diff --cached --stat
          git commit -m 'docs(p0d02): preserve provenance formatting for pending entry'
          git push origin HEAD:${GITHUB_REF_NAME}
