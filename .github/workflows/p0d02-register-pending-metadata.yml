name: P0D-02 Register Pending Metadata

on:
  push:
    branches:
      - proof/p0d02-selection-semantic-idempotency-20260906
    paths:
      - .github/workflows/p0d02-register-pending-metadata.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Register locked P0D-02 pending provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          migration_name = '20260906080000_clean_p0d02_selection_semantic_idempotency.sql'
          raw_md5 = '065a6a172f1cea50b99c57f6759ef109'
          raw_bytes = 15516
          predecessor_count = 76
          predecessor_head = '20260906065758'
          implementation_proof_head = '70e1ae400d011408f4e0ea84cbf66478851dec9f'
          implementation_proof_run = 34020645411

          manifest_path = Path('supabase/migrations/MD5_MANIFEST.txt')
          manifest = manifest_path.read_text(encoding='utf-8')
          manifest_line = f'{raw_md5}  {migration_name}'
          assert manifest_line not in manifest
          assert manifest.endswith('6ddb7d5d141e7cb3a454fa7e6ca1280d  20260906010000_clean_ru5_selection_eligibility_revalidation.sql\n')
          manifest = manifest + manifest_line + '\n'
          names = [line.split('  ', 1)[1] for line in manifest.splitlines()]
          assert names == sorted(names)
          manifest_path.write_text(manifest, encoding='utf-8', newline='\n')

          provenance_path = Path('supabase/migrations/MIGRATION_PROVENANCE.json')
          provenance = json.loads(provenance_path.read_text(encoding='utf-8'))
          assert provenance['live_history_snapshot']['migration_count'] == predecessor_count
          assert provenance['live_history_snapshot']['last']['version'] == predecessor_head
          assert provenance.get('pending_forward_migrations') == []
          provenance['pending_forward_migrations'] = [{
              'version': '20260906080000',
              'name': 'clean_p0d02_selection_semantic_idempotency',
              'file': migration_name,
              'classification': 'PENDING_FORWARD_MIGRATION',
              'raw_md5': raw_md5,
              'canonical_utf8_bytes': raw_bytes,
              'live_applied': False,
              'predecessor_live_migration_count': predecessor_count,
              'predecessor_live_head': predecessor_head,
              'proof_branch': 'proof/p0d02-selection-semantic-idempotency-20260906',
              'implementation_proof_head': implementation_proof_head,
              'implementation_proof_run_id': implementation_proof_run,
              'proof_state': 'AUTHENTICATED_RUNTIME_AND_TRUE_CONCURRENCY_PROVEN',
              'client_retry_identity': 'R05_EXACT_INTENT_REQUEST_ID_RETENTION_PROVEN',
              'scope': 'Selection semantic command receipt plus retained R05 exact-intent retry identity only',
              'nonclaims': [
                  'calendar hard-conflict authority',
                  'Povezivanje activation',
                  'Agreement/shared-Dogovor redesign',
                  'D0140 production ALLOW',
                  'RU-4B public Q&A activation',
                  'monetization',
                  'Application AI / RU-5B'
              ]
          }]
          provenance_path.write_text(json.dumps(provenance, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          continuity_path = Path('docs/implementation/IMPLEMENTATION_CONTINUITY.md')
          continuity = continuity_path.read_text(encoding='utf-8')
          old = '## Current authoritative checkpoint — 2026-09-06 — RU-5 MANUAL SELECTION ELIGIBILITY REVALIDATION CLOSED / CANONICAL / LIVE\n'
          assert continuity.count(old) == 1
          wip = '''## Current WIP checkpoint — 2026-09-06 — P0D-02 SELECTION SEMANTIC IDEMPOTENCY PROOF-PASSED / PENDING PROMOTION\n\nFrozen forward authority physically names this unit `P0D-02 — selection_semantic_idempotency`. It is the next admitted manual Selection repair after the closed RU-5 eligibility revalidation predecessor.\n\nCurrent proof branch: `proof/p0d02-selection-semantic-idempotency-20260906`. Locked candidate migration: `supabase/migrations/20260906080000_clean_p0d02_selection_semantic_idempotency.sql`, raw MD5 `065a6a172f1cea50b99c57f6759ef109`, UTF-8 bytes `15516`. Implementation/concurrency proof run `34020645411` on head `70e1ae400d011408f4e0ea84cbf66478851dec9f` is PASS: same-key/same-payload returns one Agreement/Selection/receipt; same key with different semantic payload is rejected; two distinct keys racing for the last seat produce one winner; RU-5 eligibility and P0D-01 regressions remain PASS; TypeScript PASS; Jest `22/22` suites and `144/144` tests PASS.\n\nR05 now retains one request ID for the exact Selection intent `(Need/revision, Application/version/hash, covered slots)` across ambiguous retry and allocates a new ID when that semantic intent changes. Historical Selection rows are not backfilled with fabricated request hashes.\n\nLive Supabase remains predecessor-only at `76 / 20260906065758_clean_ru5_selection_eligibility_revalidation`. P0D-02 is **NOT canonical, NOT live, NOT closed** at this checkpoint. The migration is registered only as `PENDING_FORWARD_MIGRATION`; exact-head proof and PR PRE-P4/CodeQL gates are still required before any live write. D0140 production ALLOW, RU-4B public Q&A, monetization, Povezivanje and Application AI remain unchanged and blocked.\n\n## Predecessor authoritative checkpoint — 2026-09-06 — RU-5 MANUAL SELECTION ELIGIBILITY REVALIDATION CLOSED / CANONICAL / LIVE\n'''
          continuity = continuity.replace(old, wip, 1)
          continuity_path.write_text(continuity, encoding='utf-8', newline='\n')
          PY

          python supabase/migrations/check_migration_integrity.py
          git diff --check

      - name: Commit metadata and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'msljivic031'
          git config user.email 'msljivic031@gmail.com'
          git rm .github/workflows/p0d02-register-pending-metadata.yml
          git add supabase/migrations/MD5_MANIFEST.txt \
                  supabase/migrations/MIGRATION_PROVENANCE.json \
                  docs/implementation/IMPLEMENTATION_CONTINUITY.md
          git status --short
          git commit -m 'docs(p0d02): register pending selection idempotency provenance'
          git push origin HEAD:${GITHUB_REF_NAME}
