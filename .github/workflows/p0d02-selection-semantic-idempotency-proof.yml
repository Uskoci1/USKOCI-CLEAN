name: P0D-02 Selection Semantic Idempotency proof

on:
  push:
    branches:
      - proof/p0d02-selection-semantic-idempotency-20260906
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0d02-selection-semantic-idempotency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0d02-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: latest

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Replay stable predecessor through live 76 Selection eligibility
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/uskoci-p0d02-proof
          mkdir -p /tmp/uskoci-p0d02-proof
          cd /tmp/uskoci-p0d02-proof
          supabase init
          rm -rf supabase/migrations
          mkdir -p supabase/migrations

          cp "$GITHUB_WORKSPACE/supabase/proofs/ru2_predecessor_bootstrap.sql" \
             supabase/migrations/20260825000000_p0d02_live_bootstrap.sql

          for f in "$GITHUB_WORKSPACE"/supabase/migrations/*.sql; do
            b="$(basename "$f")"
            case "$b" in
              20260903*|20260904*|20260905*|20260906*) ;;
              20260901105922_clean_completion_and_writer_authenticated_proof.sql|20260901113333_clean_ai_interview_turn_authenticated_proof.sql|20260901114029_clean_ai_fact_supersession_and_human_correction.sql) ;;
              *) cp "$f" "supabase/migrations/$b" ;;
            esac
          done

          cp "$GITHUB_WORKSPACE/supabase/proofs/ru2_replay_20260901105922_durable_effects.sql" \
             supabase/migrations/20260901105922_clean_completion_and_writer_authenticated_proof.sql
          cp "$GITHUB_WORKSPACE/supabase/proofs/ru2_replay_20260901113333_durable_effects.sql" \
             supabase/migrations/20260901113333_clean_ai_interview_turn_authenticated_proof.sql

          awk '/^-- Runtime proofs: no retained rows\.$/{exit} {print}' \
            "$GITHUB_WORKSPACE/supabase/migrations/20260901114029_clean_ai_fact_supersession_and_human_correction.sql" \
            > supabase/migrations/20260901114029_clean_ai_fact_supersession_and_human_correction.sql
          cat >> supabase/migrations/20260901114029_clean_ai_fact_supersession_and_human_correction.sql <<'SQL'
          comment on function public.rpc_ai_confirm_fact(uuid) is 'AUTHENTICATED_RUNTIME_PROVEN: human confirmation stamps confirmed_at and confirmed_by_user_id.';
          comment on function public.rpc_ai_correct_fact(uuid,text) is 'AUTHENTICATED_RUNTIME_PROVEN: explicit correction atomically supersedes prior live fact and creates CONFIRMED EXPLICIT_USER_ANSWER provenance.';
          comment on function public.rpc_ai_apply_interview_turn_service(uuid,uuid,text,text,text,jsonb) is 'SERVICE_RUNTIME_PROVEN: repeated canonical keys preserve one-live-fact invariant by superseding before insert; replacement proof rolled back with zero residue.';
          SQL

          supabase db start
          supabase db reset --local
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "delete from supabase_migrations.schema_migrations where version='20260825000000';"

          actual="$(psql "$DB_URL" -Atc "select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations;")"
          test "$actual" = "56/20260901114029"

          apply_live_alias() {
            source_file="$1"
            live_version="$2"
            live_name="$3"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/$source_file"
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -c "insert into supabase_migrations.schema_migrations(version,name) values ('$live_version','$live_name');"
          }

          apply_live_alias 20260903130355_clean_ru0_authority_closure.sql 20260903160812 clean_ru0_authority_closure
          apply_live_alias 20260903165700_clean_ru1_worker_readiness.sql 20260903184545 clean_ru1_worker_readiness
          apply_live_alias 20260903190000_clean_ru2_need_v2_draft.sql 20260903222139 clean_ru2_need_v2_draft
          apply_live_alias 20260903190100_clean_ru2_ai_fact_transition_guard.sql 20260903222333 clean_ru2_ai_fact_transition_guard
          apply_live_alias 20260904090000_clean_ru3_policy_bundle_foundation.sql 20260904090147 clean_ru3_policy_bundle_foundation
          apply_live_alias 20260904103000_clean_ru3_need_publication_decision.sql 20260904102429 clean_ru3_need_publication_decision
          apply_live_alias 20260904111500_clean_ru3_canonical_publish.sql 20260904182402 clean_ru3_canonical_publish
          apply_live_alias 20260904214500_clean_ru4_owner_edit_lock.sql 20260905052130 clean_ru4_owner_edit_lock
          apply_live_alias 20260904223000_clean_ru4_close_remaining_search.sql 20260905052224 clean_ru4_close_remaining_search
          apply_live_alias 20260904230000_clean_ru4_ai_edit_conversation.sql 20260905052336 clean_ru4_ai_edit_conversation
          apply_live_alias 20260904230200_clean_ru4_ai_edit_conversation_live_transfer_reconcile.sql 20260905052651 clean_ru4_ai_edit_conversation_live_transfer_reconcile
          apply_live_alias 20260904230500_clean_ru4_ai_edit_replay_boundary.sql 20260905052713 clean_ru4_ai_edit_replay_boundary
          apply_live_alias 20260905060000_clean_ru4b_preselection_qa_foundation.sql 20260905070010 clean_ru4b_preselection_qa_foundation
          apply_live_alias 20260905060100_clean_ru4b_service_boundary.sql 20260905070029 clean_ru4b_service_boundary
          apply_live_alias 20260905060200_clean_ru4b_inbox_event_contract.sql 20260905070046 clean_ru4b_inbox_event_contract
          apply_live_alias 20260905133000_clean_ru5_public_profile_projection.sql 20260905163927 clean_ru5_public_profile_projection
          apply_live_alias 20260905190000_clean_ru5_atomic_application_submit.sql 20260905190040 clean_ru5_atomic_application_submit
          apply_live_alias 20260905211500_clean_ru5_my_applications_projection.sql 20260905200133 clean_ru5_my_applications_projection
          apply_live_alias 20260905223000_clean_ru5_candidate_projection.sql 20260905230326 clean_ru5_candidate_projection
          apply_live_alias 20260906010000_clean_ru5_selection_eligibility_revalidation.sql 20260906065758 clean_ru5_selection_eligibility_revalidation

          actual="$(psql "$DB_URL" -Atc "select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations;")"
          echo "live76_predecessor=$actual"
          test "$actual" = "76/20260906065758"
          test "$(psql "$DB_URL" -Atc "select md5(pg_get_functiondef('public.rpc_select_response(uuid,integer,uuid,integer,text,text)'::regprocedure));")" = "ea1c1c40783dbfb9eeab527c128f9dd0"
          test "$(psql "$DB_URL" -Atc "select md5(pg_get_functiondef('public.rpc_list_need_candidates(uuid)'::regprocedure));")" = "1978ce1d5852cef46f94e81468d37bba"
          echo "PASS P0D02_PREDECESSOR live_76_selection_eligibility"

      - name: Capture candidate checksum
        id: candidate_checksum
        shell: bash
        run: |
          set -euo pipefail
          file="supabase/migrations/20260906080000_clean_p0d02_selection_semantic_idempotency.sql"
          md5="$(md5sum "$file" | awk '{print $1}')"
          bytes="$(wc -c < "$file" | tr -d ' ')"
          printf 'md5=%s\nbytes=%s\n' "$md5" "$bytes" | tee /tmp/p0d02-checksum.txt
          echo "md5=$md5" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"

      - name: Publish candidate checksum evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p0d02-md5-${{ steps.candidate_checksum.outputs.md5 }}-bytes-${{ steps.candidate_checksum.outputs.bytes }}
          path: /tmp/p0d02-checksum.txt
          retention-days: 7

      - name: Guard P0D-02 narrow scope
        shell: bash
        run: |
          set -euo pipefail
          file="supabase/migrations/20260906080000_clean_p0d02_selection_semantic_idempotency.sql"
          test "$(grep -Eic '^create table private.selection_commands' "$file")" = "1"
          test "$(grep -Eic '^create or replace function public.rpc_select_response' "$file")" = "1"
          test "$(grep -Eic '^create or replace function public.rpc_list_need_candidates' "$file")" = "0"
          grep -F "IDEMPOTENCY_KEY_REUSED" "$file"
          grep -F "pg_advisory_xact_lock" "$file"
          grep -F "Historical Selection rows intentionally have no fabricated request hash" "$file"
          if grep -Eiq '^create table public\.' "$file"; then
            echo 'P0D-02 must not create a new public table' >&2
            exit 1
          fi

      - name: Apply isolated P0D-02 candidate
        shell: bash
        run: |
          set -euo pipefail
          before_submit="$(psql "$DB_URL" -Atc "select md5(pg_get_functiondef('public.rpc_submit_response(uuid,integer,uuid,integer,integer,timestamptz,timestamptz,text,text)'::regprocedure));")"
          before_withdraw="$(psql "$DB_URL" -Atc "select md5(pg_get_functiondef('public.rpc_withdraw_response(uuid,integer,integer,text,text)'::regprocedure));")"
          before_match="$(psql "$DB_URL" -Atc "select md5(pg_get_functiondef('private.match_detail(uuid,uuid)'::regprocedure));")"
          before_candidates="$(psql "$DB_URL" -Atc "select md5(pg_get_functiondef('public.rpc_list_need_candidates(uuid)'::regprocedure));")"
          before_select="$(psql "$DB_URL" -Atc "select md5(pg_get_functiondef('public.rpc_select_response(uuid,integer,uuid,integer,text,text)'::regprocedure));")"

          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20260906080000_clean_p0d02_selection_semantic_idempotency.sql"

          after_submit="$(psql "$DB_URL" -Atc "select md5(pg_get_functiondef('public.rpc_submit_response(uuid,integer,uuid,integer,integer,timestamptz,timestamptz,text,text)'::regprocedure));")"
          after_withdraw="$(psql "$DB_URL" -Atc "select md5(pg_get_functiondef('public.rpc_withdraw_response(uuid,integer,integer,text,text)'::regprocedure));")"
          after_match="$(psql "$DB_URL" -Atc "select md5(pg_get_functiondef('private.match_detail(uuid,uuid)'::regprocedure));")"
          after_candidates="$(psql "$DB_URL" -Atc "select md5(pg_get_functiondef('public.rpc_list_need_candidates(uuid)'::regprocedure));")"
          after_select="$(psql "$DB_URL" -Atc "select md5(pg_get_functiondef('public.rpc_select_response(uuid,integer,uuid,integer,text,text)'::regprocedure));")"

          test "$before_submit" = "$after_submit"
          test "$before_withdraw" = "$after_withdraw"
          test "$before_match" = "$after_match"
          test "$before_candidates" = "$after_candidates"
          test "$before_select" != "$after_select"
          test "$(psql "$DB_URL" -Atc "select to_regclass('private.selection_commands') is not null;")" = "t"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('authenticated','public.rpc_select_response(uuid,integer,uuid,integer,text,text)','EXECUTE');")" = "t"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('service_role','public.rpc_select_response(uuid,integer,uuid,integer,text,text)','EXECUTE');")" = "t"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('anon','public.rpc_select_response(uuid,integer,uuid,integer,text,text)','EXECUTE');")" = "f"
          test "$(psql "$DB_URL" -Atc "select has_table_privilege('authenticated','private.selection_commands','SELECT');")" = "f"
          test "$(psql "$DB_URL" -Atc "select has_table_privilege('service_role','private.selection_commands','SELECT');")" = "f"
          echo "selection_before=$before_select selection_after=$after_select"

      - name: Run focused authenticated P0D-02 proof
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/proofs/p0d02_selection_semantic_idempotency_runtime_proof.sql" | tee /tmp/p0d02-proof.log
          grep -F "PASS P0D02_SELECTION_SEMANTIC_IDEMPOTENCY same_key_same_payload same_agreement no_duplicate_rows different_response_rejected different_version_rejected different_hash_rejected durable_receipt legacy_exact_replay legacy_mismatch_rejected no_legacy_hash_fabrication private_receipt rollback_only" /tmp/p0d02-proof.log
          test "$(psql "$DB_URL" -Atc "select count(*) from auth.users where email like 'p0d02-%@proof.invalid';")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from private.selection_commands;")" = "0"

      - name: Prove true concurrent Selection semantics
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/proofs/p0d02_selection_concurrency_seed.sql" | tee /tmp/p0d02-concurrency-seed.log
          grep -F "PASS P0D02_CONCURRENCY_FIXTURES" /tmp/p0d02-concurrency-seed.log

          requester="f0d02000-0000-4000-8000-000000000001"
          same_need="f0d02000-0000-4000-8000-000000000101"
          same_response="f0d02000-0000-4000-8000-000000000201"
          diff_need="f0d02000-0000-4000-8000-000000000102"
          diff_response="f0d02000-0000-4000-8000-000000000202"

          run_select() {
            local need_id="$1"
            local response_id="$2"
            local hash="$3"
            local request_id="$4"
            local out="$5"
            local err="$6"
            psql "$DB_URL" -X -qAt -v ON_ERROR_STOP=1 \
              -c "begin; set local role authenticated; set local \"request.jwt.claim.sub\" = '$requester'; select public.rpc_select_response('$need_id'::uuid,1,'$response_id'::uuid,1,'$hash','$request_id'); commit;" \
              >"$out" 2>"$err"
          }

          # Same actor + same request key + same payload must serialize and replay.
          set +e
          run_select "$same_need" "$same_response" "$(printf 'e%.0s' {1..64})" "p0d02-concurrent-same" /tmp/p0d02-same-1.out /tmp/p0d02-same-1.err & p1=$!
          run_select "$same_need" "$same_response" "$(printf 'e%.0s' {1..64})" "p0d02-concurrent-same" /tmp/p0d02-same-2.out /tmp/p0d02-same-2.err & p2=$!
          wait "$p1"; s1=$?
          wait "$p2"; s2=$?
          set -e
          if [ "$s1" -ne 0 ] || [ "$s2" -ne 0 ]; then
            cat /tmp/p0d02-same-1.err /tmp/p0d02-same-2.err >&2
            exit 1
          fi
          a1="$(grep -E '^[0-9a-f-]{36}$' /tmp/p0d02-same-1.out | tail -n1)"
          a2="$(grep -E '^[0-9a-f-]{36}$' /tmp/p0d02-same-2.out | tail -n1)"
          test -n "$a1"
          test "$a1" = "$a2"
          test "$(psql "$DB_URL" -Atc "select count(*) from private.selection_commands where need_id='$same_need'::uuid;")" = "1"
          test "$(psql "$DB_URL" -Atc "select count(*) from public.need_selections where need_id='$same_need'::uuid and status='SELECTED';")" = "1"
          test "$(psql "$DB_URL" -Atc "select count(*) from public.agreements where need_id='$same_need'::uuid;")" = "1"

          # Different request keys race for one seat. Need row locking remains the
          # business concurrency authority: exactly one command may commit.
          set +e
          run_select "$diff_need" "$diff_response" "$(printf 'f%.0s' {1..64})" "p0d02-concurrent-a" /tmp/p0d02-diff-a.out /tmp/p0d02-diff-a.err & p3=$!
          run_select "$diff_need" "$diff_response" "$(printf 'f%.0s' {1..64})" "p0d02-concurrent-b" /tmp/p0d02-diff-b.out /tmp/p0d02-diff-b.err & p4=$!
          wait "$p3"; s3=$?
          wait "$p4"; s4=$?
          set -e
          if { [ "$s3" -eq 0 ] && [ "$s4" -eq 0 ]; } || { [ "$s3" -ne 0 ] && [ "$s4" -ne 0 ]; }; then
            echo "expected exactly one different-key winner, got statuses $s3/$s4" >&2
            cat /tmp/p0d02-diff-a.err /tmp/p0d02-diff-b.err >&2
            exit 1
          fi
          if [ "$s3" -ne 0 ]; then failing_err=/tmp/p0d02-diff-a.err; else failing_err=/tmp/p0d02-diff-b.err; fi
          grep -Eq 'NEED_NOT_OPEN|RESPONSE_NOT_SELECTABLE' "$failing_err"
          test "$(psql "$DB_URL" -Atc "select count(*) from private.selection_commands where need_id='$diff_need'::uuid;")" = "1"
          test "$(psql "$DB_URL" -Atc "select count(*) from public.need_selections where need_id='$diff_need'::uuid and status='SELECTED';")" = "1"
          test "$(psql "$DB_URL" -Atc "select count(*) from public.agreements where need_id='$diff_need'::uuid;")" = "1"

          echo "PASS P0D02_TRUE_CONCURRENCY same_key_same_payload_same_agreement different_keys_one_winner one_selection one_agreement"

          # Explicit disposable-fixture cleanup. No proof residue may remain.
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          delete from public.agreement_execution
           where agreement_id in (select id from public.agreements where need_id in (
             'f0d02000-0000-4000-8000-000000000101'::uuid,
             'f0d02000-0000-4000-8000-000000000102'::uuid));
          delete from public.agreement_versions
           where agreement_id in (select id from public.agreements where need_id in (
             'f0d02000-0000-4000-8000-000000000101'::uuid,
             'f0d02000-0000-4000-8000-000000000102'::uuid));
          delete from private.selection_commands where need_id in (
             'f0d02000-0000-4000-8000-000000000101'::uuid,
             'f0d02000-0000-4000-8000-000000000102'::uuid);
          delete from public.agreements where need_id in (
             'f0d02000-0000-4000-8000-000000000101'::uuid,
             'f0d02000-0000-4000-8000-000000000102'::uuid);
          delete from public.need_selections where need_id in (
             'f0d02000-0000-4000-8000-000000000101'::uuid,
             'f0d02000-0000-4000-8000-000000000102'::uuid);
          delete from public.marketplace_response_versions where response_id in (
             'f0d02000-0000-4000-8000-000000000201'::uuid,
             'f0d02000-0000-4000-8000-000000000202'::uuid);
          delete from public.marketplace_responses where id in (
             'f0d02000-0000-4000-8000-000000000201'::uuid,
             'f0d02000-0000-4000-8000-000000000202'::uuid);
          alter table public.needs disable trigger user;
          delete from public.needs where id in (
             'f0d02000-0000-4000-8000-000000000101'::uuid,
             'f0d02000-0000-4000-8000-000000000102'::uuid);
          alter table public.needs enable trigger user;
          alter table public.app_profiles disable trigger user;
          delete from public.app_profiles where account_id in (
             'f0d02000-0000-4000-8000-000000000001'::uuid,
             'f0d02000-0000-4000-8000-000000000002'::uuid);
          alter table public.app_profiles enable trigger user;
          delete from auth.users where id in (
             'f0d02000-0000-4000-8000-000000000001'::uuid,
             'f0d02000-0000-4000-8000-000000000002'::uuid);
          commit;
          SQL
          test "$(psql "$DB_URL" -Atc "select count(*) from auth.users where id::text like 'f0d02000-%';")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from public.needs where id in ('$same_need'::uuid,'$diff_need'::uuid);")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from public.marketplace_responses where id in ('$same_response'::uuid,'$diff_response'::uuid);")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from private.selection_commands where client_request_id like 'p0d02-concurrent-%';")" = "0"
          echo "PASS P0D02_TRUE_CONCURRENCY_ZERO_RESIDUE"

      - name: Re-run RU-5 Selection eligibility regression
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/proofs/ru5_selection_eligibility_revalidation_runtime_proof.sql" | tee /tmp/ru5-selection-regression.log
          grep -F "PASS RU5_SELECTION_ELIGIBILITY_REVALIDATION unready_stale team_capacity_stale ready_selectable unready_denied team_capacity_denied zero_partial_writes exact_agreement_binding rollback_only" /tmp/ru5-selection-regression.log
          test "$(psql "$DB_URL" -Atc "select count(*) from auth.users where email like 'ru5-sel-%@proof.invalid';")" = "0"

      - name: Re-run P0D-01 Candidate Projection regression
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/proofs/ru5_p0d01_candidate_projection_runtime_proof.sql" | tee /tmp/p0d01-regression.log
          grep -F "PASS RU5_P0D01 requester_owner selectable_exact stale overfill full selected withdrawn closed draft_excluded public_safe snapshot_v1 legacy_unproven projection_read_only selection_binding rollback_only" /tmp/p0d01-regression.log
          test "$(psql "$DB_URL" -Atc "select count(*) from auth.users where email like 'ru5-p0d01-%@proof.invalid';")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from private.publication_policy_bundles;")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from private.preselection_qa_commands;")" = "0"

      - name: Stop disposable DB before client checks
        if: always()
        shell: bash
        working-directory: /tmp/uskoci-p0d02-proof
        run: supabase stop --no-backup || true

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript contract check
        run: npx tsc --noEmit

      - name: Focused R05 request identity test
        run: npm test -- --runInBand src/lib/__tests__/selectionIdempotency.test.ts

      - name: Regression tests
        run: npm test -- --runInBand
