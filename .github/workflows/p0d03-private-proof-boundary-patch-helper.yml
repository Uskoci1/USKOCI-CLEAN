name: P0D-03 Private Proof Boundary Patch Helper

on:
  push:
    branches:
      - proof/p0d03-requester-connection-activation-v1-20260906
    paths:
      - .github/workflows/p0d03-private-proof-boundary-patch-helper.yml

permissions:
  contents: write

jobs:
  patch-private-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Keep authenticated proof outside private schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/proofs/p0d03_requester_connection_activation_v1_runtime_proof.sql')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  act_count integer;\n  sel_count integer;\n', '  sel_count integer;\n', 1)
          s = s.replace('  select count(*) into act_count from private.connection_activations;\n  select count(*) into sel_count from public.need_selections;\n', '  select count(*) into sel_count from public.need_selections;\n', 1)
          s = s.replace("  if (select count(*) from private.connection_activations) <> act_count\n     or (select count(*) from public.need_selections) <> sel_count\n", "  if (select count(*) from public.need_selections) <> sel_count\n", 1)
          s = s.replace("  if (select count(*) from private.connection_activations) <> act_count then\n    raise exception 'P0D03_DIFFERENT_PAYLOAD_CREATED_ACTIVATION';\n  end if;\n", '', 1)
          needle = "begin\n  select * into a from private.connection_activations where agreement_id=expected_agreement;\n"
          replacement = "begin\n  if (select count(*) from private.connection_activations) <> 1 then\n    raise exception 'P0D03_ACTIVATION_COUNT_NOT_ONE';\n  end if;\n\n  select * into a from private.connection_activations where agreement_id=expected_agreement;\n"
          if needle not in s:
              raise SystemExit('receipt contract insertion point not found')
          s = s.replace(needle, replacement, 1)
          forbidden = [
              'act_count integer;',
              'select count(*) into act_count from private.connection_activations;',
              "P0D03_DIFFERENT_PAYLOAD_CREATED_ACTIVATION"
          ]
          if any(x in s for x in forbidden):
              raise SystemExit('authenticated private-read residue remains')
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          git diff --check
          grep -F "P0D03_ACTIVATION_COUNT_NOT_ONE" supabase/proofs/p0d03_requester_connection_activation_v1_runtime_proof.sql

      - name: Commit proof-only private-boundary repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'msljivic031'
          git config user.email 'msljivic031@gmail.com'
          git add supabase/proofs/p0d03_requester_connection_activation_v1_runtime_proof.sql
          git commit -m 'test(p0d03): respect private ledger boundary in authenticated proof'
          git push origin HEAD:${GITHUB_REF_NAME}
