name: P0D-03 Requester Connection Activation V1 proof

on:
  push:
    branches:
      - proof/p0d03-requester-connection-activation-v1-20260906
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0d03-requester-connection-activation-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0d03-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: latest

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Run live-77 replay and P0D-03 backend proof
        shell: bash
        run: bash supabase/proofs/p0d03_ci_proof.sh

      - name: Publish candidate checksum evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0d03-candidate-checksum-${{ github.sha }}
          path: /tmp/p0d03-checksum.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript contract check
        run: npx tsc --noEmit

      - name: Focused R05 request identity regression
        run: npm test -- --runInBand src/lib/__tests__/selectionIdempotency.test.ts

      - name: Regression tests
        run: npm test -- --runInBand
