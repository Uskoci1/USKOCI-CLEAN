name: P0E completion guards authenticated proof
on:
  workflow_dispatch:
  push:
    branches:
      - fix/p0e-completion-guards-20260908
permissions:
  contents: read
env:
  CI: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  N07_ARTIFACT_DIR: artifacts/p0e-completion-guards/predecessor-n07
  N08_ARTIFACT_DIR: artifacts/p0e-completion-guards/predecessor-n08
  P0E_ARTIFACT_DIR: artifacts/p0e-completion-guards
jobs:
  authenticated-completion-guards-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify applied migration bytes and provenance
        run: sh supabase/migrations/check_md5.sh
      - name: Set up proven Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: TypeScript, regression and local-target guard
        run: |
          npx tsc --noEmit
          npm test -- --runInBand
          node --check supabase/proofs/completion/p0e_completion_guards_proof.mjs
          node --check supabase/proofs/completion/p0e_completion_guards_predecessor.mjs
          node --test supabase/proofs/completion/p0e_completion_guards_predecessor.test.mjs
          node --test supabase/proofs/ru5_device_ui_local_guard.test.mjs
          python3 supabase/migrations/check_migration_integrity.py
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh
      - name: Prepare existing disposable Auth fixture
        run: node supabase/proofs/ru5_device_ui_fixture.mjs
      - name: Reconstruct exact canonical N07 and N08 predecessor contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$N07_ARTIFACT_DIR" "$N08_ARTIFACT_DIR"
          node supabase/proofs/notifications/n07_forward_promotion_proof.mjs 2>&1 | tee "$N07_ARTIFACT_DIR/proof.log"
          grep -F 'PASS N07_FORWARD_NOTIFICATION_ADMISSION' "$N07_ARTIFACT_DIR/proof.log"
          node supabase/proofs/notifications/n08_preferences_proof.mjs 2>&1 | tee "$N08_ARTIFACT_DIR/proof.log"
          grep -F 'PASS N08_NOTIFICATION_PREFERENCES' "$N08_ARTIFACT_DIR/proof.log"
      - name: Reconstruct exact canonical D03 and AI DRAFT authority to live87
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/completion/p0e_completion_guards_predecessor.mjs 2>&1 | tee "$P0E_ARTIFACT_DIR/predecessor.log"
          grep -F 'PASS P0E_COMPLETION_PREDECESSOR_INTEGRATION' "$P0E_ARTIFACT_DIR/predecessor.log"
      - name: Reproduce predecessor defects then apply exact P0E source and prove completion truth
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/completion/p0e_completion_guards_proof.mjs 2>&1 | tee "$P0E_ARTIFACT_DIR/proof.log"
          grep -F 'PASS P0E_COMPLETION_GUARDS' "$P0E_ARTIFACT_DIR/proof.log"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.env.P0E_ARTIFACT_DIR+"/proof-report.json")); if(r.result!=="PASS" || r.source_sha!==process.env.GITHUB_SHA || r.live_access || r.live_promotion || r.provider_called || r.migration_history_count!==r.predecessor_history_count+1 || r.migration_history_count!==r.predecessor_plan.source_migration_count || r.predecessor_history_count!==87 || !r.exact_forward_file_applied_disposable || !r.original_predecessor_full_history_unchanged || r.original_full_history_sha256!==r.after_original_full_history_sha256 || r.lock_interleavings.length!==2 || !r.predecessor.deadline_extended_on_replay || !r.predecessor.cancelled_agreement_resurrected || r.predecessor.duplicate_problem_messages!==2 || r.checks.length!==14) process.exit(1);'
      - name: Existing completion and problem client regressions
        shell: bash
        run: |
          set -euo pipefail
          npx jest --runInBand src/data/__tests__/m07-zavrsetak.test.ts src/data/__tests__/cdl-a07-completion-mark-equivalence.test.ts src/data/__tests__/cdl-a06-problem-report-equivalence.test.ts
      - name: Upload exact source-bound disposable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P0E-COMPLETION-GUARDS-EVIDENCE
          path: artifacts/p0e-completion-guards/
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown disposable Supabase
        if: always()
        shell: bash
        run: |
          if [[ -n "${RU5_DEVICE_PROOF_DIR:-}" && -d "$RU5_DEVICE_PROOF_DIR" ]]; then
            cd "$RU5_DEVICE_PROOF_DIR"
            supabase stop --no-backup
          fi
