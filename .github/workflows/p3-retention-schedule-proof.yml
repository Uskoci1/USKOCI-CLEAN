name: P3 retention schedule authenticated proof
on:
  workflow_dispatch:
  pull_request:
    branches: [clean-alpha-backend]
    paths:
      - '.github/workflows/p3-retention-schedule-proof.yml'
      - 'supabase/migrations/**'
      - 'supabase/proofs/legal/p3_retention_schedule*'
      - 'supabase/proofs/legal/p3_retention_pending_inventory*'
      - 'supabase/proofs/notifications/n07_forward*'
      - 'supabase/proofs/notifications/n08_preferences*'
      - 'supabase/proofs/ru5_device_ui_live79_env.sh'
  push:
    branches:
      - feat/p3-retention-schedule-20260908
permissions:
  contents: read
env:
  CI: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  N07_ARTIFACT_DIR: artifacts/p3-retention-schedule/predecessor-n07
  N08_ARTIFACT_DIR: artifacts/p3-retention-schedule/predecessor-n08
  P3_ARTIFACT_DIR: artifacts/p3-retention-schedule
jobs:
  authenticated-retention-schedule-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact proof source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify applied migration bytes and provenance
        run: sh supabase/migrations/check_md5.sh
      - name: Set up proven Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: TypeScript, regression and local-target guard
        run: |
          npx tsc --noEmit
          npm test -- --runInBand
          node --check supabase/proofs/legal/p3_retention_schedule_proof.mjs
          node --check supabase/proofs/legal/p3_retention_schedule_predecessor.mjs
          node --test supabase/proofs/legal/p3_retention_schedule_predecessor.test.mjs supabase/proofs/legal/p3_retention_pending_inventory_admission.test.mjs
          node --test supabase/proofs/ru5_device_ui_local_guard.test.mjs
          python3 supabase/migrations/check_migration_integrity.py
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh
      - name: Prepare existing disposable Auth fixture
        run: node supabase/proofs/ru5_device_ui_fixture.mjs
      - name: Reconstruct exact canonical N07 and N08 predecessor contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$N07_ARTIFACT_DIR" "$N08_ARTIFACT_DIR"
          node supabase/proofs/notifications/n07_forward_promotion_proof.mjs 2>&1 | tee "$N07_ARTIFACT_DIR/proof.log"
          grep -F 'PASS N07_FORWARD_NOTIFICATION_ADMISSION' "$N07_ARTIFACT_DIR/proof.log"
          node supabase/proofs/notifications/n08_preferences_proof.mjs 2>&1 | tee "$N08_ARTIFACT_DIR/proof.log"
          grep -F 'PASS N08_NOTIFICATION_PREFERENCES' "$N08_ARTIFACT_DIR/proof.log"
      - name: Reconstruct exact canonical predecessor through earlier pending forwards
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/legal/p3_retention_schedule_predecessor.mjs 2>&1 | tee "$P3_ARTIFACT_DIR/predecessor.log"
          grep -F 'PASS P3_RETENTION_PREDECESSOR_INTEGRATION' "$P3_ARTIFACT_DIR/predecessor.log"
      - name: Apply exact P3 source and prove fail-closed retention schedule registry
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/legal/p3_retention_schedule_proof.mjs 2>&1 | tee "$P3_ARTIFACT_DIR/proof.log"
          grep -F 'PASS P3_RETENTION_SCHEDULE' "$P3_ARTIFACT_DIR/proof.log"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.env.P3_ARTIFACT_DIR+"/proof-report.json")); if(r.result!=="PASS" || r.source_sha!==process.env.GITHUB_SHA || r.live_access || r.live_promotion || r.provider_called || r.legal_content_real || r.purge_executed || !r.successor_replay || r.successor_replay.count!==r.predecessor_plan.pending_successor_count || !r.successor_replay.original_history_unchanged || !r.successor_replay.retention_projection_unchanged || !r.successor_replay.retention_rows_unchanged || !r.successor_replay.retention_functions_and_grants_unchanged || r.migration_history_count!==r.predecessor_history_count+1+r.successor_replay.count || r.migration_history_count!==r.predecessor_plan.source_migration_count || r.predecessor_history_count!==r.predecessor_plan.expected_predecessor_count || !r.exact_forward_file_applied_disposable || !r.original_predecessor_full_history_unchanged || r.original_full_history_sha256!==r.after_original_full_history_sha256 || r.lock_interleavings.length!==1 || r.checks.length!==8) process.exit(1);'
      - name: Upload exact source-bound disposable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P3-RETENTION-SCHEDULE-EVIDENCE
          path: artifacts/p3-retention-schedule/
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown disposable Supabase
        if: always()
        shell: bash
        run: |
          if [[ -n "${RU5_DEVICE_PROOF_DIR:-}" && -d "$RU5_DEVICE_PROOF_DIR" ]]; then
            cd "$RU5_DEVICE_PROOF_DIR"
            supabase stop --no-backup
          fi
