name: P7 signup confirmation recovery
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/p7-signup-confirmation-proof.yml'
      - 'src/contracts/auth.ts'
      - 'src/data/authSignupRedirect.ts'
      - 'src/data/authClientService.ts'
      - 'src/app/auth.tsx'
      - 'src/data/__tests__/auth-client.test.ts'
      - 'src/data/__tests__/auth-entry-surface.test.tsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx jest -w 2 --testTimeout=30000 --runTestsByPath src/data/__tests__/auth-client.test.ts src/data/__tests__/auth-entry-surface.test.tsx src/data/__tests__/auth-route-parameters.test.tsx
      - run: npx jest -w 3 --testTimeout=30000
