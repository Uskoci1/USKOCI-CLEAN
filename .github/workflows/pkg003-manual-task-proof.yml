name: PKG-003 manual task proof

on:
  push:
    branches:
      - work/pre-v3-engine-integration-20260911
    paths:
      - 'src/data/manualNeedFactClientService.ts'
      - 'src/data/__tests__/pkg003-manual-need-fact.test.ts'
      - 'src/data/__tests__/pkg003-manual-entry-source.test.ts'
      - 'src/app/(app)/novi-zadatak.tsx'
      - 'src/app/(app)/rucni-zadatak.tsx'
      - 'src/app/(app)/potrebe.tsx'
      - 'src/app/(app)/_layout.tsx'
      - 'supabase/candidates/pkg003_manual_need_fact_v2.sql'
      - 'supabase/proofs/pkg003_manual_need_fact_runtime_proof.sql'
      - '.github/workflows/pkg003-manual-task-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg003-manual-task-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-candidate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "CANDIDATE_SHA=$GITHUB_SHA" | tee /tmp/pkg003-source.txt
          echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')" | tee -a /tmp/pkg003-source.txt

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Start disposable database and replay exact source migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db start
          supabase db reset --local | tee /tmp/pkg003-db-reset.log
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc \
            "select count(*)::text || '/' || coalesce(max(version),'<none>') from supabase_migrations.schema_migrations" \
            | tee /tmp/pkg003-schema-before.txt

      - name: Apply PKG-003 source candidate only in disposable database
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/candidates/pkg003_manual_need_fact_v2.sql \
            | tee /tmp/pkg003-candidate-apply.log
          test "$(psql "$DB_URL" -Atc "select to_regprocedure('public.rpc_set_manual_need_fact_v2(uuid,uuid,text,jsonb,text)') is not null")" = "t"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('authenticated','public.rpc_set_manual_need_fact_v2(uuid,uuid,text,jsonb,text)','EXECUTE')")" = "t"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('anon','public.rpc_set_manual_need_fact_v2(uuid,uuid,text,jsonb,text)','EXECUTE')")" = "f"

      - name: Run rollback-only owner attacker replay and canonical review proof
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/proofs/pkg003_manual_need_fact_runtime_proof.sql \
            | tee /tmp/pkg003-runtime.log
          grep -F "PASS PKG003_MANUAL_NEED_FACT provider_independent owner_only idempotent one_live_fact location_authority canonical_review canonical_draft zero_residue" \
            /tmp/pkg003-runtime.log
          test "$(psql "$DB_URL" -Atc "select count(*) from auth.users where email like 'pkg003-proof-%@proof.invalid'")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from private.manual_need_fact_commands")" = "0"

      - name: Stop disposable database
        if: always()
        shell: bash
        run: supabase stop --no-backup || true

      - name: Install exact app dependencies
        run: npm ci

      - name: TypeScript exact candidate
        run: npx tsc --noEmit

      - name: PKG-003 focused regressions
        run: >-
          npm test -- --runInBand
          src/data/__tests__/pkg003-manual-need-fact.test.ts
          src/data/__tests__/pkg003-manual-entry-source.test.ts
          src/data/__tests__/pkg003-location-return.test.tsx
          src/data/__tests__/pkg003-timezone.test.ts

      - name: Full regression exact candidate
        run: npm test -- --runInBand

      - name: Write execution receipt fragment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pkg003-receipt.json <<JSON
          {
            "packageId":"PKG-003",
            "gapIds":["GAP-0015","GAP-0039","GAP-0040"],
            "candidateSha":"$GITHUB_SHA",
            "treeSha":"$(git rev-parse 'HEAD^{tree}')",
            "workflowRunId":"$GITHUB_RUN_ID",
            "workflowRunAttempt":"$GITHUB_RUN_ATTEMPT",
            "disposableDbOnly":true,
            "liveDbChanged":false,
            "providerCalled":false
          }
          JSON
          cp /tmp/pkg003-source.txt /tmp/pkg003-source-binding.txt

      - name: Upload PKG-003 proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg003-proof-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            /tmp/pkg003-receipt.json
            /tmp/pkg003-source-binding.txt
            /tmp/pkg003-schema-before.txt
            /tmp/pkg003-db-reset.log
            /tmp/pkg003-candidate-apply.log
            /tmp/pkg003-runtime.log
