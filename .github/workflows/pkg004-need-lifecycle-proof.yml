name: PKG-004 need lifecycle proof

on:
  push:
    branches:
      - work/pre-v3-engine-integration-20260911
    paths:
      - 'src/data/needLifecycleController.ts'
      - 'src/data/needLifecycleClientService.ts'
      - 'src/data/ru4Production.ts'
      - 'src/data/supabaseIzvor.ts'
      - 'src/ui/needs/NeedLifecycleActions.tsx'
      - 'src/ui/v2/NeedPresentation.tsx'
      - 'src/app/(app)/potrebe/[id]/pregled.tsx'
      - 'src/app/(app)/prilike/[id].tsx'
      - 'src/app/(app)/prilike/[id]/prijava.tsx'
      - 'src/data/__tests__/need-lifecycle-controller.test.ts'
      - 'src/data/__tests__/v5-need-lifecycle-screen.test.tsx'
      - 'src/data/__tests__/pkg004-lifecycle-recovery.test.tsx'
      - 'src/data/__tests__/pkg004-lifecycle-wiring.test.ts'
      - 'src/data/__tests__/pkg004-remaining-search.test.ts'
      - 'src/data/__tests__/opportunities-read.test.ts'
      - 'src/data/__tests__/task-detail-read.test.ts'
      - 'src/data/__tests__/task-detail-screen.test.tsx'
      - 'src/data/__tests__/application-composer-read.test.tsx'
      - '.github/workflows/pkg004-need-lifecycle-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg004-need-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-candidate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "PACKAGE=PKG-004"
            echo "CANDIDATE_SHA=$GITHUB_SHA"
            echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
          } | tee /tmp/pkg004-source-binding.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript exact candidate
        run: npx tsc --noEmit

      - name: PKG-004 focused regressions
        run: >-
          npm test -- --runInBand
          src/data/__tests__/need-lifecycle-controller.test.ts
          src/data/__tests__/v5-need-lifecycle-screen.test.tsx
          src/data/__tests__/pkg004-lifecycle-recovery.test.tsx
          src/data/__tests__/pkg004-lifecycle-wiring.test.ts
          src/data/__tests__/pkg004-remaining-search.test.ts
          src/data/__tests__/opportunities-read.test.ts
          src/data/__tests__/task-detail-read.test.ts
          src/data/__tests__/task-detail-screen.test.tsx
          src/data/__tests__/application-composer-read.test.tsx

      - name: Full regression exact candidate
        run: npm test -- --runInBand

      - name: Write proof receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pkg004-receipt.json <<JSON
          {
            "packageId":"PKG-004",
            "gapIds":["GAP-0025","GAP-0026","GAP-0030"],
            "candidateSha":"$GITHUB_SHA",
            "treeSha":"$(git rev-parse 'HEAD^{tree}')",
            "workflowRunId":"$GITHUB_RUN_ID",
            "workflowRunAttempt":"$GITHUB_RUN_ATTEMPT",
            "liveDbChanged":false,
            "providerCalled":false,
            "productionChanged":false
          }
          JSON

      - name: Upload PKG-004 proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg004-proof-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            /tmp/pkg004-source-binding.txt
            /tmp/pkg004-receipt.json
