name: PKG-005 Worker onboarding proof

on:
  push:
    branches:
      - work/pre-v3-engine-integration-20260911
    paths:
      - 'src/app/(app)/profil/radnik.tsx'
      - 'src/ui/workerProfile/**'
      - 'src/app/(app)/raspored.tsx'
      - 'src/app/(app)/dogovori.tsx'
      - 'src/ui/v2/AgreementCollectionPresentation.tsx'
      - 'src/data/workerProfileClientService.ts'
      - 'src/data/__tests__/pkg005-*.test.tsx'
      - 'src/data/__tests__/worker-profile-native.test.tsx'
      - 'src/data/__tests__/worker-profile-read.test.ts'
      - 'src/data/__tests__/w02-profile-write-safety.test.ts'
      - 'src/data/__tests__/w02-calendar-native.test.tsx'
      - '.github/workflows/pkg005-worker-onboarding-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg005-worker-onboarding-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-candidate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Capture source identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Original repro and positive Worker onboarding scenarios
        run: npx jest --runInBand src/data/__tests__/pkg005-worker-onboarding.test.tsx

      - name: Worker calendar scope and navigation semantics
        run: npx jest --runInBand src/data/__tests__/pkg005-calendar-scope.test.tsx src/data/__tests__/pkg005-calendar-navigation.test.tsx

      - name: Security replay account and ownership guards
        run: npx jest --runInBand src/data/__tests__/worker-profile-native.test.tsx src/data/__tests__/worker-profile-read.test.ts src/data/__tests__/w02-profile-write-safety.test.ts src/data/__tests__/w02-calendar-native.test.tsx

      - name: Execution Ledger contract
        run: node --test scripts/ci/execution-ledger.test.cjs

      - name: Full regression
        run: npx jest --runInBand

      - name: Write exact-candidate receipt
        if: always()
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.identity.outputs.commit }}
          TREE_SHA: ${{ steps.identity.outputs.tree }}
        run: |
          mkdir -p "$RUNNER_TEMP/pkg005-proof"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const receipt = {
            schemaVersion: 1,
            packageId: 'PKG-005',
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            candidateSha: process.env.CANDIDATE_SHA,
            treeSha: process.env.TREE_SHA,
            workflow: process.env.GITHUB_WORKFLOW,
            jobStatus: process.env.GITHUB_JOB,
            generatedAt: new Date().toISOString(),
            productionApplied: false,
            liveDbChanged: false,
            providerCalled: false,
            deviceProof: false
          };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'pkg005-proof', 'receipt.json'), JSON.stringify(receipt, null, 2) + '\n');
          NODE

      - name: Retain PKG-005 receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pkg005-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pkg005-proof/receipt.json
          if-no-files-found: error
          retention-days: 7
