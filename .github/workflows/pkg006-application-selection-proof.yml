name: PKG-006 application identity and selection proof

on:
  push:
    branches:
      - work/pre-v3-engine-integration-20260911
    paths:
      - 'src/app/(app)/prilike/[id]/prijava.tsx'
      - 'src/data/applicationCommandJournal.ts'
      - 'src/data/applicationSelectionClientService.ts'
      - 'src/ui/v2/ApplicationSelectionPresentation.tsx'
      - 'src/data/__tests__/application-composer-read.test.tsx'
      - 'src/data/__tests__/application-selection-native.test.tsx'
      - 'src/data/__tests__/application-selection-client.test.ts'
      - 'src/data/__tests__/application-command-journal.test.ts'
      - 'supabase/proofs/pkg006/pkg006_selection_concurrency_proof.mjs'
      - 'supabase/proofs/pre_v3/closure_runtime.mjs'
      - '.github/workflows/pkg006-application-selection-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg006-application-selection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-candidate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/pkg006-artifacts

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "PACKAGE=PKG-006"
            echo "CANDIDATE_SHA=$GITHUB_SHA"
            echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
          } | tee /tmp/pkg006-source-binding.txt

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          # Same pin as the PRE-P4 domain proofs and PKG-003/PKG-008.
          version: 2.116.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact app dependencies
        run: npm ci

      # Same disposable history as PKG-003/PKG-008: the shared live79 environment,
      # two real disposable Auth accounts created there (as the W02 proofs do), then
      # the recorded live80-87 aliases and every pending source migration in order.
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh

      - name: Prepare two real disposable Auth accounts
        run: node supabase/proofs/ru5_device_ui_fixture.mjs

      - name: Replay recorded live80-87 aliases and every pending source migration in order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          root = os.environ['GITHUB_WORKSPACE']
          db = os.environ['DB_URL']
          prov = json.load(open(f'{root}/supabase/migrations/MIGRATION_PROVENANCE.json', encoding='utf-8'))

          def scalar(sql):
              return subprocess.run(['psql', db, '-X', '-Atc', sql], text=True, capture_output=True, check=True).stdout.strip()

          def run_sql(sql, label):
              r = subprocess.run(['psql', db, '-X', '-q', '-v', 'ON_ERROR_STOP=1'], input=sql, text=True, capture_output=True)
              if r.returncode:
                  sys.stdout.write(r.stdout[-4000:]); sys.stderr.write(r.stderr[-4000:])
                  sys.exit(f'PKG006_REPLAY_FAILED {label}')

          def apply(file, version, name):
              path = f'{root}/supabase/migrations/{file}'
              print(f'apply_source={file} recorded_as={version}_{name}', flush=True)
              r = subprocess.run(['psql', db, '-X', '-q', '-v', 'ON_ERROR_STOP=1', '-f', path], text=True, capture_output=True)
              if r.returncode:
                  sys.stdout.write(r.stdout[-4000:]); sys.stderr.write(r.stderr[-4000:])
                  sys.exit(f'PKG006_REPLAY_FAILED {file}')
              body = open(path, encoding='utf-8', newline='').read()
              tag = '$pkg006stmt$'
              assert tag not in body, file
              run_sql(f"insert into supabase_migrations.schema_migrations(version,name,statements) "
                      f"values ('{version}','{name}',array[{tag}{body}{tag}]);", file)

          assert scalar('select max(version) from supabase_migrations.schema_migrations') == '20260906141409'
          entries = [e for e in prov['live_history_snapshot']['entries'] if e['version'] > '20260906141409']
          assert len(entries) == 8, len(entries)
          for e in entries:
              apply(e.get('file') or f"{e['version']}_{e['name']}.sql", e['version'], e['name'])
          assert scalar('select count(*) from supabase_migrations.schema_migrations') == '87'
          for p in prov['pending_forward_migrations']:
              apply(p['file'], p['version'], p['name'])
          run_sql("notify pgrst, 'reload schema';", 'reload')
          history = scalar("select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations")
          open('/tmp/pkg006-schema.txt', 'w').write(history + '\n')
          print('history=' + history)
          PY

      - name: Run exact-head application submit, Selection capacity, worker capacity CAS and calendar concurrency proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PRE_V3_ARTIFACT_DIR"
          node supabase/proofs/pkg006/pkg006_selection_concurrency_proof.mjs | tee /tmp/pkg006-proof.log
          grep -F "PASS PKG006_APPLICATION_SELECTION_CONCURRENCY" /tmp/pkg006-proof.log
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.env.PRE_V3_ARTIFACT_DIR+"/pkg006-proof-report.json")); if(r.result!=="PASS"||r.liveAccess||r.providerCalled){console.error(r);process.exit(1)}; console.log("checks="+r.checks.length)'
          cp "$PRE_V3_ARTIFACT_DIR/pkg006-proof-report.json" /tmp/pkg006-proof-report.json

      - name: Stop disposable database
        if: always()
        shell: bash
        run: cd /tmp/uskoci-ru5-device-ui 2>/dev/null && supabase stop --no-backup || true

      - name: TypeScript exact candidate
        run: npx tsc --noEmit

      - name: PKG-006 focused regressions
        run: >-
          npm test -- --runInBand
          src/data/__tests__/application-composer-read.test.tsx
          src/data/__tests__/application-selection-native.test.tsx
          src/data/__tests__/application-selection-client.test.ts
          src/data/__tests__/application-command-journal.test.ts

      - name: Full regression exact candidate
        run: npm test -- --runInBand

      - name: Write proof receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pkg006-receipt.json <<JSON
          {
            "packageId":"PKG-006",
            "gapIds":["GAP-0031","GAP-0023"],
            "candidateSha":"$GITHUB_SHA",
            "treeSha":"$(git rev-parse 'HEAD^{tree}')",
            "workflowRunId":"$GITHUB_RUN_ID",
            "workflowRunAttempt":"$GITHUB_RUN_ATTEMPT",
            "disposableDbOnly":true,
            "liveDbChanged":false,
            "providerCalled":false,
            "productionChanged":false
          }
          JSON

      - name: Upload PKG-006 proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg006-proof-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            /tmp/pkg006-source-binding.txt
            /tmp/pkg006-receipt.json
            /tmp/pkg006-schema.txt
            /tmp/pkg006-proof.log
            /tmp/pkg006-proof-report.json
