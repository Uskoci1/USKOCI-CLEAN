name: PKG-007 agreement completion proof

on:
  push:
    branches:
      - work/pre-v3-engine-integration-20260911
    paths:
      - 'src/app/dogovor/[id].tsx'
      - 'src/contracts/projections.ts'
      - 'src/data/ports.ts'
      - 'src/data/agreementClientService.ts'
      - 'src/data/agreementCompletion.ts'
      - 'src/data/supabaseIzvor.ts'
      - 'src/data/lazniIzvor.ts'
      - 'src/data/serverReceipt.ts'
      - 'src/hooks/useOwnedEditor.ts'
      - 'src/ui/agreements/AgreementCompletionReview.tsx'
      - 'src/data/__tests__/pkg011-agreement-workspace.test.tsx'
      - 'src/data/__tests__/agreement-screen-recovery.test.tsx'
      - 'src/data/__tests__/pkg007-completion-receipt.test.ts'
      - 'src/data/__tests__/pkg007-agreement-actions-read.test.ts'
      - 'src/data/__tests__/pre-v3-agreement-actions.test.ts'
      - 'src/data/__tests__/cdl-a07-completion-mark-equivalence.test.ts'
      - 'src/data/__tests__/cdl-a01-agreement-read-equivalence.test.ts'
      - 'src/data/__tests__/m07-zavrsetak.test.ts'
      - 'src/data/__tests__/agreement-collection-presentation.test.tsx'
      - '.github/workflows/pkg007-agreement-completion-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg007-agreement-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-candidate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "PACKAGE=PKG-007"
            echo "CANDIDATE_SHA=$GITHUB_SHA"
            echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
          } | tee /tmp/pkg007-source-binding.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript exact candidate
        run: npx tsc --noEmit

      - name: PKG-007 focused regressions
        run: >-
          npm test -- --runInBand
          src/data/__tests__/agreement-screen-recovery.test.tsx
          src/data/__tests__/pkg007-completion-receipt.test.ts
          src/data/__tests__/pkg007-agreement-actions-read.test.ts
          src/data/__tests__/pre-v3-agreement-actions.test.ts
          src/data/__tests__/cdl-a07-completion-mark-equivalence.test.ts
          src/data/__tests__/cdl-a01-agreement-read-equivalence.test.ts
          src/data/__tests__/m07-zavrsetak.test.ts
          src/data/__tests__/agreement-collection-presentation.test.tsx

      - name: Full regression exact candidate
        run: npm test -- --runInBand

      - name: Write proof receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pkg007-receipt.json <<JSON
          {
            "packageId":"PKG-007",
            "gapIds":["GAP-0032","GAP-0033"],
            "candidateSha":"$GITHUB_SHA",
            "treeSha":"$(git rev-parse 'HEAD^{tree}')",
            "workflowRunId":"$GITHUB_RUN_ID",
            "workflowRunAttempt":"$GITHUB_RUN_ATTEMPT",
            "liveDbChanged":false,
            "providerCalled":false,
            "productionChanged":false
          }
          JSON

      - name: Upload PKG-007 proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg007-proof-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            /tmp/pkg007-source-binding.txt
            /tmp/pkg007-receipt.json
