name: PKG-008 task photo recovery proof

on:
  push:
    branches:
      - work/pre-v3-engine-integration-20260911
    paths:
      - 'src/app/(app)/fotografije-zadatka.tsx'
      - 'src/data/mediaClientService.ts'
      - 'src/data/__tests__/v5-task-photos-screen.test.tsx'
      - 'src/data/__tests__/media-client.test.ts'
      - 'src/data/__tests__/agreement-photos-hook.test.tsx'
      - 'src/data/__tests__/agreement-photo-composer.test.tsx'
      - 'src/data/__tests__/agreement-photo-client.test.ts'
      - 'src/data/__tests__/agreement-photo-journal.test.ts'
      - 'supabase/candidates/pkg008_media_upload_cancellation.sql'
      - 'supabase/proofs/pkg008_media_upload_cancellation_runtime_proof.sql'
      - '.github/workflows/pkg008-task-photo-recovery-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg008-task-photo-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-candidate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "PACKAGE=PKG-008"
            echo "CANDIDATE_SHA=$GITHUB_SHA"
            echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
          } | tee /tmp/pkg008-source-binding.txt

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          # Same pin as the PRE-P4 domain proofs and PKG-003; "latest" pulled a newer Postgres image on 2026-09-15.
          version: 2.116.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Same disposable history as PKG-003 (run 35037260591): the shared live79
      # environment, the recorded live80-87 aliases and every pending source
      # migration in provenance order. A raw db reset cannot replay this history.
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh

      - name: Replay recorded live80-87 aliases and every pending source migration in order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          root = os.environ['GITHUB_WORKSPACE']
          db = os.environ['DB_URL']
          prov = json.load(open(f'{root}/supabase/migrations/MIGRATION_PROVENANCE.json', encoding='utf-8'))

          def scalar(sql):
              return subprocess.run(['psql', db, '-X', '-Atc', sql], text=True, capture_output=True, check=True).stdout.strip()

          def run_sql(sql, label):
              r = subprocess.run(['psql', db, '-X', '-q', '-v', 'ON_ERROR_STOP=1'], input=sql, text=True, capture_output=True)
              if r.returncode:
                  sys.stdout.write(r.stdout[-4000:]); sys.stderr.write(r.stderr[-4000:])
                  sys.exit(f'PKG008_REPLAY_FAILED {label}')

          def apply(file, version, name):
              path = f'{root}/supabase/migrations/{file}'
              print(f'apply_source={file} recorded_as={version}_{name}', flush=True)
              r = subprocess.run(['psql', db, '-X', '-q', '-v', 'ON_ERROR_STOP=1', '-f', path], text=True, capture_output=True)
              if r.returncode:
                  sys.stdout.write(r.stdout[-4000:]); sys.stderr.write(r.stderr[-4000:])
                  sys.exit(f'PKG008_REPLAY_FAILED {file}')
              body = open(path, encoding='utf-8', newline='').read()
              tag = '$pkg008stmt$'
              assert tag not in body, file
              run_sql(f"insert into supabase_migrations.schema_migrations(version,name,statements) "
                      f"values ('{version}','{name}',array[{tag}{body}{tag}]);", file)

          assert scalar('select max(version) from supabase_migrations.schema_migrations') == '20260906141409'
          entries = [e for e in prov['live_history_snapshot']['entries'] if e['version'] > '20260906141409']
          assert len(entries) == 8, len(entries)
          for e in entries:
              apply(e.get('file') or f"{e['version']}_{e['name']}.sql", e['version'], e['name'])
          assert scalar('select count(*) from supabase_migrations.schema_migrations') == '87'
          for p in prov['pending_forward_migrations']:
              apply(p['file'], p['version'], p['name'])
          history = scalar("select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations")
          open('/tmp/pkg008-schema-before.txt', 'w').write(history + '\n')
          print('history=' + history)
          PY

      - name: Apply PKG-008 source candidate only in disposable database
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/candidates/pkg008_media_upload_cancellation.sql \
            | tee /tmp/pkg008-candidate-apply.log
          test "$(psql "$DB_URL" -Atc "select to_regprocedure('public.rpc_cancel_media_upload(uuid,uuid)') is not null")" = "t"
          test "$(psql "$DB_URL" -Atc "select to_regclass('private.owned_media_cancellations') is not null")" = "t"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('authenticated','public.rpc_cancel_media_upload(uuid,uuid)','EXECUTE')")" = "t"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('anon','public.rpc_cancel_media_upload(uuid,uuid)','EXECUTE')")" = "f"
          test "$(psql "$DB_URL" -Atc "select position('MEDIA_COMMAND_CANCELLED' in pg_get_functiondef('public.rpc_claim_media_upload_service(uuid,text,uuid,uuid,text,integer,text)'::regprocedure)) > 0")" = "t"

      - name: Run rollback-only owner/attacker/service cancellation proof
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/proofs/pkg008_media_upload_cancellation_runtime_proof.sql \
            | tee /tmp/pkg008-runtime.log
          grep -F "PASS PKG008_MEDIA_UPLOAD_CANCELLATION absent_tombstone idempotent late_claim_refused fresh_claim_admitted processing_deselected ready_removed owner_only acl zero_residue" \
            /tmp/pkg008-runtime.log
          test "$(psql "$DB_URL" -Atc "select count(*) from auth.users where email like 'pkg008-proof-%@proof.invalid'")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from private.owned_media_cancellations")" = "0"

      - name: Stop disposable database
        if: always()
        shell: bash
        run: cd /tmp/uskoci-ru5-device-ui 2>/dev/null && supabase stop --no-backup || true

      - name: Install exact app dependencies
        run: npm ci

      - name: TypeScript exact candidate
        run: npx tsc --noEmit

      - name: PKG-008 focused regressions
        run: >-
          npm test -- --runInBand
          src/data/__tests__/v5-task-photos-screen.test.tsx
          src/data/__tests__/media-client.test.ts
          src/data/__tests__/agreement-photos-hook.test.tsx
          src/data/__tests__/agreement-photo-composer.test.tsx
          src/data/__tests__/agreement-photo-client.test.ts
          src/data/__tests__/agreement-photo-journal.test.ts

      - name: Full regression exact candidate
        run: npm test -- --runInBand

      - name: Write proof receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pkg008-receipt.json <<JSON
          {
            "packageId":"PKG-008",
            "gapIds":["GAP-0036"],
            "candidateSha":"$GITHUB_SHA",
            "treeSha":"$(git rev-parse 'HEAD^{tree}')",
            "workflowRunId":"$GITHUB_RUN_ID",
            "workflowRunAttempt":"$GITHUB_RUN_ATTEMPT",
            "disposableDbOnly":true,
            "liveDbChanged":false,
            "providerCalled":false,
            "productionChanged":false
          }
          JSON

      - name: Upload PKG-008 proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg008-proof-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            /tmp/pkg008-source-binding.txt
            /tmp/pkg008-receipt.json
            /tmp/pkg008-schema-before.txt
            /tmp/pkg008-candidate-apply.log
            /tmp/pkg008-runtime.log
