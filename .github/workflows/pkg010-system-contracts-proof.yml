name: PKG-010 system contracts proof

on:
  push:
    branches:
      - work/pre-v3-engine-integration-20260911
    paths:
      - 'supabase/proofs/pkg010/**'
      - 'supabase/proofs/pre_v3/**'
      - 'supabase/proofs/legal/**'
      - 'supabase/functions/uskoci-account-closure-worker/**'
      - 'supabase/functions/uskoci-data-export-worker/**'
      - 'supabase/functions/uskoci-data-export-download/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/migrations/**'
      - 'src/data/safetyClientService.ts'
      - 'src/data/supportCase*.ts'
      - 'src/data/dataExport*.ts'
      - 'src/data/accountClosureClientService.ts'
      - 'src/data/closureExecutionClientService.ts'
      - 'src/lib/dataExportFile*.ts'
      - 'src/ui/support/**'
      - 'src/ui/closure/**'
      - 'src/app/(app)/bezbednost.tsx'
      - 'src/app/(app)/podrska/**'
      - 'src/data/__tests__/account-closure.test.ts'
      - 'src/data/__tests__/closure-execution-client.test.ts'
      - 'src/data/__tests__/data-export-screen.test.tsx'
      - 'src/data/__tests__/p2-data-export-client.test.ts'
      - 'src/data/__tests__/p2-data-export-delivery-client.test.ts'
      - 'src/data/__tests__/safety-authority.test.ts'
      - 'src/data/__tests__/support-case-client.test.ts'
      - 'src/data/__tests__/support-case-reads.test.ts'
      - 'src/data/__tests__/v5-owner-safety-legal.test.ts'
      - 'src/data/__tests__/v5-safety-screen.test.tsx'
      - 'src/lib/__tests__/data-export-file-native.test.ts'
      - 'src/lib/__tests__/data-export-file-web.test.ts'
      - 'src/ui/closure/__tests__/**'
      - 'src/ui/support/__tests__/**'
      - '.github/workflows/pkg010-system-contracts-proof.yml'
  workflow_dispatch:
    inputs:
      proofs:
        description: "all (receipt-grade) or a comma-separated diagnostic subset of proof scripts; unlisted proofs' migrations are replayed with psql"
        required: false
        default: 'all'
      source_gates:
        description: 'Run the TypeScript, node and Jest gates after the chain'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  # Push runs and diagnostic dispatch runs may coexist; only same-kind runs cancel each other.
  group: pkg010-system-contracts-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.proofs || 'all' }}
  cancel-in-progress: true

jobs:
  exact-candidate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      PRE_V3_ARTIFACT_DIR: /tmp/pkg010-artifacts
      PKG010_PROOFS: ${{ github.event.inputs.proofs || 'all' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: bounded_hygiene_proof.mjs and the source-boundary proofs diff
          # the candidate against historical commits (e.g. 06d51ec), which a shallow
          # checkout does not contain.
          fetch-depth: 0

      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "PACKAGE=PKG-010"
            echo "CANDIDATE_SHA=$GITHUB_SHA"
            echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
            echo "PKG010_PROOFS=$PKG010_PROOFS"
          } | tee /tmp/pkg010-source-binding.txt

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          # Same pin as the PRE-P4 domain proofs, the V5 control chain and PKG-003/006/008.
          version: 2.116.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact app dependencies
        run: npm ci

      - name: Validate chain plan against the exact source
        run: python3 supabase/proofs/pkg010/chain.py --plan

      # Same disposable history as PKG-003/PKG-006/PKG-008: the shared live79
      # environment and two real disposable Auth accounts created there.
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh

      - name: Prepare two real disposable Auth accounts
        run: node supabase/proofs/ru5_device_ui_fixture.mjs

      - name: Replay live80-116 and execute the ordered V5 proof chain on the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PRE_V3_ARTIFACT_DIR"
          python3 supabase/proofs/pkg010/chain.py 2>&1 | tee /tmp/pkg010-chain.log
          grep -F "PASS PKG010_V5_CONTRACT_CHAIN" /tmp/pkg010-chain.log

      - name: Stop disposable database
        if: always()
        shell: bash
        run: cd /tmp/uskoci-ru5-device-ui 2>/dev/null && supabase stop --no-backup || true

      - name: TypeScript exact candidate
        if: ${{ github.event_name == 'push' || github.event.inputs.source_gates != 'false' }}
        run: npx tsc --noEmit

      - name: Node edge, source-boundary and ledger tests exact candidate
        if: ${{ github.event_name == 'push' || github.event.inputs.source_gates != 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find scripts supabase -type f \( -name '*.test.cjs' -o -name '*.test.mjs' \) | sort)
          printf '%s\n' "${tests[@]}" | tee /tmp/pkg010-node-test-manifest.txt
          node --test --test-concurrency=2 --test-reporter=tap "${tests[@]}" | tee /tmp/pkg010-node-tests.tap
          grep -E '^# fail 0$' /tmp/pkg010-node-tests.tap
          grep -E '^# cancelled 0$' /tmp/pkg010-node-tests.tap

      - name: PKG-010 focused client regressions
        if: ${{ github.event_name == 'push' || github.event.inputs.source_gates != 'false' }}
        run: >-
          npm test -- --runInBand
          src/data/__tests__/account-closure.test.ts
          src/data/__tests__/closure-execution-client.test.ts
          src/data/__tests__/data-export-screen.test.tsx
          src/data/__tests__/p2-data-export-client.test.ts
          src/data/__tests__/p2-data-export-delivery-client.test.ts
          src/data/__tests__/safety-authority.test.ts
          src/data/__tests__/support-case-client.test.ts
          src/data/__tests__/support-case-reads.test.ts
          src/data/__tests__/v5-owner-safety-legal.test.ts
          src/data/__tests__/v5-safety-screen.test.tsx
          src/lib/__tests__/data-export-file-native.test.ts
          src/lib/__tests__/data-export-file-web.test.ts
          src/ui/closure/__tests__/ClosureDialog.test.tsx
          src/ui/closure/__tests__/closureIntent.test.ts
          src/ui/support/__tests__/SupportContextEntry.test.tsx
          src/ui/support/__tests__/SupportController.test.ts
          src/ui/support/__tests__/SupportScreens.test.tsx

      - name: Full regression exact candidate
        if: ${{ github.event_name == 'push' || github.event.inputs.source_gates != 'false' }}
        run: npm test -- --runInBand

      - name: Write proof receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mode=$(jq -r '.mode // "UNKNOWN"' "$PRE_V3_ARTIFACT_DIR/pkg010-chain-summary.json" 2>/dev/null || echo "NOT_STARTED")
          chain=$(jq -r '.result // "UNKNOWN"' "$PRE_V3_ARTIFACT_DIR/pkg010-chain-summary.json" 2>/dev/null || echo "NOT_STARTED")
          cat > /tmp/pkg010-receipt.json <<JSON
          {
            "packageId":"PKG-010",
            "gapIds":["GAP-0020"],
            "candidateSha":"$GITHUB_SHA",
            "treeSha":"$(git rev-parse 'HEAD^{tree}')",
            "workflowRunId":"$GITHUB_RUN_ID",
            "workflowRunAttempt":"$GITHUB_RUN_ATTEMPT",
            "event":"$GITHUB_EVENT_NAME",
            "selectedProofs":"$PKG010_PROOFS",
            "chainMode":"$mode",
            "chainResult":"$chain",
            "disposableDbOnly":true,
            "liveDbChanged":false,
            "providerCalled":false,
            "productionChanged":false,
            "deviceProof":false
          }
          JSON
          cat /tmp/pkg010-receipt.json

      - name: Upload PKG-010 proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg010-proof-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            /tmp/pkg010-source-binding.txt
            /tmp/pkg010-receipt.json
            /tmp/pkg010-chain.log
            /tmp/pkg010-node-test-manifest.txt
            /tmp/pkg010-node-tests.tap
            /tmp/pkg010-artifacts/
