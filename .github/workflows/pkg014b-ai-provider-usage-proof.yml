name: PKG-014B AI provider usage proof

on:
  push:
    branches:
      - work/pre-v3-engine-integration-20260911
    paths:
      - 'supabase/candidates/pkg014b_ai_provider_usage.sql'
      - 'supabase/proofs/pkg014b_ai_provider_usage_runtime_proof.sql'
      - 'supabase/functions/_shared/geminiTaskStream.ts'
      - 'supabase/functions/uskoci-ai-interview/index.ts'
      - 'supabase/functions/uskoci-worker-interview/index.ts'
      - '.github/workflows/pkg014b-ai-provider-usage-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg014b-ai-provider-usage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-candidate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "PACKAGE=PKG-014B"
            echo "CANDIDATE_SHA=$GITHUB_SHA"
            echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
          } | tee /tmp/pkg014b-source-binding.txt

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          # Same pin as the PRE-P4 domain proofs and PKG-003/008/015.
          version: 2.116.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh

      - name: Replay recorded live80-87 aliases and every pending source migration in order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          root = os.environ['GITHUB_WORKSPACE']
          db = os.environ['DB_URL']
          prov = json.load(open(f'{root}/supabase/migrations/MIGRATION_PROVENANCE.json', encoding='utf-8'))

          def scalar(sql):
              return subprocess.run(['psql', db, '-X', '-Atc', sql], text=True, capture_output=True, check=True).stdout.strip()

          def run_sql(sql, label):
              r = subprocess.run(['psql', db, '-X', '-q', '-v', 'ON_ERROR_STOP=1'], input=sql, text=True, capture_output=True)
              if r.returncode:
                  sys.stdout.write(r.stdout[-4000:]); sys.stderr.write(r.stderr[-4000:])
                  sys.exit(f'PKG014B_REPLAY_FAILED {label}')

          def apply(file, version, name):
              path = f'{root}/supabase/migrations/{file}'
              print(f'apply_source={file} recorded_as={version}_{name}', flush=True)
              r = subprocess.run(['psql', db, '-X', '-q', '-v', 'ON_ERROR_STOP=1', '-f', path], text=True, capture_output=True)
              if r.returncode:
                  sys.stdout.write(r.stdout[-4000:]); sys.stderr.write(r.stderr[-4000:])
                  sys.exit(f'PKG014B_REPLAY_FAILED {file}')
              body = open(path, encoding='utf-8', newline='').read()
              tag = '$pkg014bstmt$'
              assert tag not in body, file
              run_sql(f"insert into supabase_migrations.schema_migrations(version,name,statements) "
                      f"values ('{version}','{name}',array[{tag}{body}{tag}]);", file)

          assert scalar('select max(version) from supabase_migrations.schema_migrations') == '20260906141409'
          entries = [e for e in prov['live_history_snapshot']['entries'] if e['version'] > '20260906141409']
          assert len(entries) == 8, len(entries)
          for e in entries:
              apply(e.get('file') or f"{e['version']}_{e['name']}.sql", e['version'], e['name'])
          assert scalar('select count(*) from supabase_migrations.schema_migrations') == '87'
          for p in prov['pending_forward_migrations']:
              apply(p['file'], p['version'], p['name'])
          history = scalar("select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations")
          open('/tmp/pkg014b-schema-before.txt', 'w').write(history + '\n')
          print('history=' + history)
          PY

      - name: Snapshot domain surface before the candidate
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -Atc "
            select md5(string_agg(sig, E'\n' order by sig)) from (
              select n.nspname||'.'||p.proname||'('||pg_get_function_identity_arguments(p.oid)||')' as sig
              from pg_proc p join pg_namespace n on n.oid=p.pronamespace
              where n.nspname in ('public','private')
              union all
              select 'table:'||schemaname||'.'||tablename from pg_tables where schemaname in ('public','private')
              union all
              select 'policy:'||schemaname||'.'||tablename||'.'||policyname from pg_policies where schemaname in ('public','private')
            ) s" > /tmp/pkg014b-domain-before.txt
          cat /tmp/pkg014b-domain-before.txt

      - name: Apply PKG-014B source candidate only in disposable database
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/candidates/pkg014b_ai_provider_usage.sql \
            | tee /tmp/pkg014b-candidate-apply.log
          test "$(psql "$DB_URL" -Atc "select to_regclass('private.ai_test_usage_v5') is not null")" = "t"
          test "$(psql "$DB_URL" -Atc "select to_regprocedure('public.rpc_ai_test_record_usage_service(uuid,text,integer,integer,integer)') is not null")" = "t"
          test "$(psql "$DB_URL" -Atc "select to_regprocedure('public.rpc_ai_test_budget_report_service()') is not null")" = "t"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('service_role','public.rpc_ai_test_record_usage_service(uuid,text,integer,integer,integer)','EXECUTE')")" = "t"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('authenticated','public.rpc_ai_test_record_usage_service(uuid,text,integer,integer,integer)','EXECUTE')")" = "f"
          test "$(psql "$DB_URL" -Atc "select ceiling_microusd from private.ai_test_budget_v5 where singleton")" = "5000000"

      - name: Prove the candidate is additive and touches no existing object
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -Atc "
            select md5(string_agg(sig, E'\n' order by sig)) from (
              select n.nspname||'.'||p.proname||'('||pg_get_function_identity_arguments(p.oid)||')' as sig
              from pg_proc p join pg_namespace n on n.oid=p.pronamespace
              where n.nspname in ('public','private')
                and n.nspname||'.'||p.proname not in (
                  'public.rpc_ai_test_record_usage_service','public.rpc_ai_test_budget_report_service')
              union all
              select 'table:'||schemaname||'.'||tablename from pg_tables
              where schemaname in ('public','private') and tablename not in ('ai_test_usage_v5')
              union all
              select 'policy:'||schemaname||'.'||tablename||'.'||policyname from pg_policies
              where schemaname in ('public','private')
            ) s" > /tmp/pkg014b-domain-after.txt
          diff /tmp/pkg014b-domain-before.txt /tmp/pkg014b-domain-after.txt \
            || { echo 'PKG014B_CANDIDATE_CHANGED_AN_EXISTING_OBJECT'; exit 1; }

      - name: Run rollback-only provider usage proof
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/proofs/pkg014b_ai_provider_usage_runtime_proof.sql \
            | tee /tmp/pkg014b-runtime.log
          grep -F "PASS PKG014B_AI_PROVIDER_USAGE reservation_required recorded first_report_wins idempotent_replay overwrite_refused malformed_refused budget_untouched report_fields unknown_not_zero client_denied acl" \
            /tmp/pkg014b-runtime.log
          test "$(psql "$DB_URL" -Atc "select count(*) from auth.users where email like 'pkg014b-proof-%@proof.invalid'")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from private.ai_test_usage_v5")" = "0"
          test "$(psql "$DB_URL" -Atc "select ceiling_microusd from private.ai_test_budget_v5 where singleton")" = "5000000"

      - name: Stop disposable database
        if: always()
        shell: bash
        run: cd /tmp/uskoci-ru5-device-ui 2>/dev/null && supabase stop --no-backup || true

      - name: Install exact app dependencies
        run: npm ci

      - name: TypeScript exact candidate
        run: npx tsc --noEmit

      - name: Edge handler and fingerprint proofs on the changed helper
        run: |
          set -euo pipefail
          node --test supabase/proofs/ai/*.test.mjs
          node supabase/proofs/ai/ai_edge_context_proof.mjs

      - name: Full regression exact candidate
        run: npm test -- --runInBand

      - name: Write proof receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pkg014b-receipt.json <<JSON
          {
            "packageId":"PKG-014B",
            "candidateSha":"$GITHUB_SHA",
            "treeSha":"$(git rev-parse 'HEAD^{tree}')",
            "workflowRunId":"$GITHUB_RUN_ID",
            "workflowRunAttempt":"$GITHUB_RUN_ATTEMPT",
            "disposableDbOnly":true,
            "liveDbChanged":false,
            "providerCalled":false,
            "productionChanged":false,
            "budgetCeilingRaised":false
          }
          JSON

      - name: Upload PKG-014B proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg014b-proof-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            /tmp/pkg014b-source-binding.txt
            /tmp/pkg014b-receipt.json
            /tmp/pkg014b-schema-before.txt
            /tmp/pkg014b-domain-before.txt
            /tmp/pkg014b-domain-after.txt
            /tmp/pkg014b-candidate-apply.log
            /tmp/pkg014b-runtime.log
