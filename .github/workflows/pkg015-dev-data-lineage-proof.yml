name: PKG-015 DEV data lineage proof

on:
  push:
    branches:
      - work/pre-v3-engine-integration-20260911
    paths:
      - 'supabase/candidates/pkg015_dev_data_lineage.sql'
      - 'supabase/proofs/pkg015_dev_data_lineage_runtime_proof.sql'
      - '.github/workflows/pkg015-dev-data-lineage-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg015-dev-data-lineage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-candidate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "PACKAGE=PKG-015"
            echo "CANDIDATE_SHA=$GITHUB_SHA"
            echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
          } | tee /tmp/pkg015-source-binding.txt

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          # Same pin as the PRE-P4 domain proofs and PKG-003/PKG-008; "latest" pulled a newer Postgres image on 2026-09-15.
          version: 2.116.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Same disposable history as PKG-003 and PKG-008: the shared live79
      # environment, the recorded live80-87 aliases and every pending source
      # migration in provenance order. A raw db reset cannot replay this history.
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh

      - name: Replay recorded live80-87 aliases and every pending source migration in order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          root = os.environ['GITHUB_WORKSPACE']
          db = os.environ['DB_URL']
          prov = json.load(open(f'{root}/supabase/migrations/MIGRATION_PROVENANCE.json', encoding='utf-8'))

          def scalar(sql):
              return subprocess.run(['psql', db, '-X', '-Atc', sql], text=True, capture_output=True, check=True).stdout.strip()

          def run_sql(sql, label):
              r = subprocess.run(['psql', db, '-X', '-q', '-v', 'ON_ERROR_STOP=1'], input=sql, text=True, capture_output=True)
              if r.returncode:
                  sys.stdout.write(r.stdout[-4000:]); sys.stderr.write(r.stderr[-4000:])
                  sys.exit(f'PKG015_REPLAY_FAILED {label}')

          def apply(file, version, name):
              path = f'{root}/supabase/migrations/{file}'
              print(f'apply_source={file} recorded_as={version}_{name}', flush=True)
              r = subprocess.run(['psql', db, '-X', '-q', '-v', 'ON_ERROR_STOP=1', '-f', path], text=True, capture_output=True)
              if r.returncode:
                  sys.stdout.write(r.stdout[-4000:]); sys.stderr.write(r.stderr[-4000:])
                  sys.exit(f'PKG015_REPLAY_FAILED {file}')
              body = open(path, encoding='utf-8', newline='').read()
              tag = '$pkg015stmt$'
              assert tag not in body, file
              run_sql(f"insert into supabase_migrations.schema_migrations(version,name,statements) "
                      f"values ('{version}','{name}',array[{tag}{body}{tag}]);", file)

          assert scalar('select max(version) from supabase_migrations.schema_migrations') == '20260906141409'
          entries = [e for e in prov['live_history_snapshot']['entries'] if e['version'] > '20260906141409']
          assert len(entries) == 8, len(entries)
          for e in entries:
              apply(e.get('file') or f"{e['version']}_{e['name']}.sql", e['version'], e['name'])
          assert scalar('select count(*) from supabase_migrations.schema_migrations') == '87'
          for p in prov['pending_forward_migrations']:
              apply(p['file'], p['version'], p['name'])
          history = scalar("select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations")
          open('/tmp/pkg015-schema-before.txt', 'w').write(history + '\n')
          print('history=' + history)
          PY

      # The registry must add only its own objects. This snapshot is compared again
      # after the candidate, so a stray domain change cannot pass unnoticed.
      - name: Snapshot domain surface before the candidate
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -Atc "
            select md5(string_agg(sig, E'\n' order by sig)) from (
              select n.nspname||'.'||p.proname||'('||pg_get_function_identity_arguments(p.oid)||')' as sig
              from pg_proc p join pg_namespace n on n.oid=p.pronamespace
              where n.nspname in ('public','private')
              union all
              select 'table:'||schemaname||'.'||tablename from pg_tables where schemaname in ('public','private')
              union all
              select 'policy:'||schemaname||'.'||tablename||'.'||policyname from pg_policies where schemaname in ('public','private')
            ) s" > /tmp/pkg015-domain-before.txt
          cat /tmp/pkg015-domain-before.txt

      - name: Apply PKG-015 source candidate only in disposable database
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/candidates/pkg015_dev_data_lineage.sql \
            | tee /tmp/pkg015-candidate-apply.log
          test "$(psql "$DB_URL" -Atc "select to_regclass('private.account_lineage_v5') is not null")" = "t"
          test "$(psql "$DB_URL" -Atc "select to_regclass('private.account_lineage_events_v5') is not null")" = "t"
          test "$(psql "$DB_URL" -Atc "select to_regprocedure('public.rpc_admit_account_lineage_service(uuid,text,text,text,integer)') is not null")" = "t"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('service_role','public.rpc_admit_account_lineage_service(uuid,text,text,text,integer)','EXECUTE')")" = "t"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('authenticated','public.rpc_admit_account_lineage_service(uuid,text,text,text,integer)','EXECUTE')")" = "f"
          test "$(psql "$DB_URL" -Atc "select has_table_privilege('service_role','private.account_lineage_v5','SELECT')")" = "f"

      - name: Prove the candidate is additive and touches no existing object
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -Atc "
            select md5(string_agg(sig, E'\n' order by sig)) from (
              select n.nspname||'.'||p.proname||'('||pg_get_function_identity_arguments(p.oid)||')' as sig
              from pg_proc p join pg_namespace n on n.oid=p.pronamespace
              where n.nspname in ('public','private')
                and n.nspname||'.'||p.proname not in (
                  'public.rpc_admit_account_lineage_service','public.rpc_read_account_lineage_service',
                  'private.account_lineage','private.account_is_non_production',
                  'private.account_lineage_events_append_only')
              union all
              select 'table:'||schemaname||'.'||tablename from pg_tables
              where schemaname in ('public','private')
                and tablename not in ('account_lineage_v5','account_lineage_events_v5')
              union all
              select 'policy:'||schemaname||'.'||tablename||'.'||policyname from pg_policies
              where schemaname in ('public','private')
            ) s" > /tmp/pkg015-domain-after.txt
          diff /tmp/pkg015-domain-before.txt /tmp/pkg015-domain-after.txt \
            || { echo 'PKG015_CANDIDATE_CHANGED_AN_EXISTING_OBJECT'; exit 1; }

      - name: Run rollback-only lineage registry proof
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/proofs/pkg015_dev_data_lineage_runtime_proof.sql \
            | tee /tmp/pkg015-runtime.log
          grep -F "PASS PKG015_DEV_DATA_LINEAGE unclassified_fails_closed first_admission revision_control idempotent_restatement reclassification_history stale_revision_refused unknown_account_refused unreviewed_class_refused append_only_history client_denied acl zero_domain_coupling" \
            /tmp/pkg015-runtime.log
          test "$(psql "$DB_URL" -Atc "select count(*) from auth.users where email like 'pkg015-proof-%@proof.invalid'")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from private.account_lineage_v5")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from private.account_lineage_events_v5")" = "0"

      - name: Stop disposable database
        if: always()
        shell: bash
        run: cd /tmp/uskoci-ru5-device-ui 2>/dev/null && supabase stop --no-backup || true

      - name: Install exact app dependencies
        run: npm ci

      - name: TypeScript exact candidate
        run: npx tsc --noEmit

      - name: Full regression exact candidate
        run: npm test -- --runInBand

      - name: Write proof receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pkg015-receipt.json <<JSON
          {
            "packageId":"PKG-015",
            "gapIds":["GAP-0018"],
            "candidateSha":"$GITHUB_SHA",
            "treeSha":"$(git rev-parse 'HEAD^{tree}')",
            "workflowRunId":"$GITHUB_RUN_ID",
            "workflowRunAttempt":"$GITHUB_RUN_ATTEMPT",
            "disposableDbOnly":true,
            "liveDbChanged":false,
            "providerCalled":false,
            "productionChanged":false
          }
          JSON

      - name: Upload PKG-015 proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg015-proof-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            /tmp/pkg015-source-binding.txt
            /tmp/pkg015-receipt.json
            /tmp/pkg015-schema-before.txt
            /tmp/pkg015-domain-before.txt
            /tmp/pkg015-domain-after.txt
            /tmp/pkg015-candidate-apply.log
            /tmp/pkg015-runtime.log
