name: PKG-023 V3 bounded reads and public pin proof

# Disposable database only. Nothing in this workflow can reach canonical DEV: it has no secret, and
# the proof runtime refuses any target that is not the local stack it starts itself.
on:
  push:
    branches:
      - work/pre-v3-engine-integration-20260911
    paths:
      - 'supabase/candidates/pkg023*.sql'
      - 'supabase/proofs/pkg023/**'
      - '.github/workflows/pkg023-v3-reads-and-pin-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg023-v3-reads-and-pin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-candidate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/pkg023-artifacts
      PKG023_LEGACY_FILE: /tmp/pkg023-artifacts/pkg023-legacy-fixture.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$PRE_V3_ARTIFACT_DIR"
          {
            echo "PACKAGE=PKG-023"
            echo "CANDIDATE_SHA=$GITHUB_SHA"
            echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
            sha256sum supabase/candidates/pkg023*.sql supabase/proofs/pkg023/*.mjs
          } | tee "$PRE_V3_ARTIFACT_DIR/pkg023-source-binding.txt"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          # Same pin as the PRE-P4 domain proofs and PKG-003/008/010/015.
          version: 2.116.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact app dependencies
        run: npm ci

      # Same disposable history as PKG-003/008/015: the shared live79 environment, the recorded
      # live80-87 aliases and every pending source migration in provenance order, to source 147.
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh

      - name: Replay recorded live80-87 aliases and every pending source migration in order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          root = os.environ['GITHUB_WORKSPACE']
          db = os.environ['DB_URL']
          prov = json.load(open(f'{root}/supabase/migrations/MIGRATION_PROVENANCE.json', encoding='utf-8'))

          def scalar(sql):
              return subprocess.run(['psql', db, '-X', '-Atc', sql], text=True, capture_output=True, check=True).stdout.strip()

          def run_sql(sql, label):
              r = subprocess.run(['psql', db, '-X', '-q', '-v', 'ON_ERROR_STOP=1'], input=sql, text=True, capture_output=True)
              if r.returncode:
                  sys.stdout.write(r.stdout[-4000:]); sys.stderr.write(r.stderr[-4000:])
                  sys.exit(f'PKG023_REPLAY_FAILED {label}')

          def apply(file, version, name):
              path = f'{root}/supabase/migrations/{file}'
              print(f'apply_source={file} recorded_as={version}_{name}', flush=True)
              r = subprocess.run(['psql', db, '-X', '-q', '-v', 'ON_ERROR_STOP=1', '-f', path], text=True, capture_output=True)
              if r.returncode:
                  sys.stdout.write(r.stdout[-4000:]); sys.stderr.write(r.stderr[-4000:])
                  sys.exit(f'PKG023_REPLAY_FAILED {file}')
              body = open(path, encoding='utf-8', newline='').read()
              tag = '$pkg023stmt$'
              assert tag not in body, file
              run_sql(f"insert into supabase_migrations.schema_migrations(version,name,statements) "
                      f"values ('{version}','{name}',array[{tag}{body}{tag}]);", file)

          assert scalar('select max(version) from supabase_migrations.schema_migrations') == '20260906141409'
          entries = [e for e in prov['live_history_snapshot']['entries'] if e['version'] > '20260906141409']
          assert len(entries) == 8, len(entries)
          for e in entries:
              apply(e.get('file') or f"{e['version']}_{e['name']}.sql", e['version'], e['name'])
          assert scalar('select count(*) from supabase_migrations.schema_migrations') == '87'
          for p in prov['pending_forward_migrations']:
              apply(p['file'], p['version'], p['name'])
          history = scalar("select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations")
          open(os.environ['PRE_V3_ARTIFACT_DIR'] + '/pkg023-schema-before.txt', 'w').write(history + '\n')
          print('history=' + history)
          PY
          psql "$DB_URL" -X -c "notify pgrst, 'reload schema'"

      # Every existing function body, table, column, constraint, trigger, policy and grant, before.
      # Compared after each group of candidates, so nothing can change that is not meant to.
      - name: Snapshot the whole domain surface before the candidates
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -Atf supabase/proofs/pkg023/pkg023_surface.sql > "$PRE_V3_ARTIFACT_DIR/pkg023-surface-before.txt"
          wc -l "$PRE_V3_ARTIFACT_DIR/pkg023-surface-before.txt"
          # A snapshot that is empty proves nothing.
          test "$(wc -l < "$PRE_V3_ARTIFACT_DIR/pkg023-surface-before.txt")" -gt 1000
          test "$(psql "$DB_URL" -X -Atc "select (select sha256 from private.closure_source_v5 where singleton)=private.closure_source_digest_v5() and private.retention_ai_source_ready()")" = "t"

      # A task with a confirmed place, published through the real authority as it is published today.
      # Its fingerprint and its coarse point are what the proof compares against afterwards.
      - name: Publish the predecessor task before any candidate exists
        run: node supabase/proofs/pkg023/pkg023_legacy_fixture.mjs

      - name: The proof must FAIL before the candidates are applied
        shell: bash
        run: |
          set -euo pipefail
          if node supabase/proofs/pkg023/pkg023_v3_backend_proof.mjs > "$PRE_V3_ARTIFACT_DIR/pkg023-proof-before.log" 2>&1; then
            cat "$PRE_V3_ARTIFACT_DIR/pkg023-proof-before.log"; echo 'PKG023_PROOF_PASSED_WITHOUT_THE_CANDIDATES'; exit 1
          fi
          cat "$PRE_V3_ARTIFACT_DIR/pkg023-proof-before.log"
          grep -F 'FAIL S0_CANDIDATE_OBJECTS_PRESENT_WITH_EXACT_GRANTS' "$PRE_V3_ARTIFACT_DIR/pkg023-proof-before.log"
          grep -F 'FAIL PKG023_V3_BACKEND' "$PRE_V3_ARTIFACT_DIR/pkg023-proof-before.log"
          cp "$PRE_V3_ARTIFACT_DIR/pkg023-v3-backend-report.json" "$PRE_V3_ARTIFACT_DIR/pkg023-v3-backend-report-before.json"

      - name: Apply the additive candidates a, b, d only in the disposable database
        shell: bash
        run: |
          set -euo pipefail
          for c in pkg023a_own_reads_paged pkg023b_task_relations pkg023d_marketplace_bounded; do
            psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "supabase/candidates/$c.sql" | tee -a "$PRE_V3_ARTIFACT_DIR/pkg023-candidate-apply.log"
          done

      - name: Prove a, b, d are additive and leave the closure source digest as it was
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -Atf supabase/proofs/pkg023/pkg023_surface.sql > "$PRE_V3_ARTIFACT_DIR/pkg023-surface-after-abd.txt"
          # Lines may only be ADDED, and only these.
          diff "$PRE_V3_ARTIFACT_DIR/pkg023-surface-before.txt" "$PRE_V3_ARTIFACT_DIR/pkg023-surface-after-abd.txt" > "$PRE_V3_ARTIFACT_DIR/pkg023-surface-diff-abd.txt" || true
          cat "$PRE_V3_ARTIFACT_DIR/pkg023-surface-diff-abd.txt"
          if grep -E '^<' "$PRE_V3_ARTIFACT_DIR/pkg023-surface-diff-abd.txt"; then echo 'PKG023_ADDITIVE_CANDIDATE_CHANGED_AN_EXISTING_OBJECT'; exit 1; fi
          # Six functions and three plain indexes.
          test "$(grep -cE '^>' "$PRE_V3_ARTIFACT_DIR/pkg023-surface-diff-abd.txt")" = "9"
          for added in 'function:private.my_application_state(' 'function:public.rpc_list_my_needs_page(' 'function:public.rpc_list_my_applications_page(' \
            'function:public.rpc_list_my_agreements_page(' 'function:public.rpc_get_my_task_relations(' 'function:public.rpc_list_open_tasks_v3(' \
            'index:public.marketplace_responses_worker_idx' 'index:public.needs_open_geog_idx' 'index:public.needs_open_published_idx'; do
            grep -F "> $added" "$PRE_V3_ARTIFACT_DIR/pkg023-surface-diff-abd.txt" > /dev/null || { echo "PKG023_EXPECTED_ADDITION_MISSING $added"; exit 1; }
          done
          test "$(psql "$DB_URL" -X -Atc "select (select sha256 from private.closure_source_v5 where singleton)=private.closure_source_digest_v5() and private.retention_ai_source_ready()")" = "t"

      - name: Apply candidate c (the ~100 m public pin) only in the disposable database
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/candidates/pkg023c_public_pin_100m.sql | tee -a "$PRE_V3_ARTIFACT_DIR/pkg023-candidate-apply.log"

      - name: Prove candidate c changed exactly what it names, and re-bound the closure source
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -Atf supabase/proofs/pkg023/pkg023_surface.sql > "$PRE_V3_ARTIFACT_DIR/pkg023-surface-after-c.txt"
          diff "$PRE_V3_ARTIFACT_DIR/pkg023-surface-after-abd.txt" "$PRE_V3_ARTIFACT_DIR/pkg023-surface-after-c.txt" > "$PRE_V3_ARTIFACT_DIR/pkg023-surface-diff-c.txt" || true
          cat "$PRE_V3_ARTIFACT_DIR/pkg023-surface-diff-c.txt"
          # Removed lines are the previous bodies of exactly these functions and nothing else.
          grep -E '^<' "$PRE_V3_ARTIFACT_DIR/pkg023-surface-diff-c.txt" | sed -E 's/^< ([a-z]+:[a-z_.0-9]+)\(.*/\1/' | sort -u > /tmp/pkg023-changed.txt
          printf '%s\n' function:private.check_need_resolved_location_binding function:private.closure_redaction_patch_v5 function:private.guard_need_write \
            function:private.materialize_resolved_location function:private.need_material_snapshot function:private.need_publication_fingerprint_snapshot \
            function:private.need_publication_location_readiness function:private.retention_ai_source_ready function:public.rpc_confirm_need_edit \
            function:public.rpc_confirm_need_edit_from_review function:public.rpc_list_open_tasks_v3 | sort -u > /tmp/pkg023-expected.txt
          diff /tmp/pkg023-expected.txt /tmp/pkg023-changed.txt || { echo 'PKG023C_CHANGED_SOMETHING_IT_DOES_NOT_NAME'; exit 1; }
          grep -F '> column:public.needs.public_lat:numeric(7,3)' "$PRE_V3_ARTIFACT_DIR/pkg023-surface-diff-c.txt" > /dev/null
          grep -F '> column:public.needs.public_lng:numeric(8,3)' "$PRE_V3_ARTIFACT_DIR/pkg023-surface-diff-c.txt" > /dev/null
          grep -F '> constraint:public.needs.needs_public_pin_pair_check' "$PRE_V3_ARTIFACT_DIR/pkg023-surface-diff-c.txt" > /dev/null
          test "$(psql "$DB_URL" -X -Atc "select (select sha256 from private.closure_source_v5 where singleton)=private.closure_source_digest_v5() and private.retention_ai_source_ready()")" = "t"

      - name: The proof must PASS after the candidates are applied
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/pkg023/pkg023_v3_backend_proof.mjs 2>&1 | tee "$PRE_V3_ARTIFACT_DIR/pkg023-proof-after.log"
          grep -F 'PASS PKG023_V3_BACKEND' "$PRE_V3_ARTIFACT_DIR/pkg023-proof-after.log"
          test "$(node -e "const r=require('$PRE_V3_ARTIFACT_DIR/pkg023-v3-backend-report.json');process.stdout.write(r.result+':'+r.failures.length)")" = "PASS:0"

      - name: A candidate cannot be applied twice
        shell: bash
        run: |
          set -euo pipefail
          for c in pkg023a_own_reads_paged:PKG023A_ALREADY_APPLIED pkg023b_task_relations:PKG023B_ALREADY_APPLIED pkg023d_marketplace_bounded:PKG023D_ALREADY_APPLIED pkg023c_public_pin_100m:PKG023C_ALREADY_APPLIED; do
            file="${c%%:*}"; code="${c##*:}"
            if psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "supabase/candidates/$file.sql" > /tmp/pkg023-reapply.log 2>&1; then echo "PKG023_REAPPLY_SUCCEEDED $file"; exit 1; fi
            grep -F "$code" /tmp/pkg023-reapply.log
          done

      # The refusal canonical DEV would give today, reproduced on the disposable database at the very
      # end of the job: a table that nobody bound makes the closure source digest drift, exactly as
      # the dev_alpha migrations of 2026-09-17 did, and candidate c will not certify it in passing.
      - name: Candidate c refuses a predecessor whose closure source digest has drifted
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "create table private.pkg023_unbound_drift(id integer)"
          test "$(psql "$DB_URL" -X -Atc "select private.retention_ai_source_ready()")" = "f"
          if psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/candidates/pkg023c_public_pin_100m.sql > /tmp/pkg023-drift.log 2>&1; then
            echo 'PKG023C_CERTIFIED_A_DRIFTED_PREDECESSOR'; exit 1
          fi
          cat /tmp/pkg023-drift.log
          grep -F 'PKG023C_CLOSURE_SOURCE_NOT_READY' /tmp/pkg023-drift.log

      - name: Stop disposable database
        if: always()
        shell: bash
        run: cd /tmp/uskoci-ru5-device-ui 2>/dev/null && supabase stop --no-backup || true

      - name: Write proof receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > "$PRE_V3_ARTIFACT_DIR/pkg023-receipt.json" <<JSON
          {
            "packageId":"PKG-023",
            "candidates":["pkg023a_own_reads_paged","pkg023b_task_relations","pkg023d_marketplace_bounded","pkg023c_public_pin_100m"],
            "candidateSha":"$GITHUB_SHA",
            "treeSha":"$(git rev-parse 'HEAD^{tree}')",
            "workflowRunId":"$GITHUB_RUN_ID",
            "workflowRunAttempt":"$GITHUB_RUN_ATTEMPT",
            "disposableDbOnly":true,
            "liveDbChanged":false,
            "providerCalled":false,
            "productionChanged":false
          }
          JSON

      - name: Upload PKG-023 proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg023-proof-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: /tmp/pkg023-artifacts/
