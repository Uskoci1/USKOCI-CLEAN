name: PKG-023f closure source re-certification proof

# Disposable database only. Nothing in this workflow can reach canonical DEV: it has no secret, and
# the proof runtime refuses any target that is not the local stack it starts itself.
on:
  push:
    branches:
      - work/pre-v3-engine-integration-20260911
    paths:
      - 'supabase/candidates/pkg023[fgh]_*.sql'
      - 'supabase/proofs/pkg023f_closure_recert/**'
      - 'supabase/operations/dev-alpha/ledger/**'
      - '.github/workflows/pkg023f-closure-recertification-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg023f-closure-recertification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-candidate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/pkg023f-artifacts

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$PRE_V3_ARTIFACT_DIR"
          {
            echo "PACKAGE=PKG-023f"
            echo "CANDIDATE_SHA=$GITHUB_SHA"
            echo "TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
            sha256sum supabase/candidates/pkg023[fgh]_*.sql supabase/candidates/pkg023[abd]_*.sql supabase/proofs/pkg023f_closure_recert/*.mjs supabase/proofs/pkg023f_closure_recert/*.sql supabase/operations/dev-alpha/ledger/*
          } | tee "$PRE_V3_ARTIFACT_DIR/pkg023f-source-binding.txt"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          # Same pin as the PRE-P4 domain proofs and PKG-003/008/010/015.
          version: 2.116.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact app dependencies
        run: npm ci

      # Same disposable history as PKG-003/008/015: the shared live79 environment, the recorded
      # live80-87 aliases and every pending source migration in provenance order, to source 147.
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh

      - name: Replay recorded live80-87 aliases and every pending source migration in order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          root = os.environ['GITHUB_WORKSPACE']
          db = os.environ['DB_URL']
          prov = json.load(open(f'{root}/supabase/migrations/MIGRATION_PROVENANCE.json', encoding='utf-8'))

          def scalar(sql):
              return subprocess.run(['psql', db, '-X', '-Atc', sql], text=True, capture_output=True, check=True).stdout.strip()

          def run_sql(sql, label):
              r = subprocess.run(['psql', db, '-X', '-q', '-v', 'ON_ERROR_STOP=1'], input=sql, text=True, capture_output=True)
              if r.returncode:
                  sys.stdout.write(r.stdout[-4000:]); sys.stderr.write(r.stderr[-4000:])
                  sys.exit(f'PKG023F_REPLAY_FAILED {label}')

          def apply(file, version, name):
              path = f'{root}/supabase/migrations/{file}'
              print(f'apply_source={file} recorded_as={version}_{name}', flush=True)
              r = subprocess.run(['psql', db, '-X', '-q', '-v', 'ON_ERROR_STOP=1', '-f', path], text=True, capture_output=True)
              if r.returncode:
                  sys.stdout.write(r.stdout[-4000:]); sys.stderr.write(r.stderr[-4000:])
                  sys.exit(f'PKG023F_REPLAY_FAILED {file}')
              body = open(path, encoding='utf-8', newline='').read()
              tag = '$pkg023fstmt$'
              assert tag not in body, file
              run_sql(f"insert into supabase_migrations.schema_migrations(version,name,statements) "
                      f"values ('{version}','{name}',array[{tag}{body}{tag}]);", file)

          assert scalar('select max(version) from supabase_migrations.schema_migrations') == '20260906141409'
          entries = [e for e in prov['live_history_snapshot']['entries'] if e['version'] > '20260906141409']
          assert len(entries) == 8, len(entries)
          for e in entries:
              apply(e.get('file') or f"{e['version']}_{e['name']}.sql", e['version'], e['name'])
          assert scalar('select count(*) from supabase_migrations.schema_migrations') == '87'
          for p in prov['pending_forward_migrations']:
              apply(p['file'], p['version'], p['name'])
          history = scalar("select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations")
          open(os.environ['PRE_V3_ARTIFACT_DIR'] + '/pkg023f-schema-before.txt', 'w').write(history + '\n')
          print('history=' + history)
          PY
          psql "$DB_URL" -X -c "notify pgrst, 'reload schema'"

      # One script: it replays the dev_alpha migrations from the exact ledger text, shows the drift, shows every
      # refusal, applies the candidate, closes an account end to end and shows the guard is still live.
      - name: Replay the DEV ledger, reproduce the drift, prove the candidate and its refusals
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/pkg023f_closure_recert/pkg023f_closure_recert_proof.mjs 2>&1 | tee "$PRE_V3_ARTIFACT_DIR/pkg023f-proof.log"
          grep -F 'PASS PKG023F_CLOSURE_RECERTIFICATION' "$PRE_V3_ARTIFACT_DIR/pkg023f-proof.log"
          test "$(node -e "const r=require('$PRE_V3_ARTIFACT_DIR/pkg023f-closure-recertification-report.json');process.stdout.write(r.result+':'+r.checks.length)")" = "PASS:11"

      - name: Stop disposable database
        if: always()
        shell: bash
        run: cd /tmp/uskoci-ru5-device-ui 2>/dev/null && supabase stop --no-backup || true

      - name: Write proof receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > "$PRE_V3_ARTIFACT_DIR/pkg023f-receipt.json" <<JSON
          {
            "packageId":"PKG-023f",
            "candidates":["pkg023f_closure_recertification","pkg023g_ai_test_service_least_privilege","pkg023h_export_settlement_truthful"],
            "candidateSha":"$GITHUB_SHA",
            "treeSha":"$(git rev-parse 'HEAD^{tree}')",
            "workflowRunId":"$GITHUB_RUN_ID",
            "workflowRunAttempt":"$GITHUB_RUN_ATTEMPT",
            "disposableDbOnly":true,
            "liveDbChanged":false,
            "providerCalled":false,
            "productionChanged":false
          }
          JSON

      - name: Upload PKG-023f proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkg023f-proof-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: /tmp/pkg023f-artifacts/
