name: PKG-023j Home attention proof

on:
  push:
    branches: [work/pre-v3-engine-integration-20260911]
    paths:
      - 'supabase/candidates/pkg023j_home_attention.sql'
      - 'supabase/proofs/pkg023j/**'
      - '.github/workflows/pkg023j-home-attention-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg023j-home-attention-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/pkg023j-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked existing dependencies
        run: npm ci
      - name: Bind the exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$PRE_V3_ARTIFACT_DIR"
          git rev-parse HEAD 'HEAD^{tree}' > "$PRE_V3_ARTIFACT_DIR/source-binding.txt"
          sha256sum supabase/candidates/pkg023j_home_attention.sql supabase/proofs/pkg023j/* src/data/homeSnapshot.ts src/data/marketplaceView.ts >> "$PRE_V3_ARTIFACT_DIR/source-binding.txt"
          python3 supabase/migrations/check_migration_integrity.py
      # Existing proven local-stack reconstruction; no hosted URL or hosted secret exists in this job.
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh
      - name: Replay source147 and the already installed paged-reader predecessor
        shell: bash
        run: |
          set -euo pipefail
          python3 supabase/proofs/pkg023j/replay_source147.py
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/candidates/pkg023a_own_reads_paged.sql
      - name: The aggregate proof must fail before the candidate
        shell: bash
        run: |
          set -euo pipefail
          if node supabase/proofs/pkg023j/home_attention_proof.mjs --before > "$PRE_V3_ARTIFACT_DIR/before.log" 2>&1; then
            echo 'PROOF_PASSED_WITHOUT_CANDIDATE'; exit 1
          fi
          grep -F 'PKG023J_MISSING_AGGREGATE_EXPECTED_BEFORE' "$PRE_V3_ARTIFACT_DIR/before.log"
      - name: Prove pin failures roll back then apply exact candidate only locally
        run: node supabase/proofs/pkg023j/home_attention_proof.mjs --apply
      - name: Compare with the real client composer and prove isolation and non-interference
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/pkg023j/home_attention_proof.mjs | tee "$PRE_V3_ARTIFACT_DIR/after.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkg023j-home-attention-${{ github.sha }}
          path: /tmp/pkg023j-artifacts
          if-no-files-found: error
