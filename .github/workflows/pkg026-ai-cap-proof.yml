name: PKG-026 optional AI cap proof

on:
  push:
    branches: [work/ai-reservation-unblock-20260920]
    paths:
      - 'supabase/candidates/pkg026_ai_test_cap_optional.sql'
      - 'supabase/proofs/pkg026/**'
      - '.github/workflows/pkg026-ai-cap-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg026-ai-cap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/pkg026-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked existing dependencies
        run: npm ci
      - name: Bind candidate and frozen source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$PRE_V3_ARTIFACT_DIR"
          git rev-parse HEAD 'HEAD^{tree}' > "$PRE_V3_ARTIFACT_DIR/source-binding.txt"
          sha256sum supabase/candidates/pkg026_ai_test_cap_optional.sql supabase/proofs/pkg026/* >> "$PRE_V3_ARTIFACT_DIR/source-binding.txt"
          python3 supabase/migrations/check_migration_integrity.py
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh
      - name: Reconstruct source147 and certified DEV predecessor
        shell: bash
        run: |
          set -euo pipefail
          python3 supabase/proofs/pkg023j/replay_source147.py
          node supabase/proofs/pkg023f_closure_recert/pkg023f_closure_recert_proof.mjs
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/candidates/pkg023j_home_attention.sql
      - name: Prove failure before, admission after, exact rollback and preserved boundaries
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/pkg026/optional_cap_proof.mjs | tee "$PRE_V3_ARTIFACT_DIR/optional-cap.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkg026-ai-cap-${{ github.sha }}
          path: /tmp/pkg026-artifacts
          if-no-files-found: error
