name: PKG-027 owner-approved fixes proof

# Disposable database only. Nothing in this workflow can reach canonical DEV: it has no secret, and the
# proof refuses any target that is not the local stack this job starts itself.
on:
  push:
    branches: [work/pre-v3-engine-integration-20260911]
    paths:
      - 'supabase/candidates/pkg027*.sql'
      - 'supabase/proofs/pkg027/**'
      - 'supabase/operations/dev-alpha/ledger/**'
      - '.github/workflows/pkg027-owner-approved-fixes-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg027-owner-approved-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/pkg027-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked existing dependencies
        run: npm ci
      - name: Bind the exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$PRE_V3_ARTIFACT_DIR"
          git rev-parse HEAD 'HEAD^{tree}' > "$PRE_V3_ARTIFACT_DIR/source-binding.txt"
          sha256sum supabase/candidates/pkg027*.sql supabase/proofs/pkg027/* supabase/operations/dev-alpha/ledger/*.sql >> "$PRE_V3_ARTIFACT_DIR/source-binding.txt"
          python3 supabase/migrations/check_migration_integrity.py
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh
      - name: Replay source 147
        run: python3 supabase/proofs/pkg023j/replay_source147.py
      - name: Replay every dev_alpha migration of canonical DEV from the exact recorded text
        run: node supabase/proofs/pkg027/pkg027_proof.mjs replay
      - name: Write committed seeds the candidates must rewrite or leave alone
        run: node supabase/proofs/pkg027/pkg027_proof.mjs seed
      - name: Every approved defect must reproduce before the candidates
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/pkg027/pkg027_proof.mjs before | tee "$PRE_V3_ARTIFACT_DIR/before.log"
          grep -F 'PASS PKG027_DEFECTS_REPRODUCED_BEFORE' "$PRE_V3_ARTIFACT_DIR/before.log"
      - name: Tampered pins refused, candidates applied, second application refused, surface diff exact
        run: node supabase/proofs/pkg027/pkg027_proof.mjs apply
      - name: The same scenarios show the fixed behaviour
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/pkg027/pkg027_proof.mjs after | tee "$PRE_V3_ARTIFACT_DIR/after.log"
          grep -F 'PASS PKG027_OWNER_APPROVED_FIXES' "$PRE_V3_ARTIFACT_DIR/after.log"
      - name: Stop disposable database
        if: always()
        shell: bash
        run: cd /tmp/uskoci-ru5-device-ui 2>/dev/null && supabase stop --no-backup || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkg027-owner-approved-fixes-${{ github.sha }}
          path: /tmp/pkg027-artifacts
          if-no-files-found: error
