name: PKG-028 workers and past tasks proof

# Disposable local stack only. Nothing in this workflow can reach canonical DEV: it has no secret, the proof refuses
# any database that is not the local stack this job starts, and the only Edge address the tick is given before a key
# exists is this stack's own gateway.
on:
  push:
    branches: [work/pre-v3-engine-integration-20260911]
    paths:
      - 'supabase/candidates/pkg028*.sql'
      - 'supabase/proofs/pkg028/**'
      - '.github/workflows/pkg028-workers-and-past-tasks-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg028-workers-and-past-tasks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/pkg028-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked existing dependencies
        run: npm ci
      - name: Bind the exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$PRE_V3_ARTIFACT_DIR"
          git rev-parse HEAD 'HEAD^{tree}' > "$PRE_V3_ARTIFACT_DIR/source-binding.txt"
          sha256sum supabase/candidates/pkg027*.sql supabase/candidates/pkg028*.sql supabase/proofs/pkg028/* \
            supabase/functions/_shared/data-export.ts supabase/functions/uskoci-account-closure-worker/*.ts \
            supabase/functions/uskoci-data-export-worker/index.ts supabase/functions/uskoci-push-transport/index.ts \
            >> "$PRE_V3_ARTIFACT_DIR/source-binding.txt"
          python3 supabase/migrations/check_migration_integrity.py
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh
      - name: Replay source 147
        run: python3 supabase/proofs/pkg023j/replay_source147.py
      - name: Replay every dev_alpha migration up to PKG-026 from the exact recorded text
        run: node supabase/proofs/pkg027/pkg027_proof.mjs replay
      - name: Replay PKG-027 from the exact recorded text
        run: node supabase/proofs/pkg028/pkg028_proof.mjs replay
      - name: Every defect reproduces before the candidates
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/pkg028/pkg028_proof.mjs before | tee "$PRE_V3_ARTIFACT_DIR/before.log"
      - name: Tampered pin refused, candidates applied, second application refused, surface diff exact
        run: node supabase/proofs/pkg028/pkg028_proof.mjs apply
      - name: The same scenarios show the fixed behaviour
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/pkg028/pkg028_proof.mjs after | tee "$PRE_V3_ARTIFACT_DIR/after.log"
      - name: Serve the exact Edge workers on the disposable stack and run the tick end to end
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/uskoci-ru5-device-ui
          mkdir -p supabase/functions
          cp -r "$GITHUB_WORKSPACE/supabase/functions/." supabase/functions/
          # The transport switch stays off; the closure worker's switch is on, as the owner is asked to set it.
          printf 'USKOCI_ACCOUNT_CLOSURE_WORKER_ENABLED=true\nEXPO_PUSH_TRANSPORT_ENABLED=false\n' > /tmp/pkg028-functions.env
          nohup supabase functions serve --env-file /tmp/pkg028-functions.env > "$PRE_V3_ARTIFACT_DIR/functions-serve.log" 2>&1 &
          code=000
          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/uskoci-push-transport \
              -H 'Content-Type: application/json' -d '{}' || true)"
            if [ "$code" = "401" ]; then break; fi
            sleep 2
          done
          echo "functions_ready_status=$code"
          test "$code" = "401"
          kong="$(docker ps --format '{{.Names}}' | grep '^supabase_kong_' | head -n1)"
          test -n "$kong"
          cd "$GITHUB_WORKSPACE"
          PKG028_KONG="http://$kong:8000" node supabase/proofs/pkg028/pkg028_proof.mjs e2e | tee "$PRE_V3_ARTIFACT_DIR/e2e.log"
      - name: Stop disposable database
        if: always()
        shell: bash
        run: cd /tmp/uskoci-ru5-device-ui 2>/dev/null && supabase stop --no-backup || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkg028-workers-and-past-tasks-${{ github.sha }}
          path: /tmp/pkg028-artifacts
          if-no-files-found: error
