name: PKG-030 workers take the secret key proof

# Disposable local stack only. Nothing in this workflow can reach canonical DEV: it has no secret, the proof refuses
# any database that is not the local stack this job starts, and the only Edge address the tick is given while a key
# exists is this stack's own gateway.
on:
  push:
    branches: [work/pre-v3-engine-integration-20260911]
    paths:
      - 'supabase/candidates/pkg030*.sql'
      - 'supabase/proofs/pkg030/**'
      - 'supabase/functions/_shared/data-export.ts'
      - 'supabase/functions/uskoci-push-transport/index.ts'
      - 'supabase/functions/uskoci-data-export-worker/index.ts'
      - 'supabase/functions/uskoci-account-closure-worker/**'
      - '.github/workflows/pkg030-workers-secret-key-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg030-workers-secret-key-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/pkg030-artifacts
      # The commit whose worker sources canonical DEV ran when the owner's legacy key was refused (2026-09-21).
      PKG030_BEFORE: 2a22deb3f74145d2e89d1852a0d8942b10244717
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked existing dependencies
        run: npm ci
      - name: Bind the exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$PRE_V3_ARTIFACT_DIR"
          git rev-parse HEAD 'HEAD^{tree}' "$PKG030_BEFORE" > "$PRE_V3_ARTIFACT_DIR/source-binding.txt"
          sha256sum supabase/candidates/pkg027*.sql supabase/candidates/pkg028*.sql supabase/candidates/pkg029*.sql \
            supabase/candidates/pkg030*.sql supabase/proofs/pkg030/* \
            supabase/functions/_shared/data-export.ts supabase/functions/uskoci-account-closure-worker/*.ts \
            supabase/functions/uskoci-data-export-worker/index.ts supabase/functions/uskoci-push-transport/index.ts \
            >> "$PRE_V3_ARTIFACT_DIR/source-binding.txt"
          python3 supabase/migrations/check_migration_integrity.py
      - name: The workers before and after, in an environment shaped like canonical DEV's (no database)
        shell: bash
        run: |
          set -euo pipefail
          before=/tmp/pkg030-before
          for f in supabase/functions/_shared/data-export.ts supabase/functions/uskoci-push-transport/index.ts \
                   supabase/functions/uskoci-data-export-worker/index.ts \
                   supabase/functions/uskoci-account-closure-worker/closure.ts \
                   supabase/functions/uskoci-account-closure-worker/index.ts; do
            mkdir -p "$before/$(dirname "$f")"
            git show "$PKG030_BEFORE:$f" > "$before/$f"
          done
          node supabase/proofs/pkg030/pkg030_proof.mjs gate "$before" before | tee "$PRE_V3_ARTIFACT_DIR/gate-before.log"
          node supabase/proofs/pkg030/pkg030_proof.mjs gate . after | tee "$PRE_V3_ARTIFACT_DIR/gate-after.log"
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh
      - name: Replay source 147
        run: python3 supabase/proofs/pkg023j/replay_source147.py
      - name: Replay every dev_alpha migration up to PKG-026 from the exact recorded text
        run: node supabase/proofs/pkg027/pkg027_proof.mjs replay
      - name: Replay PKG-027 from the exact recorded text
        run: node supabase/proofs/pkg028/pkg028_proof.mjs replay
      - name: Replay PKG-028 from the exact recorded text
        run: node supabase/proofs/pkg029/pkg029_proof.mjs replay
      - name: Replay PKG-029 from the exact recorded text
        run: node supabase/proofs/pkg030/pkg030_proof.mjs replay
      - name: The tick sends the key as a Bearer before the candidate
        run: node supabase/proofs/pkg030/pkg030_proof.mjs before
      - name: Tampered pin refused, candidate applied, second application refused, surface diff exact
        run: node supabase/proofs/pkg030/pkg030_proof.mjs apply
      - name: The tick sends the key on apikey after the candidate
        run: node supabase/proofs/pkg030/pkg030_proof.mjs after
      - name: Serve the exact Edge workers with JWT verification off and run the tick end to end
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/uskoci-ru5-device-ui
          # Only the three workers and the one shared file they import: other functions import app source
          # outside supabase/functions, which this copied project does not have.
          mkdir -p supabase/functions/_shared
          cp "$GITHUB_WORKSPACE/supabase/functions/_shared/data-export.ts" supabase/functions/_shared/
          for f in uskoci-push-transport uskoci-data-export-worker uskoci-account-closure-worker; do
            cp -r "$GITHUB_WORKSPACE/supabase/functions/$f" supabase/functions/
          done
          ls -R supabase/functions
          # The transport switch stays off; the closure worker's switch is on, as on canonical DEV.
          printf 'USKOCI_ACCOUNT_CLOSURE_WORKER_ENABLED=true\nEXPO_PUSH_TRANSPORT_ENABLED=false\n' > /tmp/pkg030-functions.env
          # As deployed after PKG-030: no JWT check in front of these three workers; each checks the key itself.
          nohup supabase functions serve --no-verify-jwt --env-file /tmp/pkg030-functions.env > "$PRE_V3_ARTIFACT_DIR/functions-serve.log" 2>&1 &
          code=000
          body=''
          for i in $(seq 1 90); do
            body="$(curl -s -w ' %{http_code}' -X POST http://127.0.0.1:54321/functions/v1/uskoci-push-transport \
              -H 'Content-Type: application/json' -d '{"action":"tick"}' || true)"
            code="${body##* }"
            if [ "$code" = "403" ]; then break; fi
            sleep 2
          done
          echo "functions_ready=$body"
          # 403 FORBIDDEN is the worker's own answer to a call without a key; a gateway JWT check would say 401.
          test "$code" = "403"
          case "$body" in *FORBIDDEN*) ;; *) echo "not the worker's own refusal: $body"; exit 1 ;; esac
          kong="$(docker ps --format '{{.Names}}' | grep '^supabase_kong_' | head -n1)"
          test -n "$kong"
          cd "$GITHUB_WORKSPACE"
          PKG030_KONG="http://$kong:8000" node supabase/proofs/pkg030/pkg030_proof.mjs e2e | tee "$PRE_V3_ARTIFACT_DIR/e2e.log"
      - name: Stop disposable database
        if: always()
        shell: bash
        run: cd /tmp/uskoci-ru5-device-ui 2>/dev/null && supabase stop --no-backup || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkg030-workers-secret-key-${{ github.sha }}
          path: /tmp/pkg030-artifacts
          if-no-files-found: error
