name: PKG-031 owner rules proof

# Disposable database only. Nothing in this workflow can reach canonical DEV: it has no secret, and the proof
# refuses any target that is not the local stack this job starts itself.
on:
  push:
    branches: [work/pre-v3-engine-integration-20260911]
    paths:
      - 'supabase/candidates/pkg031*.sql'
      - 'supabase/proofs/pkg031/**'
      - '.github/workflows/pkg031-owner-rules-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkg031-owner-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/pkg031-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked existing dependencies
        run: npm ci
      - name: Bind the exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$PRE_V3_ARTIFACT_DIR"
          git rev-parse HEAD 'HEAD^{tree}' > "$PRE_V3_ARTIFACT_DIR/source-binding.txt"
          sha256sum supabase/candidates/pkg027*.sql supabase/candidates/pkg028*.sql supabase/candidates/pkg029*.sql \
            supabase/candidates/pkg030*.sql supabase/candidates/pkg031*.sql supabase/proofs/pkg031/* \
            >> "$PRE_V3_ARTIFACT_DIR/source-binding.txt"
          python3 supabase/migrations/check_migration_integrity.py
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh
      - name: Replay source 147
        run: python3 supabase/proofs/pkg023j/replay_source147.py
      - name: Replay every dev_alpha migration up to PKG-026 from the exact recorded text
        run: node supabase/proofs/pkg027/pkg027_proof.mjs replay
      - name: Replay PKG-027 from the exact recorded text
        run: node supabase/proofs/pkg028/pkg028_proof.mjs replay
      - name: Replay PKG-028 from the exact recorded text
        run: node supabase/proofs/pkg029/pkg029_proof.mjs replay
      - name: Replay PKG-029 from the exact recorded text
        run: node supabase/proofs/pkg030/pkg030_proof.mjs replay
      - name: Replay PKG-030 from the exact recorded text
        run: node supabase/proofs/pkg031/pkg031_proof.mjs replay
      - name: Every defect reproduces before the candidates
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/pkg031/pkg031_proof.mjs before | tee "$PRE_V3_ARTIFACT_DIR/before.log"
      - name: Tampered pin refused, candidates applied, second application refused, surface diff exact
        run: node supabase/proofs/pkg031/pkg031_proof.mjs apply
      - name: The same scenarios show the fixed behaviour
        shell: bash
        run: |
          set -euo pipefail
          node supabase/proofs/pkg031/pkg031_proof.mjs after | tee "$PRE_V3_ARTIFACT_DIR/after.log"
      - name: Stop disposable database
        if: always()
        shell: bash
        run: cd /tmp/uskoci-ru5-device-ui 2>/dev/null && supabase stop --no-backup || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkg031-owner-rules-${{ github.sha }}
          path: /tmp/pkg031-artifacts
          if-no-files-found: error
