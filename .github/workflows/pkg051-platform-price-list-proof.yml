name: PKG-051 platform price list proof
on:
  push:
    branches: [work/uskoci-ui-unification-20260924, work/pre-v3-engine-integration-20260911, pkg051-impl]
    # Every file the proof reads, directly or through the replay chain, so a changed input re-runs it. Explicit
    # names only, no bracket patterns (GitHub rejected a workflow file over one).
    paths:
      - 'supabase/candidates/pkg051*.sql'
      - 'supabase/proofs/pkg051/**'
      - '.github/workflows/pkg051-platform-price-list-proof.yml'
      - 'supabase/proofs/pre_v3/**'
      - 'supabase/proofs/pkg023/pkg023_surface.sql'
      - 'supabase/proofs/ru5_device_ui_live79_env.sh'
      - 'supabase/candidates/pkg042a_*.sql'
      - 'supabase/candidates/pkg045a_*.sql'
      - 'supabase/candidates/pkg046a_*.sql'
      - 'supabase/candidates/pkg047a_*.sql'
      - 'supabase/candidates/pkg048a_*.sql'
      - 'supabase/candidates/pkg050a_*.sql'
      - 'supabase/proofs/pkg023j/**'
      - 'supabase/proofs/pkg027/**'
      - 'supabase/proofs/pkg028/**'
      - 'supabase/proofs/pkg029/**'
      - 'supabase/proofs/pkg030/**'
      - 'supabase/proofs/pkg031/**'
      - 'supabase/proofs/pkg032/**'
      - 'supabase/proofs/pkg033/**'
      - 'supabase/proofs/pkg034/**'
      - 'supabase/proofs/pkg035/**'
      - 'supabase/proofs/pkg037/**'
      - 'supabase/proofs/pkg038/**'
      - 'supabase/proofs/pkg039/**'
      - 'supabase/proofs/pkg040/**'
      - 'supabase/proofs/pkg042/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pkg051-platform-price-list-${{ github.ref }}
  cancel-in-progress: true
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/pkg051-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked existing dependencies
        run: npm ci
      - name: Bind source, migration integrity and types
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PRE_V3_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD 'HEAD^{tree}' > "$PRE_V3_ARTIFACT_DIR/source-binding.txt"
          sha256sum supabase/candidates/pkg051*.sql supabase/proofs/pkg051/pkg051_proof.mjs >> "$PRE_V3_ARTIFACT_DIR/source-binding.txt"
          python3 supabase/migrations/check_migration_integrity.py
          npx tsc --noEmit -p tsconfig.json
      - name: Reconstruct disposable historical live79
        run: bash supabase/proofs/ru5_device_ui_live79_env.sh
      - name: Replay source 147
        run: python3 supabase/proofs/pkg023j/replay_source147.py
      - name: Replay every dev_alpha migration up to PKG-026
        run: node supabase/proofs/pkg027/pkg027_proof.mjs replay
      - name: Replay PKG-027
        run: node supabase/proofs/pkg028/pkg028_proof.mjs replay
      - name: Replay PKG-028
        run: node supabase/proofs/pkg029/pkg029_proof.mjs replay
      - name: Replay PKG-029
        run: node supabase/proofs/pkg030/pkg030_proof.mjs replay
      - name: Replay PKG-030
        run: node supabase/proofs/pkg031/pkg031_proof.mjs replay
      - name: Replay PKG-031
        run: node supabase/proofs/pkg032/pkg032_proof.mjs replay
      - name: Replay PKG-032
        run: node supabase/proofs/pkg033/pkg033_proof.mjs replay
      - name: Replay PKG-033
        run: node supabase/proofs/pkg034/pkg034_proof.mjs replay
      - name: Replay PKG-034
        run: node supabase/proofs/pkg035/pkg035_proof.mjs replay
      - name: Replay PKG-035
        run: node supabase/proofs/pkg037/pkg037_proof.mjs replay
      - name: Replay PKG-037
        run: node supabase/proofs/pkg038/pkg038_proof.mjs replay
      - name: Replay PKG-038
        run: node supabase/proofs/pkg039/pkg039_proof.mjs replay
      - name: Replay PKG-039
        run: node supabase/proofs/pkg040/pkg040_proof.mjs replay
      - name: Replay PKG-040
        run: node supabase/proofs/pkg042/pkg042_proof.mjs replay
      - name: Replay PKG-042a to PKG-050a, then tampers, the zero-RSD price list, the kill switch, the free path and an unmoved certificate
        run: node supabase/proofs/pkg051/pkg051_proof.mjs
      - name: Stop disposable database
        if: always()
        shell: bash
        run: cd /tmp/uskoci-ru5-device-ui 2>/dev/null && supabase stop --no-backup || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkg051-platform-price-list-${{ github.sha }}
          path: /tmp/pkg051-artifacts
          if-no-files-found: error
