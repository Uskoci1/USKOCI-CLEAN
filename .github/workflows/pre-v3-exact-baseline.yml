name: PRE-V3 exact PR101 baseline
on:
  push:
    branches: [work/pre-v3-exact-verifier-20260911]
    paths: [.github/workflows/pre-v3-exact-baseline.yml]
permissions:
  contents: read
concurrency:
  group: pre-v3-exact-pr101-20260911
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1138d4f727735519b15d9b834bf261954e8013fe
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Pin source and retain exact archive and provenance
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1138d4f727735519b15d9b834bf261954e8013fe
          test "$(git rev-parse HEAD^{tree})" = 2ef75df1fee892311f45fb38364045112b31df2d
          mkdir -p "$RUNNER_TEMP/pre-v3-source" "$RUNNER_TEMP/pre-v3-evidence"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/pre-v3-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/pre-v3-source/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/pre-v3-source/tree.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/pre-v3-source/git-tree.txt"
          git log --format=fuller 916ffb498ba5ad47a307a3c66477757b6753095a..HEAD > "$RUNNER_TEMP/pre-v3-evidence/lineage.txt"
          git merge-base --is-ancestor 58e842e883db71f9118efc474c5011f3b261824c df167547c469f5b4cb5679058526b697dae8ba48
          git merge-base --is-ancestor df167547c469f5b4cb5679058526b697dae8ba48 HEAD
          git diff --numstat 916ffb498ba5ad47a307a3c66477757b6753095a 58e842e883db71f9118efc474c5011f3b261824c > "$RUNNER_TEMP/pre-v3-evidence/pr99-numstat.tsv"
          git diff --numstat 58e842e883db71f9118efc474c5011f3b261824c df167547c469f5b4cb5679058526b697dae8ba48 > "$RUNNER_TEMP/pre-v3-evidence/pr100-incremental-numstat.tsv"
          git diff --numstat df167547c469f5b4cb5679058526b697dae8ba48 HEAD > "$RUNNER_TEMP/pre-v3-evidence/pr101-numstat.tsv"
          git diff --binary df167547c469f5b4cb5679058526b697dae8ba48 HEAD > "$RUNNER_TEMP/pre-v3-evidence/pr101.patch"
          sha256sum package.json package-lock.json > "$RUNNER_TEMP/pre-v3-evidence/dependency-hashes-before.txt"
          (cd "$RUNNER_TEMP/pre-v3-source" && sha256sum source.tar.gz git-tree.txt > SHA256SUMS)
      - name: Retain source independently of tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-v3-exact-source-${{ github.run_id }}
          path: ${{ runner.temp }}/pre-v3-source/
          retention-days: 3
          if-no-files-found: error
      - name: Install unchanged locked dependencies
        id: install
        working-directory: source
        run: npm ci
      - name: Execute exact-source checks and preserve all outcomes
        if: success()
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys, time
          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pre-v3-evidence'
          out.mkdir(exist_ok=True)
          node_tests = sorted(str(p) for base in ('scripts', 'supabase') for p in pathlib.Path(base).rglob('*') if p.is_file() and (p.name.endswith('.test.cjs') or p.name.endswith('.test.mjs')))
          (out / 'node-test-manifest.json').write_text(json.dumps(node_tests, indent=2) + '\n')
          commands = [
              ('typescript', ['npx', '--no-install', 'tsc', '--noEmit']),
              ('jest', ['npx', '--no-install', 'jest', '--runInBand', '--silent', '--json', '--outputFile=' + str(out / 'jest-results.json')]),
              ('node_edge_synthetic', ['node', '--test', '--test-concurrency=2', '--test-reporter=tap', *node_tests]),
              ('source_inventory', ['node', 'scripts/pre_html_source_inventory.cjs', str(out / 'source-inventory.json')]),
              ('migration_integrity', ['sh', 'supabase/migrations/check_md5.sh']),
              ('diff_check', ['git', 'diff', '--check', 'df167547c469f5b4cb5679058526b697dae8ba48', 'HEAD']),
              ('dependency_lock_unchanged', ['git', 'diff', '--exit-code', 'HEAD', '--', 'package.json', 'package-lock.json']),
              ('tracked_source_unchanged', ['git', 'diff', '--exit-code', 'HEAD']),
          ]
          results = {}
          for name, command in commands:
              start = time.monotonic()
              with (out / (name + '.log')).open('w') as log:
                  log.write(json.dumps(command) + '\n'); log.flush()
                  try:
                      result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=600, check=False)
                      code = result.returncode
                  except subprocess.TimeoutExpired:
                      log.write('\nCHECK TIMED OUT; NOT A PASS\n')
                      code = 124
              results[name] = {'exitCode': code, 'seconds': round(time.monotonic() - start, 3)}
              print(name, results[name], flush=True)
          jest = {}
          path = out / 'jest-results.json'
          if path.exists():
              raw = json.loads(path.read_text())
              jest = {k: raw.get(k) for k in ('success', 'numTotalTestSuites', 'numPassedTestSuites', 'numFailedTestSuites', 'numPendingTestSuites', 'numTotalTests', 'numPassedTests', 'numFailedTests', 'numPendingTests', 'numTodoTests')}
          pending = any((jest.get(k) or 0) != 0 for k in ('numPendingTestSuites', 'numPendingTests', 'numTodoTests'))
          passed = all(v['exitCode'] == 0 for v in results.values()) and bool(jest.get('success')) and not pending and bool(node_tests)
          receipt = {
              'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'sourceTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'workflowCommit': os.environ['GITHUB_SHA'],
              'runId': os.environ['GITHUB_RUN_ID'],
              'nodeVersion': subprocess.check_output(['node', '--version'], text=True).strip(),
              'gates': results, 'jest': jest, 'nodeTestFileCount': len(node_tests),
              'PR101_EXACT_HEAD_BASELINE': 'PASS' if passed else 'FAIL',
              'environment': 'isolated-github-actions-exact-source',
              'limits': ['Node Edge tests are synthetic, not a Deno deployment or provider proof.', 'No live SQL integration, migrations, scheduler, merge, native or physical-device action.'],
              'productionChanged': False, 'providerProven': False, 'physicalDeviceProven': False,
          }
          (out / 'baseline-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          sys.exit(0 if passed else 1)
          PY
      - name: Retain original evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-v3-exact-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/pre-v3-evidence/
          retention-days: 7
          if-no-files-found: error
