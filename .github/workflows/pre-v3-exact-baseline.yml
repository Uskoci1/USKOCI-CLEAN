name: PRE-V3 exact integration baseline
on:
  push:
    branches: [work/pre-v3-exact-verifier-20260911]
    paths: [.github/workflows/pre-v3-exact-baseline.yml]
permissions:
  contents: read
concurrency:
  group: pre-v3-exact-integration-20260912
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 93fb1748104e1f21344d35a1d62b3a9bd672f747
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Pin exact integration source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 93fb1748104e1f21344d35a1d62b3a9bd672f747
          test "$(git rev-parse HEAD^{tree})" = db89de68d006d3247212c5313746ba7bdf5c6587
          git merge-base --is-ancestor 1138d4f727735519b15d9b834bf261954e8013fe HEAD
          git merge-base --is-ancestor 94bda947c68b981972c53d4372a7e4bc8549b542 HEAD
          mkdir -p "$RUNNER_TEMP/pre-v3-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/pre-v3-evidence/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/pre-v3-evidence/tree.txt"
          git log --format=fuller 94bda947c68b981972c53d4372a7e4bc8549b542..HEAD > "$RUNNER_TEMP/pre-v3-evidence/integration-lineage.txt"
          git diff --numstat 94bda947c68b981972c53d4372a7e4bc8549b542 HEAD > "$RUNNER_TEMP/pre-v3-evidence/integration-numstat.tsv"
          git diff --binary 94bda947c68b981972c53d4372a7e4bc8549b542 HEAD > "$RUNNER_TEMP/pre-v3-evidence/integration.patch"
      - name: Install locked dependencies
        working-directory: source
        run: npm ci
      - name: Run complete exact-head source regression
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys, time
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pre-v3-evidence'
          tests = sorted(str(p) for base in ('scripts','supabase') for p in pathlib.Path(base).rglob('*') if p.is_file() and (p.name.endswith('.test.cjs') or p.name.endswith('.test.mjs')))
          (out/'node-test-manifest.json').write_text(json.dumps(tests,indent=2)+'\n')
          commands = [
            ('typescript',['npx','--no-install','tsc','--noEmit']),
            ('jest',['npx','--no-install','jest','--runInBand','--silent','--json','--outputFile='+str(out/'jest-results.json')]),
            ('node_edge',['node','--test','--test-concurrency=2','--test-reporter=tap',*tests]),
            ('source_inventory',['node','scripts/pre_html_source_inventory.cjs',str(out/'source-inventory.json')]),
            ('migration_integrity',['sh','supabase/migrations/check_md5.sh']),
            ('c09_json',['python','-m','json.tool','docs/implementation/pre-v3/C09_PROVENANCE_LEDGER.json']),
            ('diff_check',['git','diff','--check','94bda947c68b981972c53d4372a7e4bc8549b542','HEAD']),
            ('dependency_lock_unchanged',['git','diff','--exit-code','1138d4f727735519b15d9b834bf261954e8013fe','HEAD','--','package.json','package-lock.json']),
            ('tracked_source_unchanged',['git','diff','--exit-code','HEAD']),
          ]
          results={}
          for name,cmd in commands:
            start=time.monotonic()
            with (out/(name+'.log')).open('w') as log:
              log.write(json.dumps(cmd)+'\n'); log.flush()
              try: code=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=900).returncode
              except subprocess.TimeoutExpired: code=124; log.write('\nTIMED OUT; NOT PASS\n')
            results[name]={'exitCode':code,'seconds':round(time.monotonic()-start,3)}
            print(name,results[name],flush=True)
          jest={}; jp=out/'jest-results.json'
          if jp.exists():
            raw=json.loads(jp.read_text()); jest={k:raw.get(k) for k in ('success','numTotalTestSuites','numPassedTestSuites','numFailedTestSuites','numPendingTestSuites','numTotalTests','numPassedTests','numFailedTests','numPendingTests','numTodoTests')}
          pending=any((jest.get(k) or 0)!=0 for k in ('numPendingTestSuites','numPendingTests','numTodoTests'))
          passed=all(v['exitCode']==0 for v in results.values()) and bool(jest.get('success')) and not pending and bool(tests)
          receipt={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'sourceTree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'workflowCommit':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'gates':results,'jest':jest,'nodeTestFileCount':len(tests),'PRE_V3_INTEGRATION_SOURCE_BASELINE':'PASS' if passed else 'FAIL','environment':'github-actions-exact-source','productionChanged':False,'providerProven':False,'physicalDeviceProven':False,'limits':['Source/Jest/Node checks only in this job; isolated authenticated SQL runs separately.','No canonical merge, live migration, scheduler activation or provider/device claim.']}
          (out/'integration-baseline-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n'); print(json.dumps(receipt,indent=2)); sys.exit(0 if passed else 1)
          PY
      - name: Retain exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-v3-integration-source-${{ github.run_id }}
          path: ${{ runner.temp }}/pre-v3-evidence/
          retention-days: 14
          if-no-files-found: error
