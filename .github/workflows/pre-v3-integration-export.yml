name: PRE-V3 integration source export
on:
  push:
    branches: [work/pre-v3-exact-verifier-20260911]
    paths: [.github/workflows/pre-v3-integration-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 94bda947c68b981972c53d4372a7e4bc8549b542
          fetch-depth: 0
          persist-credentials: false
      - name: Export Git objects and refreshed provenance without credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pre-v3-export"
          test "$(git rev-parse HEAD)" = 94bda947c68b981972c53d4372a7e4bc8549b542
          refs=(refs/remotes/origin/clean-alpha-backend refs/remotes/origin/feat/v2-native-journey-closure-20260911 refs/remotes/origin/feat/owner-completion-20260911 refs/remotes/origin/work/pre-html-stabilization-20260911 refs/remotes/origin/work/pre-v3-engine-closure-20260911 refs/remotes/origin/work/pre-v3-proof-repair-20260911 refs/remotes/origin/feat/v2-agreement-changes-20260911)
          git bundle create "$RUNNER_TEMP/pre-v3-export/source.bundle" HEAD "${refs[@]}"
          git bundle verify "$RUNNER_TEMP/pre-v3-export/source.bundle"
          git show -s --format=fuller HEAD > "$RUNNER_TEMP/pre-v3-export/engine-commit.txt"
          git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin/ > "$RUNNER_TEMP/pre-v3-export/refs.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/pre-v3-export/engine-tree.txt"
          git diff --binary 1138d4f727735519b15d9b834bf261954e8013fe e5579800a066247a2e235883371be98bda5ed3d9 > "$RUNNER_TEMP/pre-v3-export/repair.patch"
          gh api repos/Uskoci1/USKOCI-CLEAN/pulls?state=open\&per_page=100 > "$RUNNER_TEMP/pre-v3-export/open-prs.json"
          date -u +%FT%TZ > "$RUNNER_TEMP/pre-v3-export/observed-at.txt"
          (cd "$RUNNER_TEMP/pre-v3-export" && sha256sum source.bundle engine-tree.txt repair.patch refs.txt open-prs.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-v3-integration-source-${{ github.run_id }}
          path: ${{ runner.temp }}/pre-v3-export/
          retention-days: 3
          if-no-files-found: error
