name: PRE-V3 exact integration staged SQL verification
on:
  push:
    branches: [work/pre-v3-proof-runner-20260911]
    paths: ['.pre-v3/run.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pre-v3-integration-staged-sql
  cancel-in-progress: false
env:
  CI: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  RU5_DEVICE_PACKAGE: rs.uskoci.n04proof
  RU5_DEVICE_ARTIFACT_DIR: artifacts/ai-review-device
  W03_INTAKE_ARTIFACT_DIR: artifacts/ai-review-device/source105
  AI_REVIEW_SCOPE: marketplace
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false
      - name: Read exact owner-controlled source pin
        id: pin
        run: |
          python3 - <<'PY'
          import json,re,os
          d=json.load(open('control/.pre-v3/run.json'));s=d['sourceSha'];t=d['sourceTree']
          assert re.fullmatch('[a-f0-9]{40}',s) and re.fullmatch('[a-f0-9]{40}',t)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('source='+s+'\n');f.write('tree='+t+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PRE_V3_SOURCE_SHA='+s+'\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.pin.outputs.source }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Pin source, apply explicitly requested correction, admit candidate-only inventory
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.pin.outputs.source }}
          SOURCE_TREE: ${{ steps.pin.outputs.tree }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          python3 ../control/.pre-v3/apply_p12_source_correction.py
          export SOURCE_SHA="$(git rev-parse HEAD)"
          export SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          python3 ../control/.pre-v3/finalize_inventory.py
      - name: Install locked dependencies and verify exact source regression
        working-directory: source
        run: |
          npm ci > "$RUNNER_TEMP/pre-v3-evidence/dependencies.log" 2>&1
          python3 ../control/.pre-v3/package_checks.py source
          for f in supabase/proofs/pre_v3/*.mjs; do node --check "$f"; done
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Exact historical baseline worktree
        working-directory: source
        run: |
          git worktree add --detach ../baseline 1138d4f727735519b15d9b834bf261954e8013fe
          ln -s "$PWD/node_modules" ../baseline/node_modules
      - name: Existing disposable full stack through live79
        working-directory: baseline
        run: |
          export GITHUB_WORKSPACE="$PWD"
          export GITHUB_SHA=1138d4f727735519b15d9b834bf261954e8013fe
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$RUNNER_TEMP/pre-v3-evidence/bootstrap.log" 2>&1
      - name: Export disposable Auth fixture
        working-directory: baseline
        run: env GITHUB_WORKSPACE="$PWD" GITHUB_SHA=1138d4f727735519b15d9b834bf261954e8013fe node supabase/proofs/ru5_device_ui_fixture.mjs > "$RUNNER_TEMP/pre-v3-evidence/fixture.log" 2>&1
      - name: Reconstruct exact historical source through108
        working-directory: baseline
        run: |
          export GITHUB_WORKSPACE="$PWD"
          export GITHUB_SHA=1138d4f727735519b15d9b834bf261954e8013fe
          node scripts/ci/owned-intake-proof.mjs prepare105 > "$RUNNER_TEMP/pre-v3-evidence/prepare105.log" 2>&1
          node scripts/ai_review_fixture.mjs admit > "$RUNNER_TEMP/pre-v3-evidence/admit106.log" 2>&1
          node scripts/ci/owned-intake-proof.mjs prepare108 > "$RUNNER_TEMP/pre-v3-evidence/prepare108.log" 2>&1
      - name: Reuse ordered candidate109-116 invariants
        working-directory: source
        run: |
          export GITHUB_SHA="$PRE_V3_SOURCE_SHA"
          export PRE_V3_ARTIFACT_DIR="$RUNNER_TEMP/pre-v3-evidence"
          for f in worker_authority_proof.mjs inbox_visibility_proof.mjs agreement_core_proof.mjs need_lifecycle_proof.mjs agreement_client_proof.mjs requester_identity_proof.mjs; do
            node "supabase/proofs/pre_v3/$f" 2>&1 | tee "$RUNNER_TEMP/pre-v3-evidence/$f.log"
          done
      - name: Execute ordered closure package SQL proofs
        working-directory: source
        run: python3 ../control/.pre-v3/package_checks.py extras
      - name: Bind final exact-source package verdict
        working-directory: source
        if: always()
        run: python3 ../control/.pre-v3/package_checks.py receipt
      - name: Print bounded evidence summary
        if: always()
        working-directory: source
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'pre-v3-evidence'
          p=out/'package-integration-receipt.json'
          if not p.exists():
            print('PRE_V3_SUMMARY_MISSING');raise SystemExit(0)
          d=json.loads(p.read_text());s=d.get('sourceRegression',{})
          safe={k:d.get(k) for k in ('sourceCommit','sourceTree','runId','finalHistoryCount','result','liveChanged','providerProven','deviceProven')}
          safe['sourceRegression']={k:s.get(k) for k in ('regressionScope','result','gates','jest','node','nodeFiles')}
          safe['reports']={k:{f:v.get(f) for f in ('unit','result','sourceSha','historyCount','actualAuth','actualDatabase','actualClient','providerCalled','liveAccess','deviceProven','checks')} for k,v in d.get('reports',{}).items()}
          print('PRE_V3_BOUNDED_SUMMARY='+json.dumps(safe,separators=(',',':')))
          PY
      - name: Retain exact proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-v3-staged-sql-${{ github.run_id }}
          path: ${{ runner.temp }}/pre-v3-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Stop disposable Supabase
        if: always()
        run: |
          if [[ -n "${RU5_DEVICE_PROOF_DIR:-}" && -d "$RU5_DEVICE_PROOF_DIR" ]]; then cd "$RU5_DEVICE_PROOF_DIR"; supabase stop --no-backup; fi
