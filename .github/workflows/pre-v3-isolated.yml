name: PRE-V3 exact integration staged SQL verification
on:
  push:
    branches: [work/pre-v3-proof-runner-20260911]
    paths: ['.pre-v3/run.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pre-v3-integration-staged-sql
  cancel-in-progress: false
env:
  CI: '1'
  SUPABASE_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  RU5_DEVICE_PACKAGE: rs.uskoci.n04proof
  RU5_DEVICE_ARTIFACT_DIR: artifacts/ai-review-device
  W03_INTAKE_ARTIFACT_DIR: artifacts/ai-review-device/source105
  AI_REVIEW_SCOPE: marketplace
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false
      - name: Read exact owner-controlled source pin
        id: pin
        run: |
          python3 - <<'PY'
          import json,re,os
          d=json.load(open('control/.pre-v3/run.json'));s=d['sourceSha'];t=d['sourceTree']
          assert re.fullmatch('[a-f0-9]{40}',s) and re.fullmatch('[a-f0-9]{40}',t)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('source='+s+'\n');f.write('tree='+t+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PRE_V3_SOURCE_SHA='+s+'\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.pin.outputs.source }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Pin exact integration source without branch mutation
        working-directory: source
        env:
          SOURCE_SHA: ${{ steps.pin.outputs.source }}
          SOURCE_TREE: ${{ steps.pin.outputs.tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git merge-base --is-ancestor 1138d4f727735519b15d9b834bf261954e8013fe HEAD
          git merge-base --is-ancestor 94bda947c68b981972c53d4372a7e4bc8549b542 HEAD
          mkdir -p "$RUNNER_TEMP/pre-v3-evidence"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/pre-v3-evidence/source-commit.txt"
          printf '%s\n' "$SOURCE_TREE" > "$RUNNER_TEMP/pre-v3-evidence/source-tree.txt"
          git status --porcelain | tee "$RUNNER_TEMP/pre-v3-evidence/source-status.txt"
          test ! -s "$RUNNER_TEMP/pre-v3-evidence/source-status.txt"
      - name: Unchanged dependencies, proof syntax and migration integrity
        working-directory: source
        run: |
          npm ci > "$RUNNER_TEMP/pre-v3-evidence/dependencies.log" 2>&1
          python3 supabase/migrations/check_migration_integrity.py | tee "$RUNNER_TEMP/pre-v3-evidence/integrity.log"
          for f in worker_authority_proof.mjs inbox_visibility_proof.mjs agreement_core_proof.mjs need_lifecycle_proof.mjs agreement_client_proof.mjs requester_identity_proof.mjs; do
            node --check "supabase/proofs/pre_v3/$f"
          done
          git diff --check HEAD
          git diff --exit-code HEAD
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Exact historical baseline worktree
        working-directory: source
        run: |
          git worktree add --detach ../baseline 1138d4f727735519b15d9b834bf261954e8013fe
          ln -s "$PWD/node_modules" ../baseline/node_modules
      - name: Existing disposable full stack through live79
        working-directory: baseline
        run: |
          export GITHUB_WORKSPACE="$PWD"
          export GITHUB_SHA=1138d4f727735519b15d9b834bf261954e8013fe
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$RUNNER_TEMP/pre-v3-evidence/bootstrap.log" 2>&1
      - name: Export disposable Auth fixture
        working-directory: baseline
        run: env GITHUB_WORKSPACE="$PWD" GITHUB_SHA=1138d4f727735519b15d9b834bf261954e8013fe node supabase/proofs/ru5_device_ui_fixture.mjs > "$RUNNER_TEMP/pre-v3-evidence/fixture.log" 2>&1
      - name: Reconstruct exact historical source through108
        id: reconstruct
        working-directory: baseline
        run: |
          export GITHUB_WORKSPACE="$PWD"
          export GITHUB_SHA=1138d4f727735519b15d9b834bf261954e8013fe
          node scripts/ci/owned-intake-proof.mjs prepare105 > "$RUNNER_TEMP/pre-v3-evidence/prepare105.log" 2>&1
          node scripts/ai_review_fixture.mjs admit > "$RUNNER_TEMP/pre-v3-evidence/admit106.log" 2>&1
          node scripts/ci/owned-intake-proof.mjs prepare108 > "$RUNNER_TEMP/pre-v3-evidence/prepare108.log" 2>&1
      - name: Stage109-110 Worker location availability capacity authority
        id: worker_sql
        working-directory: source
        run: env GITHUB_SHA="$PRE_V3_SOURCE_SHA" PRE_V3_ARTIFACT_DIR="$RUNNER_TEMP/pre-v3-evidence" node supabase/proofs/pre_v3/worker_authority_proof.mjs 2>&1 | tee "$RUNNER_TEMP/pre-v3-evidence/worker-sql.log"
      - name: Stage111 Inbox visibility truth
        id: inbox_sql
        working-directory: source
        run: env GITHUB_SHA="$PRE_V3_SOURCE_SHA" PRE_V3_ARTIFACT_DIR="$RUNNER_TEMP/pre-v3-evidence" node supabase/proofs/pre_v3/inbox_visibility_proof.mjs 2>&1 | tee "$RUNNER_TEMP/pre-v3-evidence/inbox-sql.log"
      - name: Stage112-113 Agreement core and hostile races
        id: agreement_sql
        working-directory: source
        run: env GITHUB_SHA="$PRE_V3_SOURCE_SHA" PRE_V3_ARTIFACT_DIR="$RUNNER_TEMP/pre-v3-evidence" node supabase/proofs/pre_v3/agreement_core_proof.mjs 2>&1 | tee "$RUNNER_TEMP/pre-v3-evidence/agreement-sql.log"
      - name: Stage114 Need lifecycle and second Task engine proof
        id: need_sql
        working-directory: source
        run: env GITHUB_SHA="$PRE_V3_SOURCE_SHA" PRE_V3_ARTIFACT_DIR="$RUNNER_TEMP/pre-v3-evidence" node supabase/proofs/pre_v3/need_lifecycle_proof.mjs 2>&1 | tee "$RUNNER_TEMP/pre-v3-evidence/need-sql.log"
      - name: Stage115 Agreement production-client replay proof
        id: agreement_client_sql
        working-directory: source
        run: env GITHUB_SHA="$PRE_V3_SOURCE_SHA" PRE_V3_ARTIFACT_DIR="$RUNNER_TEMP/pre-v3-evidence" node supabase/proofs/pre_v3/agreement_client_proof.mjs 2>&1 | tee "$RUNNER_TEMP/pre-v3-evidence/agreement-client-sql.log"
      - name: Stage116 Requester identity authority proof
        id: requester_sql
        working-directory: source
        run: env GITHUB_SHA="$PRE_V3_SOURCE_SHA" PRE_V3_ARTIFACT_DIR="$RUNNER_TEMP/pre-v3-evidence" node supabase/proofs/pre_v3/requester_identity_proof.mjs 2>&1 | tee "$RUNNER_TEMP/pre-v3-evidence/requester-sql.log"
      - name: Bind final staged history and proof verdict
        working-directory: source
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'pre-v3-evidence';reports={}
          for name in ['worker-authority-report.json','inbox-visibility-report.json','agreement-core-report.json','need-lifecycle-report.json','agreement-client-report.json','requester-identity-report.json']:
            p=out/name
            reports[name]=json.loads(p.read_text()) if p.exists() else {'result':'MISSING'}
          ok=all(v.get('result')=='PASS' for v in reports.values()) and reports['requester-identity-report.json'].get('historyCount')==116
          receipt={'sourceCommit':os.environ['PRE_V3_SOURCE_SHA'],'reports':reports,'finalHistoryCount':reports['requester-identity-report.json'].get('historyCount'),
            'PRE_V3_STAGED_SQL_108_116':'PASS' if ok else 'FAIL','liveChanged':False,'providerProven':False,'deviceProven':False}
          (out/'staged-108-116-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps({'PRE_V3_STAGED_SQL_108_116':receipt['PRE_V3_STAGED_SQL_108_116'],'finalHistoryCount':receipt['finalHistoryCount']}))
          if not ok: raise SystemExit(1)
          PY
      - name: Retain exact proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-v3-staged-sql-${{ github.run_id }}
          path: ${{ runner.temp }}/pre-v3-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Stop disposable Supabase
        if: always()
        run: |
          if [[ -n "${RU5_DEVICE_PROOF_DIR:-}" && -d "$RU5_DEVICE_PROOF_DIR" ]]; then cd "$RU5_DEVICE_PROOF_DIR"; supabase stop --no-backup; fi
