name: PRE-V3 exact PR101 baseline
on:
  push:
    branches: [proof/pre-v3-pr101-exact-baseline-20260911]
    paths: [.github/workflows/pre-v3-pr101-exact-baseline.yml]
permissions:
  contents: read
concurrency:
  group: pre-v3-pr101-exact-baseline-20260911
  cancel-in-progress: false
jobs:
  baseline:
    if: github.repository == 'Uskoci1/USKOCI-CLEAN'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      SOURCE_SHA: 1138d4f727735519b15d9b834bf261954e8013fe
      SOURCE_TREE: 2ef75df1fee892311f45fb38364045112b31df2d
      PR100_SHA: df167547c469f5b4cb5679058526b697dae8ba48
      PR99_SHA: 58e842e883db71f9118efc474c5011f3b261824c
      CANONICAL_SHA: 916ffb498ba5ad47a307a3c66477757b6753095a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1138d4f727735519b15d9b834bf261954e8013fe
          fetch-depth: 0
          persist-credentials: false
      - name: Pin identity and verify inherited source lineage
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/pre-v3-evidence"
          mkdir -p "$E"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git merge-base --is-ancestor "$CANONICAL_SHA" "$PR99_SHA"
          git merge-base --is-ancestor "$PR99_SHA" "$PR100_SHA"
          git merge-base --is-ancestor "$PR100_SHA" "$SOURCE_SHA"
          test "$(git hash-object package.json)" = c1687486b2eb48808a4742ac9a2979e7491b67dd
          test "$(git hash-object package-lock.json)" = 204c748dd85340da8f4dca32fb40c79826238af9
          python - <<'PY'
          import json, os, pathlib, subprocess, datetime
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pre-v3-evidence'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          report = {
              'observed_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'source_sha': git('rev-parse', 'HEAD'),
              'source_tree': git('rev-parse', 'HEAD^{tree}'),
              'control_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'package_json_blob': git('hash-object', 'package.json'),
              'package_lock_blob': git('hash-object', 'package-lock.json'),
              'lineage_assertions': 'PASS',
              'scope': 'Exact source regression only. No live DB, migration, provider, native or physical-device execution.'
          }
          (out / 'identity.json').write_text(json.dumps(report, indent=2) + '\n')
          pairs = [('PR99', os.environ['CANONICAL_SHA'], os.environ['PR99_SHA']), ('PR100', os.environ['PR99_SHA'], os.environ['PR100_SHA']), ('PR101', os.environ['PR100_SHA'], os.environ['SOURCE_SHA'])]
          for label, base, head in pairs:
              (out / (label + '-commits.txt')).write_text(git('log', '--format=fuller', '--name-status', base + '..' + head) + '\n')
              (out / (label + '-files.txt')).write_text(git('diff', '--name-status', base, head) + '\n')
              (out / (label + '-diff.patch')).write_text(git('diff', '--no-ext-diff', '--no-renames', '--unified=3', base, head, '--', 'src', 'scripts', 'supabase') + '\n')
          (out / 'tracked-tree.txt').write_text(git('ls-tree', '-r', 'HEAD') + '\n')
          tests = [p for p in git('ls-files').splitlines() if '.test.' in p or '.spec.' in p or '_test.' in p]
          (out / 'test-inventory.json').write_text(json.dumps(tests, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exact locked dependencies
        id: install
        shell: bash
        run: |
          set -euo pipefail
          node --version | tee "$RUNNER_TEMP/pre-v3-evidence/node-version.txt"
          npm --version | tee "$RUNNER_TEMP/pre-v3-evidence/npm-version.txt"
          npm ci 2>&1 | tee "$RUNNER_TEMP/pre-v3-evidence/npm-ci.log"
          git diff --exit-code -- package.json package-lock.json
          test "$(git hash-object package-lock.json)" = 204c748dd85340da8f4dca32fb40c79826238af9
      - name: TypeScript exact source
        id: typescript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/pre-v3-evidence/typescript.log"
      - name: Full Jest without assertion or skip changes
        id: jest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install jest --runInBand --silent --json --outputFile="$RUNNER_TEMP/pre-v3-evidence/jest-results.json" 2>&1 | tee "$RUNNER_TEMP/pre-v3-evidence/jest.log"
          node -e 'const fs=require("node:fs");const p=process.env.RUNNER_TEMP+"/pre-v3-evidence/jest-results.json";const r=JSON.parse(fs.readFileSync(p,"utf8"));if(!r.success||r.numFailedTests||r.numFailedTestSuites||r.numPendingTests||r.numPendingTestSuites||r.numTodoTests)process.exit(1);console.log(JSON.stringify({suites:r.numTotalTestSuites,tests:r.numTotalTests,skipped:r.numPendingTests,todo:r.numTodoTests}));'
      - name: Node and changed Edge handler synthetic regression
        id: node_edge
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/build-identity.test.cjs supabase/proofs/notifications/n09_push_transport_edge.test.mjs 2>&1 | tee "$RUNNER_TEMP/pre-v3-evidence/node-edge.log"
      - name: Literal source inventory
        id: inventory
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pre_html_source_inventory.cjs "$RUNNER_TEMP/pre-v3-evidence/source-inventory.json"
      - name: Whitespace, lock and final working tree checks
        id: integrity
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$PR100_SHA" "$SOURCE_SHA" 2>&1 | tee "$RUNNER_TEMP/pre-v3-evidence/pr101-diff-check.log"
          git diff --check "$CANONICAL_SHA" "$SOURCE_SHA" 2>&1 | tee "$RUNNER_TEMP/pre-v3-evidence/lineage-diff-check.log"
          git status --porcelain=v1 | tee "$RUNNER_TEMP/pre-v3-evidence/working-tree.txt"
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object package-lock.json)" = 204c748dd85340da8f4dca32fb40c79826238af9
      - name: Record exact gate outcomes
        if: always()
        env:
          IDENTITY: ${{ steps.identity.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          TYPESCRIPT: ${{ steps.typescript.outcome }}
          JEST: ${{ steps.jest.outcome }}
          NODE_EDGE: ${{ steps.node_edge.outcome }}
          INVENTORY: ${{ steps.inventory.outcome }}
          INTEGRITY: ${{ steps.integrity.outcome }}
        run: |
          python - <<'PY'
          import os, json, pathlib
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pre-v3-evidence'
          out.mkdir(parents=True, exist_ok=True)
          gates = {k: os.environ.get(k, 'unknown') for k in ['IDENTITY','INSTALL','TYPESCRIPT','JEST','NODE_EDGE','INVENTORY','INTEGRITY']}
          verdict = {'source_sha': os.environ['SOURCE_SHA'], 'source_tree': os.environ['SOURCE_TREE'], 'gates': gates, 'PR101_EXACT_HEAD_BASELINE': 'PASS' if all(v == 'success' for v in gates.values()) else 'FAIL', 'limitations': ['Source regression, not SQL integration.', 'Edge handler uses synthetic Auth/DB/Expo transports.', 'No real provider, native E2E or physical-device proof.', 'Source inventory is literal-callsite evidence, not reachability or live permission proof.']}
          (out / 'baseline-verdict.json').write_text(json.dumps(verdict, indent=2) + '\n')
          print(json.dumps(verdict, indent=2))
          PY
          cd "$RUNNER_TEMP/pre-v3-evidence"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Preserve original evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pre-v3-pr101-exact-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/pre-v3-evidence/
          retention-days: 7
          if-no-files-found: error
