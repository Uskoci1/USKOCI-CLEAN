name: PRE-V3 save exact integration commits
on:
  push:
    branches: [work/pre-v3-exact-verifier-20260911]
    paths: [.pre-v3/integration-save.json]
permissions:
  contents: write
concurrency:
  group: pre-v3-single-integration-writer
  cancel-in-progress: false
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false
      - name: Read bounded source pin
        id: request
        run: |
          python3 - <<'PY'
          import json,os,re
          d=json.load(open('control/.pre-v3/integration-save.json'))
          assert re.fullmatch('[a-f0-9]{40}',d['base'])
          assert d['branch']=='work/pre-v3-engine-integration-20260911'
          assert 0<len(d['commits'])<=16
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('base='+d['base']+'\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          ref: ${{ steps.request.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact Git objects and frozen SQL, then fast-forward fixed integration ref
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,re,subprocess,zlib
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          d=json.load(open('../control/.pre-v3/integration-save.json'))
          assert git('rev-parse','HEAD')==d['base']
          current=d['base']; receipts=[]
          allowed=('src/data/','src/contracts/','src/hooks/','src/store/','supabase/migrations/','supabase/proofs/','supabase/functions/','scripts/','docs/implementation/pre-v3/')
          for c in d['commits']:
            assert all(re.fullmatch('[0-9a-f]{40}',c[k]) for k in ('commit','tree','parent'))
            assert c['parent']==current
            if c.get('generator') is not None:
              assert c['generator']=='c09' and current=='9426e46e40909189bf65ccd18d7d109a78782797'
              assert c['commit']=='7c29abfaf4836157b8c0ebc043aed1f8e4a88e64' and c['tree']=='cf2105694612446ec28f36065b0732f18c97fc40'
              subprocess.run(['python3','../control/.pre-v3/build_c09.py'],check=True)
              subprocess.run(['git','add','docs/implementation/pre-v3/C09_PROVENANCE_LEDGER.json'],check=True)
            else:
              assert len(c['compressedPatch'])<3000000
              stream=zlib.decompressobj();patch=stream.decompress(base64.b64decode(c['compressedPatch'],validate=True),2000001)
              assert len(patch)<=2000000 and stream.eof and not stream.unused_data and not stream.unconsumed_tail
              assert hashlib.sha256(patch).hexdigest()==c['patchSha256']
              p=pathlib.Path(os.environ['RUNNER_TEMP'])/'integration.patch';p.write_bytes(patch)
              subprocess.run(['git','apply','--check','--index',str(p)],check=True)
              subprocess.run(['git','apply','--index',str(p)],check=True)
            paths=git('diff','--cached','--name-only').splitlines()
            assert paths and all(x.startswith(allowed) and '..' not in x.split('/') for x in paths),paths
            subprocess.run(['git','diff','--cached','--check'],check=True)
            assert git('write-tree')==c['tree']
            raw=c['rawCommit'].encode();assert len(raw)<10000
            obj=subprocess.check_output(['git','hash-object','-t','commit','-w','--stdin'],input=raw).decode().strip()
            assert obj==c['commit'] and git('show','-s','--format=%P',obj)==current
            assert git('rev-parse',obj+'^{tree}')==c['tree']
            subprocess.run(['git','reset','--hard',obj],check=True)
            current=obj;receipts.append({'commit':obj,'tree':c['tree'],'changedFiles':paths,'patchSha256':c.get('patchSha256'),'generator':c.get('generator')})
          frozen='1138d4f727735519b15d9b834bf261954e8013fe'
          for p in git('ls-tree','-r','--name-only',frozen,'supabase/migrations').splitlines():
            if p.endswith('.sql'): assert git('rev-parse',frozen+':'+p)==git('rev-parse','HEAD:'+p),p
          subprocess.run(['git','diff','--exit-code',frozen,'HEAD','--','package.json','package-lock.json'],check=True)
          repo='Uskoci1/USKOCI-CLEAN';ref='refs/heads/'+d['branch']
          remote=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/git/ref/heads/'+d['branch']],text=True))['object']['sha']
          assert remote==d['base'],'INTEGRATION_BRANCH_MOVED'
          env=os.environ.copy();env['GIT_CONFIG_COUNT']='1';env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader'
          env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+env['GH_TOKEN']).encode()).decode()
          subprocess.run(['git','push','origin',current+':'+ref],env=env,check=True)
          actual=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/git/ref/heads/'+d['branch']],text=True))['object']['sha']
          assert actual==current
          receipt={'base':d['base'],'commit':current,'tree':git('rev-parse','HEAD^{tree}'),'branch':d['branch'],'saved':True,'runId':os.environ['GITHUB_RUN_ID'],'commits':receipts,'canonicalChanged':False,'liveChanged':False,'testedByThisWorkflow':False}
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'integration-save';out.mkdir(exist_ok=True)
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n');print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pre-v3-integration-save-${{ github.run_id }}
          path: ${{ runner.temp }}/integration-save/
          retention-days: 14
          if-no-files-found: warn
