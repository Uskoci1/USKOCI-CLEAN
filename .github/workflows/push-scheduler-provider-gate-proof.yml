name: Push scheduler provider gate proof
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - 'supabase/candidates/push_scheduler_provider_gate_20261004.sql'
      - 'supabase/proofs/notifications/push_scheduler_provider_gate_20261004.sql'
      - '.github/workflows/push-scheduler-provider-gate-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run disposable SQL proof
        run: psql postgresql://postgres:postgres@127.0.0.1:5432/postgres -X -v ON_ERROR_STOP=1 -f supabase/proofs/notifications/push_scheduler_provider_gate_20261004.sql | tee /tmp/push-gate-proof.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: push-scheduler-provider-gate-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/push-gate-proof.txt
          retention-days: 30
