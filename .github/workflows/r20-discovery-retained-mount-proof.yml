name: R20 Discovery retained-mount proof

on:
  push:
    branches:
      - work/uskoci-ui-unification-20260924
    paths:
      - 'src/ui/v2/DiscoveryPresentation.tsx'
      - 'src/ui/v2/discovery/DiscoveryListSheet.tsx'
      - 'src/data/__tests__/discovery-presentation.test.tsx'
      - '.github/workflows/r20-discovery-retained-mount-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: '1'
  DO_NOT_TRACK: '1'

jobs:
  exact-client-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: TypeScript exact candidate
        run: npx tsc --noEmit
      - name: Focused Discovery lifecycle regressions
        run: npm test -- --runInBand --json --outputFile=/tmp/r20-discovery-focused.json src/data/__tests__/discovery-presentation.test.tsx
      - name: Full regression
        run: npm test -- --runInBand --json --outputFile=/tmp/r20-discovery-full.json
      - name: Write source binding
        if: always()
        run: |
          mkdir -p /tmp/r20-discovery
          printf '%s\n' "$GITHUB_SHA" > /tmp/r20-discovery/source.txt
          git rev-parse 'HEAD^{tree}' > /tmp/r20-discovery/tree.txt
          cp /tmp/r20-discovery-focused.json /tmp/r20-discovery/ 2>/dev/null || true
          cp /tmp/r20-discovery-full.json /tmp/r20-discovery/ 2>/dev/null || true
      - name: Preserve exact proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r20-discovery-retained-mount-${{ github.run_id }}
          if-no-files-found: warn
          path: /tmp/r20-discovery/
