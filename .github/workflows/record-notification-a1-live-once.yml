name: Record Notification A1 live once
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths: ['.github/workflows/record-notification-a1-live-once.yml']
permissions:
  contents: write
concurrency:
  group: record-notification-a1-live-once
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Regenerate single control table and retire recorder
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/control/osvezi.mjs
          git rm .github/workflows/record-notification-a1-live-once.yml
          git add docs/control/stanje.json
          git add -f docs/control/out/tabla.html
          git diff --cached --check
          remote=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote" = "$GITHUB_SHA" || { echo 'Branch moved; refusing overwrite.'; exit 1; }
          git config user.name 'USKOCI evidence bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate control table after Notification A1 live apply'
          git push origin "HEAD:$GITHUB_REF"
