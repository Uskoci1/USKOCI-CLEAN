name: Repair V5 identity145 prompt-context proof
on:
  push:
    branches: [work/pre-v3-proof-runner-20260911]
    paths: ['.github/workflows/repair-v5-145-stream-fixture.yml']
permissions:
  contents: write
concurrency:
  group: repair-v5-identity145-prompt-context
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/pre-v3-engine-integration-20260911
          fetch-depth: 0
          persist-credentials: true
      - name: Guard exact head and repair only stale prompt parsing in 145 proof
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4939521e7e50f677278aafaae19ad6b3312b06ab"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/proofs/pre_v3/v5_self_reported_identity_proof.mjs')
          s=p.read_text(encoding='utf-8')
          old="const factPrefix='Aktuelne server-side činjenice: ',factLine=prompt.split('\\n').find(line=>line.startsWith(factPrefix));\n assert.ok(factLine);const facts=JSON.parse(factLine.slice(factPrefix.length));"
          new="const factPrefix='Aktuelne server-side činjenice: ',factStart=prompt.indexOf(factPrefix),factEnd=prompt.indexOf(' Sastavite lep, kratak',factStart);\n assert.ok(factStart>=0&&factEnd>factStart);const facts=JSON.parse(prompt.slice(factStart+factPrefix.length,factEnd));"
          if s.count(old)!=1: raise SystemExit(f'prompt-context guard={s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')
          PY
          node --check supabase/proofs/pre_v3/v5_self_reported_identity_proof.mjs
          git diff --check
          git diff -- supabase/proofs/pre_v3/v5_self_reported_identity_proof.mjs
      - name: Commit exact proof repair to integration branch
        run: |
          set -euo pipefail
          git config user.name 'USKOCI integration bot'
          git config user.email 'integration-bot@users.noreply.github.com'
          git add -- supabase/proofs/pre_v3/v5_self_reported_identity_proof.mjs
          git commit -m 'test(v5): parse identity145 AI context from joined prompt'
          git push origin HEAD:work/pre-v3-engine-integration-20260911
