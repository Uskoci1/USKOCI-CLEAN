name: Repair V5 145 stream fixture
on:
  push:
    branches: [work/pre-v3-proof-runner-20260911]
    paths: ['.github/workflows/repair-v5-145-stream-fixture.yml']
permissions:
  contents: write
concurrency:
  group: repair-v5-145-stream-fixture
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/pre-v3-engine-integration-20260911
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Guard exact integration head and repair stale synthetic provider fixture
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8d6039c4c3b5f0222842cf3f88b79b1671c79f7c"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/proofs/pre_v3/v5_self_reported_identity_proof.mjs')
          s=p.read_text(encoding='utf-8')
          start_marker="  if(url.href==='https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent'){"
          end_marker="  assert.equal(url.origin,origin)"
          if s.count(start_marker)!=1 or s.count(end_marker)<1:
              raise SystemExit('guarded fixture markers changed')
          start=s.index(start_marker); end=s.index(end_marker,start)
          new="""  if(url.href==='https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:streamGenerateContent?alt=sse'){
           providerCalls++;assert.equal(budgetCalls,1);assert.equal(init.headers?.Accept,'text/event-stream');
           const request=JSON.parse(init.body),prompt=request.systemInstruction.parts[0].text;
           const factPrefix='Aktuelne server-side činjenice: ',factLine=prompt.split('\\n').find(line=>line.startsWith(factPrefix));
           assert.ok(factLine);const facts=JSON.parse(factLine.slice(factPrefix.length));
           assert.ok(Array.isArray(facts));assert.ok(facts.every(f=>f.key!=='need.verified_identity_required'));
           assert.equal(request.generationConfig.responseFormat.text.mimeType,'application/json');
           assert.ok(!request.generationConfig.responseFormat.text.schema.properties.facts.items.properties.key.enum.includes('need.verified_identity_required'));
           for(const legacy of ['temperature','topP','topK','responseMimeType','responseSchema'])assert.equal(Object.hasOwn(request.generationConfig,legacy),false);
           assert.deepEqual(request.generationConfig.thinkingConfig,{thinkingLevel:'low'});
           assert.equal(sql(`select count(*) from private.ai_test_reservations_v5 where account_id=${q(a.id)}::uuid and operation_id=${q(key)}::uuid and kind='LLM' and max_cost_microusd=250000`),'1');
           assert.equal((await ok(a.client.rpc('rpc_ai_recover_need_turn_v2',{p_conversation_id:cid,p_client_request_id:key}))).providerDispatched,true);
           const event={candidates:[{content:{parts:[{text:JSON.stringify({safety:'ALLOW',assistantMessage:'Synthetic145 ordinary edit remains available',facts:[]})}]},finishReason:'STOP'}]};
           return new Response(`data: ${JSON.stringify(event)}\\n\\n`,{headers:{'Content-Type':'text/event-stream'}});
          }
          """
          p.write_text(s[:start]+new+s[end:],encoding='utf-8',newline='\n')
          PY
          node --check supabase/proofs/pre_v3/v5_self_reported_identity_proof.mjs
          npm ci >/dev/null
          node --test supabase/proofs/ai/gemini_wire_diagnostics.test.mjs
          git diff --check
          test "$(git status --porcelain | wc -l)" -eq 1
          git diff -- supabase/proofs/pre_v3/v5_self_reported_identity_proof.mjs
      - name: Commit exact proof repair to integration branch
        run: |
          set -euo pipefail
          git config user.name 'USKOCI integration bot'
          git config user.email 'integration-bot@users.noreply.github.com'
          git add -- supabase/proofs/pre_v3/v5_self_reported_identity_proof.mjs
          git commit -m 'test(v5): align self-reported identity fixture with streamed Gemini wire'
          git push origin HEAD:work/pre-v3-engine-integration-20260911
