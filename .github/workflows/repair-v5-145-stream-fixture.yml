name: Repair V5 account-erasure trigger-state binding
on:
  push:
    branches: [work/pre-v3-proof-runner-20260911]
    paths: ['.github/workflows/repair-v5-145-stream-fixture.yml']
permissions:
  contents: write
concurrency:
  group: repair-v5-account-erasure-trigger-state
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/pre-v3-engine-integration-20260911
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Guard exact head and bind noninternal trigger enabled state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a9ceed1b869a47950c220b2e636743c51bf5f11e"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('supabase/migrations/20260913081147_clean_v5_event_bound_account_erasure.sql')
          s=p.read_text(encoding='utf-8')
          old=""" 'tables',(select jsonb_agg(jsonb_build_array(c.oid::regclass::text,c.relowner,c.relacl::text,c.relrowsecurity,c.relforcerowsecurity) order by c.oid::regclass::text)\n from pg_class c where c.relnamespace in('private'::regnamespace,'public'::regnamespace) and c.relkind in('r','p'))\n )::text,'UTF8'),'sha256'),'hex')"""
          new=""" 'tables',(select jsonb_agg(jsonb_build_array(c.oid::regclass::text,c.relowner,c.relacl::text,c.relrowsecurity,c.relforcerowsecurity) order by c.oid::regclass::text)\n from pg_class c where c.relnamespace in('private'::regnamespace,'public'::regnamespace) and c.relkind in('r','p')),\n 'triggerState',(select jsonb_agg(jsonb_build_array(t.tgrelid::regclass::text,t.tgname,t.tgenabled) order by t.tgrelid::regclass::text,t.tgname)\n from pg_trigger t join pg_class c on c.oid=t.tgrelid where not t.tgisinternal\n and (c.relnamespace in('private'::regnamespace,'public'::regnamespace) or t.tgrelid='storage.objects'::regclass))\n )::text,'UTF8'),'sha256'),'hex')"""
          if s.count(old)!=1: raise SystemExit(f'trigger-state digest guard={s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')
          test=Path('supabase/proofs/pre_v3/v5_account_erasure.test.mjs')
          t=test.read_text(encoding='utf-8')
          old_assert=" assert.ok(sql.includes('closure_erasure_program_digest_v5'));"
          new_assert=" assert.ok(sql.includes('closure_erasure_program_digest_v5'));\n assert.ok(sql.includes('t.tgenabled'));"
          if t.count(old_assert)!=1: raise SystemExit(f'trigger-state assertion guard={t.count(old_assert)}')
          test.write_text(t.replace(old_assert,new_assert),encoding='utf-8',newline='\n')
          b=p.read_bytes()
          prov=Path('supabase/migrations/MIGRATION_PROVENANCE.json')
          data=json.loads(prov.read_text(encoding='utf-8'))
          item=next(x for x in data['pending_forward_migrations'] if x['file']==p.name)
          item['raw_md5']=hashlib.md5(b).hexdigest();item['raw_sha256']=hashlib.sha256(b).hexdigest();item['raw_bytes']=len(b)
          prov.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8',newline='\n')
          manifest=Path('supabase/migrations/MD5_MANIFEST.txt')
          manifest.write_text(''.join(hashlib.md5(x.read_bytes()).hexdigest()+'  '+x.name+'\n' for x in sorted(Path('supabase/migrations').glob('*.sql'))),encoding='utf-8',newline='\n')
          PY
          npm ci >/dev/null
          npx --no-install tsc --noEmit
          node --check supabase/proofs/pre_v3/v5_account_erasure_proof.mjs
          node --test supabase/proofs/pre_v3/v5_account_erasure.test.mjs
          sh supabase/migrations/check_md5.sh
          python3 -m json.tool supabase/migrations/MIGRATION_PROVENANCE.json >/dev/null
          git diff --check
          git diff -- supabase/migrations/20260913081147_clean_v5_event_bound_account_erasure.sql supabase/proofs/pre_v3/v5_account_erasure.test.mjs supabase/migrations/MIGRATION_PROVENANCE.json supabase/migrations/MD5_MANIFEST.txt
      - name: Commit verified 146 trigger-state repair to integration branch
        run: |
          set -euo pipefail
          git config user.name 'USKOCI integration bot'
          git config user.email 'integration-bot@users.noreply.github.com'
          git add -- supabase/migrations/20260913081147_clean_v5_event_bound_account_erasure.sql supabase/proofs/pre_v3/v5_account_erasure.test.mjs supabase/migrations/MIGRATION_PROVENANCE.json supabase/migrations/MD5_MANIFEST.txt
          git commit -m 'fix(v5): bind closure erasure trigger enabled state'
          git push origin HEAD:work/pre-v3-engine-integration-20260911
