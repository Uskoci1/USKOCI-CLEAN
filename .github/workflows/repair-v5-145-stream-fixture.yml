name: Diagnose V5 identity145 edge response
on:
  push:
    branches: [work/pre-v3-proof-runner-20260911]
    paths: ['.github/workflows/repair-v5-145-stream-fixture.yml']
permissions:
  contents: write
concurrency:
  group: diagnose-v5-identity145-edge
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/pre-v3-engine-integration-20260911
          fetch-depth: 0
          persist-credentials: true
      - name: Guard exact head and add synthetic-only response diagnosis
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a97af75877ea08dce14afa7ac041f23318a9971b"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/proofs/pre_v3/v5_self_reported_identity_proof.mjs')
          s=p.read_text(encoding='utf-8')
          old="const response=await invoke();assert.equal(response.status,200);const receipt=await response.json();assert.equal(receipt.state,'SUCCEEDED');"
          new="const response=await invoke();const receipt=await response.json();if(response.status!==200)throw new Error(`ACTUAL_EDIT_EDGE_${response.status}_${String(receipt?.code??'NO_CODE')}`);assert.equal(receipt.state,'SUCCEEDED');"
          if s.count(old)!=1: raise SystemExit(f'diagnostic guard={s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')
          PY
          node --check supabase/proofs/pre_v3/v5_self_reported_identity_proof.mjs
          git diff --check
      - name: Commit diagnostic proof only
        run: |
          set -euo pipefail
          git config user.name 'USKOCI integration bot'
          git config user.email 'integration-bot@users.noreply.github.com'
          git add -- supabase/proofs/pre_v3/v5_self_reported_identity_proof.mjs
          git commit -m 'test(v5): surface safe identity145 edge failure code'
          git push origin HEAD:work/pre-v3-engine-integration-20260911
