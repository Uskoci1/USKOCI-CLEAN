name: Repair V5 account-erasure V2 fact fixture
on:
  push:
    branches: [work/pre-v3-proof-runner-20260911]
    paths: ['.github/workflows/repair-v5-145-stream-fixture.yml']
permissions:
  contents: write
concurrency:
  group: repair-v5-account-erasure-v2-fact-fixture
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/pre-v3-engine-integration-20260911
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Guard exact head and supply required V2 display value in disposable fixture
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f24f1baa77f70a8a50cbca11523060556db405fe"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/proofs/pre_v3/v5_erasure_content_fixtures.mjs')
          s=p.read_text(encoding='utf-8')
          old="""sql(`insert into public.ai_structured_facts(id,account_id,conversation_id,fact_key,fact_value,status,source,scope,evidence_excerpt,superseded_at,fact_schema_version)\n  values ${factIds.map(id=>`(${q(id)},${q(a.id)},${q(cid)},'need.title',to_jsonb(${q(canary)}::text),'INFERRED','AI_INFERENCE','NEED_DRAFT',${q(canary)},clock_timestamp(),'NEED_FACT_V2')`).join(',')};"""
          new="""sql(`insert into public.ai_structured_facts(id,account_id,conversation_id,fact_key,fact_value,status,source,scope,display_value,evidence_excerpt,superseded_at,fact_schema_version)\n  values ${factIds.map(id=>`(${q(id)},${q(a.id)},${q(cid)},'need.title',to_jsonb(${q(canary)}::text),'INFERRED','AI_INFERENCE','NEED_DRAFT',${q(canary)},${q(canary)},clock_timestamp(),'NEED_FACT_V2')`).join(',')};"""
          if s.count(old)!=1: raise SystemExit(f'v2-fact-fixture guard={s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')
          t=Path('supabase/proofs/pre_v3/v5_account_erasure.test.mjs')
          ts=t.read_text(encoding='utf-8')
          old_assert=" const proof=read('./v5_account_erasure_proof.mjs'),fixtures=read('./v5_erasure_content_fixtures.mjs');"
          new_assert=old_assert+"\n assert.ok(fixtures.includes('scope,display_value,evidence_excerpt')));"
          if ts.count(old_assert)!=1: raise SystemExit(f'fixture-assert guard={ts.count(old_assert)}')
          t.write_text(ts.replace(old_assert,new_assert),encoding='utf-8',newline='\n')
          PY
          npm ci >/dev/null
          node --check supabase/proofs/pre_v3/v5_erasure_content_fixtures.mjs
          node --test supabase/proofs/pre_v3/v5_account_erasure.test.mjs
          git diff --check
          git diff -- supabase/proofs/pre_v3/v5_erasure_content_fixtures.mjs supabase/proofs/pre_v3/v5_account_erasure.test.mjs
      - name: Commit verified disposable fixture repair to integration branch
        run: |
          set -euo pipefail
          git config user.name 'USKOCI integration bot'
          git config user.email 'integration-bot@users.noreply.github.com'
          git add -- supabase/proofs/pre_v3/v5_erasure_content_fixtures.mjs supabase/proofs/pre_v3/v5_account_erasure.test.mjs
          git commit -m 'test(v5): supply V2 display value in erasure fixture'
          git push origin HEAD:work/pre-v3-engine-integration-20260911
