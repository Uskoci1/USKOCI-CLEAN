name: Repair V5 provider-wire assertions
on:
  push:
    branches: [work/pre-v3-proof-runner-20260911]
    paths: ['.github/workflows/repair-v5-145-stream-fixture.yml']
permissions:
  contents: write
concurrency:
  group: repair-v5-provider-wire-assertions
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/pre-v3-engine-integration-20260911
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Guard exact head and update only stale Gemini schema assertions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "37fcf56eceabf64fbe05699e498aada103757c4c"
          python3 - <<'PY'
          from pathlib import Path
          replacements={
            'supabase/proofs/ai/ai_edge_context.test.mjs':(
              "const call=providerCall(f),schema=call.body.generationConfig?.responseSchema??call.body.text.format.schema;",
              "const call=providerCall(f),schema=call.body.generationConfig?.responseFormat?.text?.schema??call.body.generationConfig?.responseSchema??call.body.text?.format?.schema;"),
            'supabase/proofs/ai/owned_intake_edge.test.mjs':(
              "assert.ok(!body.generationConfig.responseSchema.properties.facts.items.properties.key.enum.includes('need.verified_identity_required'));",
              "assert.ok(!body.generationConfig.responseFormat.text.schema.properties.facts.items.properties.key.enum.includes('need.verified_identity_required'));"),
          }
          for name,(old,new) in replacements.items():
              p=Path(name);s=p.read_text(encoding='utf-8')
              if s.count(old)!=1: raise SystemExit(f'{name} guard={s.count(old)}')
              p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')
          PY
          npm ci >/dev/null
          node --test supabase/proofs/ai/ai_edge_context.test.mjs supabase/proofs/ai/owned_intake_edge.test.mjs
          npx --no-install tsc --noEmit
          git diff --check
          git diff -- supabase/proofs/ai/ai_edge_context.test.mjs supabase/proofs/ai/owned_intake_edge.test.mjs
      - name: Commit verified assertion repair to integration branch
        run: |
          set -euo pipefail
          git config user.name 'USKOCI integration bot'
          git config user.email 'integration-bot@users.noreply.github.com'
          git add -- supabase/proofs/ai/ai_edge_context.test.mjs supabase/proofs/ai/owned_intake_edge.test.mjs
          git commit -m 'test(ai): assert Gemini 3.8 responseFormat wire schema'
          git push origin HEAD:work/pre-v3-engine-integration-20260911
