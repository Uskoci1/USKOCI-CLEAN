name: Round40 control refresh
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/round40-control-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'Uskoci1/USKOCI-CLEAN' && github.ref == 'refs/heads/work/uskoci-ui-unification-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Regenerate current tracker views
        run: |
          node scripts/control/osvezi.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/control/stanje.json docs/control/FINALIZATION_MATRIX.md
          git add -f docs/control/out/tabla.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(control): regenerate Round40 views'
          branch='work/uskoci-ui-unification-20260924'
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$branch"
