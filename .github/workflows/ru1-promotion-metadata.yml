name: RU-1 promotion metadata

on:
  push:
    branches:
      - promotion/ru1-worker-readiness-20260903
    paths:
      - '.github/workflows/ru1-promotion-metadata.yml'

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: promotion/ru1-worker-readiness-20260903
      - name: Normalize pending migration metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path

          migration = Path('supabase/migrations/20260903165700_clean_ru1_worker_readiness.sql')
          manifest = Path('supabase/migrations/MD5_MANIFEST.txt')
          provenance = Path('supabase/migrations/MIGRATION_PROVENANCE.json')

          raw = migration.read_bytes()
          if b'\r' in raw:
              raise SystemExit('RU1 migration contains CR bytes')
          md5 = hashlib.md5(raw).hexdigest()
          sha256 = hashlib.sha256(raw).hexdigest()
          if len(raw) != 13591:
              raise SystemExit(f'RU1 byte mismatch: {len(raw)}')
          if md5 != 'f80e2e721365ee07316a9c0e84ab593f':
              raise SystemExit(f'RU1 MD5 mismatch: {md5}')
          if sha256 != '71c2ec459e4cb986698856194017c71661769c236434fbbc2505ae5aed3190a0':
              raise SystemExit(f'RU1 SHA256 mismatch: {sha256}')

          filename = migration.name
          line = f'{md5}  {filename}'
          lines = manifest.read_text(encoding='utf-8').splitlines()
          if line not in lines:
              lines.append(line)
          lines = sorted(lines, key=lambda x: x.split('  ', 1)[1])
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

          data = json.loads(provenance.read_text(encoding='utf-8'))
          history = data['live_history_snapshot']
          if history['migration_count'] != 57:
              raise SystemExit(f"expected live count 57, got {history['migration_count']}")
          if history['last']['version'] != '20260903160812':
              raise SystemExit(f"expected live head 20260903160812, got {history['last']['version']}")

          pending = data.setdefault('pending_forward_migrations', [])
          existing = [p for p in pending if p.get('version') == '20260903165700']
          if existing:
              if len(existing) != 1 or existing[0].get('raw_md5') != md5:
                  raise SystemExit('conflicting RU1 pending provenance entry')
          else:
              if pending:
                  raise SystemExit(f'unexpected pre-existing pending migrations: {pending}')
              pending.append({
                  'version': '20260903165700',
                  'name': 'clean_ru1_worker_readiness',
                  'file': filename,
                  'classification': 'PENDING_FORWARD_MIGRATION',
                  'raw_md5': md5,
                  'live_applied': False,
                  'predecessor_live_migration_count': 57,
                  'predecessor_live_head': '20260903160812',
                  'disposable_runtime_proof': 'PASS: GitHub Actions run 33790306570; DB apply, owner/attacker/replay, forced-insert DRAFT, missing-skill denial, zero residue, and source checks all passed.',
                  'source_sha256': sha256,
                  'source_bytes': len(raw)
              })
          data['generated_at_utc'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          provenance.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')
          print(f'RU1_PENDING_METADATA_OK bytes={len(raw)} md5={md5} sha256={sha256}')
          PY
      - name: Verify migration integrity
        run: sh supabase/migrations/check_md5.sh
      - name: Commit normalized metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'uskoci-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/migrations/MD5_MANIFEST.txt supabase/migrations/MIGRATION_PROVENANCE.json
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit.'
            exit 0
          fi
          git commit -m 'docs(db): register proven RU-1 as pending migration'
          git push origin HEAD:promotion/ru1-worker-readiness-20260903
