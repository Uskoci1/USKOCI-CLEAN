name: RU-1 provenance minimal diff

on:
  push:
    branches:
      - promotion/ru1-worker-readiness-20260903
    paths:
      - '.github/workflows/ru1-provenance-minimize.yml'

permissions:
  contents: write

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: promotion/ru1-worker-readiness-20260903
      - name: Restore canonical formatting and add only RU-1 pending record
        shell: bash
        run: |
          set -euo pipefail
          git show 1846fcbaaf50ef76b7e9686ff1f5d6cbd222ee83:supabase/migrations/MIGRATION_PROVENANCE.json > /tmp/provenance.base.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path('/tmp/provenance.base.json').read_text(encoding='utf-8')
          needle = '  "pending_forward_migrations": [],\n'
          if base.count(needle) != 1:
              raise SystemExit('canonical pending marker mismatch')
          block = '''  "pending_forward_migrations": [\n    {\n      "version": "20260903165700",\n      "name": "clean_ru1_worker_readiness",\n      "file": "20260903165700_clean_ru1_worker_readiness.sql",\n      "classification": "PENDING_FORWARD_MIGRATION",\n      "raw_md5": "f80e2e721365ee07316a9c0e84ab593f",\n      "live_applied": false,\n      "predecessor_live_migration_count": 57,\n      "predecessor_live_head": "20260903160812",\n      "disposable_runtime_proof": "PASS: GitHub Actions run 33790306570; DB apply, owner/attacker/replay, forced-insert DRAFT, missing-skill denial, zero residue, and source checks all passed.",\n      "source_sha256": "71c2ec459e4cb986698856194017c71661769c236434fbbc2505ae5aed3190a0",\n      "source_bytes": 13591\n    }\n  ],\n'''
          out = base.replace(needle, block)
          json.loads(out)
          Path('supabase/migrations/MIGRATION_PROVENANCE.json').write_text(out, encoding='utf-8', newline='\n')
          PY
      - name: Verify exact migration integrity
        run: sh supabase/migrations/check_md5.sh
      - name: Commit minimal provenance diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'uskoci-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/migrations/MIGRATION_PROVENANCE.json
          git commit -m 'docs(db): minimize RU-1 pending provenance diff'
          git push origin HEAD:promotion/ru1-worker-readiness-20260903
