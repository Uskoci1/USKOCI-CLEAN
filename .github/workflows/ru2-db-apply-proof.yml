name: RU-2 DB apply proof

on:
  push:
    branches:
      - proof/ru2-need-v2-r07-20260903
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ru2-db-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ru2-db-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Replay canonical predecessor through pre-RU0 head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/uskoci-ru2-proof
          mkdir -p /tmp/uskoci-ru2-proof
          cd /tmp/uskoci-ru2-proof
          supabase init
          rm -rf supabase/migrations
          mkdir -p supabase/migrations

          # Proof-only bootstrap reconstructs the pre-existing DDL event-trigger
          # object that predates the physical CLEAN migration directory.
          cp "$GITHUB_WORKSPACE/supabase/proofs/ru2_predecessor_bootstrap.sql" \
             supabase/migrations/20260825000000_ru2_proof_live_bootstrap.sql

          # Reset must stop at the real 56-migration predecessor. RU0/RU1 are
          # intentionally excluded here and applied manually after the synthetic
          # bootstrap ledger row is removed.
          for f in "$GITHUB_WORKSPACE"/supabase/migrations/*.sql; do
            b="$(basename "$f")"
            case "$b" in
              20260903130355_clean_ru0_authority_closure.sql|20260903165700_clean_ru1_worker_readiness.sql|20260903190000_clean_ru2_need_v2_draft.sql|20260901105922_clean_completion_and_writer_authenticated_proof.sql|20260901113333_clean_ai_interview_turn_authenticated_proof.sql|20260901114029_clean_ai_fact_supersession_and_human_correction.sql)
                ;;
              *) cp "$f" "supabase/migrations/$b" ;;
            esac
          done

          cp "$GITHUB_WORKSPACE/supabase/proofs/ru2_replay_20260901105922_durable_effects.sql" \
             supabase/migrations/20260901105922_clean_completion_and_writer_authenticated_proof.sql
          cp "$GITHUB_WORKSPACE/supabase/proofs/ru2_replay_20260901113333_durable_effects.sql" \
             supabase/migrations/20260901113333_clean_ai_interview_turn_authenticated_proof.sql

          # Keep the exact durable function/grant changes from 20260901114029,
          # omit only its fixture-dependent rollback proof, and preserve its
          # durable comments.
          awk '/^-- Runtime proofs: no retained rows\.$/{exit} {print}' \
            "$GITHUB_WORKSPACE/supabase/migrations/20260901114029_clean_ai_fact_supersession_and_human_correction.sql" \
            > supabase/migrations/20260901114029_clean_ai_fact_supersession_and_human_correction.sql
          cat >> supabase/migrations/20260901114029_clean_ai_fact_supersession_and_human_correction.sql <<'SQL'
          comment on function public.rpc_ai_confirm_fact(uuid) is 'AUTHENTICATED_RUNTIME_PROVEN: human confirmation stamps confirmed_at and confirmed_by_user_id.';
          comment on function public.rpc_ai_correct_fact(uuid,text) is 'AUTHENTICATED_RUNTIME_PROVEN: explicit correction atomically supersedes prior live fact and creates CONFIRMED EXPLICIT_USER_ANSWER provenance.';
          comment on function public.rpc_ai_apply_interview_turn_service(uuid,uuid,text,text,text,jsonb) is 'SERVICE_RUNTIME_PROVEN: repeated canonical keys preserve one-live-fact invariant by superseding before insert; replacement proof rolled back with zero residue.';
          SQL

          supabase db start
          supabase db reset --local

          # Remove only the synthetic bootstrap ledger marker. The bootstrap
          # object itself stays in the DB, matching production predecessor state.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "delete from supabase_migrations.schema_migrations where version='20260825000000';"

          actual="$(psql "$DB_URL" -Atc "select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations;")"
          echo "pre_ru0=$actual"
          test "$actual" = "56/20260901114029"

      - name: Apply exact RU-0 source at live version identity
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20260903130355_clean_ru0_authority_closure.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name) values ('20260903160812','clean_ru0_authority_closure');"
          actual="$(psql "$DB_URL" -Atc "select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations;")"
          echo "post_ru0=$actual"
          test "$actual" = "57/20260903160812"

      - name: Apply exact RU-1 source at live version identity
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20260903165700_clean_ru1_worker_readiness.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name) values ('20260903184545','clean_ru1_worker_readiness');"
          actual="$(psql "$DB_URL" -Atc "select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations;")"
          echo "post_ru1=$actual"
          test "$actual" = "58/20260903184545"

      - name: Verify exact stable RU-2 predecessor
        shell: bash
        run: |
          set -euo pipefail
          actual="$(psql "$DB_URL" -Atc "select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations;")"
          echo "product_predecessor=$actual"
          test "$actual" = "58/20260903184545"
          test "$(psql "$DB_URL" -Atc \"select to_regclass('public.ai_structured_facts') is not null;\")" = "t"
          test "$(psql "$DB_URL" -Atc \"select to_regclass('public.ai_conversations') is not null;\")" = "t"
          test "$(psql "$DB_URL" -Atc \"select to_regclass('public.needs') is not null;\")" = "t"
          test "$(psql "$DB_URL" -Atc \"select to_regprocedure('public.rpc_ai_apply_interview_turn_service(uuid,uuid,text,text,text,jsonb)') is not null;\")" = "t"

      - name: Apply RU-2 candidate
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20260903190000_clean_ru2_need_v2_draft.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name) values ('20260903190000','clean_ru2_need_v2_draft');"
          actual="$(psql "$DB_URL" -Atc "select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations;")"
          echo "post_ru2=$actual"
          test "$actual" = "59/20260903190000"

      - name: Verify static RU-2 invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "$DB_URL" -Atc "select count(*) from public.ai_structured_facts where fact_schema_version<>'LEGACY_TEXT_V1';")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from public.ai_conversations where fact_schema_version<>'LEGACY_TEXT_V1';")" = "0"
          test "$(psql "$DB_URL" -Atc 'select count(*) from private.need_fact_registry;')" = "20"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('authenticated','public.rpc_ai_apply_interview_turn_v2_service(uuid,uuid,text,text,text,jsonb)','EXECUTE');")" = "f"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('service_role','public.rpc_ai_apply_interview_turn_v2_service(uuid,uuid,text,text,text,jsonb)','EXECUTE');")" = "t"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('anon','public.rpc_ai_open_need_conversation_v2()','EXECUTE');")" = "f"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('authenticated','public.rpc_ai_open_need_conversation_v2()','EXECUTE');")" = "t"
          test "$(psql "$DB_URL" -Atc "select position('fact_schema_version' in pg_get_functiondef('public.rpc_ai_open_conversation(text)'::regprocedure));")" = "0"
          test "$(psql "$DB_URL" -Atc "select has_table_privilege('authenticated','public.need_sensitive','UPDATE');")" = "f"

      - name: Stop disposable stack
        if: always()
        shell: bash
        working-directory: /tmp/uskoci-ru2-proof
        run: |
          supabase stop --no-backup || true
