name: RU-2 DB apply proof

on:
  push:
    branches:
      - proof/ru2-need-v2-r07-20260903
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ru2-db-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ru2-db-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Replay canonical predecessor through pre-RU0 head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/uskoci-ru2-proof
          mkdir -p /tmp/uskoci-ru2-proof
          cd /tmp/uskoci-ru2-proof
          supabase init
          rm -rf supabase/migrations
          mkdir -p supabase/migrations

          cp "$GITHUB_WORKSPACE/supabase/proofs/ru2_predecessor_bootstrap.sql" \
             supabase/migrations/20260825000000_ru2_proof_live_bootstrap.sql

          for f in "$GITHUB_WORKSPACE"/supabase/migrations/*.sql; do
            b="$(basename "$f")"
            case "$b" in
              20260903130355_clean_ru0_authority_closure.sql|20260903165700_clean_ru1_worker_readiness.sql|20260903190000_clean_ru2_need_v2_draft.sql|20260903190100_clean_ru2_ai_fact_transition_guard.sql|20260901105922_clean_completion_and_writer_authenticated_proof.sql|20260901113333_clean_ai_interview_turn_authenticated_proof.sql|20260901114029_clean_ai_fact_supersession_and_human_correction.sql)
                ;;
              *) cp "$f" "supabase/migrations/$b" ;;
            esac
          done

          cp "$GITHUB_WORKSPACE/supabase/proofs/ru2_replay_20260901105922_durable_effects.sql" \
             supabase/migrations/20260901105922_clean_completion_and_writer_authenticated_proof.sql
          cp "$GITHUB_WORKSPACE/supabase/proofs/ru2_replay_20260901113333_durable_effects.sql" \
             supabase/migrations/20260901113333_clean_ai_interview_turn_authenticated_proof.sql

          awk '/^-- Runtime proofs: no retained rows\.$/{exit} {print}' \
            "$GITHUB_WORKSPACE/supabase/migrations/20260901114029_clean_ai_fact_supersession_and_human_correction.sql" \
            > supabase/migrations/20260901114029_clean_ai_fact_supersession_and_human_correction.sql
          cat >> supabase/migrations/20260901114029_clean_ai_fact_supersession_and_human_correction.sql <<'SQL'
          comment on function public.rpc_ai_confirm_fact(uuid) is 'AUTHENTICATED_RUNTIME_PROVEN: human confirmation stamps confirmed_at and confirmed_by_user_id.';
          comment on function public.rpc_ai_correct_fact(uuid,text) is 'AUTHENTICATED_RUNTIME_PROVEN: explicit correction atomically supersedes prior live fact and creates CONFIRMED EXPLICIT_USER_ANSWER provenance.';
          comment on function public.rpc_ai_apply_interview_turn_service(uuid,uuid,text,text,text,jsonb) is 'SERVICE_RUNTIME_PROVEN: repeated canonical keys preserve one-live-fact invariant by superseding before insert; replacement proof rolled back with zero residue.';
          SQL

          supabase db start
          supabase db reset --local
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "delete from supabase_migrations.schema_migrations where version='20260825000000';"

          actual="$(psql "$DB_URL" -Atc "select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations;")"
          echo "pre_ru0=$actual"
          test "$actual" = "56/20260901114029"

      - name: Apply exact RU-0 source at live version identity
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20260903130355_clean_ru0_authority_closure.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name) values ('20260903160812','clean_ru0_authority_closure');"
          actual="$(psql "$DB_URL" -Atc "select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations;")"
          echo "post_ru0=$actual"
          test "$actual" = "57/20260903160812"

      - name: Apply exact RU-1 source at live version identity
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20260903165700_clean_ru1_worker_readiness.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name) values ('20260903184545','clean_ru1_worker_readiness');"
          actual="$(psql "$DB_URL" -Atc "select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations;")"
          echo "post_ru1=$actual"
          test "$actual" = "58/20260903184545"

      - name: Verify exact stable RU-2 predecessor
        shell: bash
        run: |
          set -euo pipefail
          actual="$(psql "$DB_URL" -Atc "select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations;")"
          echo "product_predecessor=$actual"
          test "$actual" = "58/20260903184545"
          test "$(psql "$DB_URL" -Atc "select to_regclass('public.ai_structured_facts') is not null;")" = "t"
          test "$(psql "$DB_URL" -Atc "select to_regclass('public.ai_conversations') is not null;")" = "t"
          test "$(psql "$DB_URL" -Atc "select to_regclass('public.needs') is not null;")" = "t"
          test "$(psql "$DB_URL" -Atc "select to_regprocedure('public.rpc_ai_apply_interview_turn_service(uuid,uuid,text,text,text,jsonb)') is not null;")" = "t"

      - name: Apply RU-2 typed Need candidate
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20260903190000_clean_ru2_need_v2_draft.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name) values ('20260903190000','clean_ru2_need_v2_draft');"
          actual="$(psql "$DB_URL" -Atc "select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations;")"
          echo "post_ru2_core=$actual"
          test "$actual" = "59/20260903190000"

      - name: Apply RU-2 explicit AI fact transition guard
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20260903190100_clean_ru2_ai_fact_transition_guard.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name) values ('20260903190100','clean_ru2_ai_fact_transition_guard');"
          actual="$(psql "$DB_URL" -Atc "select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations;")"
          echo "post_ru2_guard=$actual"
          test "$actual" = "60/20260903190100"

      - name: Verify static RU-2 invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "$DB_URL" -Atc "select count(*) from public.ai_structured_facts where fact_schema_version<>'LEGACY_TEXT_V1';")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from public.ai_conversations where fact_schema_version<>'LEGACY_TEXT_V1';")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from private.need_fact_registry;")" = "20"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('authenticated','public.rpc_ai_apply_interview_turn_v2_service(uuid,uuid,text,text,text,jsonb)','EXECUTE');")" = "f"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('service_role','public.rpc_ai_apply_interview_turn_v2_service(uuid,uuid,text,text,text,jsonb)','EXECUTE');")" = "t"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('anon','public.rpc_ai_open_need_conversation_v2()','EXECUTE');")" = "f"
          test "$(psql "$DB_URL" -Atc "select has_function_privilege('authenticated','public.rpc_ai_open_need_conversation_v2()','EXECUTE');")" = "t"
          test "$(psql "$DB_URL" -Atc "select position('fact_schema_version' in pg_get_functiondef('public.rpc_ai_open_conversation(text)'::regprocedure));")" = "0"
          test "$(psql "$DB_URL" -Atc "select position('uskoci.ai_mutation' in pg_get_functiondef('private.guard_ai_fact_write()'::regprocedure));")" = "0"
          test "$(psql "$DB_URL" -Atc "select has_table_privilege('authenticated','public.ai_structured_facts','UPDATE');")" = "f"
          test "$(psql "$DB_URL" -Atc "select has_table_privilege('authenticated','public.need_sensitive','UPDATE');")" = "f"

      - name: Run RU-2 owner attacker service runtime proof
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/proofs/ru2_need_v2_runtime_proof.sql" | tee /tmp/ru2-runtime-proof.log
          grep -F "PASS RU2_RUNTIME owner_attacker_service typed_correction review draft idempotency legacy_coexistence privacy zero_residue" /tmp/ru2-runtime-proof.log
          test "$(psql "$DB_URL" -Atc "select count(*) from auth.users where email like 'ru2-proof-%@proof.invalid';")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from public.ai_messages where body like 'RU2_PROOF_%';")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from public.needs where title in ('Prenos frižidera u Novom Sadu','Drugi proof zadatak');")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from private.need_draft_save_commands where client_request_id like 'ru2-proof-%';")" = "0"

      - name: Run RU-2 repeated V2 service supersession proof
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/proofs/ru2_v2_service_supersession_runtime_proof.sql" | tee /tmp/ru2-service-proof.log
          grep -F "PASS RU2_V2_SERVICE_SUPERSESSION repeated_key one_live_fact service_cannot_bind_need zero_residue" /tmp/ru2-service-proof.log
          test "$(psql "$DB_URL" -Atc "select count(*) from auth.users where email like 'ru2-service-proof-%@proof.invalid';")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from public.ai_messages where body like 'RU2_SERVICE_%';")" = "0"

      - name: Stop disposable stack before client checks
        shell: bash
        working-directory: /tmp/uskoci-ru2-proof
        run: supabase stop --no-backup

      - name: Install exact app dependencies
        run: npm ci

      - name: TypeScript on exact combined head
        run: npx tsc --noEmit

      - name: Deno Edge v5 on exact combined head
        run: deno check supabase/functions/uskoci-ai-interview/index.ts

      - name: Regression tests on exact combined head
        run: npm test -- --runInBand

      - name: Verify R02 to R07 draft-only source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "rpc_ai_apply_interview_turn_v2_service" supabase/functions/uskoci-ai-interview/index.ts
          grep -F "rpc_ai_open_need_conversation_v2" src/data/aiNeedV2Production.ts
          grep -F "rpc_ai_need_review_v2" src/data/aiNeedV2Production.ts
          grep -F "rpc_save_need_draft_from_review" src/data/aiNeedV2Production.ts
          grep -F "Pregledajte nacrt" 'src/app/(app)/nova.tsx'
          grep -F "Sačuvajte DRAFT" 'src/app/(app)/pregled-nacrta.tsx'
          if grep -F "rpc_ai_publish_need" 'src/app/(app)/nova.tsx' 'src/app/(app)/pregled-nacrta.tsx' src/data/aiNeedV2Production.ts; then
            echo "RU2_COMBINED_FAIL: V2 path references legacy publish" >&2
            exit 1
          fi
          if grep -F "objaviPotrebu" 'src/app/(app)/nova.tsx' 'src/app/(app)/pregled-nacrta.tsx'; then
            echo "RU2_COMBINED_FAIL: R02/R07 direct publish path present" >&2
            exit 1
          fi
          echo "PASS RU2_COMBINED db_runtime typed_v2 supersession privacy edge_v5 deno rn_tsc jest r02_r07 draft_only"

      - name: Stop disposable stack
        if: always()
        shell: bash
        working-directory: /tmp/uskoci-ru2-proof
        run: |
          supabase stop --no-backup || true
