name: RU-2 Edge RN source proof

on:
  push:
    branches:
      - work/ru2-edge-rn-20260903
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ru2-edge-rn-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Regression tests
        run: npm test -- --runInBand

      - name: RU-2 Edge RN static contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "NEED_FACT_V2" supabase/functions/uskoci-ai-interview/index.ts
          grep -F "rpc_ai_apply_interview_turn_v2_service" supabase/functions/uskoci-ai-interview/index.ts
          grep -F "rpc_ai_open_need_conversation_v2" src/data/aiNeedV2Production.ts
          grep -F "rpc_ai_need_review_v2" src/data/aiNeedV2Production.ts
          grep -F "rpc_save_need_draft_from_review" src/data/aiNeedV2Production.ts
          grep -F "Pregledajte nacrt" 'src/app/(app)/nova.tsx'
          grep -F "Sačuvajte DRAFT" 'src/app/(app)/pregled-nacrta.tsx'
          if grep -F "rpc_ai_publish_need" 'src/app/(app)/nova.tsx' 'src/app/(app)/pregled-nacrta.tsx' src/data/aiNeedV2Production.ts; then
            echo "RU2_SOURCE_FAIL: new V2 flow references legacy publish authority" >&2
            exit 1
          fi
          if grep -F "objaviPotrebu" 'src/app/(app)/nova.tsx' 'src/app/(app)/pregled-nacrta.tsx'; then
            echo "RU2_SOURCE_FAIL: R02/R07 still call direct publish path" >&2
            exit 1
          fi
          echo "PASS RU2_EDGE_RN_SOURCE typed_v2 edge_dual_mode r02_r07 draft_only no_legacy_publish"
