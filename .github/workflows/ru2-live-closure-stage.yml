- existing 82 facts + 15 conversations + 6 Needs + 6 profiles preserved;
- all preexisting AI facts/conversations remain `LEGACY_TEXT_V1`;
- public publish/admission remains fail-closed for the next governing unit.

Live migration aliases:
- `{core_source_version}` -> `{core_live_version}` `{core_name}`, MD5 `{core_md5}`, {core_bytes} bytes, exact-byte `true`.
- `{guard_source_version}` -> `{guard_live_version}` `{guard_name}`, MD5 `{guard_md5}`, {guard_bytes} bytes, exact-byte `true`.

Proof chain:
- combined disposable run `33806989549`: PASS;
- promotion integrity `33811732899`: PASS;
- canonical PRE-P4 `33812075892`: PASS;
- fresh production preflight: PASS;
- live structural post-apply: PASS;
- Edge v{edge_version} ACTIVE/verify_jwt=true: PASS.

## Next allowed action

Fresh read-only physical preflight. If state remains `60 / {guard_live_version}` + Edge v{edge_version}, read governing master and begin the next dependency-ordered unit. Do not reopen RU-0/RU-1/RU-2.

Principle: **AI agent is replaceable. Canonical project state is not.**
'''
          (ROOT / 'docs/implementation/LIVE_IMPLEMENTATION_NETWORK.md').write_text(network, encoding='utf-8')

          ledger_path = ROOT / 'docs/implementation/IMPLEMENTATION_STATUS_LEDGER.csv'
          with ledger_path.open(newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              fieldnames = reader.fieldnames
              rows = list(reader)
          unit = 'RU-2_NEED_V2_R07_DRAFT'
          rows = [r for r in rows if r.get('unit') != unit]
          row = {
              'unit': unit,
              'status': 'CLOSED',
              'source_git_sha': source_head,
              'migration': f'staged={core_source_version}_{core_name}+{guard_source_version}_{guard_name};live={core_live_version}_{core_name}+{guard_live_version}_{guard_name}',
              'backend_owner': 'Typed Need V2 registry + Human Review DRAFT materializer + explicit AI fact transition guard + Edge v5',
              'rn_consumer': 'R02 nova.tsx -> R07 pregled-nacrta.tsx',
              'proof_artifact': 'runs 33806989549 + 33811732899 + 33812075892 + live structural proof + Edge v5 deployment',
              'proof_level': 'DISPOSABLE_RUNTIME_PROVEN+ZERO_RESIDUE_PROVEN+LIVE_STRUCTURAL_PROVEN+EDGE_DEPLOYED+PROVENANCE_RECONCILED',
              'live_applied': 'YES',
              'blocker': 'NONE',
              'next_action': f'Fresh preflight against 60/{guard_live_version} + Edge v5; read governing master next unit; DO_NOT_REAPPLY_RU2',
          }
          rows.append({k: row.get(k, '') for k in fieldnames})
          with ledger_path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
          PY

          sh supabase/migrations/check_md5.sh

      - name: Commit durable closure checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'uskoci-ci'
          git config user.email 'uskoci-ci@users.noreply.github.com'
          git add supabase/migrations/MIGRATION_PROVENANCE.json \
                  docs/implementation/CURRENT_IMPLEMENTATION_HANDOFF.md \
                  docs/implementation/LIVE_IMPLEMENTATION_NETWORK.md \
                  docs/implementation/IMPLEMENTATION_STATUS_LEDGER.csv \
                  docs/implementation/LIVE_MIGRATION_STATE.json
          git diff --cached --check
          git commit -m 'docs(implementation): close RU-2 live state'
          git push origin HEAD:stage/ru2-live-closure-20260904
