              'canonical_source_head': source_head,
              'source_migrations': [
                  {'version': core_source_version, 'name': core_name, 'file': f'supabase/migrations/{core_file}', 'raw_md5': core_md5},
                  {'version': guard_source_version, 'name': guard_name, 'file': f'supabase/migrations/{guard_file}', 'raw_md5': guard_md5},
              ],
              'live_apply': [
                  {'version': core_live_version, 'name': core_name, 'source_version': core_source_version, 'recorded_statement_utf8_bytes': core_bytes, 'recorded_statement_md5': core_md5, 'exact_byte_identity_with_source': True},
                  {'version': guard_live_version, 'name': guard_name, 'source_version': guard_source_version, 'recorded_statement_utf8_bytes': guard_bytes, 'recorded_statement_md5': guard_md5, 'exact_byte_identity_with_source': True},
