name: RU-2 live closure staging

on:
  push:
    branches:
      - stage/ru2-live-closure-20260904

permissions:
  contents: write

jobs:
  close-ru2:
    if: ${{ startsWith(github.event.head_commit.message, 'fix(ru2): run live closure staging') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/ru2-live-closure-20260904
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconcile RU-2 live tracking
        run: python scripts/ru2_live_closure_stage.py

      - name: Verify migration bytes and live provenance
        run: sh supabase/migrations/check_md5.sh

      - name: Commit durable closure checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'uskoci-ci'
          git config user.email 'uskoci-ci@users.noreply.github.com'
          git add supabase/migrations/MIGRATION_PROVENANCE.json
          git add docs/implementation/CURRENT_IMPLEMENTATION_HANDOFF.md
          git add docs/implementation/LIVE_IMPLEMENTATION_NETWORK.md
          git add docs/implementation/IMPLEMENTATION_STATUS_LEDGER.csv
          git add docs/implementation/LIVE_MIGRATION_STATE.json
          git diff --cached --check
          git commit -m 'docs(implementation): close RU-2 live state'
          git push origin HEAD:stage/ru2-live-closure-20260904
