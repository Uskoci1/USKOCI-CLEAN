name: RU-2 live closure staging

on:
  push:
    branches:
      - stage/ru2-live-closure-20260904

permissions:
  contents: write

jobs:
  close-ru2:
    if: github.event.head_commit.message == 'chore(ru2): stage live closure automation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/ru2-live-closure-20260904
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconcile RU-2 live tracking
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path('.')
          source_head = '47ce475030cc1ab5908f014d6d7398a0e2cb7754'
          core_source_version = '20260903190000'
          core_live_version = '20260903222139'
          core_name = 'clean_ru2_need_v2_draft'
          core_file = '20260903190000_clean_ru2_need_v2_draft.sql'
          core_md5 = 'f95fadda53d8d803faac4498d860c31b'
          core_bytes = 47143
          guard_source_version = '20260903190100'
          guard_live_version = '20260903222333'
          guard_name = 'clean_ru2_ai_fact_transition_guard'
          guard_file = '20260903190100_clean_ru2_ai_fact_transition_guard.sql'
          guard_md5 = '95145c601b6366f1a98e8566b3307515'
          guard_bytes = 9438
          edge_version = 5
          edge_sha = '5003809f31681eb396713ffc66a1adf979d62a39312dcb833ead67df180954ca'
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          # Migration provenance: live 60 with explicit source->live aliases.
          prov_path = ROOT / 'supabase/migrations/MIGRATION_PROVENANCE.json'
          prov = json.loads(prov_path.read_text(encoding='utf-8'))
          prov['generated_at_utc'] = now
          prov['repository_base_head'] = source_head
          snap = prov['live_history_snapshot']
          entries = [e for e in snap['entries'] if e.get('name') not in {core_name, guard_name}]
          entries.extend([
              {
                  'name': core_name,
                  'version': core_live_version,
                  'file': core_file,
                  'source_version': core_source_version,
                  'exact_byte_mirror': True,
                  'live_recorded_statement_md5': core_md5,
                  'recorded_statement_utf8_bytes': core_bytes,
              },
              {
                  'name': guard_name,
                  'version': guard_live_version,
                  'file': guard_file,
                  'source_version': guard_source_version,
                  'exact_byte_mirror': True,
                  'live_recorded_statement_md5': guard_md5,
                  'recorded_statement_utf8_bytes': guard_bytes,
              },
          ])
          snap['entries'] = entries
          snap['migration_count'] = 60
          snap['last'] = {'name': guard_name, 'version': guard_live_version}
          prov['pending_forward_migrations'] = []
          repairs = [r for r in prov.get('forward_repairs', []) if r.get('name') not in {core_name, guard_name}]
          repairs.extend([
              {
                  'version': core_live_version,
                  'source_version': core_source_version,
                  'name': core_name,
                  'file': core_file,
                  'classification': 'FORWARD_REPAIR',
                  'raw_md5': core_md5,
                  'exact_byte_mirror': True,
                  'live_recorded_statement_md5': core_md5,
                  'recorded_statement_utf8_bytes': core_bytes,
                  'disposable_runtime_proof': 'PASS: combined GitHub Actions run 33806989549 proved DB apply, owner/attacker/service, typed correction, Human Review, DRAFT idempotency, privacy, legacy/V2 coexistence and zero residue.',
                  'live_structural_proof': 'PASS: live registry 20; V2 opener/review/correct/save grants correct; service writer service-only; legacy rows preserved; need_sensitive authenticated writes revoked; legacy publish remains fail-closed.'
              },
              {
                  'version': guard_live_version,
                  'source_version': guard_source_version,
                  'name': guard_name,
                  'file': guard_file,
                  'classification': 'FORWARD_REPAIR',
                  'raw_md5': guard_md5,
                  'exact_byte_mirror': True,
                  'live_recorded_statement_md5': guard_md5,
                  'recorded_statement_utf8_bytes': guard_bytes,
                  'disposable_runtime_proof': 'PASS: run 33806989549 proved owner/service supersession, canonical DRAFT binding and zero residue.',
                  'live_structural_proof': 'PASS: authenticated direct fact UPDATE false; private guard API execute false; ambient uskoci.ai_mutation bypass absent; explicit subject/supersession/schema guards present.'
              },
          ])
          prov['forward_repairs'] = repairs
          prov_path.write_text(json.dumps(prov, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Machine-readable live state. Preserve RU-0/RU-1 history and append RU-2.
          state_path = ROOT / 'docs/implementation/LIVE_MIGRATION_STATE.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['updated_at'] = now
          state['live_migration_count'] = 60
          state['live_head'] = {'version': guard_live_version, 'name': guard_name}
          state['ru2'] = {
