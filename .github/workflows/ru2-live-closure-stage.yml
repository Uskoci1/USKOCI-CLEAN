          }
          state['provenance'] = {
              'file': 'supabase/migrations/MIGRATION_PROVENANCE.json',
              'state': 'NORMALIZED_TO_LIVE_60',
              'pending_forward_migrations': 0,
              'ru2_live_version_aliases': [
                  {'live_version': core_live_version, 'source_version': core_source_version, 'source_file': core_file, 'exact_byte_identity': True},
                  {'live_version': guard_live_version, 'source_version': guard_source_version, 'source_file': guard_file, 'exact_byte_identity': True},
              ]
          }
          state['next_allowed_action'] = 'Fresh read-only GitHub/Supabase preflight against live 60/20260903222333 and Edge v5; then read governing master and begin the next dependency-ordered unit. Do not redo RU-0/RU-1/RU-2.'
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          handoff = f'''# USKOČI — CURRENT IMPLEMENTATION HANDOFF

Checkpoint: {now}

## Canonical identity

- Repo: `Uskoci1/USKOCI-CLEAN`
- Branch: `clean-alpha-backend`
- RU-2 canonical source promotion head: `{source_head}`
- Supabase project: `leqcwgzvjsxugfgzdmth`
- Production migration state: `60 / {guard_live_version}_{guard_name}`
- Edge: `uskoci-ai-interview` ACTIVE v{edge_version}, `verify_jwt=true`, EZBR SHA-256 `{edge_sha}`

## Last fully completed unit

`RU-2 — Need V2 + R02/R07 canonical DRAFT`

State: `CLOSED`

Canonical source migrations:
- `{core_file}` — MD5 `{core_md5}`
- `{guard_file}` — MD5 `{guard_md5}`

Live Supabase aliases:
- source `{core_source_version}` -> live `{core_live_version}_{core_name}`; 1 statement; {core_bytes} UTF-8 bytes; MD5 `{core_md5}`; exact byte identity `true`
- source `{guard_source_version}` -> live `{guard_live_version}_{guard_name}`; 1 statement; {guard_bytes} UTF-8 bytes; MD5 `{guard_md5}`; exact byte identity `true`

## RU-2 contract now live

`R02 AI conversation -> R07 Human Review -> canonical DRAFT`

- 20-key server-owned typed Need fact registry is live.
- AI V2 turn persistence is service-role only; authenticated/anon cannot execute it.
- Owner typed correction and Human Review are live.
- `rpc_save_need_draft_from_review` materializes an idempotent owner DRAFT only.
- Exact/private address/access remains separate from public/coarse task geography.
- Authenticated direct write to `need_sensitive` is revoked.
- AI fact transition guard has no ambient `uskoci.ai_mutation` bypass; it explicitly permits only owner confirmation, owner/service supersession and the one-time owner V2 NULL->DRAFT Need binding.
- Legacy conversations/facts remain classified `LEGACY_TEXT_V1`.
- Legacy AI publish remains fail-closed (`PACKAGE_4_NOT_READY`). RU-2 does not authorize public publish/admission.

## Proof

- Combined disposable DB + Edge + RN run `33806989549`: PASS, including owner/attacker/service, Human Review, DRAFT idempotency, privacy, repeated-key supersession, zero residue, TypeScript, Deno and Jest.
- Promotion integrity run `33811732899`: PASS — MD5/provenance + TS + Deno + Jest + draft-only source contract.
- Canonical PRE-P4 run `33812075892` on source head `{source_head}`: PASS.
- Fresh production preflight before write matched exactly `58 / 20260903184545`, Edge v4 and preserved row fingerprints.
- Live DB post-apply: `60 / {guard_live_version}`, registry 20, grants/guards correct, business rows preserved: AI facts 82, conversations 15, Needs 6, profiles 6.
- Live Edge v{edge_version}: ACTIVE, `verify_jwt=true`, deployed from the Deno-proven canonical v5 source plus `src/contracts/needFactsV2.ts`.

## Closed units — DO NOT REDO

- Edge source reconciliation: DONE
- RU-0 Authority Closure: CLOSED — live `20260903160812_clean_ru0_authority_closure`
- RU-1 Worker Readiness: CLOSED — live `20260903184545_clean_ru1_worker_readiness`
- RU-2 Need V2 + R02/R07 DRAFT: CLOSED — live head `{guard_live_version}_{guard_name}`, Edge v{edge_version}

Quarantine remains quarantine: `repair/ru0-ru1-backend-20260902` — no merge/cherry-pick/apply.

## Next allowed action

Fresh read-only GitHub/Supabase preflight against this checkpoint. If physical state matches `60 / {guard_live_version}` and Edge v{edge_version}, read the governing master for the next dependency-ordered implementation unit. Do not infer publish/admission semantics from RU-2 and do not reapply RU-0/RU-1/RU-2.

Continuity rule:
`READ MASTER -> HANDOFF -> LIVE NETWORK -> LEDGER -> LIVE MIGRATION STATE -> FRESH PHYSICAL READ -> CONTINUE OR RECONCILE`

**AI agent is replaceable. Canonical project state is not.**
'''
          (ROOT / 'docs/implementation/CURRENT_IMPLEMENTATION_HANDOFF.md').write_text(handoff, encoding='utf-8')

          network = f'''# USKOČI — LIVE IMPLEMENTATION NETWORK

Last updated: {now}
Authority: governing master + fresh physical GitHub/Supabase reads

## Canonical physical baseline

- Repository: `Uskoci1/USKOCI-CLEAN`
- Branch: `clean-alpha-backend`
- Canonical source promotion head: `{source_head}`
- Supabase: `leqcwgzvjsxugfgzdmth`
- Live migrations: `60`
- Live head: `{guard_live_version}_{guard_name}`
- Edge: `uskoci-ai-interview` ACTIVE v{edge_version}, `verify_jwt=true`, EZBR `{edge_sha}`

## Closed dependency chain

