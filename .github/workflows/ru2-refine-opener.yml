name: RU-2 refine opener

on:
  push:
    branches:
      - proof/ru2-need-v2-r07-20260903
    paths:
      - '.github/workflows/ru2-refine-opener.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/ru2-need-v2-r07-20260903
          fetch-depth: 0
      - name: Apply additive V2 opener refinement
        run: python supabase/proofs/ru2_refine_opener.py
      - name: Commit refinement
        run: |
          set -euo pipefail
          rm .github/workflows/ru2-refine-opener.yml
          rm supabase/proofs/ru2_refine_opener.py
          git config user.name uskoci-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(db): make RU-2 V2 opener additive"
          git push origin HEAD:proof/ru2-need-v2-r07-20260903
