name: RU-2 stable guard repair

on:
  push:
    branches:
      - proof/ru2-need-v2-r07-20260903
    paths:
      - '.github/workflows/ru2-stable-guard-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/ru2-need-v2-r07-20260903
          fetch-depth: 0
      - name: Apply stable predecessor/replay repair
        run: python supabase/proofs/ru2_fix_replay_and_guard.py
      - name: Commit repair
        run: |
          set -euo pipefail
          rm .github/workflows/ru2-stable-guard-repair.yml
          rm supabase/proofs/ru2_fix_replay_and_guard.py
          git config user.name uskoci-ci
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(db): make RU-2 predecessor guard stable"
          git push origin HEAD:proof/ru2-need-v2-r07-20260903
