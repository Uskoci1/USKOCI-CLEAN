name: RU-2 stable guard repair

on:
  push:
    branches:
      - proof/ru2-need-v2-r07-20260903
    paths:
      - '.github/workflows/ru2-stable-guard-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/ru2-need-v2-r07-20260903
          fetch-depth: 0
      - name: Apply dynamic preservation postconditions
        run: python supabase/proofs/ru2_stabilize_postconditions.py
      - name: Commit only product migration repair
        run: |
          set -euo pipefail
          git config user.name uskoci-ci
          git config user.email actions@users.noreply.github.com
          git add supabase/migrations/20260903190000_clean_ru2_need_v2_draft.sql
          git diff --cached --check
          git commit -m "fix(db): make RU-2 preservation postconditions dynamic"
          git push origin HEAD:proof/ru2-need-v2-r07-20260903
