name: RU-3 B05 live reconciliation

on:
  push:
    branches:
      - automation/ru3-b05-live-reconcile-20260904
    paths:
      - .github/workflows/ru3-b05-live-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical
        uses: actions/checkout@v4
        with:
          ref: clean-alpha-backend
          fetch-depth: 0

      - name: Build clean reconciliation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B promotion/ru3-b05-live-reconcile-20260904 origin/clean-alpha-backend

          python3 - <<'PY'
          from __future__ import annotations
          import csv
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          source_head = 'ac70e1e66375a9e1be602808a3d4d3a2735f1b3b'
          live_version = '20260904090147'
          live_name = 'clean_ru3_policy_bundle_foundation'
          source_version = '20260904090000'
          source_file = '20260904090000_clean_ru3_policy_bundle_foundation.sql'
          source_md5 = 'e65a1d1658938ffdca07c88c246e660c'
          live_md5 = '6ca4db41a4c23dd9bd85fc2e76ea2af8'
          live_bytes = 8506

          prov_path = Path('supabase/migrations/MIGRATION_PROVENANCE.json')
          prov = json.loads(prov_path.read_text(encoding='utf-8'))
          prov['generated_at_utc'] = now
          prov['repository_base_head'] = source_head
          snap = prov['live_history_snapshot']
          snap['migration_count'] = 61
          snap['last'] = {'name': live_name, 'version': live_version}
          entries = snap.setdefault('entries', [])
          if not any(e.get('version') == live_version for e in entries):
              entries.append({
                  'name': live_name,
                  'version': live_version,
                  'file': source_file,
                  'source_version': source_version,
                  'exact_byte_mirror': False,
                  'live_recorded_statement_md5': live_md5,
                  'recorded_statement_utf8_bytes': live_bytes,
              })
          prov['pending_forward_migrations'] = [
              e for e in prov.get('pending_forward_migrations', [])
              if e.get('name') != live_name
          ]
          repairs = prov.setdefault('forward_repairs', [])
          if not any(e.get('version') == live_version for e in repairs):
              repairs.append({
                  'version': live_version,
                  'source_version': source_version,
                  'name': live_name,
                  'file': source_file,
                  'classification': 'FORWARD_REPAIR',
                  'raw_md5': source_md5,
                  'exact_byte_mirror': False,
                  'live_recorded_statement_md5': live_md5,
                  'recorded_statement_utf8_bytes': live_bytes,
                  'disposable_runtime_proof': 'PASS: GitHub Actions run 33854188735 proved fail-closed bundle readiness, unreviewed/incomplete denial, jurisdiction isolation, one-active constraint, legacy publish closure and zero residue.',
                  'live_structural_proof': 'PASS: live 61/20260904090147; policy tables exist with RLS; zero bundle/rule rows; anon/authenticated/service_role direct table access denied; private helper EXECUTE denied; legacy publish remains fail-closed; business rows preserved 82 facts/15 conversations/6 Needs/6 profiles.'
              })
          recs = prov.setdefault('live_source_reconciliations', [])
          if not any(e.get('version') == live_version for e in recs):
              recs.append({
                  'version': live_version,
                  'source_version': source_version,
                  'name': live_name,
                  'file': source_file,
                  'classification': 'SEMANTIC_RECORDED_STATEMENT_RECONCILIATION',
                  'recorded_statement_utf8_bytes': live_bytes,
                  'recorded_statement_md5': live_md5,
                  'canonical_raw_md5': source_md5,
                  'exact_byte_mirror': False,
                  'difference': 'Connected Supabase migration recording is not byte-identical to the canonical raw file representation. Executable B05 contract and live structural postconditions match; raw-byte identity is not claimed.',
                  'applied_history_action': 'LIVE_VERSION_ALIAS_RECORDED'
              })
          prov_path.write_text(json.dumps(prov, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          state_path = Path('docs/implementation/LIVE_MIGRATION_STATE.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['updated_at'] = now
          state['live_migration_count'] = 61
          state['live_head'] = {'version': live_version, 'name': live_name}
          state['ru3'] = {
              'status': 'OPEN_B05_LIVE_STRUCTURAL_PROVEN',
              'full_ru3_closed': False,
              'b05': {
                  'status': 'LIVE_STRUCTURAL_PROVEN',
                  'canonical_source_head': source_head,
                  'source_version': source_version,
                  'source_file': f'supabase/migrations/{source_file}',
                  'source_raw_md5': source_md5,
                  'live_version': live_version,
                  'recorded_statement_utf8_bytes': live_bytes,
                  'recorded_statement_md5': live_md5,
                  'exact_byte_identity_with_source': False,
                  'disposable_runtime_proof_run': 33854188735,
                  'canonical_integrity_run': 33855138395,
                  'zero_policy_rows': True,
                  'publish_admission': 'FAIL_CLOSED'
              },
              'next_dependency': 'B06_IMMUTABLE_ADMISSION_DECISION_AND_CANONICAL_FINGERPRINT',
              'activation_blocker': 'No reviewed/versioned/applicable D-0140 policy content exists yet; missing or incomplete policy must not produce ALLOW.'
          }
          state.setdefault('provenance', {})['state'] = 'NORMALIZED_TO_LIVE_61'
          state['provenance']['pending_forward_migrations'] = 0
          state['provenance']['ru3_b05_live_alias'] = {
              'live_version': live_version,
              'source_version': source_version,
              'source_file': source_file,
              'exact_byte_identity': False,
              'recorded_statement_md5': live_md5,
              'source_raw_md5': source_md5
          }
          state['next_allowed_action'] = 'Fresh read-only preflight against live 61/20260904090147 and Edge v5; then implement B06 immutable admission/publication decision + canonical input fingerprint as a fail-closed structural unit. Do not activate publish or invent policy content.'
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          handoff = f'''# USKOČI — CURRENT IMPLEMENTATION HANDOFF\n\nCheckpoint: {now}\n\n## Canonical identity\n\n- Repo: `Uskoci1/USKOCI-CLEAN`\n- Branch: `clean-alpha-backend`\n- RU-3/B05 canonical source promotion head: `{source_head}`\n- Supabase project: `leqcwgzvjsxugfgzdmth`\n- Production migration state: `61 / {live_version}_{live_name}`\n- Edge: `uskoci-ai-interview` ACTIVE v5, `verify_jwt=true`, EZBR SHA-256 `5003809f31681eb396713ffc66a1adf979d62a39312dcb833ead67df180954ca`\n\n## Current live unit\n\n`RU-3 / B05 — publication policy bundle foundation`\n\nState: `LIVE_STRUCTURAL_PROVEN`\n\nImportant: **RU-3 as a whole is still OPEN.** B05 only creates the safe server-side structure for future reviewed policy bundles. It seeds no policy content and creates no ALLOW rule.\n\nCanonical source migration:\n- `{source_version}_{live_name}.sql` — raw MD5 `{source_md5}`\n\nLive Supabase alias:\n- source `{source_version}` -> live `{live_version}_{live_name}`; recorded 1 statement; {live_bytes} UTF-8 bytes; recorded MD5 `{live_md5}`; exact raw-byte identity with canonical source `false` (semantic/live structural reconciliation only).\n\n## B05 contract now live\n\n- Private policy bundle and rule-reference tables exist.\n- RLS is enabled.\n- `anon`, `authenticated` and `service_role` have no direct table access.\n- Private readiness/current-bundle helpers are not executable by those roles.\n- Live tables contain **0 policy bundles and 0 rule references**.\n- Missing/unreviewed/incomplete policy cannot activate publication.\n- Retired legacy publish remains unavailable to authenticated users.\n- Legacy AI publish remains fail-closed with `PACKAGE_4_NOT_READY`.\n- Existing business rows remain preserved: 82 AI facts, 15 conversations, 6 Needs, 6 profiles.\n\n## Proof\n\n- Disposable B05 runtime proof run `33854188735`: PASS, including fail-closed behavior, invalid activation rejection, jurisdiction isolation, one-active constraint and zero residue.\n- Canonical PRE-P4 run `33855138395` on `{source_head}`: PASS — migration integrity, TypeScript and regression tests.\n- Fresh production preflight before live write: PASS.\n- Live apply: PASS -> `{live_version}_{live_name}`.\n- Live structural post-apply: PASS — zero policy rows, RLS/ACL closed, legacy publish still closed, business rows preserved.\n- Edge v5 unchanged since RU-2.\n\n## Closed units — DO NOT REDO\n\n- Edge source reconciliation: DONE\n- RU-0 Authority Closure: CLOSED\n- RU-1 Worker Readiness: CLOSED\n- RU-2 Need V2 + R02/R07 DRAFT: CLOSED\n\nQuarantine remains quarantine: `repair/ru0-ru1-backend-20260902` — no merge/cherry-pick/apply.\n\n## Current blocker / next dependency\n\nThere is still no reviewed, versioned and applicable D-0140 policy content. Therefore public admission/publish must remain fail-closed.\n\nNext safe unit: **B06 — immutable admission/publication decision + canonical input fingerprint**, built so it cannot emit/activate ALLOW without a current reviewed complete applicable policy bundle.\n\nDo not activate canonical publish yet. Do not invent legal/safety policy content.\n\nContinuity rule:\n`READ MASTER -> HANDOFF -> LIVE NETWORK -> LEDGER -> LIVE MIGRATION STATE -> FRESH PHYSICAL READ -> CONTINUE OR RECONCILE`\n\n**AI agent is replaceable. Canonical project state is not.**\n'''
          Path('docs/implementation/CURRENT_IMPLEMENTATION_HANDOFF.md').write_text(handoff, encoding='utf-8')

          network = f'''# USKOČI — LIVE IMPLEMENTATION NETWORK\n\nLast updated: {now}\nAuthority: governing master + fresh physical GitHub/Supabase reads\n\n## Canonical physical baseline\n\n- Repository: `Uskoci1/USKOCI-CLEAN`\n- Branch: `clean-alpha-backend`\n- B05 source promotion head: `{source_head}`\n- Supabase: `leqcwgzvjsxugfgzdmth`\n- Live migrations: `61`\n- Live head: `{live_version}_{live_name}`\n- Edge: `uskoci-ai-interview` ACTIVE v5, `verify_jwt=true`, EZBR `5003809f31681eb396713ffc66a1adf979d62a39312dcb833ead67df180954ca`\n\n## Dependency chain\n\n`RU-0 CLOSED -> RU-1 CLOSED -> RU-2 CLOSED -> RU-3/B05 LIVE_STRUCTURAL_PROVEN -> B06 NEXT`\n\nRU-3 is **not** closed. Only B05 is live/proven.\n\nB05 network:\n`server-owned policy bundle metadata -> reviewed+complete+active readiness gate -> exact jurisdiction selector -> no client/service direct access -> no seeded policy content -> publish still fail-closed`\n\nB05 live invariants:\n- 0 policy bundle rows;\n- 0 policy rule-reference rows;\n- RLS enabled on both private tables;\n- anon/authenticated/service_role direct table access denied;\n- private helper EXECUTE denied to anon/authenticated/service_role;\n- authenticated legacy `rpc_publish_need` execute remains false;\n- legacy AI publish still contains `PACKAGE_4_NOT_READY`;\n- existing 82 facts + 15 conversations + 6 Needs + 6 profiles preserved;\n- Edge v5 unchanged.\n\nLive migration alias:\n- `{source_version}` -> `{live_version}` `{live_name}`; source raw MD5 `{source_md5}`; recorded MD5 `{live_md5}`; {live_bytes} recorded UTF-8 bytes; exact-byte identity not claimed.\n\nProof chain:\n- disposable B05 run `33854188735`: PASS;\n- canonical PRE-P4 `33855138395`: PASS;\n- fresh production preflight: PASS;\n- live apply: PASS;\n- live structural post-apply: PASS.\n\n## Next allowed action\n\nFresh read-only physical preflight against `61 / {live_version}` + Edge v5. Then implement **B06 immutable admission/publication decision + canonical input fingerprint** as a fail-closed structural unit. Missing/unreviewed/incomplete policy must never yield ALLOW. Do not reopen RU-0/RU-1/RU-2 and do not activate publish yet.\n\nPrinciple: **AI agent is replaceable. Canonical project state is not.**\n'''
          Path('docs/implementation/LIVE_IMPLEMENTATION_NETWORK.md').write_text(network, encoding='utf-8')

          ledger_path = Path('docs/implementation/IMPLEMENTATION_STATUS_LEDGER.csv')
          rows = list(csv.reader(ledger_path.read_text(encoding='utf-8').splitlines()))
          if not any(r and r[0] == 'RU-3_B05_POLICY_BUNDLE_FOUNDATION' for r in rows):
              rows.append([
                  'RU-3_B05_POLICY_BUNDLE_FOUNDATION',
                  'LIVE_STRUCTURAL_PROVEN',
                  source_head,
                  f'source={source_version}_{live_name};live={live_version}_{live_name}',
                  'private policy bundle metadata + fail-closed readiness selector',
                  'none yet; publish remains closed',
                  'run 33854188735 + canonical 33855138395 + live structural proof + provenance reconciliation',
                  'DISPOSABLE_RUNTIME_PROVEN+ZERO_RESIDUE_PROVEN+LIVE_STRUCTURAL_PROVEN+PROVENANCE_RECONCILED',
                  'YES',
                  'Reviewed/versioned/applicable D-0140 policy content is not yet present; RU-3 activation remains blocked',
                  'Fresh preflight; implement B06 immutable decision + canonical fingerprint fail-closed; DO_NOT_ACTIVATE_PUBLISH'
              ])
          with ledger_path.open('w', encoding='utf-8', newline='') as f:
              csv.writer(f, lineterminator='\n').writerows(rows)
          PY

          python3 supabase/migrations/check_migration_integrity.py

          git add supabase/migrations/MIGRATION_PROVENANCE.json \
                  docs/implementation/LIVE_MIGRATION_STATE.json \
                  docs/implementation/CURRENT_IMPLEMENTATION_HANDOFF.md \
                  docs/implementation/LIVE_IMPLEMENTATION_NETWORK.md \
                  docs/implementation/IMPLEMENTATION_STATUS_LEDGER.csv
          git diff --cached --check
          git commit -m "docs(ru3): reconcile B05 live state"
          git push origin HEAD:promotion/ru3-b05-live-reconcile-20260904
