name: RU-3 B06 live reconciliation

on:
  push:
    branches:
      - automation/ru3-b06-live-reconcile-20260904

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve reconciliation helper
        run: cp .github/scripts/reconcile_b06_live.py /tmp/reconcile_b06_live.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Build clean B06 live tracking branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin clean-alpha-backend
          git checkout -B tracking/ru3-b06-live-20260904 origin/clean-alpha-backend
          python /tmp/reconcile_b06_live.py
          git diff --check
          sh supabase/migrations/check_md5.sh

          expected=$(cat <<'EOF'
docs/implementation/CURRENT_IMPLEMENTATION_HANDOFF.md
docs/implementation/IMPLEMENTATION_STATUS_LEDGER.csv
docs/implementation/LIVE_IMPLEMENTATION_NETWORK.md
docs/implementation/LIVE_MIGRATION_STATE.json
supabase/migrations/MIGRATION_PROVENANCE.json
EOF
          )
          actual=$(git diff --name-only | sort)
          if [ "$actual" != "$(printf '%s\n' "$expected" | sort)" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$actual"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/migrations/MIGRATION_PROVENANCE.json \
            docs/implementation/LIVE_MIGRATION_STATE.json \
            docs/implementation/CURRENT_IMPLEMENTATION_HANDOFF.md \
            docs/implementation/LIVE_IMPLEMENTATION_NETWORK.md \
            docs/implementation/IMPLEMENTATION_STATUS_LEDGER.csv
          git commit -m 'docs(ru3): reconcile B06 live state'
          git push -u origin tracking/ru3-b06-live-20260904

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript contract check
        run: npx tsc --noEmit

      - name: Regression tests
        run: npm test -- --runInBand
