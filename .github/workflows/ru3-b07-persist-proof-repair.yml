name: RU-3 B07 persist proof repair

on:
  push:
    branches:
      - proof/ru3-b07-canonical-publish-20260904

permissions:
  contents: write

concurrency:
  group: ru3-b07-proof-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic proof repair
        run: python .github/scripts/patch_ru3_b07_proof_runtime.py

      - name: Persist only corrected proof when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/proofs/ru3_b07_canonical_publish_runtime_proof.sql; then
            echo "proof artifact already corrected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/proofs/ru3_b07_canonical_publish_runtime_proof.sql
          git commit -m "test(ru3): persist B07 privilege-safe runtime proof"
          git push origin HEAD:proof/ru3-b07-canonical-publish-20260904
