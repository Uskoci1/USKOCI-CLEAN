name: RU-3 decision ordering patch helper

on:
  push:
    branches:
      - proof/ru3-admission-infra-20260904

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'chore(ru3): stage decision ordering patch helper' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/ru3-admission-infra-20260904
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/ru3_fix_decision_ordering.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'uskoci-ci'
          git config user.email 'uskoci-ci@users.noreply.github.com'
          git add supabase/migrations/20260904061000_clean_ru3_fail_closed_admission_infrastructure.sql
          git diff --cached --check
          git commit -m 'fix(db): serialize RU-3 publication decisions'
          git push origin HEAD:proof/ru3-admission-infra-20260904
