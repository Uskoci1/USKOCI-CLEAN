name: RU-4 clean promotion builder

on:
  push:
    branches:
      - work/ru4-clean-promotion-build-20260905
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-clean-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch exact green RU-4 proof source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin proof/ru4-owner-edit-lock-20260904
          test "$(git rev-parse FETCH_HEAD)" = "eeb8a29036cdcbd9ee008ae789334e55c9cbfbea"
          echo "PASS exact_green_proof_head=eeb8a29036cdcbd9ee008ae789334e55c9cbfbea"

      - name: Materialize exact proved app and migration bytes
        shell: bash
        run: |
          set -euo pipefail
          PROOF=eeb8a29036cdcbd9ee008ae789334e55c9cbfbea
          mkdir -p 'src/data' 'src/app/(app)' 'src/app/(app)/potrebe/[id]' supabase/migrations

          git show "$PROOF:src/data/ru4Production.ts" > src/data/ru4Production.ts
          git show "$PROOF:src/app/(app)/moje-prijave.tsx" > 'src/app/(app)/moje-prijave.tsx'
          git show "$PROOF:src/app/(app)/potrebe/[id]/pregled.tsx" > 'src/app/(app)/potrebe/[id]/pregled.tsx'

          git show "$PROOF:supabase/staging/ru4/20260904214500_clean_ru4_owner_edit_lock.sql" > supabase/migrations/20260904214500_clean_ru4_owner_edit_lock.sql
          git show "$PROOF:supabase/staging/ru4/20260904223000_clean_ru4_close_remaining_search.sql" > supabase/migrations/20260904223000_clean_ru4_close_remaining_search.sql
          git show "$PROOF:supabase/staging/ru4/20260904230000_clean_ru4_ai_edit_conversation.sql" > supabase/migrations/20260904230000_clean_ru4_ai_edit_conversation.sql
          git show "$PROOF:supabase/staging/ru4/20260904230500_clean_ru4_ai_edit_replay_boundary.sql" > supabase/migrations/20260904230500_clean_ru4_ai_edit_replay_boundary.sql

          test "$(git hash-object src/data/ru4Production.ts)" = "52f6c2151dcd8f58fb185bfe1cfba41bcc0f0fa3"
          test "$(git hash-object 'src/app/(app)/moje-prijave.tsx')" = "dd370a5ab1172a2f3d66c97d41a2834711c0b417"
          test "$(git hash-object 'src/app/(app)/potrebe/[id]/pregled.tsx')" = "5208fd97e9f7496afb58a5b3f5e8009c6d6f6d80"

          echo '10b57d64ab0d58e6e96b7e09cbd3c748  supabase/migrations/20260904214500_clean_ru4_owner_edit_lock.sql' | md5sum -c -
          echo '4e4e27d9e71be5f51ef5d892884b63a7  supabase/migrations/20260904223000_clean_ru4_close_remaining_search.sql' | md5sum -c -
          echo 'b976f1ccc2c329d7f2fe0bc43ef36606  supabase/migrations/20260904230000_clean_ru4_ai_edit_conversation.sql' | md5sum -c -
          echo '2a1fdea9f612394709afc44cc6f6b1b9  supabase/migrations/20260904230500_clean_ru4_ai_edit_replay_boundary.sql' | md5sum -c -

      - name: Record four pending forward migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          manifest = Path('supabase/migrations/MD5_MANIFEST.txt')
          extra = [
              ('10b57d64ab0d58e6e96b7e09cbd3c748', '20260904214500_clean_ru4_owner_edit_lock.sql'),
              ('4e4e27d9e71be5f51ef5d892884b63a7', '20260904223000_clean_ru4_close_remaining_search.sql'),
              ('b976f1ccc2c329d7f2fe0bc43ef36606', '20260904230000_clean_ru4_ai_edit_conversation.sql'),
              ('2a1fdea9f612394709afc44cc6f6b1b9', '20260904230500_clean_ru4_ai_edit_replay_boundary.sql'),
          ]
          lines = manifest.read_text(encoding='utf-8').splitlines()
          names = {line.split('  ', 1)[1] for line in lines}
          for checksum, filename in extra:
              if filename in names:
                  raise SystemExit(f'duplicate migration in manifest: {filename}')
              lines.append(f'{checksum}  {filename}')
          if lines != sorted(lines, key=lambda line: line.split('  ', 1)[1]):
              raise SystemExit('manifest would not be filename-sorted')
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

          provenance = Path('supabase/migrations/MIGRATION_PROVENANCE.json')
          data = json.loads(provenance.read_text(encoding='utf-8'))
          if data.get('pending_forward_migrations'):
              raise SystemExit('unexpected pre-existing pending migrations')
          if data['live_history_snapshot']['migration_count'] != 63:
              raise SystemExit('unexpected live predecessor count')
          if data['live_history_snapshot']['last']['version'] != '20260904182402':
              raise SystemExit('unexpected live predecessor head')

          data['generated_at_utc'] = datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z')
          data['repository_base_head'] = '1f5e112b692aa709d18d1ad4794ac8e8ce9860b9'
          data['pending_forward_migrations'] = [
              {
                  'version': '20260904214500',
                  'name': 'clean_ru4_owner_edit_lock',
                  'file': '20260904214500_clean_ru4_owner_edit_lock.sql',
                  'classification': 'PENDING_FORWARD_MIGRATION',
                  'raw_md5': '10b57d64ab0d58e6e96b7e09cbd3c748',
                  'live_applied': False,
                  'predecessor_live_migration_count': 63,
                  'predecessor_live_head': '20260904182402',
              },
              {
                  'version': '20260904223000',
                  'name': 'clean_ru4_close_remaining_search',
                  'file': '20260904223000_clean_ru4_close_remaining_search.sql',
                  'classification': 'PENDING_FORWARD_MIGRATION',
                  'raw_md5': '4e4e27d9e71be5f51ef5d892884b63a7',
                  'live_applied': False,
                  'predecessor_live_migration_count': 63,
                  'predecessor_live_head': '20260904182402',
              },
              {
                  'version': '20260904230000',
                  'name': 'clean_ru4_ai_edit_conversation',
                  'file': '20260904230000_clean_ru4_ai_edit_conversation.sql',
                  'classification': 'PENDING_FORWARD_MIGRATION',
                  'raw_md5': 'b976f1ccc2c329d7f2fe0bc43ef36606',
                  'live_applied': False,
                  'predecessor_live_migration_count': 63,
                  'predecessor_live_head': '20260904182402',
              },
              {
                  'version': '20260904230500',
                  'name': 'clean_ru4_ai_edit_replay_boundary',
                  'file': '20260904230500_clean_ru4_ai_edit_replay_boundary.sql',
                  'classification': 'PENDING_FORWARD_MIGRATION',
                  'raw_md5': '2a1fdea9f612394709afc44cc6f6b1b9',
                  'live_applied': False,
                  'predecessor_live_migration_count': 63,
                  'predecessor_live_head': '20260904182402',
              },
          ]
          provenance.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Verify clean promotion migration integrity
        run: sh supabase/migrations/check_md5.sh

      - name: Install exact app dependencies
        run: npm ci

      - name: TypeScript contract check
        run: npx tsc --noEmit

      - name: Regression tests
        run: npm test -- --runInBand

      - name: Commit clean payload and remove builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'USKOCI Promotion Builder'
          git config user.email 'noreply@uskoci.local'
          git rm .github/workflows/ru4-clean-promotion-builder.yml
          git add \
            src/data/ru4Production.ts \
            'src/app/(app)/moje-prijave.tsx' \
            'src/app/(app)/potrebe/[id]/pregled.tsx' \
            supabase/migrations/20260904214500_clean_ru4_owner_edit_lock.sql \
            supabase/migrations/20260904223000_clean_ru4_close_remaining_search.sql \
            supabase/migrations/20260904230000_clean_ru4_ai_edit_conversation.sql \
            supabase/migrations/20260904230500_clean_ru4_ai_edit_replay_boundary.sql \
            supabase/migrations/MD5_MANIFEST.txt \
            supabase/migrations/MIGRATION_PROVENANCE.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "10"
          git commit -m 'feat(ru4): assemble proven clean promotion payload'
          git push origin HEAD:work/ru4-clean-promotion-build-20260905
