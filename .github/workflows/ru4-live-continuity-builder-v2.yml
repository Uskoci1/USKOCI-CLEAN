name: RU-4 live continuity builder v2

on:
  push:
    branches:
      - work/ru4-live-continuity-reconcile-v2-20260905
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Materialize proven reconciliation source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin proof/ru4-live-transfer-reconcile-20260905
          git show FETCH_HEAD:supabase/staging/ru4/20260905053000_clean_ru4_ai_edit_conversation_live_transfer_reconcile.sql > supabase/migrations/20260904230200_clean_ru4_ai_edit_conversation_live_transfer_reconcile.sql
          echo '6be6134441a81a4550710969cac89d85  supabase/migrations/20260904230200_clean_ru4_ai_edit_conversation_live_transfer_reconcile.sql' | md5sum -c -

      - name: Build live 68 continuity metadata
        run: python3 scripts/ru4_reconcile_live68.py

      - name: Verify canonical migration integrity
        run: sh supabase/migrations/check_md5.sh

      - name: Install exact app dependencies
        run: npm ci

      - name: TypeScript contract check
        run: npx tsc --noEmit

      - name: Regression tests
        run: npm test -- --runInBand

      - name: Commit reconciled continuity payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'USKOCI Continuity Builder'
          git config user.email 'noreply@uskoci.local'
          git add supabase/migrations/20260904230200_clean_ru4_ai_edit_conversation_live_transfer_reconcile.sql
          git add supabase/migrations/MD5_MANIFEST.txt
          git add supabase/migrations/MIGRATION_PROVENANCE.json
          git add docs/implementation/CURRENT_IMPLEMENTATION_HANDOFF.md
          git add docs/implementation/LIVE_IMPLEMENTATION_NETWORK.md
          git add docs/implementation/IMPLEMENTATION_STATUS_LEDGER.csv
          git add docs/implementation/LIVE_MIGRATION_STATE.json
          git commit -m 'docs(ru4): reconcile canonical continuity to live 68'
          git push origin HEAD:work/ru4-live-continuity-reconcile-v2-20260905
