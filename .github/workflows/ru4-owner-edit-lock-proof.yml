name: RU-4 owner edit lock proof

on:
  push:
    branches:
      - proof/ru4-owner-edit-lock-20260904
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ru4-owner-edit-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ru4-owner-edit-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical migration integrity
        run: sh supabase/migrations/check_md5.sh

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Replay physical live predecessor through RU-3/B07
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/uskoci-ru4-lock
          mkdir -p /tmp/uskoci-ru4-lock
          cd /tmp/uskoci-ru4-lock
          supabase init
          rm -rf supabase/migrations
          mkdir -p supabase/migrations

          cp "$GITHUB_WORKSPACE/supabase/proofs/ru2_predecessor_bootstrap.sql" \
             supabase/migrations/20260825000000_ru4_lock_proof_live_bootstrap.sql

          for f in "$GITHUB_WORKSPACE"/supabase/migrations/*.sql; do
            b="$(basename "$f")"
            case "$b" in
              20260903130355_clean_ru0_authority_closure.sql|20260903165700_clean_ru1_worker_readiness.sql|20260903190000_clean_ru2_need_v2_draft.sql|20260903190100_clean_ru2_ai_fact_transition_guard.sql|20260904090000_clean_ru3_policy_bundle_foundation.sql|20260904103000_clean_ru3_need_publication_decision.sql|20260904111500_clean_ru3_canonical_publish.sql|20260901105922_clean_completion_and_writer_authenticated_proof.sql|20260901113333_clean_ai_interview_turn_authenticated_proof.sql|20260901114029_clean_ai_fact_supersession_and_human_correction.sql)
                ;;
              *) cp "$f" "supabase/migrations/$b" ;;
            esac
          done

          cp "$GITHUB_WORKSPACE/supabase/proofs/ru2_replay_20260901105922_durable_effects.sql" \
             supabase/migrations/20260901105922_clean_completion_and_writer_authenticated_proof.sql
          cp "$GITHUB_WORKSPACE/supabase/proofs/ru2_replay_20260901113333_durable_effects.sql" \
             supabase/migrations/20260901113333_clean_ai_interview_turn_authenticated_proof.sql

          awk '/^-- Runtime proofs: no retained rows\.$/{exit} {print}' \
            "$GITHUB_WORKSPACE/supabase/migrations/20260901114029_clean_ai_fact_supersession_and_human_correction.sql" \
            > supabase/migrations/20260901114029_clean_ai_fact_supersession_and_human_correction.sql
          cat >> supabase/migrations/20260901114029_clean_ai_fact_supersession_and_human_correction.sql <<'SQL'
          comment on function public.rpc_ai_confirm_fact(uuid) is 'AUTHENTICATED_RUNTIME_PROVEN: human confirmation stamps confirmed_at and confirmed_by_user_id.';
          comment on function public.rpc_ai_correct_fact(uuid,text) is 'AUTHENTICATED_RUNTIME_PROVEN: explicit correction atomically supersedes prior live fact and creates CONFIRMED EXPLICIT_USER_ANSWER provenance.';
          comment on function public.rpc_ai_apply_interview_turn_service(uuid,uuid,text,text,text,jsonb) is 'SERVICE_RUNTIME_PROVEN: repeated canonical keys preserve one-live-fact invariant by superseding before insert; replacement proof rolled back with zero residue.';
          SQL

          supabase db start
          supabase db reset --local
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "delete from supabase_migrations.schema_migrations where version='20260825000000';"

          actual="$(psql "$DB_URL" -Atc "select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations;")"
          echo "pre_ru0=$actual"
          test "$actual" = "56/20260901114029"

          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20260903130355_clean_ru0_authority_closure.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name) values ('20260903160812','clean_ru0_authority_closure');"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20260903165700_clean_ru1_worker_readiness.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name) values ('20260903184545','clean_ru1_worker_readiness');"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20260903190000_clean_ru2_need_v2_draft.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name) values ('20260903222139','clean_ru2_need_v2_draft');"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20260903190100_clean_ru2_ai_fact_transition_guard.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name) values ('20260903222333','clean_ru2_ai_fact_transition_guard');"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20260904090000_clean_ru3_policy_bundle_foundation.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name) values ('20260904090147','clean_ru3_policy_bundle_foundation');"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20260904103000_clean_ru3_need_publication_decision.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name) values ('20260904102429','clean_ru3_need_publication_decision');"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20260904111500_clean_ru3_canonical_publish.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations(version,name) values ('20260904182402','clean_ru3_canonical_publish');"

          actual="$(psql "$DB_URL" -Atc "select count(*)::text || '/' || max(version) from supabase_migrations.schema_migrations;")"
          echo "ru4_predecessor=$actual"
          test "$actual" = "63/20260904182402"

      - name: Apply RU-4 owner edit lock candidate
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f "$GITHUB_WORKSPACE/supabase/staging/ru4/20260904214500_clean_ru4_owner_edit_lock.sql"

      - name: Apply RU-4 close remaining search candidate
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f "$GITHUB_WORKSPACE/supabase/staging/ru4/20260904223000_clean_ru4_close_remaining_search.sql"

      - name: Create disposable dispatch proof helper
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create or replace function public._proof_ru4_dispatch_exists(p_need_id uuid)
          returns boolean
          language sql
          security definer
          set search_path to 'pg_catalog'
          as $$
            select exists(select 1 from private.dispatch_schedule where need_id = p_need_id)
          $$;
          revoke all on function public._proof_ru4_dispatch_exists(uuid) from public, anon;
          grant execute on function public._proof_ru4_dispatch_exists(uuid) to authenticated;
          SQL

      - name: Normalize rollback proof fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/proofs/ru4_owner_edit_lock_runtime_proof.sql')
          s = p.read_text()
          replacements = [
              ('  need_id uuid;\n', '  fixture_need_id uuid;\n'),
              ('  ) returning id into need_id;\n', '  ) returning id into fixture_need_id;\n'),
              ('    (need_id,worker_a,', '    (fixture_need_id,worker_a,'),
              ('    (need_id,worker_b,', '    (fixture_need_id,worker_b,'),
              ('    (need_id,worker_c,', '    (fixture_need_id,worker_c,'),
              ('  values(need_id,statement_timestamp())\n', '  values(fixture_need_id,statement_timestamp())\n'),
              ("  perform set_config('uskoci.ru4_need',need_id::text,true);\n", "  perform set_config('uskoci.ru4_need',fixture_need_id::text,true);\n"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'expected proof fixture text missing: {old!r}')
              s = s.replace(old, new, 1)

          stale_anchor = "  if cnt<>3 then raise exception 'RU4_LOCK_PRIOR_APPLICATIONS_NOT_ALL_STALE'; end if;\n"
          dispatch_assert = stale_anchor + "  if public._proof_ru4_dispatch_exists(nid) then\n    raise exception 'RU4_LOCK_OLD_DISPATCH_SCHEDULE_SURVIVED_EDIT';\n  end if;\n"
          if stale_anchor not in s:
              raise SystemExit('dispatch assertion anchor missing')
          s = s.replace(stale_anchor, dispatch_assert, 1)

          late_bad = "  if exists(select 1 from private.dispatch_schedule where need_id=nid and current_setting('uskoci.ru4_requester')<>'' ) then\n    raise exception 'RU4_LOCK_OLD_DISPATCH_SCHEDULE_SURVIVED_EDIT';\n  end if;\n"
          if late_bad not in s:
              raise SystemExit('late dispatch assertion missing')
          s = s.replace(late_bad, '', 1)
          p.write_text(s)
          PY

      - name: Run RU-4 authenticated owner/edit/Application proof
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f "$GITHUB_WORKSPACE/supabase/proofs/ru4_owner_edit_lock_runtime_proof.sql" \
            | tee /tmp/ru4-owner-edit-lock.log
          grep -F "PASS RU4_OWNER_EDIT_LOCK owner_only atomic_confirm rev2_stale_all explicit_keep_update_withdraw same_response_history first_dogovor_permanent_lock no_silent_reconfirm" \
            /tmp/ru4-owner-edit-lock.log

      - name: Verify rollback proof zero residue
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "$DB_URL" -Atc "select count(*) from private.need_edit_commands;")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from private.need_revision_events;")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from private.response_revision_resolution_commands;")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from public.needs where title like 'RU4 %task';")" = "0"
          echo "PASS RU4_OWNER_EDIT_LOCK_ZERO_RESIDUE"

      - name: Run RU-4 close remaining search proof
        shell: bash
        run: |
          set -euo pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f "$GITHUB_WORKSPACE/supabase/proofs/ru4_close_remaining_search_runtime_proof.sql" \
            | tee /tmp/ru4-close-remaining-search.log
          grep -F "PASS RU4_CLOSE_REMAINING_SEARCH owner_only keeps_required_slots_revision_and_dogovor expires_pending stops_dispatch blocks_new_application idempotent" \
            /tmp/ru4-close-remaining-search.log

      - name: Verify remaining-search proof zero residue
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "$DB_URL" -Atc "select count(*) from private.remaining_search_close_commands;")" = "0"
          test "$(psql "$DB_URL" -Atc "select count(*) from public.needs where title='RU4 close task';")" = "0"
          echo "PASS RU4_CLOSE_REMAINING_SEARCH_ZERO_RESIDUE"

      - name: Run RU-4 true concurrency proof
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/supabase/proofs/ru4_owner_edit_lock_concurrency.sh"

      - name: Destroy disposable stack with no backup
        if: always()
        shell: bash
        working-directory: /tmp/uskoci-ru4-lock
        run: |
          supabase stop --no-backup || true

      - name: Install exact app dependencies
        run: npm ci

      - name: TypeScript contract check
        run: npx tsc --noEmit

      - name: Regression tests
        run: npm test -- --runInBand