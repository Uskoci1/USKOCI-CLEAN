name: RU-5 P0C-02 live closure once

on:
  push:
    branches:
      - closure/ru5-p0c02-live-20260905

permissions:
  contents: write

jobs:
  close-live-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close P0C-02 provenance and advance P0C-03 cursor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          canonical_md5 = '1a397f893deb3109b8984035c19111bb'
          live_md5 = 'e573341dad8ed303d4c72f234e11b761'
          source_file = '20260905190000_clean_ru5_atomic_application_submit.sql'
          live_version = '20260905190040'

          # --- MIGRATION_PROVENANCE.json: targeted edits, preserve historical formatting. ---
          path = Path('supabase/migrations/MIGRATION_PROVENANCE.json')
          text = path.read_text(encoding='utf-8')

          old_head = '''    "migration_count": 72,\n    "last": {\n      "name": "clean_ru5_public_profile_projection",\n      "version": "20260905163927"\n    },'''
          new_head = '''    "migration_count": 73,\n    "last": {\n      "name": "clean_ru5_atomic_application_submit",\n      "version": "20260905190040"\n    },'''
          if text.count(old_head) != 1:
              raise SystemExit('provenance live head anchor mismatch')
          text = text.replace(old_head, new_head, 1)

          p0c01_entry = '{"name":"clean_ru5_public_profile_projection","version":"20260905163927","file":"20260905133000_clean_ru5_public_profile_projection.sql","source_version":"20260905133000","exact_byte_mirror":true,"canonical_raw_md5":"6fe4a4f013debb262700fbbe2e76c33e","live_recorded_statement_md5":"6fe4a4f013debb262700fbbe2e76c33e","recorded_statement_utf8_bytes":2458}'
          p0c02_entry = '{"name":"clean_ru5_atomic_application_submit","version":"20260905190040","file":"20260905190000_clean_ru5_atomic_application_submit.sql","source_version":"20260905190000","exact_byte_mirror":false,"canonical_raw_md5":"1a397f893deb3109b8984035c19111bb","canonical_utf8_bytes":18107,"live_recorded_statement_md5":"e573341dad8ed303d4c72f234e11b761","recorded_statement_utf8_bytes":18106,"transport_deviation":"connected migration transport omitted only the terminal LF","normalized_terminal_lf_md5":"1a397f893deb3109b8984035c19111bb","normalized_terminal_lf_bytes":18107}'
          if text.count(p0c01_entry) != 1 or '"version":"20260905190040"' in text:
              raise SystemExit('provenance live entry precondition mismatch')
          text = text.replace(p0c01_entry, p0c01_entry + ',\n      ' + p0c02_entry, 1)

          pending = '''  "pending_forward_migrations": [\n    {\n      "version": "20260905190000",\n      "name": "clean_ru5_atomic_application_submit",\n      "file": "20260905190000_clean_ru5_atomic_application_submit.sql",\n      "raw_md5": "1a397f893deb3109b8984035c19111bb",\n      "classification": "PENDING_FORWARD_MIGRATION",\n      "live_applied": false,\n      "predecessor_live_migration_count": 72,\n      "predecessor_live_head": "20260905163927",\n      "rationale": "RU-5 P0C-02 targeted atomic Application submit hardening: current RU-1 readiness, team/remaining capacity, MY_PRICE equality, private per-version self-declared snapshot and deduplicated RESPONSE_RECEIVED event; existing historical rows preserved; D0140/RU-4B/monetization/calendar/note-policy activation excluded."\n    }\n  ],\n'''
          if text.count(pending) != 1:
              raise SystemExit('P0C02 pending block mismatch')
          text = text.replace(pending, '  "pending_forward_migrations": [],\n', 1)

          old_next = '  "next_allowed_action": "RU-5 / P0C-02 ATOMIC APPLICATION SUBMIT — fresh read-only physical preflight of marketplace_responses, rpc_submit_response, response command ledger, Need eligibility, covered_slots/team_capacity semantics and W05/R05/R06 consumers; proof branch before any live write.",'
          new_next = '  "next_allowed_action": "RU-5 / P0C-03 MY APPLICATIONS PROJECTION + WITHDRAW PORT — fresh read-only physical preflight of own Application projection, rpc_withdraw_response, response/version lifecycle, RLS/idempotency and W06 consumer; proof branch before any live write.",'
          if text.count(old_next) != 1:
              raise SystemExit('provenance next cursor mismatch')
          text = text.replace(old_next, new_next, 1)

          close_anchor = '''  },\n  "ru4b": {'''
          start = text.index('  "ru5_p0c01_live_reconciliation": {')
          pos = text.find(close_anchor, start)
          if pos < 0 or '"ru5_p0c02_live_reconciliation"' in text:
              raise SystemExit('P0C01 reconciliation close anchor mismatch')
          p0c02_recon = '''  },\n  "ru5_p0c02_live_reconciliation": {\n    "status": "CLOSED_LIVE",\n    "proof_sha": "2d6b1a64d9760bddcca1e4751945fdccc8a5e6ba",\n    "canonical_promotion_sha": "bc784f3ed65d3a053195789740fae17e4df235d3",\n    "source_version": "20260905190000",\n    "source_file": "20260905190000_clean_ru5_atomic_application_submit.sql",\n    "live_version": "20260905190040",\n    "live_name": "clean_ru5_atomic_application_submit",\n    "exact_byte_identity": false,\n    "canonical_raw_md5": "1a397f893deb3109b8984035c19111bb",\n    "canonical_utf8_bytes": 18107,\n    "live_recorded_statement_md5": "e573341dad8ed303d4c72f234e11b761",\n    "recorded_statement_utf8_bytes": 18106,\n    "transport_deviation": "terminal LF omitted only",\n    "normalized_terminal_lf_md5": "1a397f893deb3109b8984035c19111bb",\n    "proof_run": 33982216558,\n    "pr_pre_p4_run": 33982373215,\n    "pr_codeql_run": 33982372198,\n    "canonical_pre_p4_run": 33985675818,\n    "canonical_codeql_run": 33985675330,\n    "post_live": {"needs":6,"marketplace_responses":4,"agreements":2,"app_profiles":6,"application_snapshot_rows":0,"publication_policy_bundles":0,"publication_policy_rule_refs":0,"need_publication_decisions":0,"preselection_questions":0,"preselection_answer_versions":0,"preselection_policy_decisions":0,"preselection_materiality_decisions":0,"preselection_commands":0},\n    "d0140_production_publish": "FAIL_CLOSED",\n    "ru4b_public_qa": "ACTIVATION_BLOCKED",\n    "monetization": "FREE_0_RSD",\n    "explicit_non_claims": ["bounded_note_policy","calendar_hard_conflict_authority","historical_snapshot_backfill","application_ai"]\n  },\n  "ru4b": {'''
          text = text[:pos] + p0c02_recon + text[pos + len(close_anchor):]
          json.loads(text)
          path.write_text(text, encoding='utf-8', newline='\n')

          # --- LIVE_MIGRATION_STATE.json: targeted live cursor update. ---
          path = Path('docs/implementation/LIVE_MIGRATION_STATE.json')
          live = path.read_text(encoding='utf-8')
          pairs = [
            ('"migration_count": 72', '"migration_count": 73'),
            ('"head": "20260905163927_clean_ru5_public_profile_projection"', '"head": "20260905190040_clean_ru5_atomic_application_submit"'),
            ('"state": "NORMALIZED_TO_LIVE_72_RU5_P0C01"', '"state": "NORMALIZED_TO_LIVE_73_RU5_P0C02"'),
            ('"next_cursor": "RU5_P0C02_ATOMIC_APPLICATION_SUBMIT_PREFLIGHT"', '"next_cursor": "RU5_P0C03_MY_APPLICATIONS_PREFLIGHT"'),
            ('"RU-5":"IN_PROGRESS_P0C01_CLOSED_LIVE_P0C02_NEXT"', '"RU-5":"IN_PROGRESS_P0C01_P0C02_CLOSED_LIVE_P0C03_NEXT"'),
            ('"next_allowed_action":"RU-5/P0C-02 atomic Application submit: fresh read-only physical preflight of current podnesiPrijavu/rpc_submit_response, response schema/RLS/idempotency and W05 consumer; proof branch before any new live write."', '"next_allowed_action":"RU-5/P0C-03 My Applications projection + withdraw port: fresh read-only physical preflight of own Application projection, rpc_withdraw_response, response/version lifecycle, RLS/idempotency and W06 consumer; proof branch before any new live write."')
          ]
          for old, new in pairs:
              if live.count(old) != 1:
                  raise SystemExit(f'LIVE state anchor mismatch: {old}')
              live = live.replace(old, new, 1)

          alias_anchor = '''      "canonical_codeql_run":33978450975\n    }'''
          alias_insert = '''      "canonical_codeql_run":33978450975\n    },\n    "ru5_p0c02_live_alias": {\n      "name":"clean_ru5_atomic_application_submit",\n      "live_version":"20260905190040",\n      "source_version":"20260905190000",\n      "source_file":"20260905190000_clean_ru5_atomic_application_submit.sql",\n      "exact_byte_identity":false,\n      "canonical_raw_md5":"1a397f893deb3109b8984035c19111bb",\n      "canonical_utf8_bytes":18107,\n      "recorded_statement_md5":"e573341dad8ed303d4c72f234e11b761",\n      "recorded_statement_utf8_bytes":18106,\n      "transport_deviation":"terminal LF omitted only",\n      "normalized_terminal_lf_md5":"1a397f893deb3109b8984035c19111bb",\n      "canonical_promotion_sha":"bc784f3ed65d3a053195789740fae17e4df235d3",\n      "proof_run":33982216558,\n      "canonical_pre_p4_run":33985675818,\n      "canonical_codeql_run":33985675330\n    }'''
          if live.count(alias_anchor) != 1 or '"ru5_p0c02_live_alias"' in live:
              raise SystemExit('LIVE P0C02 alias precondition mismatch')
          live = live.replace(alias_anchor, alias_insert, 1)

          ru5_anchor = '''      "next":"P0C-02_ATOMIC_APPLICATION_SUBMIT"\n    }\n  },'''
          ru5_insert = '''      "next":"P0C-02_CLOSED_LIVE"\n    },\n    "p0c02": {\n      "status":"CLOSED_LIVE",\n      "contract":"ATOMIC_APPLICATION_SUBMIT",\n      "canonical_sha":"bc784f3ed65d3a053195789740fae17e4df235d3",\n      "live_migration":"20260905190040_clean_ru5_atomic_application_submit",\n      "historical_snapshot_backfill":false,\n      "next":"P0C-03_MY_APPLICATIONS_PROJECTION_WITHDRAW"\n    },\n    "p0c03": {\n      "status":"NEXT_READ_ONLY_PREFLIGHT",\n      "contract":"MY_APPLICATIONS_PROJECTION_AND_WITHDRAW_PORT"\n    }\n  },'''
          if live.count(ru5_anchor) != 1:
              raise SystemExit('LIVE RU5 object anchor mismatch')
          live = live.replace(ru5_anchor, ru5_insert, 1)
          json.loads(live)
          path.write_text(live, encoding='utf-8', newline='\n')

          # --- IMPLEMENTATION_STATUS_LEDGER.csv: close P0C02 and add P0C03 cursor. ---
          path = Path('docs/implementation/IMPLEMENTATION_STATUS_LEDGER.csv')
          ledger = path.read_text(encoding='utf-8')
          old_line = 'RU-5_P0C02_ATOMIC_APPLICATION_SUBMIT,NEXT_READ_ONLY_PREFLIGHT,2459867beb3f0899b3efd06d6467694b6d89ed8f,NONE,rpc_submit_response + response submit command authority to be physically reconciled,W05/R05/R06 + Opportunity/Application consumers,read-only preflight required before proof branch,NOT_STARTED,NO,must prove covered_slots/team_capacity + replay + Need/Worker eligibility + direct INSERT denial,READ_ONLY_PREFLIGHT_ONLY\n'
          new_lines = 'RU-5_P0C02_ATOMIC_APPLICATION_SUBMIT,CLOSED_LIVE,proof=2d6b1a64d9760bddcca1e4751945fdccc8a5e6ba;canonical=bc784f3ed65d3a053195789740fae17e4df235d3,source=20260905190000_clean_ru5_atomic_application_submit;live=20260905190040_clean_ru5_atomic_application_submit,rpc_submit_response + private.response_submit_commands + private.response_application_snapshots,W05 Application submit consumer,proof=33982216558;pr_pre_p4=33982373215;pr_codeql=33982372198;canonical_pre_p4=33985675818;canonical_codeql=33985675330;live structural postflight + terminal-LF-normalized checksum proof,DISPOSABLE_RUNTIME_PROVEN+ZERO_RESIDUE_PROVEN+LIVE_STRUCTURAL_PROVEN+RN_ALIGNED+PROVENANCE_RECONCILED,YES,bounded-note policy and hard calendar-conflict authority remain separate unresolved work,RU5_P0C03_MY_APPLICATIONS_PREFLIGHT\nRU-5_P0C03_MY_APPLICATIONS_PROJECTION_WITHDRAW_PORT,NEXT_READ_ONLY_PREFLIGHT,bc784f3ed65d3a053195789740fae17e4df235d3,NONE,own Applications projection + existing rpc_withdraw_response,W06 moje-prijave + data port/projection,fresh physical preflight required before proof branch,NOT_STARTED,NO,must prove own-only projection + canonical lifecycle mapping + selected withdraw denial + semantic replay,READ_ONLY_PREFLIGHT_ONLY\n'
          if ledger.count(old_line) != 1:
              raise SystemExit('ledger P0C02 row mismatch')
          ledger = ledger.replace(old_line, new_lines, 1)
          path.write_text(ledger, encoding='utf-8', newline='\n')
          PY

      - name: Verify closure integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool supabase/migrations/MIGRATION_PROVENANCE.json >/dev/null
          python3 -m json.tool docs/implementation/LIVE_MIGRATION_STATE.json >/dev/null
          sh supabase/migrations/check_md5.sh
          git diff --check
          grep -F '"version":"20260905190040"' supabase/migrations/MIGRATION_PROVENANCE.json
          grep -F '"pending_forward_migrations": []' supabase/migrations/MIGRATION_PROVENANCE.json
          grep -F 'RU-5_P0C02_ATOMIC_APPLICATION_SUBMIT,CLOSED_LIVE' docs/implementation/IMPLEMENTATION_STATUS_LEDGER.csv
          grep -F 'RU-5_P0C03_MY_APPLICATIONS_PROJECTION_WITHDRAW_PORT,NEXT_READ_ONLY_PREFLIGHT' docs/implementation/IMPLEMENTATION_STATUS_LEDGER.csv

      - name: Commit live closure metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/MIGRATION_PROVENANCE.json docs/implementation/LIVE_MIGRATION_STATE.json docs/implementation/IMPLEMENTATION_STATUS_LEDGER.csv
          git commit -m 'docs(ru5): close p0c02 live provenance'
          git push origin HEAD:closure/ru5-p0c02-live-20260905
