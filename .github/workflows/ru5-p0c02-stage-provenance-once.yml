name: RU-5 P0C-02 stage provenance once

on:
  push:
    branches:
      - proof/ru5-p0c02-atomic-application-20260905

permissions:
  contents: write

jobs:
  stage-provenance:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add exact P0C-02 manifest and pending provenance entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          md5 = '1a397f893deb3109b8984035c19111bb'
          filename = '20260905190000_clean_ru5_atomic_application_submit.sql'

          manifest = Path('supabase/migrations/MD5_MANIFEST.txt')
          text = manifest.read_text(encoding='utf-8')
          line = f'{md5}  {filename}\n'
          if filename in text:
              raise SystemExit('P0C02 manifest entry already exists')
          manifest.write_text(text + line, encoding='utf-8', newline='\n')

          provenance = Path('supabase/migrations/MIGRATION_PROVENANCE.json')
          p = provenance.read_text(encoding='utf-8')
          needle = '  "pending_forward_migrations": [],\n'
          if p.count(needle) != 1:
              raise SystemExit(f'Expected exactly one empty pending list, found {p.count(needle)}')
          replacement = '''  "pending_forward_migrations": [\n    {\n      "version": "20260905190000",\n      "name": "clean_ru5_atomic_application_submit",\n      "file": "20260905190000_clean_ru5_atomic_application_submit.sql",\n      "raw_md5": "1a397f893deb3109b8984035c19111bb",\n      "classification": "PENDING_FORWARD_MIGRATION",\n      "live_applied": false,\n      "predecessor_live_migration_count": 72,\n      "predecessor_live_head": "20260905163927",\n      "rationale": "RU-5 P0C-02 targeted atomic Application submit hardening: current RU-1 readiness, team/remaining capacity, MY_PRICE equality, private per-version self-declared snapshot and deduplicated RESPONSE_RECEIVED event; existing historical rows preserved; D0140/RU-4B/monetization/calendar/note-policy activation excluded."\n    }\n  ],\n'''
          provenance.write_text(p.replace(needle, replacement), encoding='utf-8', newline='\n')
          PY

      - name: Verify migration bytes and provenance before commit
        run: |
          set -euo pipefail
          sh supabase/migrations/check_md5.sh
          git diff --check
          git diff -- supabase/migrations/MD5_MANIFEST.txt supabase/migrations/MIGRATION_PROVENANCE.json

      - name: Commit exact metadata closure on proof branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/MD5_MANIFEST.txt supabase/migrations/MIGRATION_PROVENANCE.json
          git commit -m 'chore(ru5): register p0c02 pending migration'
          git push origin HEAD:proof/ru5-p0c02-atomic-application-20260905
