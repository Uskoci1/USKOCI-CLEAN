        run: |
          set -euo pipefail
          npm ci
          npx tsc --noEmit
          git diff --check

      - name: Commit client wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contracts/projections.ts src/data/ports.ts src/data/supabaseIzvor.ts src/data/index.ts src/data/lazniIzvor.ts 'src/app/(app)/moje-prijave.tsx'
          git commit -m 'feat(ru5): wire P0C03 My Applications client'
          git push origin HEAD:proof/ru5-p0c03-my-applications-20260905
