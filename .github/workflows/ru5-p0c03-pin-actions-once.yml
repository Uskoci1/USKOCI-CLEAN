name: RU-5 P0C-03 pin proof actions once

on:
  push:
    branches:
      - proof/ru5-p0c03-my-applications-20260905

permissions:
  contents: write

jobs:
  pin-proof-actions:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Pin every Action used by P0C-03 proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ru5-p0c03-my-applications-proof.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
            'actions/checkout@v4': 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4',
            'supabase/setup-cli@v1': 'supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1',
            'actions/setup-node@v4': 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4',
            'actions/upload-artifact@v4': 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Verify immutable pins
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/ru5-p0c03-my-applications-proof.yml
          ! grep -Eq 'uses: .+@(v[0-9]+|main|master)$' "$file"
          grep -F 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262' "$file"
          grep -F 'supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1' "$file"
          grep -F 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020' "$file"
          grep -F 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' "$file"
          git diff --check

      - name: Commit immutable action pins
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ru5-p0c03-my-applications-proof.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore(ru5): pin P0C03 proof actions by SHA'
          git push origin HEAD:proof/ru5-p0c03-my-applications-20260905
