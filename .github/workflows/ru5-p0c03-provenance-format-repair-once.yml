name: RU-5 P0C-03 provenance format repair once

on:
  push:
    branches:
      - proof/ru5-p0c03-my-applications-20260905

permissions:
  contents: write

jobs:
  repair-targeted-provenance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore canonical formatting and add only P0C-03 pending block
        shell: bash
        run: |
          set -euo pipefail
          git show 6a81e2c1449e95a020813ef29e334cc6688de4f0:supabase/migrations/MIGRATION_PROVENANCE.json > /tmp/provenance-base.json
          cp /tmp/provenance-base.json supabase/migrations/MIGRATION_PROVENANCE.json
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path('supabase/migrations/MIGRATION_PROVENANCE.json')
          text = path.read_text(encoding='utf-8')
          anchor = '  "pending_forward_migrations": [],\n'
          replacement = '''  "pending_forward_migrations": [\n    {\n      "version": "20260905211500",\n      "name": "clean_ru5_my_applications_projection",\n      "file": "20260905211500_clean_ru5_my_applications_projection.sql",\n      "raw_md5": "868ef30987d3a62b84b41e93efeed047",\n      "canonical_utf8_bytes": 6353,\n      "classification": "PENDING_FORWARD_MIGRATION",\n      "live_applied": false,\n      "predecessor_live_migration_count": 73,\n      "predecessor_live_head": "20260905190040",\n      "rationale": "RU-5 P0C-03 own-Worker My Applications projection and client withdraw binding. Projection is read-only, maps canonical Worker-facing lifecycle states, returns selected Agreement link, preserves existing rpc_withdraw_response authority and leaves RU-4 stale resolution separate. No response row rewrite, D0140/RU-4B/monetization/calendar/note-policy activation."\n    }\n  ],\n'''
          if text.count(anchor) != 1:
              raise SystemExit('pending anchor mismatch')
          text = text.replace(anchor, replacement, 1)
          json.loads(text)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Verify targeted provenance diff
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool supabase/migrations/MIGRATION_PROVENANCE.json >/dev/null
          sh supabase/migrations/check_md5.sh
          git diff --check
          additions="$(git diff --numstat 6a81e2c1449e95a020813ef29e334cc6688de4f0 -- supabase/migrations/MIGRATION_PROVENANCE.json | awk '{print $1}')"
          deletions="$(git diff --numstat 6a81e2c1449e95a020813ef29e334cc6688de4f0 -- supabase/migrations/MIGRATION_PROVENANCE.json | awk '{print $2}')"
          echo "provenance_diff=${additions}/${deletions}"
          test "$additions" -le 16
          test "$deletions" -le 1
          grep -F '"name": "clean_ru5_my_applications_projection"' supabase/migrations/MIGRATION_PROVENANCE.json
          grep -F '"live_applied": false' supabase/migrations/MIGRATION_PROVENANCE.json

      - name: Commit targeted repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/MIGRATION_PROVENANCE.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(ru5): keep P0C03 provenance diff targeted'
          git push origin HEAD:proof/ru5-p0c03-my-applications-20260905
