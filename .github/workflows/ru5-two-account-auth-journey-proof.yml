name: RU-5 two-account authenticated journey proof

on:
  push:
    branches:
      - proof/ru5-two-account-auth-journey-20260906
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ru5-two-account-auth-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Verify migration bytes and provenance integrity
        run: sh supabase/migrations/check_md5.sh

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run live-79 two-account authenticated journey
        run: bash supabase/proofs/ru5_two_account_auth_journey_ci.sh

      - name: TypeScript contract check
        run: npx tsc --noEmit

      - name: Regression tests
        run: npm test -- --runInBand
