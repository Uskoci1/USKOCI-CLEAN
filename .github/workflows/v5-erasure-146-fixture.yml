name: V5 erasure146 canonical supersession fixture
on:
  push:
    branches: [work/pre-v3-proof-runner-20260911]
    paths: ['.github/workflows/v5-erasure-146-fixture.yml']
permissions:
  contents: write
concurrency:
  group: v5-erasure146-canonical-fixture
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/pre-v3-engine-integration-20260911
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Guard V5 head and repair disposable fact graph without weakening production guard
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ef02449e2d11f48b959c6b113a1f8ade0465c392"
          python3 - <<'PY'
          from pathlib import Path
          fixture=Path('supabase/proofs/pre_v3/v5_erasure_content_fixtures.mjs')
          s=fixture.read_text(encoding='utf-8')
          old="const needId=randomUUID(),reviewIds=[],workerReview=randomUUID(),factIds=Array.from({length:205},()=>randomUUID());"
          new="const needId=randomUUID(),reviewIds=[],workerReview=randomUUID(),factIds=Array.from({length:205},()=>randomUUID());\n const liveFactId=factIds[0],supersededFactIds=factIds.slice(1);"
          if s.count(old)!=1: raise SystemExit(f'fact id guard={s.count(old)}')
          s=s.replace(old,new)
          old=""" // Reversed insertion order makes a referenced target precede its referrer by
 // physical ctid. The chain spans >2 batches, not just an implementation mirror.
 sql(`insert into public.ai_structured_facts(id,account_id,conversation_id,fact_key,fact_value,status,source,scope,display_value,evidence_excerpt,superseded_at,fact_schema_version)
  values ${factIds.map(id=>`(${q(id)},${q(a.id)},${q(cid)},'need.title',to_jsonb(${q(canary)}::text),'INFERRED','AI_INFERENCE','NEED_DRAFT',${q(canary)},${q(canary)},clock_timestamp(),'NEED_FACT_V2')`).join(',')};
  update public.ai_structured_facts f set superseded_by=x.target from (values ${factIds.slice(1).map((id,i)=>`(${q(id)}::uuid,${q(factIds[i])}::uuid)`).join(',')}) x(id,target) where f.id=x.id;
  insert into private.ai_need_turn_commands(account_id,conversation_id,client_request_id,request_hash,state,receipt)
"""
          new=""" // One canonical live replacement precedes 204 superseded referrers by physical
 // ctid. The reference set spans >2 executor batches while every link remains
 // valid under the production supersession guard: superseded_by targets must be live.
 sql(`insert into public.ai_structured_facts(id,account_id,conversation_id,fact_key,fact_value,status,source,scope,display_value,evidence_excerpt,superseded_at,fact_schema_version)
  values (${q(liveFactId)},${q(a.id)},${q(cid)},'need.title',to_jsonb(${q(canary)}::text),'INFERRED','AI_INFERENCE','NEED_DRAFT',${q(canary)},${q(canary)},null,'NEED_FACT_V2'),
  ${supersededFactIds.map(id=>`(${q(id)},${q(a.id)},${q(cid)},'need.title',to_jsonb(${q(canary)}::text),'INFERRED','AI_INFERENCE','NEED_DRAFT',${q(canary)},${q(canary)},clock_timestamp(),'NEED_FACT_V2')`).join(',')};
  update public.ai_structured_facts f set superseded_by=${q(liveFactId)}::uuid where f.id in (${supersededFactIds.map(id=>`${q(id)}::uuid`).join(',')});
  insert into private.ai_need_turn_commands(account_id,conversation_id,client_request_id,request_hash,state,receipt)
"""
          if s.count(old)!=1: raise SystemExit(f'fact graph guard={s.count(old)}')
          fixture.write_text(s.replace(old,new),encoding='utf-8',newline='\n')

          test=Path('supabase/proofs/pre_v3/v5_account_erasure.test.mjs')
          t=test.read_text(encoding='utf-8')
          old="assert.ok(fixtures.includes('length:205'));assert.ok(fixtures.includes('active_export_attempt_id'));"
          new="assert.ok(fixtures.includes('length:205'));assert.ok(fixtures.includes('liveFactId=factIds[0],supersededFactIds=factIds.slice(1)'));\n assert.ok(fixtures.includes('set superseded_by=${q(liveFactId)}::uuid'));assert.ok(fixtures.includes('active_export_attempt_id'));"
          if t.count(old)!=1: raise SystemExit(f'static fixture guard={t.count(old)}')
          test.write_text(t.replace(old,new),encoding='utf-8',newline='\n')
          PY
          npm ci >/dev/null
          node --check supabase/proofs/pre_v3/v5_erasure_content_fixtures.mjs
          node --check supabase/proofs/pre_v3/v5_account_erasure_proof.mjs
          node --test supabase/proofs/pre_v3/v5_account_erasure.test.mjs
          npx --no-install tsc --noEmit
          git diff --check
          git diff -- supabase/proofs/pre_v3/v5_erasure_content_fixtures.mjs supabase/proofs/pre_v3/v5_account_erasure.test.mjs
      - name: Commit verified 146 fixture repair to integration branch
        run: |
          set -euo pipefail
          git config user.name 'USKOCI integration bot'
          git config user.email 'integration-bot@users.noreply.github.com'
          git add -- supabase/proofs/pre_v3/v5_erasure_content_fixtures.mjs supabase/proofs/pre_v3/v5_account_erasure.test.mjs
          git commit -m 'test(v5): use canonical live target in erasure fact graph'
          git push origin HEAD:work/pre-v3-engine-integration-20260911
