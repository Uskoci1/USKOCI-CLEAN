name: V5 discovery owned-scope intent switch
on:
  push:
    branches: [work/pre-v3-proof-runner-20260911]
    paths: ['.github/workflows/v5-map-new-task.yml']
permissions:
  contents: write
concurrency:
  group: v5-discovery-owned-scope-intent
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/pre-v3-engine-integration-20260911
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Guard exact V5 head and switch Worker to requester before owned tasks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "91a1e0d7b0949114eecd4db6dcf2a6357d62469c"
          python3 - <<'PY'
          from pathlib import Path
          route=Path('src/app/(app)/prilike.tsx')
          s=route.read_text(encoding='utf-8')
          old="""    onSwitch={() => navigate(() => router.navigate('/potrebe'))} onProfile={() => navigate(() => router.navigate('/profil'))}\n    onNew={() => navigate(() => {"""
          new="""    onSwitch={() => navigate(() => {\n      if (intent === 'narucilac') router.navigate('/potrebe');\n      else { postaviUlogu('narucilac'); router.replace('/potrebe'); }\n    })} onProfile={() => navigate(() => router.navigate('/profil'))}\n    onNew={() => navigate(() => {"""
          if s.count(old)!=1: raise SystemExit(f'owned-scope switch guard={s.count(old)}')
          route.write_text(s.replace(old,new),encoding='utf-8',newline='\n')

          test=Path('src/data/__tests__/marketplace-intent-entry.test.ts')
          t=test.read_text(encoding='utf-8')
          old="""  expect(source).toContain(\"onNew={() => navigate(() => {\");\n  expect(source).toContain(\"if (intent === 'narucilac') router.navigate('/nova');\");"""
          new="""  expect(source).toContain(\"onSwitch={() => navigate(() => {\");\n  expect(source).toContain(\"if (intent === 'narucilac') router.navigate('/potrebe');\");\n  expect(source).toContain(\"else { postaviUlogu('narucilac'); router.replace('/potrebe'); }\");\n  expect(source).toContain(\"onNew={() => navigate(() => {\");\n  expect(source).toContain(\"if (intent === 'narucilac') router.navigate('/nova');\");"""
          if t.count(old)!=1: raise SystemExit(f'intent-entry assertion guard={t.count(old)}')
          test.write_text(t.replace(old,new),encoding='utf-8',newline='\n')
          PY
          npm ci >/dev/null
          npx --no-install tsc --noEmit
          npx --no-install jest --runInBand --runTestsByPath src/data/__tests__/marketplace-intent-entry.test.ts src/data/__tests__/marketplace-presentation.test.tsx
          git diff --check
          git diff -- src/app/'(app)'/prilike.tsx src/data/__tests__/marketplace-intent-entry.test.ts
      - name: Commit verified discovery intent alignment
        run: |
          set -euo pipefail
          git config user.name 'USKOCI integration bot'
          git config user.email 'integration-bot@users.noreply.github.com'
          git add -- src/app/'(app)'/prilike.tsx src/data/__tests__/marketplace-intent-entry.test.ts
          git commit -m 'fix(v5): align discovery owned scope with requester intent'
          git push origin HEAD:work/pre-v3-engine-integration-20260911
