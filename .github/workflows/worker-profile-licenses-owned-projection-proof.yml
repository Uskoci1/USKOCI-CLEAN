name: P5 owned worker licenses disposable proof
# Isolated SQL-role proof only. No caller inputs, DEV, certificate rebind or providers.
# Narrow branch/path registration also permits manual dispatch on this feature branch.
on:
  push:
    branches: [work/uskoci-ui-unification-20260924]
    paths:
      - '.github/workflows/worker-profile-licenses-owned-projection-proof.yml'
      - 'supabase/candidates/worker_profile_licenses_owned_projection.sql'
      - 'supabase/proofs/worker_profile_licenses_owned_projection_proof.sql'
      - 'supabase/proofs/worker_profile_licenses_owned_projection_proof.mjs'
      - 'docs/implementation/product-v1-closure-20260926/finalization-20260927/worker_profile_licenses_owned_projection_report.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-profile-licenses-owned-projection-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disposable-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PRE_V3_ARTIFACT_DIR: /tmp/worker-profile-licenses-private
      WORKER_PROFILE_LICENSES_ARTIFACT_DIR: /tmp/worker-profile-licenses-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.116.0
          github-token: ${{ github.token }}
      - name: Bind exact source and install locked existing dependencies
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$WORKER_PROFILE_LICENSES_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git rev-parse HEAD 'HEAD^{tree}' > "$WORKER_PROFILE_LICENSES_ARTIFACT_DIR/source-binding.txt"
          git ls-files -z supabase/migrations supabase/operations/dev-alpha/ledger supabase/candidates supabase/proofs docs/implementation/v5-ai-first .github/workflows/chat-b3-history-proof.yml .github/workflows/worker-profile-licenses-owned-projection-proof.yml package.json package-lock.json | xargs -0 sha256sum | sha256sum > "$WORKER_PROFILE_LICENSES_ARTIFACT_DIR/source-manifest-sha256.txt"
          dependency_exit=0
          npm ci --include=dev > "$PRE_V3_ARTIFACT_DIR/01-dependencies.log" 2>&1 || dependency_exit=$?
          printf '01-dependencies exit=%s\n' "$dependency_exit" | tee "$WORKER_PROFILE_LICENSES_ARTIFACT_DIR/stages.txt"
          test "$dependency_exit" -eq 0
          git diff --exit-code
      - name: Reconstruct the existing disposable historical live79
        run: |
          set -euo pipefail
          umask 077
          # Setup can print local keys. Raw output and predecessor reports stay
          # outside the uploaded directory; only fixed stage summaries are public.
          setup_exit=0
          bash supabase/proofs/ru5_device_ui_live79_env.sh > "$PRE_V3_ARTIFACT_DIR/02-live79.log" 2>&1 || setup_exit=$?
          printf '02-live79 exit=%s\n' "$setup_exit" | tee -a "$WORKER_PROFILE_LICENSES_ARTIFACT_DIR/stages.txt"
          exit "$setup_exit"
      - name: Guard loopback targets and replay unchanged B3 predecessor stages
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module - <<'NODE'
          import {assertLocalDeviceProofTargets} from './supabase/proofs/ru5_device_ui_local_guard.mjs';
          try {
            assertLocalDeviceProofTargets(process.env.RU5_DEVICE_SUPABASE_URL, process.env.RU5_DEVICE_DB_URL);
            if (process.env.DB_URL !== process.env.RU5_DEVICE_DB_URL) throw new Error();
          } catch { console.error('FAIL WORKER_PROFILE_LICENSES_LOCAL_TARGET_ADMISSION'); process.exit(1); }
          NODE
          run_stage() {
            local stage="$1" status=0
            shift
            printf '%s START\n' "$stage" | tee -a "$WORKER_PROFILE_LICENSES_ARTIFACT_DIR/stages.txt"
            "$@" > "$PRE_V3_ARTIFACT_DIR/$stage.log" 2>&1 || status=$?
            printf '%s exit=%s\n' "$stage" "$status" | tee -a "$WORKER_PROFILE_LICENSES_ARTIFACT_DIR/stages.txt"
            return "$status"
          }
          # Exact stage order from chat-b3-history-proof.yml. PKG-051/P0 excluded.
          run_stage 03-source147 python3 supabase/proofs/pkg023j/replay_source147.py
          run_stage 04-dev-alpha-to-pkg026 node supabase/proofs/pkg027/pkg027_proof.mjs replay
          run_stage 05-pkg027 node supabase/proofs/pkg028/pkg028_proof.mjs replay
          run_stage 06-pkg028 node supabase/proofs/pkg029/pkg029_proof.mjs replay
          run_stage 07-pkg029 node supabase/proofs/pkg030/pkg030_proof.mjs replay
          run_stage 08-pkg030 node supabase/proofs/pkg031/pkg031_proof.mjs replay
          run_stage 09-pkg031 node supabase/proofs/pkg032/pkg032_proof.mjs replay
          run_stage 10-pkg032 node supabase/proofs/pkg033/pkg033_proof.mjs replay
          run_stage 11-pkg033 node supabase/proofs/pkg034/pkg034_proof.mjs replay
          run_stage 12-pkg034 node supabase/proofs/pkg035/pkg035_proof.mjs replay
          run_stage 13-pkg035 node supabase/proofs/pkg037/pkg037_proof.mjs replay
          run_stage 14-pkg037 node supabase/proofs/pkg038/pkg038_proof.mjs replay
          run_stage 15-pkg038 node supabase/proofs/pkg039/pkg039_proof.mjs replay
          run_stage 16-pkg039 node supabase/proofs/pkg040/pkg040_proof.mjs replay
          run_stage 17-pkg040 node supabase/proofs/pkg042/pkg042_proof.mjs replay
          run_stage 18-pkg042-to-pkg050 node supabase/proofs/pkg050/pkg050_proof.mjs
          run_stage 19-a1-preparation node supabase/proofs/chat/prepare_notification_a1.mjs
          run_stage 20-b3a node supabase/proofs/chat/private_history_read_proof.mjs
          run_stage 21-b3b node supabase/proofs/chat/message_window_proof.mjs
      - name: Prove the owned self-declared licenses projection and rollback
        run: |
          set -euo pipefail
          umask 077
          proof_exit=0
          timeout --signal=TERM --kill-after=10s 300s node supabase/proofs/worker_profile_licenses_owned_projection_proof.mjs > "$PRE_V3_ARTIFACT_DIR/22-worker-profile-licenses.log" 2>&1 || proof_exit=$?
          printf '22-worker-profile-licenses exit=%s\n' "$proof_exit" | tee -a "$WORKER_PROFILE_LICENSES_ARTIFACT_DIR/stages.txt"
          exit "$proof_exit"
      - name: Admit only exact local SQL-role projection evidence
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          try {
            const report=JSON.parse(readFileSync(process.env.WORKER_PROFILE_LICENSES_ARTIFACT_DIR+'/worker-profile-licenses-report.json','utf8'));
            assert.equal(report.result,'PASS'); assert.equal(report.sourceSha,process.env.GITHUB_SHA);
            for (const key of ['actualDatabase','sqlAuthenticatedRoles','catalogRestored','fixtureDataRestored','disposableOnly']) assert.equal(report[key],true);
            for (const key of ['actualAuth','liveAccess','clientWired','deploymentReady','certificateMoved']) assert.equal(report[key],false);
            assert.equal(report.providerCalls,0); assert.equal(report.storageCalls,0);
            assert.equal(report.catalogBeforeSha256,report.catalogAfterSha256);
            assert.equal(report.checks.length,7);
            assert.equal(new Set(report.checks.map(check=>check.name)).size,7);
            assert.ok(report.checks.every(check=>check.result==='PASS'));
            assert.equal(Object.keys(report.sourceArtifactHashes).length,7);
            assert.ok(Object.values(report.sourceArtifactHashes).every(hash=>/^[a-f0-9]{64}$/.test(hash)));
            console.log('PASS WORKER_PROFILE_LICENSES_SQL_ROLE_PROJECTION_ONLY');
          } catch { console.error('FAIL WORKER_PROFILE_LICENSES_RESULT_ADMISSION'); process.exit(1); }
          NODE
      - name: Always discard the disposable database
        if: always()
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$PRE_V3_ARTIFACT_DIR" "$WORKER_PROFILE_LICENSES_ARTIFACT_DIR"
          teardown_exit=0
          if [[ -d /tmp/uskoci-ru5-device-ui ]]; then
            cd /tmp/uskoci-ru5-device-ui
            supabase stop --no-backup > "$PRE_V3_ARTIFACT_DIR/teardown.log" 2>&1 || teardown_exit=$?
          fi
          printf 'teardown exit=%s\n' "$teardown_exit" | tee -a "$WORKER_PROFILE_LICENSES_ARTIFACT_DIR/stages.txt"
          exit "$teardown_exit"
      - name: Upload only bounded source and result summaries including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-profile-licenses-${{ github.sha }}-${{ github.run_id }}
          path: |
            /tmp/worker-profile-licenses-artifacts/source-binding.txt
            /tmp/worker-profile-licenses-artifacts/source-manifest-sha256.txt
            /tmp/worker-profile-licenses-artifacts/stages.txt
            /tmp/worker-profile-licenses-artifacts/worker-profile-licenses-report.json
          if-no-files-found: error
          retention-days: 30
