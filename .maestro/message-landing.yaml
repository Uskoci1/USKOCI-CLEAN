# F14: a notification about a message opens the conversation itself, not the overview it lives behind.
#
# Read-only apart from the read receipt a person leaves by opening a notification. It opens the
# inbox, taps the newest "Nova poruka" item, and asserts that the Dogovor opened on its Poruke tab
# with the message on screen. It sends nothing.

appId: rs.uskoci.dev
env:
  MESSAGE: "Cao"
---
- launchApp:
    clearState: false
- tapOn:
    text: "Obaveštenja,.*"
- takeScreenshot: 01-obavestenja
- tapOn:
    text: ".*Nova poruka.*"
- extendedWaitUntil:
    visible: "Poruke"
    timeout: 10000
- assertVisible:
    text: ${MESSAGE}
- takeScreenshot: 02-otvorilo-poruke
