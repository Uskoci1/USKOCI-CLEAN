# Rate the other side of a completed Dogovor (D12), the two-device run of 2026-09-23.
#
# THIS FLOW WRITES, and the write is final: "Sačuvana ocena se ne menja." It runs only on the owner's explicit
# word for that one run, on the device and Dogovor he named, never as part of a routine pass. Rating, one
# optional tag and the Dogovor come in as env so nothing is baked in.
#
#   maestro --device emulator-5554 test -e AGREEMENT=".*krečenja.*" -e RATING=5 -e TAG="Po dogovoru" .maestro/rate-agreement.yaml
#
# Labels come from src/ui/reviews/AgreementReviewScreen.tsx: the stars are radios "Ocena N od 5", the tags are
# checkboxes named "Po dogovoru" / "Pažljivo" / "Jasna komunikacija" / "Na vreme" / "Pouzdano" / "Uz poštovanje",
# the one save is "Sačuvaj ocenu", and the receipt reads "Ocena je sačuvana" with "Tvoja ocena: N od 5".

appId: rs.uskoci.dev
env:
  AGREEMENT: ".*krečenja.*"
  RATING: "5"
  TAG: "Po dogovoru"
---
- launchApp:
    clearState: false
- tapOn:
    text: "Dogovori"
# A completed Dogovor may already sit in history, so the flow widens the list before looking for it.
- tapOn:
    text: "Svi"
    optional: true
- extendedWaitUntil:
    visible: "Otvori Dogovor.*"
    timeout: 15000
- tapOn:
    text: "Otvori Dogovor${AGREEMENT}"
- extendedWaitUntil:
    visible: "Oceni saradnju"
    timeout: 15000
- takeScreenshot: 01-dogovor-zavrsen
- tapOn:
    text: "Oceni saradnju"
# The radiogroup label is not a text node on Android; the screen's own title is what a person sees.
- extendedWaitUntil:
    visible: "Kako je prošla saradnja?"
    timeout: 25000
- takeScreenshot: 02-ocena-prazno

- tapOn:
    text: "Ocena ${RATING} od 5"
- tapOn:
    text: ${TAG}
    optional: true
- takeScreenshot: 03-ocena-izabrano

# The one write, and it cannot be undone. Everything before this point could be walked away from.
- tapOn:
    text: "Sačuvaj ocenu"
- extendedWaitUntil:
    visible: "Ocena je sačuvana"
    timeout: 20000
- assertVisible:
    text: "Tvoja ocena: ${RATING} od 5"
- takeScreenshot: 04-ocena-sacuvana
- tapOn:
    text: "Nazad na Dogovor"
- takeScreenshot: 05-dogovor-posle-ocene
