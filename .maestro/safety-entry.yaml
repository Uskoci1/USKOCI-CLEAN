# PKG-047 (F05): the one entry into report and block, seen on a real phone.
#
# Read-only. It opens an opportunity, opens the poster's public profile, and photographs the entry.
# It does NOT press it: pressing opens the safety screen, and this flow does not go near a report or
# a block on a real person's account.
#
# Prerequisites: rs.uskoci.dev from the commit under test, signed in, and — this is the hard one —
# somebody else reachable: an open Zadatak posted by another person, or an application on one of yours.
#
# Run on 2026-09-23 against the owner's account: neither existed. Every card in Lista was "Tvoj zadatak"
# and his task says "još nema prijava", so the flow photographed his own task instead of a stranger, and
# the entry could not be shown. That is data, not a defect: PKG-047 refuses your own account as a safety
# target by design. Showing this entry on a phone needs the two-phone test, or one task posted by a
# second account.

appId: rs.uskoci.dev
---
- launchApp:
    clearState: false

- tapOn:
    text: "Mapa"
    optional: true
- tapOn:
    text: "Lista"
    optional: true
- takeScreenshot: 01-prilike

# A card posted by somebody else. Selecting by index is not enough: the owner's own tasks sit in the same
# list, and opening one of those shows the public view of your own Zadatak, which has no other person on
# it. This picks a task the other test-world account posted.
- scrollUntilVisible:
    element:
      text: ".*troseda.*"
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    text: ".*troseda.*"
    optional: true
- takeScreenshot: 02-detalj-prilike

# The person who posted it, as a public profile over the detail. Their identity sits below the facts,
# so the screen has to be scrolled to it first.
- scrollUntilVisible:
    element:
      text: "Pogledaj javni profil"
    direction: DOWN
    timeout: 20000
    optional: true
- tapOn:
    text: "Pogledaj javni profil"
    optional: true
- extendedWaitUntil:
    visible: "Javni profil"
    timeout: 8000
    optional: true
- takeScreenshot: 03-javni-profil
- scroll
- takeScreenshot: 04-javni-profil-bezbednost

# The entry itself. Present only on a build that carries PKG-047, and only when the server resolves a
# target for this profile, so the assertion is optional and the picture is the evidence either way.
- assertVisible:
    text: "Prijavi ili blokiraj.*"
    optional: true
- takeScreenshot: 05-ulaz-u-bezbednost

# Second way in, when every visible Zadatak is your own: the person who applied to yours. The requester
# reaches a candidate's public profile from their own task, which is the other screen PKG-047 wired.
- launchApp:
    clearState: false
- tapOn:
    text: "Početna"
    optional: true
- tapOn:
    text: "Moji zadaci"
    optional: true
- takeScreenshot: 06-moji-zadaci
- tapOn:
    text: "Otvori Zadatak.*"
    optional: true
- takeScreenshot: 07-moj-zadatak
- tapOn:
    text: "Prijave.*"
    optional: true
- takeScreenshot: 08-prijave
- tapOn:
    text: "Otvori prijavu.*"
    optional: true
- takeScreenshot: 09-prijava
- tapOn:
    text: "Pogledaj javni profil"
    optional: true
- extendedWaitUntil:
    visible: "Javni profil"
    timeout: 8000
    optional: true
- scroll
- takeScreenshot: 10-profil-kandidata
- assertVisible:
    text: "Prijavi ili blokiraj.*"
    optional: true
- takeScreenshot: 11-ulaz-u-bezbednost-kandidat
