# Send one message in an existing Dogovor (D03), the two-device run of 2026-09-23.
#
# THIS FLOW WRITES. It sends a real message from the signed-in account into a real Agreement. It runs
# only on the owner's explicit word for that one run ("Da", 2026-09-23), on the device and Agreement he
# named, never as part of a routine pass. The Agreement and the text come in as env so nothing is baked in.
#
#   maestro --device emulator-5554 test -e AGREEMENT=".*krečenja.*" -e TEXT="..." .maestro/send-message.yaml
#
# Labels come from src/ui/AgreementChat.tsx: the field is "Napiši poruku" (hint "Napiši poruku…"), the
# button "Pošalji poruku", and a sent bubble of your own is announced as "Poruka: Ja".

appId: rs.uskoci.dev
env:
  AGREEMENT: ".*krečenja.*"
  TEXT: "Ok, vidimo se sutra u 12. Javi ako se nesto promeni."
---
- launchApp:
    clearState: false
- tapOn:
    text: "Dogovori"
- extendedWaitUntil:
    visible: "Otvori Dogovor.*"
    timeout: 15000
# The card names the Dogovor it opens; the pattern picks the one the owner named, not the first one.
- tapOn:
    text: "Otvori Dogovor${AGREEMENT}"
- extendedWaitUntil:
    visible: "Poruke"
    timeout: 15000
- tapOn:
    text: "Poruke"
- takeScreenshot: 01-poruke-pre

- tapOn:
    text: "Napiši poruku.*"
- inputText: ${TEXT}
- takeScreenshot: 02-nacrt

# The one write. Everything before this point could be walked away from.
- tapOn:
    text: "Pošalji poruku"
# The composer clears and the message comes back from the server as a bubble of your own.
- extendedWaitUntil:
    visible: "Poruka: Ja"
    timeout: 20000
- takeScreenshot: 03-poslato
