// Local build control only. No application or dependency source is rewritten.
// Gradle worker count does not bound Ninja's separate C++ compiler fan-out.
allprojects { project ->
    project.afterEvaluate {
        def android = project.extensions.findByName('android')
        if (android != null && android.defaultConfig != null) {
            android.defaultConfig.externalNativeBuild.cmake.arguments.addAll([
                '-DCMAKE_JOB_POOLS=uskoci_compile=2;uskoci_link=1',
                '-DCMAKE_JOB_POOL_COMPILE=uskoci_compile',
                '-DCMAKE_JOB_POOL_LINK=uskoci_link'
            ])
        }
    }
}

// Recompute the Expo Router transform for this exact worktree while retaining
// unchanged native compilation task inputs and all ordinary release checks.
allprojects { project ->
  project.afterEvaluate {
    def react = project.extensions.findByName('react')
    if (react != null) {
      react.extraPackagerArgs.addAll(['--reset-cache', '--max-workers', '2'])
    }
  }
}

// The public build identity is always regenerated by Expo Constants. Regenerate
// the JS graph as well, retaining unchanged native inputs and ordinary checks.
allprojects { project ->
  project.tasks.matching { it.name == 'createBundleReleaseJsAndAssets' }.configureEach {
    outputs.upToDateWhen { false }
  }
}
