# Read-only look at the V41 transfer on the emulator. Screenshots only; nothing is typed, sent or saved.
appId: rs.uskoci.dev
---
- launchApp:
    clearState: false
- tapOn:
    text: "Početna"
- extendedWaitUntil:
    visible: "Moje aktivnosti"
    timeout: 20000
- takeScreenshot: v01-pocetna
- scroll
- takeScreenshot: v02-pocetna-dole
- tapOn:
    text: "Mapa"
- extendedWaitUntil:
    visible: "Filteri"
    timeout: 15000
- tapOn:
    text: "Lista"
    optional: true
- takeScreenshot: v03-lista
- tapOn:
    text: "Otvori priliku.*"
    index: 0
    optional: true
- takeScreenshot: v04-prilika
- scroll
- takeScreenshot: v05-prilika-dole
- back
- tapOn:
    text: "Dogovori"
- extendedWaitUntil:
    visible: "Otvori Dogovor.*"
    timeout: 15000
- takeScreenshot: v06-dogovori
- tapOn:
    text: "Otvori Dogovor.*krečenja.*"
- extendedWaitUntil:
    visible: "Oceni saradnju"
    timeout: 15000
- takeScreenshot: v07-dogovor
- tapOn:
    text: "Poruke"
    optional: true
- takeScreenshot: v08-poruke
- back
- tapOn:
    text: "Početna"
- tapOn:
    text: "Vidi sve"
- extendedWaitUntil:
    visible: "Moje aktivnosti"
    timeout: 15000
- takeScreenshot: v09-aktivnosti
- tapOn:
    text: ".*Krečenje stana od 80.*"
    index: 0
- extendedWaitUntil:
    visible: ".*Krečenje stana od 80.*"
    timeout: 15000
- takeScreenshot: v10-moj-zadatak
- scroll
- takeScreenshot: v11-moj-zadatak-dole
- back
- tapOn:
    text: ".*Hitno prenošenje troseda.*"
    index: 0
    optional: true
- takeScreenshot: v12-moje-prijave
- back
- back
- tapOn:
    text: "Moj profil"
- extendedWaitUntil:
    visible: "Profil"
    timeout: 15000
- takeScreenshot: v13-profil
- back
- tapOn:
    text: "Obaveštenja.*"
- takeScreenshot: v14-obavestenja
- back
