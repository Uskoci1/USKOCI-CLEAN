# Read-only check of the four regression fixes and the sliding segment on the release candidate.
appId: rs.uskoci.dev
---
- launchApp:
    clearState: false
- tapOn:
    text: "Početna"
- extendedWaitUntil:
    visible: "Moje aktivnosti"
    timeout: 20000
- takeScreenshot: c01-pocetna
- tapOn:
    text: "Dogovori"
- extendedWaitUntil:
    visible: "Otvori Dogovor.*"
    timeout: 15000
- tapOn:
    text: "Istorija"
- takeScreenshot: c02-segment-istorija
- tapOn:
    text: "Svi"
- takeScreenshot: c03-segment-svi
- tapOn:
    text: "Mapa"
- tapOn:
    text: "Lista"
    optional: true
- tapOn:
    text: "Filteri"
- takeScreenshot: c04-filteri
- back
- tapOn:
    text: "Početna"
- tapOn:
    text: "Moj profil"
- tapOn:
    text: "Dostupnost.*"
- takeScreenshot: c05-dostupnost
- back
- back
