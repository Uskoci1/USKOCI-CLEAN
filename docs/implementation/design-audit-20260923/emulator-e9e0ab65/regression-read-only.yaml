# Release regression, read-only: every main screen of the signed-in worker account, opened and photographed.
# Nothing is typed, sent, saved, published, withdrawn or deleted. Local-only toggles (tabs, disclosures) are allowed.
appId: rs.uskoci.dev
---
- launchApp:
    clearState: false
# --- Početna
- tapOn:
    text: "Početna"
- extendedWaitUntil:
    visible: "Moje aktivnosti"
    timeout: 20000
- takeScreenshot: r01-pocetna
# --- Obaveštenja
- tapOn:
    text: "Obaveštenja.*"
- extendedWaitUntil:
    visible: "Obaveštenja"
    timeout: 15000
- takeScreenshot: r02-obavestenja
- tapOn:
    text: "Moje prijave"
    optional: true
- takeScreenshot: r03-obavestenja-prijave
- back
# --- Profil i podekrani
- tapOn:
    text: "Moj profil"
- extendedWaitUntil:
    visible: "Profil"
    timeout: 15000
- takeScreenshot: r04-profil
- tapOn:
    text: "Veštine, alat i tim.*"
    optional: true
- takeScreenshot: r05-radni-profil
- back
- tapOn:
    text: "Dostupnost.*"
    optional: true
- takeScreenshot: r06-dostupnost
- back
- scrollUntilVisible:
    element:
      text: "Privatnost i podaci.*"
    direction: DOWN
    optional: true
- tapOn:
    text: "Privatnost i podaci.*"
    optional: true
- takeScreenshot: r07-privatnost
- back
- tapOn:
    text: "Pravila i saglasnosti.*"
    optional: true
- takeScreenshot: r08-pravna
- back
- tapOn:
    text: "Blokirani korisnici.*"
    optional: true
- takeScreenshot: r09-blokirani
- back
- tapOn:
    text: "Izvoz podataka.*"
    optional: true
- takeScreenshot: r10-izvoz
- back
- scrollUntilVisible:
    element:
      text: "Podrška.*|Pomoć.*"
    direction: DOWN
    optional: true
- tapOn:
    text: "Podrška.*|Pomoć.*"
    optional: true
- takeScreenshot: r11-podrska
- back
- back
# --- Mapa i lista
- tapOn:
    text: "Mapa"
- extendedWaitUntil:
    visible: "Filteri"
    timeout: 15000
- takeScreenshot: r12-mapa
- tapOn:
    text: "Lista"
    optional: true
- takeScreenshot: r13-lista
- tapOn:
    text: "Filteri"
    optional: true
- takeScreenshot: r14-filteri
- back
# A public task from the list, read only (no application is started).
- tapOn:
    text: "Otvori priliku.*"
    index: 0
    optional: true
- takeScreenshot: r14b-prilika
- scroll
- takeScreenshot: r14c-prilika-dole
- back
# --- Dogovori
- tapOn:
    text: "Dogovori"
- extendedWaitUntil:
    visible: "Otvori Dogovor.*"
    timeout: 15000
- takeScreenshot: r15-dogovori
- tapOn:
    text: "Istorija"
    optional: true
- takeScreenshot: r16-dogovori-istorija
- tapOn:
    text: "Aktivni"
    optional: true
- tapOn:
    text: "Otvori Dogovor.*krečenja.*"
- extendedWaitUntil:
    visible: "Oceni saradnju"
    timeout: 15000
- takeScreenshot: r17-dogovor
- scroll
- takeScreenshot: r18-dogovor-dole
- tapOn:
    text: "Poruke"
    optional: true
- takeScreenshot: r19-poruke
- back
# --- Moje aktivnosti i prijave
- tapOn:
    text: "Početna"
- tapOn:
    text: "Vidi sve"
- extendedWaitUntil:
    visible: "Moje aktivnosti"
    timeout: 15000
- takeScreenshot: r20-aktivnosti
- tapOn:
    text: "Istorija"
    optional: true
- takeScreenshot: r21-aktivnosti-istorija
- back
# --- AI
- tapOn:
    text: "Objavi zadatak.*"
    index: 0
- extendedWaitUntil:
    visible: ".*Drži i govori.*|.*Reci šta ti treba.*"
    timeout: 20000
- takeScreenshot: r22-ai
- back
