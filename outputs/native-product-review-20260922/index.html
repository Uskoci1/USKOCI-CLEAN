<!doctype html><html lang="sr-Latn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>USKOČI · lokalna provera ekrana</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2ee;color:#202723;font:15px system-ui}
header{padding:16px 24px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}nav{display:flex;gap:8px;flex-wrap:wrap}
button,select{font:inherit;border:1px solid #d8ded7;background:white;padding:9px 12px;border-radius:12px;cursor:pointer}
p{margin:0;max-width:720px;font-size:13px;color:#5e6d64}main{display:flex;justify-content:center;padding:12px}
iframe{width:390px;height:780px;border:1px solid #d8ded7;border-radius:26px;background:white;box-shadow:0 15px 50px #183f3510}
</style></head><body><header><strong>USKOČI · lokalna provera, bez naloga i baze</strong><nav>
<button data-screen="list">Zadaci</button><button data-screen="task">Detalj</button><button data-screen="compose">Nova ponuda</button><button data-screen="my-applications">Moje prijave</button><button data-screen="candidates">Pristigle prijave</button>
<button data-screen="offer">Ponuda</button><button data-screen="agreement">Dogovor</button><button data-screen="ai">AI unos</button>
</nav><select aria-label="Širina ekrana"><option>390</option><option>320</option><option>360</option><option>430</option></select>
<select aria-label="Stanje liste" id="scenario"><option value="ready">Zadaci</option><option value="loading">Učitavanje</option><option value="empty">Prazno</option><option value="no-results">Bez rezultata pretrage</option><option value="error">Greška / nema veze</option></select>
<p>Provera izgleda stvarnog React Native koda na primerima podataka. Nema naloga, povezivanja sa bazom, slanja niti plaćenih poziva. Mapa i mediji se ovde ne proveravaju.</p></header>
<main><iframe title="USKOČI prikaz" src="/app.html?screen=list"></iframe></main>
<script>
let screen='list';
const render=()=>document.querySelector('iframe').src='/app.html?screen='+screen+'&state='+document.querySelector('#scenario').value;
document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{screen=b.dataset.screen;render()});
document.querySelector('[aria-label="Širina ekrana"]').onchange=e=>document.querySelector('iframe').style.width=e.target.value+'px';
document.querySelector('#scenario').onchange=render;
</script></body></html>
